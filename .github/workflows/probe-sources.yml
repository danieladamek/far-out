name: Probe opportunity sources

on:
  workflow_dispatch:
  push:
    paths: ['scripts/probe-sources.mjs', '.github/workflows/probe-sources.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe-sources.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: probe-results.json
