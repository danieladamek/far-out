name: Build, test and deploy FAR Out

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *' # daily re-harvest of SAM.gov + Grants.gov

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The daily schedule only re-harvests and redeploys; pushes and manual runs test first.
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # build:content exits 1 on content-pack validation errors; the app still builds from what validated
      # and lists the errors on /methods, so annotate and continue.
      - name: Build content
        run: npm run build:content || echo "::error title=Content build::content-pack has build errors — see content-pack/BUILD-ERRORS.md and /methods"
      # e2e runs against the offline fixture harvest, never the live feeds.
      - name: Use fixture harvest
        run: |
          rm -rf public/data/opportunities
          mkdir -p public/data
          cp -R tests/fixtures/opportunities public/data/opportunities
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  deploy:
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build content
        run: npm run build:content || echo "::error title=Content build::content-pack has build errors — see content-pack/BUILD-ERRORS.md and /methods"
      # A failed feed must not block the deploy: the scripts record it in manifest.json failures[]
      # (the app names the stale feed); the warning makes it visible on the run.
      - name: Harvest SAM.gov + Grants.gov
        run: npm run harvest || echo "::warning title=Harvest::harvest failed for at least one feed — see failures[] in public/data/opportunities/manifest.json"
      - name: Harvest summary
        if: always()
        run: |
          if [ -f public/data/opportunities/manifest.json ]; then
            {
              echo "## Harvest"
              echo '```json'
              node -e "const m=require('./public/data/opportunities/manifest.json');console.log(JSON.stringify({harvestedAt:m.harvestedAt,counts:m.counts,failures:m.failures},null,2))"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /far-out/
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
