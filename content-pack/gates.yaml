- id: foreign-disclosure-security-review
  name: Foreign-affiliation disclosure and security-risk review
  what: 'Applicants disclose foreign ties on the foreign-disclosure form in SBA''s directive appendices [459]. Agencies
    had to establish due diligence programs by June 27, 2023, assessing cybersecurity practices, patents, employee
    affiliations and foreign ownership [452]. P.L. 119-83 adds an evaluation of whether a small business "presents
    a security risk for any reason", with denial grounds that include a connection to an entity on eight named lists
    [417].

    '
  applies_when: Every SBIR/STTR application; at HHS the policy covers all SBIR/STTR applications and active awards
    [328]
  steps:
  - 'Complete the foreign disclosure (Appendix III): malign foreign talent recruitment program participation; parent,
    subsidiary or joint venture in a foreign country of concern; obligations to foreign state entities; wholly foreign
    ownership; foreign-affiliated venture investment; technology licensing or IP transfer to a country of concern
    in the prior 5 years [459]'
  - '"Foreign country of concern" means China, North Korea, Russia, Iran, or any other country so determined by
    the Secretary of State [452]'
  - The agency may deny the award; under the 2026 Act denied firms must be notified and remain eligible in later
    cycles [417]
  - 'HHS: update the disclosure annually with progress reports and within 30 days of any change in ownership, entity
    structure or covered individual; failure to disclose can require repayment of all funds [328]'
  - NOAA names a Foreign Affiliations Disclosure among its required forms [408]
  - 'Certifications run alongside: a Funding Agreement Certification at award and Life Cycle Certifications during
    performance, with warnings citing 18 U.S.C. 1001, False Claims Act treble damages, suspension and debarment
    [459]'
  official_url: https://www.sbir.gov/sites/default/files/SBA%20SBIR_STTR_FINAL_APPENDICES_MAY2023.pdf
  pending_changes:
  - status: final
    date: '2026-04-20'
    text: HHS issued its post-reauthorization foreign disclosure and risk management policy as NOT-OD-26-074 [328]
  - status: pending-implementation
    date: '2026-04-13'
    text: Sec. 2 of the Act adds eight entity lists (UFLPA Entity List; Non-SDN Chinese Military-Industrial Complex
      Companies List; Section 889 Prohibition List; Chinese Military Companies list; Military End User List; Entity
      List; FCC List of Equipment and Services; Withhold Release Orders and Findings List) and a ground for any
      security risk the agency "determines warrants a denial" [417]; an implementing notice was read only for HHS
      [328]
  as_of: '2026-10-03'
