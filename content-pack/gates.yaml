- id: sam-registration-uei
  name: SAM registration and Unique Entity ID
  governing_text:
  - FAR Subpart 4.11 [843]
  - FAR 52.204-7 (Nov 2024) [842]
  what: 'An active entity registration in SAM.gov is a condition of offering: "An Offeror is required to be registered
    in SAM when submitting an offer or quotation and at time of award" [842]. Registered means the mandatory information
    (UEI, EFT indicator) is entered; the Core, Assertions, Representations and Certifications, and Points of Contact
    sections are complete; the Government has validated the data, including the TIN match with the IRS; and the
    record is marked "Active" [842]. The Unique Entity ID is generated by SAM.gov; the transition from DUNS took
    place on April 4, 2022 [844].

    '
  applies_when: Offerors and quoters must be registered when an offer or quotation is submitted, and again at award
    [843] [842]. There are seven exceptions, including purchase-card micro-purchases, classified contracts, and
    foreign vendor contracts of $40,000 or less performed outside the U.S.; for unusual and compelling urgency the
    firm registers within 30 days after award or at least 3 days before the first invoice, whichever is first [843].
  steps:
  - Get a Unique Entity ID at SAM.gov; a UEI alone needs only legal business name and physical address and does
    not allow applying directly for federal awards [840]
  - Complete the Core, Assertions, Representations and Certifications, and Points of Contact sections [842]
  - 'Wait for validation and Active status: "Registration can take up to 10 business days to become active." [840]'
  - 'Renew every 365 days: "You must renew your registration every 365 days to keep it active." [840]'
  cost_time: Up to 10 business days to become active; renewal every 365 days [840]. The text fetched from SAM.gov
    carried no statement on cost, so "free" is unverified [840].
  official_url: https://sam.gov/content/entity-registration
  pending_changes:
