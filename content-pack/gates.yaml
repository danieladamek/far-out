- id: past-performance-cpars
  name: Past performance and CPARS
  governing_text:
  - FAR 42.1502 [837]
  - FAR 42.1503 [838]
  - FAR Subpart 15.3 [830]
  what: 'Past performance evaluations are prepared at least annually and at the time the work is completed, and
    are entered into CPARS, the Governmentwide evaluation reporting tool [837]. The factors are technical (quality),
    cost control, schedule/timeliness, management or business relations, small business subcontracting and other,
    rated Exceptional, Very Good, Satisfactory, Marginal or Unsatisfactory [838]. In source selection a firm with
    no record "may not be evaluated favorably or unfavorably on past performance" [830].

    '
  applies_when: Evaluations are required for contracts and orders exceeding the simplified acquisition threshold,
    construction of $900,000 or more and architect-engineer contracts of $45,000 or more [837]. The simplified acquisition
    threshold has been $350,000 since October 1, 2025 [810]. Past performance is evaluated in competitive acquisitions
    expected to exceed the simplified acquisition threshold unless the contracting officer documents why not [830].
  steps:
  - 'CPARS roles named on the site: Focal Point, Assessing Official, Contractor Representative [839]'
  - Comment, rebut or add information within 14 calendar days of notification that the evaluation is available [838]
  - Evaluations become visible to source selection officials 14 days after notice whether or not the contractor
    has commented [838]
  cost_time: 14 calendar days to comment; past performance information is used within three years of completion,
    six years for construction and architect-engineer contracts [838].
  official_url: https://www.cpars.gov/
  pending_changes:
