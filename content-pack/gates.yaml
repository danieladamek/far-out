- id: late-payment-reporting
  name: Late-payment reporting by the prime
  governing_text: 15 U.S.C. 637(d)(13); 13 CFR 125.3(c); FAR 52.242-5 (Jan 2017); FAR 52.219-9(d)(15) (Jan 2025);
    FAR 52.219-8 (Jan 2025); FAR 42.1503; FAR 19.702
  what: 'On a contract that requires a subcontracting plan, a prime that pays a small-business subcontractor a reduced
    price or pays late must notify the contracting officer in writing and give the reason [1443] [1441]. An unjustified
    failure counts in the prime''s past performance evaluation [1443] [1446].

    '
  applies_when: Small-business subcontractors under a prime whose contract requires a subcontracting plan [1443].
    Plans are required above $900,000 generally and $2 million for construction under FAR 19.702, and are not required
    from small business concerns [1465].
  how_it_works:
  - 'Statute (2024 edition): written notice when the prime pays a reduced price or "the payment to a subcontractor
    is more than 30 days past due for goods or services provided for the covered contract", for work the agency
    has paid the prime for [1443]'
  - 'FAR clause as displayed: untimely payment is "a payment that is more than 90 days past due under the terms
    and conditions of a subcontract", for supplies and services for which the Government has paid the prime [1441]'
  - 'SBA regulation as displayed (13 CFR 125.3(c)(5)): the prime notifies the contracting officer if it pays a reduced
    price or payment is more than 90 days past due [1442]'
  - Written notice to the contracting officer not later than 14 days after the event, giving the reason [1441]
  - The subcontracting plan carries an assurance to pay small business subcontractors on time and notify the contracting
    officer of reduced or untimely payment (FAR 52.219-9(d)(15)) [1374]
  - Primes must "establish procedures to ensure the timely payment of amounts due pursuant to the terms of their
    subcontracts" (FAR 52.219-8) [1491]
  - 'Past performance: small business subcontracting, including reduced or untimely payments to small business subcontractors,
    is an evaluation factor [1446]'
  - 'FAPIIS: a report is made when a contractor has "a history of three or more unjustified reduced or untimely
    payments to small business subcontractors under a single contract within a 12-month period", within 3 calendar
    days (FAR 42.1503(h)) [1446]'
  - 'Statute: the contracting officer shall consider the unjustified failure in evaluating the prime and may enter
    or modify past performance information before or after close-out; the prime must cooperate once an unjustified
    failure is determined [1443]'
  - '"The contractor may not prohibit a subcontractor from discussing any material matter pertaining to payment
    or utilization with the contracting officer" (13 CFR 125.3(c)(1)(iii)) [1442]'
  - 'Origin: FAR final rule 81 FR 93481 (FAR Case 2014-004), effective January 19, 2017, implementing section 1334
    of the Small Business Jobs Act of 2010; it created FAR 52.242-5 and the FAPIIS reporting [1445]'
  steps:
  - The duty to report is the prime's; a subcontractor that is unpaid may itself assert non-payment to the contracting
    officer, who may encourage payment or reduce or suspend the prime's progress payments [1439]
