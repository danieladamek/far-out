- id: buy-american-taa
  name: Buy American and the Trade Agreements Act
  governing_text:
  - FAR Subpart 25.1 [890]
  - FAR 25.402 [891]
  what: 'Under FAR Subpart 25.1 a domestic end product "must be manufactured in the United States" and meet a domestic-content
    share: over 60% through 2023, 65% for 2024–2028 and 75% starting 2029 [890]. Above the trade agreements thresholds,
    eligible products from designated countries are treated like domestic ones [891].

    '
  applies_when: 'Trade agreements thresholds (WTO GPA): supplies $174,000; services $174,000; construction $6,683,000;
    Israeli Trade Act $50,000 for supplies [891]. Buy American exceptions: public interest, nonavailability, unreasonable
    cost, commissary resale, commercial information technology; the Buy American applicability threshold was not
    fetched [890]. On the GSA Multiple Award Schedule, all proposed products and services must comply with the Trade
    Agreements Act [705].'
  steps:
  - Represent Buy American and trade agreements status; 52.212-3 covers both for commercial buys [852]
  - Check the product against the domestic-content test, including the iron and steel rule (foreign iron and steel
    under 5%) [890]
  cost_time: 'Price evaluation factor: 20% (large business low domestic offer), 30% (small business) [890].'
