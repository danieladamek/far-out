- id: prompt-and-accelerated-payment
  name: Prompt payment and accelerated payment (what reaches a subcontractor)
  governing_text: 31 U.S.C. chapter 39 (including 31 U.S.C. 3903(a) and 3905); 10 U.S.C. 3801; FAR Subpart 32.9;
    FAR 32.009-1; FAR 52.232-40 (Mar 2023); FAR 52.232-27 (Jan 2017); FAR 52.232-5 (May 2014); FAR 52.216-7 (Aug
    2018); FAR 32.112-1
  what: 'The Prompt Payment clock is the Government''s own deadline for paying its prime contractor, with interest
    paid automatically when the Government is late [1427]. Treasury''s pages speak of agencies paying vendors and
    do not address subcontractors [1432]. Two rules do reach a subcontractor. When the Government pays a prime on
    an accelerated basis, the prime must pass the payment on to its small-business subcontractors within 15 days,
    to the maximum extent practicable, without charging fees [1421]. On construction, every subcontract must carry
    a 7-day payment clause and an interest clause, flowed to lower tiers [1428] [1430].

    '
  applies_when: 'Accelerated payment: small-business subcontractors under a prime that receives accelerated payments;
    the substance of the clause flows to all subcontracts with small business concerns, including commercial products
    and services [1421]. Seven-day rule: subcontractors on federal construction contracts, with the same clauses
    in lower-tier subcontracts [1428] [1430].'
  how_it_works:
  - 'Government to prime: invoice payment is due on the later of the 30th day after the billing office receives
    a proper invoice or the 30th day after Government acceptance (FAR 32.904(b)(1)) [1427]'
  - 'Government to prime, construction: progress payments are due 14 days after receipt of a proper payment request
    (FAR 32.904(d)(1)(i)) [1427]'
  - '"The designated payment office will pay an interest penalty automatically, without request from the contractor"
    (FAR 32.907) [1427]'
  - 'Interest rate: "For the period beginning July 1, 2026, and ending on December 31, 2026, the prompt payment
    interest rate is 4-3/4 per centum per annum." (91 FR 42594) [1431]; Treasury''s page gives the same figure as
    4.75% [1432]'
  - 'Accelerated payment policy: agencies "provide accelerated payments, to the fullest extent permitted by law,
    with a goal of 15 days after receipt of a proper invoice"; it covers small business contractors and prime contractors
    that subcontract with small business, if the prime agrees to pass payment on within 15 days [1422]'
  - For civilian agencies the goal applies only when a specific payment date is not established by contract; DoD
    has a parallel paragraph under separate statutory authority [1422] [1423]
  - The prime pays small business subcontractors "within 15 days after receipt of accelerated payments from the
    Government", "to the maximum extent practicable", after receipt of a proper invoice and all other required documentation
    from the small business subcontractor [1421]
  - No further consideration or fees may be charged to the subcontractor [1421]
  - '"The acceleration of payments under this clause does not provide any new rights under the Prompt Payment Act."
    [1421]'
  - FAR 52.232-40 is on both commercial flow-down lists [1448] [1449]
  - 'Construction: the prime pays subcontractors for satisfactory performance "not later than 7 days from receipt
    of payment out of such amounts as are paid to the Contractor"; interest accrues from the day after the required
    payment date, at the rate under 41 U.S.C. 7109 [1428]'
  - 'Construction: the parties may agree retainage; withholding for documented deficiencies is permitted with prior
    written notice; after a deficiency is corrected, payment is due within 7 days or interest accrues [1428]'
  - 'Construction: each progress-payment request carries the prime''s certification that "All payments due to subcontractors
    and suppliers from previous payments received under the contract have been made" [1429]'
  - Interest a prime owes a subcontractor is not an obligation of the Government and cannot be claimed as a cost
    [1428]; a payment dispute between a contractor and a subcontractor is not a dispute to which the United States
    is a party [1430]
  - 'Cost-reimbursement contracts: a prime may bill the Government for subcontract costs it has not yet paid only
    if it pays "ordinarily within 30 days of the submission of the Contractor''s payment request to the Government"
    [1433]'
  - 'History: a DoD rule effective April 8, 2020 created DFARS 252.232-7017 (section 852, NDAA FY2019) [1425]; CAAC
    Letter 2020-02 authorised a civilian class deviation in April 2020 (section 873, NDAA FY2020) [1424]; the FAR
    final rule (88 FR 9730, FAR Case 2020-007) took effect March 16, 2023 [1423]; the DFARS page now reads "252.232-7017
    Reserved." [1426]'
  steps:
  - 'Invoice properly: the prime''s 15-day duty runs after receipt of a proper invoice and all other required documentation
    from the small business subcontractor [1421]'
  - A subcontractor or supplier may tell the contracting officer it has not been paid; the officer may determine
    whether the prime made payments in compliance with the subcontract, and may encourage timely payment or reduce
    or suspend progress payments (FAR 32.112-1) [1439]
  - If the prime's certification of payment was inaccurate, "the contracting officer shall initiate administrative
    or other remedial action" [1439]
