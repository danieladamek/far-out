- id: data-rights-marking
  name: SBIR/STTR data-rights marking
  what: 'During the protection period the government holds a license to use SBIR data but may not disclose it [436].
    Under SBA''s directive the period begins at award and ends twenty years (or longer at agency discretion) from
    the date of award, and data must be marked [422]. The DoD clause DFARS 252.227-7018 (AUG 2025) runs 20 years
    from contract award, after which "the Government shall have government purpose rights perpetually" [434]. The
    civilian clause FAR 52.227-20 (May 2014) still states a 4-year period [433].

    '
  applies_when: 'Every SBIR/STTR award: the 20-year period applies to Phase I, II and III [436], and SBIR/STTR data
    protection applies to contracts and subcontracts that include Phase III work [429]'
  steps:
  - Mark SBIR/STTR data before delivery; under SBA's directive data must be marked [422]
  - 'DoD contracts: data must carry the "SBIR/STTR DATA RIGHTS" legend, including the expiration date of the protection
    period [434]'
  - If data was delivered unmarked, ask to correct it within 6 months [422] [433]
  - Under FAR 52.227-20, data delivered without the notice is treated as unlimited-rights data [433]
  - 'DoD contracts: nonconforming markings not corrected within 60 days of notice may be removed or corrected by
    the government at contractor expense [434]'
  - In a Phase III proposal, assert SBIR/STTR data rights; primes must flow down SBIR/STTR data rights [430]
  - DoD may not require an offeror to sell or relinquish rights in SBIR/STTR technical data (DFARS 227.7104-1(a))
    [429]
  official_url: https://www.acquisition.gov/dfars/227.7104-1-policy.
  pending_changes:
  - status: proposed
    date: '2023-04-07'
    text: FAR Case 2020-010 would change the protection period in FAR 52.227-20 from 4 years to 20 years after award
      and add STTR coverage; it is a proposed rule and no final rule was found as of 2026-10-03 [428]
  - status: final
    date: '2025-01-17'
    text: DFARS Case 2019-D043 replaced the extendable 5-year period with a single non-extendable 20-year period
      followed by perpetual government purpose rights, effective January 17, 2025 [435]
  - status: pending-implementation
    date: '2026-04-13'
    text: P.L. 119-83 does not amend the data-rights rules [417]; it requires contracting-officer training that
      covers Phase III data rights (sec. 5), with implementation not verified [416]
  as_of: '2026-10-03'
  sources:
  - 416
  - 417
  - 422
  - 428
  - 429
  - 430
  - 433
  - 434
  - 435
  - 436
  - 437
  conflicts:
  - 'Protection period: 20 years from award in SBA''s directive [422] and DFARS 252.227-7018 [434] vs 4 years in
