- id: sam-registration
  name: SAM.gov registration, Unique Entity ID (UEI) and CAGE code
  what: 'A SAM.gov registration allows an entity to bid on government contracts and apply for federal assistance,
    and the Unique Entity ID is assigned as part of it [523]. The UEI is a 12-character alphanumeric value managed,
    granted and owned by the government; it replaced the DUNS number on April 4, 2022 [528]. The CAGE code is a
    separate identifier managed by the Defense Logistics Agency, assigned after submission if the entity has none
    [528] [524]. SAM.gov is free: there is no charge to get a UEI, register an entity or maintain the registration
    [524].'
  applies_when: An offeror is required to be registered in SAM when submitting an offer or quotation and at time
    of award (FAR 52.204-7; FAR 4.1102) [526] [525]. FAR 4.1102 lists seven exceptions, among them purchase-card
    micro-purchases, classified contracts, deployed contracting officers, urgency, and foreign vendors at or below
    $40,000 for overseas work where registration is impractical [525].
  steps:
  - 'Gather: legal business name, physical address (no PO box), date and state of incorporation, TIN, NAICS codes,
    bank routing and account numbers [524]'
  - A UEI alone needs only the legal business name and physical address [523]
  - 'Complete the registration: "registered" means Core, Assertions, and Reps & Certs complete, the TIN validated
    with the IRS, and the record marked "Active" [526]'
  - A CAGE code is mandatory information in SAM [526]; it is assigned after submission if the entity has none [524]
  - 'Timing: allow at least ten business days after submission [524]; SAM''s page says a registration can take up
    to 10 business days to become active [523]'
  - Renew every 365 days to keep the registration active [523] [524]
  - 'Notarized letter: GSA now uses it only to establish an Entity Administrator for an existing entity whose previous
    administrator is no longer on staff; it was previously required of all new entities [529]'
  - 'Help: the Entity Registration Checklist and the Federal Service Desk (fsd.gov) [523]'
  - 'Scam warnings from the government: SAM''s alert on phishing emails (February 4, 2025) [530]; GSA OIG''s alert
    (October 1, 2026) on a fake "Vendor Credentialing Form" demanding an annual fee and a fake "Records Digitization
    Non-Compliance" notice sent from look-alike domains such as e-gsa.us, reportable to the GSA OIG hotline and
    FBI IC3 [531]; SBA''s notice that "Certify.us is not affiliated with SBA" [585]'
  - The SAM record is used to populate SBA's Small Business Search (formerly Dynamic Small Business Search) [666]
  - A joint venture must be registered in SAM under its own name [520]
  official_url: https://sam.gov/content/entity-registration
  pending_changes:
  - status: final
    date: '2024-11-12'
    text: Interim rule 89 FR 89472 (FAR Case 2023-018), effective on publication November 12, 2024, removed the
      requirement to "continue to be registered until time of award", leaving registration at offer and at award
      [527]. It is an interim rule in force; search results point to a November 2025 finalization that was not fetched.
  - status: proposed
    date: '2026-06-23'
