- id: jv-agreement-requirements
  name: Joint venture agreement requirements (13 CFR 125.8 and the program sections)
  what: A joint venture agreement between firms that each qualify as small needs no specific form or conditions,
    but every joint venture agreement between a protégé and its SBA-approved mentor for a set-aside must contain
    twelve listed provisions (13 CFR 125.8(b)) [1098]. The 8(a), HUBZone, WOSB/EDWOSB and VOSB/SDVOSB sections carry
    the same structure with the certified firm as managing venturer (13 CFR 124.513, 126.616, 127.506, 128.402)
    [1099] [1101] [1103] [1104]. The regulation does not require SBA to approve the joint venture agreement itself,
    and SBA approves an 8(a) joint venture only before a sole-source 8(a) award [1098] [1099].
  applies_when: A joint venture between a protégé and its mentor offers on a procurement set aside or reserved for
    small business, or a joint venture led by a certified firm offers on an 8(a), HUBZone, WOSB/EDWOSB or VOSB/SDVOSB
    contract [1098] [1099] [1101] [1103] [1104]. Compliance with the agreement requirements is judged as of the
    final proposal revision for negotiated acquisitions and the final bid for sealed bidding (13 CFR 121.404(f))
    [1096].
  steps:
  - 'The twelve provisions of 13 CFR 125.8(b)(2): (1) purpose; (2) the small business as managing venturer with
    a named Responsible Manager; (3) the small business owns at least 51% of a separate-legal-entity joint venture;
    (4) profits commensurate with the work performed, or more; (5) a special bank account in the joint venture''s
    name requiring the signature or consent of all parties; (6) itemised equipment, facilities and resources; (7)
    responsibilities for negotiation, labour and performance; (8) all parties obligated to complete performance
    despite a member''s withdrawal; (9) accounting records kept by the managing venturer; (10) final records retained
    by the managing venturer; (11) annual performance statements to SBA not later than 45 days after each operating
    year; (12) a project-end statement no later than 90 days after completion [1098]'
  - Other partners may take part in commercially customary corporate-governance decisions; the Responsible Manager
    need not be an employee of the small business at offer if there is a signed letter of intent to be employed
    by it on award (13 CFR 125.8(b)(2)(ii)) [1098]
  - 'Work share: the joint venture meets 13 CFR 125.6, and the protégé performs at least 40% of the work the joint
    venture performs, more than administrative or ministerial functions; work of the mentor and its affiliates at
    any subcontracting tier counts as the mentor''s, and work by a similarly situated subcontractor does not count
    toward the protégé''s 40% (13 CFR 125.8(c)) [1098]'
  - 'Before performance: a written certification signed by an authorised official of each partner to the contracting
    officer and SBA (13 CFR 125.8(d)) [1098]'
  - 'During and after: an annual performance-of-work report to the contracting officer and SBA and a completion
    report at the end of the contract (13 CFR 125.8(h)); SBA and its Inspector General may inspect and copy the
    joint venture''s records (13 CFR 125.8(g)) [1098]'
  - 'Program joint ventures: the certified firm is managing venturer, owns at least 51% and performs at least 40%,
    with quarterly financial statements not later than 45 days after each operating quarter and a project-end statement
    no later than 90 days after completion [1099] [1101] [1103] [1104]; HUBZone and VOSB/SDVOSB joint ventures certify
    at offer as well as before performance or award [1101] [1104]'
  - 'The joint venture itself: in writing, under its own name, identified as a joint venture in SAM [1095]; with
    its own UEI and CAGE code [1116]'
  - 'Consequences: failing to have a compliant agreement, to perform to it or to the 40% rule, or to submit certifications
    or allow inspection are grounds for suspension or debarment, and any person may report non-compliance to SBA
    or its OIG (13 CFR 125.8(i)-(j)) [1098]; a HUBZone or VOSB/SDVOSB joint venture can be protested for failing
    its section [1102] [1105]'
