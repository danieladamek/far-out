- id: naics-size-at-offer
  name: NAICS code and size at the time of offer
  governing_text:
  - 13 CFR 121.404 [848]
  - FAR 19.301-1 [847]
  - FAR 52.204-8 (Mar 2026) [851]
  what: 'The contracting officer inserts the NAICS code and size standard for the buy, and the offeror "is required
    to represent in good faith" that it is small [851] [847]. Size is determined "as of the date the concern submits
    a written self-certification that it is small to the procuring activity as part of its initial offer or response
    which includes price" [848].

    '
  applies_when: The representation is made in writing at the time of initial offer [847]. On a multiple-award contract,
    small at initial offer generally means small for each order, but for orders under basic ordering agreements
    or BPAs size is tested at the time of award of the order [847]. On multiple-award contracts with several NAICS
    codes, size is determined for each discrete category [848]. The provision notes a nonmanufacturer size standard
    of 500 employees, or 150 for information technology value-added resellers [851].
  steps:
  - Read the NAICS code and size standard the contracting officer has inserted for the buy [851]
  - Keep SAM representations entered or updated within the last 12 months, current, accurate and complete [851]
  - Represent size in writing with the initial offer [847]
  - SBA lists the NAICS code and size standard among the basics of getting started [845]
  cost_time: None stated in the pages read.
