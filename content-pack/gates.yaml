- id: cage-ncage
  name: CAGE and NCAGE codes
  governing_text:
  - FAR Subpart 4.18 [849]
  - FAR 52.204-16 (Aug 2020) [850]
  - FAR 2.101 [791]
  what: 'A CAGE code is "an identifier assigned to entities located in the United States or its outlying areas by
    the Defense Logistics Agency" [850]. CAGE codes are assigned by the DLA CAGE Branch for U.S. entities, and NATO
    members assign NCAGE codes [791].

    '
  applies_when: A CAGE code is required "prior to the award of a contract action above the micro-purchase threshold,
    when there is a requirement to be registered in the System for Award Management (SAM) or a requirement to have
    a unique entity identifier in the solicitation" [849]. A CAGE code is also needed for a facility clearance [875].
  steps:
  - SAM registrants are assigned a CAGE code, which is part of the mandatory registration information [850] [842]
  - U.S. entities not registering in SAM may request a code at https://cage.dla.mil [850]
  - Foreign firms go to their NATO codification bureau or NSPA for an NCAGE code [850]
  - Do not delay an offer while waiting for a CAGE code; it is needed before award [850]
  cost_time: No cost or time statement was found in the pages read.
