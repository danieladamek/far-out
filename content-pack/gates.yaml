- id: recertification-size-status
  name: Recertification of size and program status (13 CFR 125.12)
  what: 13 CFR 125.12 is the unified rule on re-representing size and 8(a), HUBZone, WOSB/EDWOSB and SDVOSB status
    after certain events, and on what a disqualifying recertification costs the firm [514]. It was added by the
    December 17, 2024 final rule and took effect January 17, 2026 [515]. A firm that is small at award otherwise
    generally stays small for the life of the contract [513].
  applies_when: 'Triggers: a merger, acquisition or sale that changes controlling interest (recertify within 30
    calendar days); a contract longer than five years (no more than 120 days before the end of year five and before
    each later option); a contracting officer''s request in a solicitation [514].'
  steps:
  - Recertify size and program status within 30 calendar days of a merger, acquisition or sale [514]
  - A disqualifying recertification within 180 days after offer and before award makes the firm ineligible for that
    set-aside award [514]
  - On multiple-award contracts, a disqualifying recertification makes the firm ineligible for later set-aside or
    reserved orders; it stays eligible for unrestricted awards [514]
  - 'Exception: after a merger, acquisition or sale involving another small business, the firm stays eligible for
    set-aside or reserved orders [514]'
  - 'Paragraph (g): events before January 17, 2026 keep eligibility for existing orders and options, but agencies
    cannot count them toward goals [514]'
  official_url: https://www.ecfr.gov/current/title-13/chapter-I/part-125/section-125.12
  pending_changes:
  - status: final
    date: '2024-12-17'
    text: Created by 89 FR 102448, effective January 16, 2025, with the effective date of § 125.12 delayed to January
      17, 2026 [515]; amended by 90 FR 23609 (June 4, 2025) [514]. No pending change was found.
  as_of: '2026-10-03'
