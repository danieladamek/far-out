- id: recertification-size-status
  name: Recertification of size and status after a merger, acquisition or sale (13 CFR 125.12)
  what: 13 CFR 125.12 requires a firm to recertify its size and small business program status within 30 calendar
    days of a merger, acquisition or sale that changes controlling interest [1107]. The FAR counterpart is rerepresentation
    under clause 52.219-28, within 30 days after a novation agreement or a merger or acquisition that does not require
    novation (FAR 19.301-2) [1092] [1091]. Section 125.12 was created by the December 17, 2024 final rule and replaces
    recertification text formerly in 13 CFR 121.404(g), 124.108, 126.900, 127.400 and 128.400 [1110] [1096].
  applies_when: A merger, acquisition or sale changes the controlling interest of a firm that holds or has offered
    on a small-business contract [1107]; a contract runs longer than five years [1107] [1092]; or an order is set
    aside under an unrestricted multiple-award contract, is further set aside for a socioeconomic category, or the
    contracting officer requires rerepresentation [1092] [1108].
  steps:
  - Recertify within 30 calendar days of the merger, acquisition or sale (13 CFR 125.12(a)) [1107]
  - 'Before award: a triggering event within 180 days of offer and before award makes the firm ineligible for that
    single award; after 180 days the award may proceed (13 CFR 125.12(e)(2)(i)) [1107]'
  - 'Multiple-award contracts: after a merger with or acquisition by a firm that is not small, the contractor is
    ineligible for set-aside or reserved orders and options; after a merger between two small businesses it stays
    eligible but the orders do not count toward goals (13 CFR 125.12(e)(2)(ii)(B)) [1107]'
  - 'Long contracts: recertify no more than 120 days before the end of the fifth year and before each option thereafter
    (13 CFR 125.12(b)) [1107]'
  - 'Joint ventures: a joint venture may recertify as small where all parties are small at recertification, or the
    protégé is small in a mentor-protégé joint venture (13 CFR 125.12(f)) [1107]; once the protégé is no longer
    small for the contract''s NAICS code the joint venture cannot recertify as small [1112]'
  - 'Transition: disqualifying recertifications from mergers, acquisitions or sales before January 17, 2026 leave
    the firm eligible for orders under small-business multiple-award contracts, though agencies cannot count new
    orders toward goals (13 CFR 125.12(g)) [1107]'
  official_url: https://www.ecfr.gov/current/title-13/chapter-I/part-125/section-125.12
