- id: data-rights-as-a-subcontractor
  name: Data rights as a subcontractor
  governing_text: FAR 52.227-14 (May 2014); FAR 52.227-11 (May 2014); FAR 52.215-1(e) (Nov 2021); DFARS 252.227-7013
    and 252.227-7014 (AUG 2025); DFARS 252.227-7018 (AUG 2025); DFARS 227.7103-15; DFARS 252.227-7017 (JAN 2025);
    10 U.S.C. 3771 and 3782; SBA SBIR/STTR Policy Directive (May 2023) § 4(c)(5) and § 8(b)(2)
  what: 'The rules on what the Government and the prime can do with technical data, software and inventions a subcontractor
    brings or creates. For DoD work, "10 U.S.C. 3771 provides subcontractors at all tiers the same protection for
    their rights in data as is provided to prime contractors." [1471]. Under the civilian clause, "The Contractor
    shall obtain from its subcontractors all data and rights therein necessary to fulfill the Contractor''s obligations
    to the Government under this contract." [1468]

    '
  applies_when: A subcontract under which technical data or software is delivered to the Government, where the DoD
    clauses flow without alteration [1470] [1472], and any subcontract for experimental, developmental or research
    work, where the patent rights clause flows [1469].
  how_it_works:
  - 'DoD policy (DFARS 227.7103-15): subcontractors may deal directly with the Government on validation of their
    markings (10 U.S.C. 3782) and cannot be made to give up rights as a condition of award; clauses to flow: 252.227-7013,
    252.227-7025, 252.227-7028, 252.227-7037 [1471]'
  - 'DFARS 252.227-7013 (AUG 2025), paragraph (l): flows without alteration, except to identify the parties; a subcontractor''s
    technical data may be submitted directly to the Government rather than through a higher tier; primes "shall
    not use their power to award contracts as economic leverage to obtain rights in technical data from their subcontractors
    or suppliers" [1470]'
  - 'Software (DFARS 252.227-7014): the prime must "require its subcontractors or suppliers to do so, without alteration,
    except to identify the parties" [1472]'
  - 'Private expense: developed exclusively at private expense means costs charged to indirect cost pools, costs
    not allocated to a Government contract, or any combination [1470]'
  - 'Assertions list (DFARS 252.227-7017): covers assertions by the offeror, its subcontractors or suppliers, and
    potential subcontractors or suppliers; it is submitted as an attachment to the offer and carries the warning
    "may render the offer ineligible for award" [1474]'
  - 'Civilian clause (FAR 52.227-14): if a subcontractor refuses terms giving the Government the required rights,
    the prime notifies the contracting officer and does not award without written authorization [1468]'
  - 'Civilian clause: the contractor may withhold qualifying limited rights data and restricted computer software,
    identifying what is withheld and furnishing form, fit and function data instead; the clause as returned contains
    no express right for a subcontractor to deliver directly to the Government [1468]'
  - 'Markings: unauthorized markings can be cancelled or ignored after a 60-day written inquiry procedure [1468];
    the DoD limited rights and restricted rights legends name the contract number, contractor name and address [1470]
    [1472]'
  - 'Patents (FAR 52.227-11): the substance is included in all subcontracts for experimental, developmental or research
    work; "The Contractor shall not, as part of the consideration for awarding the subcontract, obtain rights in
    the subcontractor''s subject inventions."; disclosure within 2 months, election to retain title within 2 years,
    patent application within 1 year after election [1469]'
  - 'Proposal data (FAR 52.215-1(e)): a title-page legend plus a per-sheet legend: "Use or disclosure of data contained
    on this sheet is subject to the restriction on the title page of this proposal." [1476]'
  - 'SBIR/STTR: data rights apply to all SBIR/STTR awards, including subcontracts or subgrants (Policy Directive
    § 8(b)(2)); "A subcontract to a Federally-funded prime contract may be a Phase III award." [1475]'
  - 'SBIR/STTR under DoD (DFARS 252.227-7018, AUG 2025): protection begins on the date of award of the contract
    under which the data are generated and ends 20 years after that date; "After the SBIR/STTR data protection period
    expiration date shown above, the Government has perpetual government purpose rights"; paragraph (l) carries
    the unaltered flow-down, the leverage ban and direct delivery by subcontractors [1473]'
  steps:
  - 'Give the prime, before the offer goes in, the entries for its assertions list: data or software to be furnished
    with restrictions; basis for assertion; asserted rights category; name of person asserting restrictions [1474]'
  - Use the legend the clause prescribes; the DoD legends name the contract number, contractor name and address
    [1470] [1472]
