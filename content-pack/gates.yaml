  conflicts:
  - 'Secondary only: a law-firm note reports ASBCA decisions in Sauer Inc., No. 62295 (August 13, 2025 and November
    18, 2025) accepting conditional liability, where the prime agrees to pay the sub as and when it recovers from
    the Government, as satisfying the Severin doctrine; the Board decisions were not fetched [1486].'
  - 'Secondary only and not current law: a 2019 commentary describes a bill-stage provision (section 831 of a 2020
    NDAA draft) for a formal OSDBU non-payment process; enactment was not verified [1490].'
  - 15 U.S.C. 644(k) was read on Cornell LII and truncated at duty (16); later duties were not read [1489].
- id: past-performance-as-a-subcontractor
  name: Past performance as a subcontractor
  governing_text: FAR 15.305(a)(2); FAR 42.1502; 13 CFR 125.11; 13 CFR 125.2(g); 13 CFR 125.8(e); CPARS Guidance
    § 2.5 and § 2.13
  what: 'CPARS does not rate subcontractors: "Evaluations are not completed for subcontractors." [1500]. A small
    first-tier subcontractor on a prime contract that had a subcontracting plan may ask its prime for a written
    performance rating to use in its own bids [1496].

    '
  applies_when: Small first-tier subcontractors where the prime contract had a subcontracting plan, and small joint-venture
    members [1496].
  how_it_works:
  - 'CPARS: the prime is assessed on how it manages subcontractors (Guidance § 2.13); a formal joint venture gets
    a single evaluation under its own Unique Entity ID, otherwise only the named prime is evaluated (§ 2.5) [1500]'
  - The request goes to the prime within 30 days after completion of the period of performance; the prime responds
    within 15 calendar days of the request [1496]
  - 'Scale: Exceptional, Very Good, Satisfactory, Marginal, Unsatisfactory; factors: technical (quality), cost control,
    schedule/timeliness, management or business relations, other [1496]'
  - The agency "shall consider the concern's experience and rating of past performance as a first-tier subcontractor"
    [1496]
  - A small joint-venture member may request and use such a rating in the same way [1496]
  - 'Origin: SBA final rule 87 FR 43731, effective August 22, 2022, implementing section 868 of NDAA FY2021; the
    final rule dropped a three-year age limit on the performance used [1497]'
  - 'A small prime''s team: when a small prime''s offer identifies a team of small business first-tier subcontractors,
    "the head of the agency must consider the capabilities, past performance, and experience of each first tier
    subcontractor that is part of the team" if the prime''s own do not independently suffice (13 CFR 125.2(g)) [1498]'
  - 'FAR 15.305(a)(2)(iii): evaluators should take into account predecessor companies, key personnel, and subcontractors
    performing major or critical aspects; with no record, "the offeror may not be evaluated favorably or unfavorably
    on past performance" [1495]'
  - 'Joint ventures: the agency "must consider work done and qualifications held individually by each partner to
    the joint venture" (13 CFR 125.8(e)) [1499]; a small member "cannot identify and use as its own experience and
    past performance work that was performed exclusively by other partners to the joint venture" [1497]'
  - FAR 42.1502 states evaluation thresholds for contracts and orders held by the contractor (each contract or order
    exceeding the simplified acquisition threshold; construction contracts of $900,000 or more; architect-engineer
    services contracts of $45,000 or more); nothing returned provides for evaluating a subcontractor [1501]
  steps:
  - Request the written rating from the prime within 30 days after the period of performance is complete [1496]
  - The prime has 15 calendar days to respond; the subcontractor may notify the contracting officer if the prime
    does not comply [1496]
