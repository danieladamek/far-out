- id: export-controls
  name: 'Export controls: ITAR registration and the EAR'
  governing_text:
  - 22 CFR Part 122 (ITAR registration) [878]
  - 15 CFR Part 730 (EAR; only sections 730.3 and 730.7 were read) [880]
  what: 'ITAR: "Any person who engages in the United States in the business of manufacturing or exporting or temporarily
    importing defense articles, or furnishing defense services, is required to register." [878] A U.S. manufacturer
    of defense articles must register with DDTC even if it never exports [878]. The EAR covers purely civilian items,
    dual-use items, and military items not controlled under the ITAR, and "A relatively small percentage of exports
    and reexports subject to the EAR require an application to BIS for a license." [880]

    '
  applies_when: 'ITAR: a single occasion of manufacturing or exporting a defense article triggers the registration
    requirement [878]. EAR: exports and reexports of items subject to the EAR; no registration requirement was found
    in the sections read [880].'
  steps:
  - 'ITAR: register with form DS-2032 through the DDTC website (www.pmddtc.state.gov) and renew annually [878]'
  - 'EAR: classify the item; items not on the Commerce Control List are designated EAR99, and BIS points to its
    order-of-review tool [881]'
  - 'EAR: apply to BIS for a licence only where one is required [880]'
  cost_time: 'DDTC registration: Tier 1 $3,000 per year; Tier 2 $4,000; Tier 3 $4,000 plus $1,100 per favourable
    determination over five [878]. The fees took effect January 9, 2025 (Tier 1 $2,250 → $3,000; Tier 2 $2,750 →
    $4,000), with a pilot $500 discount (fee $2,500) where the fee is 1% or more of annual revenue [879].'
  official_url: https://www.pmddtc.state.gov
  related_urls:
  - https://www.bis.gov/regulations
  pending_changes: []
  as_of: '2026-10-03'
  sources:
