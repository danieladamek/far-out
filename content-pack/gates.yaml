- id: facility-clearance
  name: Facility security clearance (FCL)
  governing_text:
  - 32 CFR Part 117 (NISPOM), section 117.9 [877]
  - Executive Order 12829, which established the National Industrial Security Program [876]
  what: 'Under the National Industrial Security Program, DCSA oversees approximately 12,500 contractor facilities
    that are cleared for access to classified information, on behalf of DoD and 35 other federal agencies [876].
    32 CFR 117.9 sets entity eligibility: a legitimate need, a U.S. organisation, integrity, and foreign ownership,
    control or influence that is absent or mitigated [877]. A firm cannot apply for itself: "Contractors cannot
    sponsor themselves for an FCL." [875]

    '
  applies_when: When a government contracting activity or a cleared contractor sponsors the firm for access to classified
    information [875].
  steps:
  - A government contracting activity or a cleared contractor submits the sponsorship through NISS (National Industrial
    Security System) [875]
  - Have a CAGE code (from SAM.gov or DLA) [875]
  - Submit business documents and key management personnel information by Day 20 [875]
  - Submit KMP investigation requests and fingerprints by Day 45 [875]
  - Key management personnel must be identified and cleared as required [877]
  cost_time: '"The government funds the processing of personnel clearances (PCL) and facility clearances (FCL) for
    access to classified information." [875] Day 20 and Day 45 submission deadlines; no overall duration was found
    [875].'
