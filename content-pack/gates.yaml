    the report ending date" in 13 CFR 125.3 [1021] vs 45 days in the GSA and NRC deviation supplements [1013] [1014]'
  - 'Reporting system: eSRS at www.esrs.gov in the codified clause [1003] and "the eSRS (or any successor system)"
    in 13 CFR 125.3 [1021] vs Subcontracting Plan Reporting in SAM.gov since February 20, 2026 [1039] [1038]; HHS''s
    mentor-protégé provision also still names eSRS [1151]'
  - 'Filing threshold shown on sam.gov/esrs: first-tier subcontractor filers must have subcontracts "reported to
    SAM.gov with a value above $550,000.00" [1038], which does not match the $900,000 ($2 million for construction)
    at which a non-small subcontractor must adopt a plan [1002]'
- id: ffata-subaward-reporting
  name: FFATA first-tier subcontract (subaward) reporting in SAM.gov, formerly FSRS
  what: Clause 52.204-10 makes a prime contractor report each first-tier subcontract at or above the threshold in
    FAR 4.1403(a) by the end of the month following the month of award, and the reported information is made public
    [1008]. FSRS.gov retired on March 8, 2025 and all subaward reporting is now done in SAM.gov [1042] [1043]. The
    codified clause still names www.fsrs.gov [1008].
  applies_when: FAR subpart 4.14 "applies to all contracts with a value of $40,000 or more" [1009]; USAspending's
    documentation states the reporting threshold as $30,000 [1046]. A contractor with gross income under $300,000
    in the previous tax year is exempt from reporting subcontract awards [1008], and classified information is not
    disclosed [1009].
  steps:
  - Report by the end of the month following the month of award [1008]
  - 'Reported: subcontractor name, amount, date, description, subcontract number, address, place of performance,
    prime contract number, agency, NAICS and Treasury account symbol [1008]'
  - Reporters request the Data Entry role for entity reporting in SAM.gov; the page covers sign-in with former FSRS
    credentials and bulk upload [1043]
  - Executive compensation reporting applies at 80 percent and $25,000,000 of annual gross revenues from Federal
    sources [1008]
  - 'Publication: data submitted one day is available to USAspending the next day and published the day after [1047]'
  - 'Reading the records: federal users need no role to search subcontract reports; other users sign in [1044];
    the public API serves published and deleted federal subcontract data, needs an API key, and gives non-federal
    users without an entity role 10 requests a day [1045]'
  - 'Quality: "Duplication of subaward records is common"; records are sometimes late, incomplete or inconsistent
    and agency enforcement varies; the March 2025 migration added controls meant to prevent new duplication [1046]'
  official_url: https://sam.gov/fsrs
