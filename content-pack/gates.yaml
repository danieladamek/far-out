- id: limitations-on-subcontracting
  name: Limitations on subcontracting and the similarly situated entity rule
  what: On a set-aside or sole-source award, the small prime agrees it will not pay more than a set share of the
    amount paid by the Government to subcontractors that are not similarly situated entities (FAR 19.505; clause
    FAR 52.219-14) [645] [646]. A similarly situated entity is a first-tier subcontractor that has the same small
    business program status as the prime and is small [646]. SBA's rule at 13 CFR 125.6 sets the same percentages
    [647].
  applies_when: Small-business set-asides above the simplified acquisition threshold, and awards under FAR subparts
    19.8 (8(a)), 19.13 (HUBZone), 19.14 (SDVOSB) and 19.15 (WOSB) at any value [645].
  steps:
  - 'Services: no more than 50 percent of the amount paid by the Government to firms that are not similarly situated
    [645] [646]'
  - 'Supplies: 50 percent, excluding materials [645]'
  - 'General construction: 85 percent, excluding materials; special trade construction: 75 percent, excluding materials
    [645]'
  - Work by a similarly situated subcontractor's own employees does not count against the limit, but what that subcontractor
    passes on does; materials are not subcontracted work; certain direct costs (airline travel, cloud computing)
    are excluded for services [647]
  - Compliance is measured by the end of the base term and each option, or by the end of performance of each order
