- id: size-status-representation
  name: Representing size and socioeconomic status
  what: An offeror is required to represent its size and socioeconomic status in writing to the contracting officer
    at the time of initial offer (FAR 19.301-1) [650]. The representation is made in the provision FAR 52.219-1,
    which includes the small disadvantaged business box by reference to 13 CFR 124.1001 [596]. Size is determined
    as of the written self-certification with the initial offer including price (13 CFR 121.404) [513]. Bidding
    on a set-aside, encouraging classification as small, or registering as small in a federal database is itself
    deemed a certification of size [518] [519].
  applies_when: Every offer in which the firm claims small or program status [650]. On a multiple-award contract,
    a firm small at contract award is small for each order, subject to the rerepresentation rules [650]; a contract
    holder that cannot recertify for one order when the contracting officer asks may still be small for other orders
    where the contracting officer does not ask [513].
  steps:
  - 'Read the NAICS code on the solicitation: the contracting officer assigns one code by principal purpose, and
    its size standard governs [648] [508]'
  - 'Measure size against that standard: receipts averaged over five completed fiscal years [504]; employees averaged
    over the preceding completed 24 calendar months [505]; affiliates included [520]'
  - The certification must be signed by an authorized official [518]
  - 'Know the penalties: a presumption of loss to the United States based on the total amount expended on the contract;
    suspension or debarment; False Claims Act; criminal penalties under 15 U.S.C. 645(d); with a limitation for
    unintentional errors, technical malfunctions and similar situations [518]. FAR 52.219-1 states fine, imprisonment
    or both, suspension and debarment, and ineligibility for Small Business Act programs [596]'
  - A competitor, the contracting officer or SBA can challenge the representation by size protest; private parties
    have five business days [517]
  official_url: https://www.acquisition.gov/far/19.301-1
  pending_changes:
  - status: class-deviation
    date: '2025-09-26'
    text: 'FAR-overhaul numbering: the RFO Part 19 model deviation text issued September 26, 2025 carries NAICS
      code and size standard assignment at 19.103 [614]; the RFO section corresponding to FAR 19.301-1 was not identified
      in the text read. RFO Part 2 (October 28, 2025) defines a small business as one "qualified as a small business
      under the criteria and size standards in 13 CFR part 121" [616].'
  as_of: '2026-10-03'
