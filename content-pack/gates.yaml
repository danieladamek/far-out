- id: proposal-cap
  name: Per-firm proposal limits
  what: 'Starting fiscal year 2027, each agency''s SBIR/STTR director must set, equally for all small businesses,
    a limit on the maximum number of Phase I and Phase II proposals a firm may submit, on a fiscal-year, solicitation
    or topic basis [417]. The limit was to be established not later than 90 days before the start of FY2027, with
    topic-by-topic waivers for "time-sensitive and urgent" needs capped at 5 percent of topics per year [417]. HHS
    has published its limit of nine new and resubmission Phase I, Fast-track and Direct to Phase II applications
    per fiscal year [330].

    '
  applies_when: Every applicant from fiscal year 2027 [417]; at HHS for due dates on or after April 13, 2026 [330]
  steps:
  - Check the agency's limit before planning submissions; HHS allows nine per fiscal year [330]
  - NASA accepts no more than two proposal packages per offeror for an appendix [360]
  - NSF limits proposals per organization to 1 and Project Pitches to two per company per 12 months [338]
  - DOE allows each small business up to three pitches [356]
  - DOT allows one offer per topic with no limit on the number of offers [385]
  official_url: https://www.govinfo.gov/content/pkg/BILLS-119s3971enr/html/BILLS-119s3971enr.htm
  pending_changes:
  - status: final
    date: '2026-07-10'
    text: HHS limit published as NOT-OD-26-090, replacing the rescinded NOT-OD-26-073 [330]
  - status: pending-implementation
    date: '2026-04-13'
    text: Apart from HHS, no agency's FY2027 limit was found in sweeps C or D; the existing NASA, NSF, DOE and DOT
      limits are not confirmed as limits under the Act [417]
