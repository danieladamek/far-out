- id: research-gov
  name: NSF Research.gov registration
  what: 'NSF SBIR/STTR proposals are submitted via Research.gov [337]. NSF names three registrations, Unique Entity
    ID (SAM.gov), Research.gov and the SBA Company Registry, and gives no registration lead times [343].

    '
  applies_when: Submitting a full NSF SBIR/STTR proposal after a Project Pitch invitation [344]
