- id: dcaa-accounting-system
  name: Accounting system adequate for cost-type contracts
  governing_text:
  - FAR 16.301-3 [873]
  - SF 1408 (form revision January 2014), prescribed by FAR (48 CFR) 53.209-1(f) [874]
  - FAR 9.104-1 [894]
  what: 'A cost-reimbursement contract may be used only when "the contractor''s accounting system is adequate for
    determining costs applicable to the contract or order" [873]. In a pre-award survey before the first cost-type
    contract award, the design of the accounting system is judged against the SF 1408 criteria [872]. DCAA says
    of approval in advance: "There is no such thing as a DCAA approved government accounting system." [872]

    '
  applies_when: Cost-reimbursement contracts and orders [873]. The survey occurs prior to the first cost-type contract
    award [872].
  steps:
  - 'A federal entity requests the survey: "DCAA does not perform audits requested by a contractor. DCAA only performs
    these audits based on a request from a federal entity." [872]'
  - The system design is judged against the SF 1408 criteria [872]
  - 'The matching responsibility standard: "Have the necessary organization, experience, accounting and operational
    controls, and technical skills, or the ability to obtain them" [894]'
  cost_time: None stated in the pages read.
