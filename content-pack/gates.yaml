- id: cmmc
  name: Cybersecurity Maturity Model Certification (CMMC)
  governing_text:
  - 32 CFR Part 170 [862]
  - 32 CFR 170.3 (phases) [861]
  - DFARS 252.204-7021 (NOV 2025) [859]
  - DFARS 252.204-7025, Notice of CMMC Level Requirements, and the DFARS final rule at 90 FR 43560 (September 10,
    2025) [860]
  what: 'CMMC is the DoD program rule at 32 CFR Part 170 that sets cybersecurity levels, who assesses them and how
    long a status lasts, and DFARS 252.204-7021 requires a current CMMC status at the stated level for the life
    of the contract [862] [859]. On July 13, 2026 the Department announced the immediate suspension of the CMMC
    Phase II requirements; implementation is paused in Phase 1 and all Phase I self-assessment requirements remain
    in place [863]. The rule and the suspension are recorded separately below, and the parts that rest only on secondary
    sources are listed under suspension.secondary_only.

    '
  rule:
    basis: primary sources only (eCFR, DFARS text on acquisition.gov, Federal Register, DoD CIO page)
    levels:
    - 'Level 1: 15 requirements from 48 CFR 52.204-21(b)(1) [862]; annual self-assessment and annual affirmation,
      and no plans of action permitted [863]'
    - 'Level 2: 110 requirements from NIST SP 800-171 R2; conditional status at 88 of 110 with a plan of action
      closed within 180 days [862]; Level 2 (self) is a self-assessment every three years with annual affirmation
      [863]'
    - 'Level 3: 24 requirements selected from NIST SP 800-172 (Feb 2021) [862]'
    - A status is valid 3 years from issuance, with annual affirmation; C3PAOs must meet ISO/IEC 17020:2012(E) [862]
    phases_in_32_cfr_170_3:
    - 'Phase 1: Level 1 (Self) or Level 2 (Self); "Begins on the effective date of the complementary 48 CFR part
      204 CMMC Acquisition final rule." [861]'
    - 'Phase 2, "one calendar year following the start date of Phase 1": adds Level 2 (C3PAO) [861]'
    - 'Phase 3, one year after Phase 2: adds Level 3 (DIBCAC) [861]'
    - 'Phase 4, one year after Phase 3: full implementation [861]'
    - 'Dates derived by the sweep from the rule''s arithmetic, not quoted: Phase 1 November 10, 2025; Phase 2 November
      10, 2026; Phase 3 November 10, 2027; Phase 4 November 10, 2028 [861]'
    acquisition_rule:
    - DFARS final rule 90 FR 43560, effective November 10, 2025; clauses 252.204-7021 and 252.204-7025 (Notice of
      CMMC Level Requirements) [860]
    - Through November 9, 2028 CMMC applies where program managers and requiring activities decide to apply it;
      on or after November 10, 2028 it applies wherever the contractor will process, store or transmit FCI or CUI
      [860]
    - Awards solely for COTS items are excluded; a conditional status is allowed for up to 180 days at Levels 2
      and 3 [860]
    - 'Contract clause: "Have and maintain for the duration of the contract a current CMMC status at the following
      CMMC level, or higher"; annual affirmation of continuous compliance in SPRS; a 10-character CMMC unique identifier
      per assessment; flows down where the subcontractor will process, store or transmit FCI or CUI [859]'
  suspension:
    announced: '2026-07-13'
    primary:
    - '"On July 13, 2026, the Department of War announced the immediate suspension of the Cybersecurity Maturity
      Model Certification (CMMC) Phase II requirements, which was originally scheduled for November 10, 2026." [863]'
    - '"All Phase I self-assessment requirements remain firmly in place." [863] [864]'
    - '"The first phase of CMMC implementation began on November 10, 2025 and CMMC implementation is paused in Phase
      1." [863]'
    - 'Implementing memorandum "Implementing Suspension of CMMC Phase II" (document 26-P-1023; July 2026, date and
      signer not legible in the fetch): suspends the phased schedule including the November 2026 Phase 2 transition,
      and Level 2 (C3PAO) and Level 3 (DIBCAC) in new procurements [865]'
    - Under the memorandum new procurements may ask only for Level 1 (Self) or Level 2 (Self), and open solicitations
      are to be amended and existing contracts modified [865]
    - NIST SP 800-171 Rev 2 and DFARS 252.204-7012 obligations remain; the memorandum refers to the CIO's 60-day
      review [865]
    - The Department of War CIO page links two memoranda, "Removing Barriers to DIB Expansion" and "Implementing
      Suspension of CMMC Phase II", and an FAQ [864]
    - The text of 32 CFR 170.3 is unchanged by the suspension, which was done by memorandum and class deviation
      [861]
    - The DARS class-deviation page fetched showed Class Deviation 2026-O0025 (overhaul Part 40, DFARS Part 240)
      dated 18 December 2025, with no revisions [809]
    secondary_only:
    - Class Deviation 2026-O0025 Revision 2 (July 16, 2026) and Revision 3 (September 3, 2026, issued by Defense
      Pricing, Contracting, and Acquisition Policy) [868] [869]
    - That 252.204-7021 remains in the regulation, that removal from contracts is by modification, and that clauses
      already in signed contracts bind until modified [869] [866]
    - 'The reform RFI: posted July 13, 2026 with responses due August 14, 2026; closed with about 1,100 responses
      [867] [868]'
    - The 60-day review closed September 11, 2026 with no report released as of that date [868]
    - The war.gov press release (Article 4542329) returned 403 to the fetch tool and is known only through a consultant
      summary [866]
    - DFARS Part 240 numbering for the assessment text (DFARS 240.371, clause 252.240-7997) [869]
    - 'Assessment cost figures that the sweep attributes to a vendor log quoting SBA ($593,800 for third-party certification
      against $388,600 for self-assessment): no primary source was fetched; do not use [868]'
  applies_when: 'Under the DFARS rule, DoD contracts where the contractor will process, store or transmit FCI or
    CUI, other than awards solely for COTS items: at the discretion of program managers and requiring activities
    through November 9, 2028 [860]. Since July 13, 2026 implementation is paused in Phase 1 [863].'
  steps:
  - Read the required CMMC level in the solicitation notice (252.204-7025) [860]
  - Self-assess at Level 1 or Level 2 (Self), the only levels new procurements may ask for under the suspension
    memorandum [865]
  - Enter results in SPRS [863]
  - Affirm continuous compliance annually in SPRS (https://piee.eb.mil) [859]
  - Flow the requirement down where the subcontractor will process, store or transmit FCI or CUI [859]
  cost_time: A status is valid 3 years from issuance [862]; a conditional status may last up to 180 days [860].
    No official cost figure was fetched.
  ecosystem: The Cyber AB is the CMMC accreditation body; its marketplace is at https://cyberab.org/Catalog and
    its home page carried no statement on the suspension [870]. SPRS holds NIST SP 800-171 assessments, CMMC status
    and self-assessments [871].
  official_url: https://dodcio.defense.gov/CMMC/About/
