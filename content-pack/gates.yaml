- id: subcontracting-plan-reporting-sam
  name: Subcontracting plan reporting (ISR and SSR) in SAM.gov, formerly eSRS
  what: A contractor with a subcontracting plan files Individual Subcontract Reports (ISR) and Summary Subcontract
    Reports (SSR) showing its awards to small businesses (FAR 19.704(a)(10); 52.219-9(l)) [1002] [1003]. eSRS.gov
    was decommissioned on February 20, 2026 and the filing moved to Subcontracting Plan Reporting (SPR) in SAM.gov;
    www.esrs.gov now redirects to sam.gov/esrs [1039] [1038] [1015]. The codified FAR text still names eSRS at www.esrs.gov
    [1003].
  applies_when: The contract carries clause 52.219-9, used above $900,000 ($2 million for construction) [1001];
    a subcontractor that is not small and holds its own plan reports too [1002]. Plans, and so these reports, are
    not required from small business concerns [1001]. Each plan holder reports only its own first-tier awards [1028].
  steps:
  - 'ISR: semi-annually for the periods ending March 31 and September 30, and at contract completion; no ISR under
    a commercial plan [1003]'
  - 'SSR: annually by October 30 [1003]; under a commercial plan, one SSR a year within 30 days after the Government
    fiscal year ends [1002]'
  - 'Due date for the ISR: 30 days after the period closes in the codified FAR [1002] [1003]; 45 days in 13 CFR
    125.3 and in the February 2026 deviation supplement [1021] [1013] [1014]'
  - Filers need a SAM.gov "Administrator or Data Entry" role for Subcontracting Plan Reporting [1038]
  - Second-tier and lower-tier subcontractor ISR reporting was deployed only in the pre-production environment [1038]
  - '2026 transition: GSA "deployed updates to SAM.gov to resolve known issues with the Subcontracting Plan Reporting
    system", and mid-year ISRs were due July 14, 2026 [1040]'
  - 'DoD: ISRs go to the procuring contracting office and the consolidated SSR to "Department of Defense"; Alternate
    I substitutes SF 294 for the ISR [1036]; Test Program participants file the SSR semiannually [1037]'
  - Failure to submit timely subcontracting reports can be a material breach [1029]
  - 'What the public sees: aggregate subcontract dollars by NAICS code in agency reports under Small Business Act
    section 15(h)(3)(A)(ii) [1078]'
  official_url: https://sam.gov/esrs
