- id: sam-registration
  name: SAM.gov registration and Unique Entity ID (UEI)
  what: 'SAM registration provides the UEI and is one of the registrations that must be completed before an application
    can be submitted [355]. NIH requires SAM registration with annual renewal [322]. EPA requires an active SAM
    registration set to "contracts" or "all awards" [393].

    '
  applies_when: Before applying to NIH, NSF, DOE, DOT, EPA, ED or NIST opportunities, each of which names SAM or
    the UEI among its requirements [322] [343] [355] [382] [393] [398] [402]
  steps:
  - 'Start early: DOE says SAM takes "Up to 8 weeks (pending capacity)" [355]; NIH says registration can take 6
    weeks or more [322]; EPA says to allow 6-8 weeks minimum for its registrations [393]'
  - For EPA contracts, set the SAM registration to "contracts" or "all awards" [393]
  - For DOT, use NAICS code 541715 in the SAM registration [385]
  - For NIH, renew the SAM registration annually [322]
  - Grants.gov applicants find instructions for registering with sam.gov as part of the grants.gov process [402]
  official_url: https://sam.gov/
