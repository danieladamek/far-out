- id: size-at-subcontract
  name: Size at subcontract
  governing_text: 13 CFR 121.404(g); 13 CFR 121.410; 13 CFR 121.411; 13 CFR 121.104; 13 CFR 121.106; 13 CFR 125.12;
    13 CFR 121.103; FAR 52.219-8 (Jan 2025)
  what: '"For subcontracting purposes, a concern must qualify as small as of the date that it certifies that it
    is small for the subcontract." [1502]. The subcontractor is small if "it does not exceed the size standard for
    the NAICS code that the prime contractor believes best describes the product or service being acquired" by the
    subcontract [1506].

    '
  applies_when: 'Each time a firm represents itself as small for a subcontract: "A subcontractor must still qualify
    and self-certify as a small business at the time it submits its offer" [1507].'
  how_it_works:
  - Primes may rely on SAM as an accurate representation of size and ownership [1507]; under FAR 52.219-8 a prime
    may accept a size representation in writing or through SAM, and contractors may not require the use of SAM for
    size or status representations [1491]
  - 'Receipts: all revenue from whatever source, averaged over the most recently completed five fiscal years, with
    affiliates'' average receipts added; "All other items, such as subcontractor costs ... may not be excluded from
    receipts." [1504]'
  - 'Employees: the average "based upon numbers of employees for each of the pay periods for the preceding completed
    24 calendar months", including employees of domestic and foreign affiliates [1505]'
  - 'Protest and penalties: a subcontractor''s size may be protested by the contracting officer, the prime, the
    SBA official or any other interested party; misrepresentation carries suspension or debarment, False Claims
    Act civil penalties, criminal penalties [1507]'
  - 'Competitive subcontracts over the simplified acquisition threshold: unsuccessful offerors are told the name
    and location of the apparent successful offeror [1507]'
  - 'Recertification on prime contracts (13 CFR 125.12): "Recertification of size and small business program status
    is required within 30 calendar days of a merger, acquisition, or sale of or by a concern"; on long-term contracts,
    no more than 120 days before the end of the fifth year and before each option thereafter; growth alone between
    those events is not listed as a trigger in what was returned [1503]'
  - 'Dependence on one customer: a concern that derived 70% or more of its receipts from another concern over the
    previous three fiscal years is presumed affiliated with it, rebuttably (13 CFR 121.103(f)(2)) [1481]'
  - 'Joint ventures: "a specific joint venture generally may not be awarded contracts beyond a two-year period,
    starting from the date of the award of the first contract" without the partners being deemed affiliated [1481]'
  - 'Ostensible subcontractor: one that is not a similarly situated entity and performs primary and vital requirements,
    or on which the prime is unusually reliant (13 CFR 121.103(h)(3)) [1481]'
  steps:
  - Check size as of the date of certifying for each subcontract, against the NAICS code the prime assigns to it
    [1502] [1506]
