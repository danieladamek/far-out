- id: basic-safeguarding-nist-800-171
  name: Basic safeguarding and NIST SP 800-171
  governing_text:
  - FAR 52.204-21 (Nov 2021) [855]
  - DFARS 252.204-7012 (MAY 2024) [856]
  - DFARS 252.204-7019 (NOV 2023) [857]
  - DFARS 252.204-7020 (NOV 2023) [858]
  what: 'FAR 52.204-21 sets 15 basic safeguarding requirements for contractor systems holding Federal contract information
    [855]. DFARS 252.204-7012 requires NIST SP 800-171 on systems holding covered defense information, and cyber
    incident reporting "within 72 hours of discovery of any cyber incident" [856]. DFARS 252.204-7019 tells offerors
    that a current NIST SP 800-171 assessment score in SPRS is needed to be considered for award [857].

    '
  applies_when: 52.204-21 flows down to subcontracts where the subcontractor may have Federal contract information,
    and not to COTS items [855]. For DoD awards a current assessment is one "not more than 3 years old unless a
    lesser time is specified in the solicitation" [857].
  steps:
  - Apply the 15 basic safeguarding requirements, which cover access control, identification and authentication,
    media sanitisation, physical access, boundary protection, flaw remediation and malicious-code protection [855]
  - 'DoD: complete at least a Basic NIST SP 800-171 DoD Assessment within the last 3 years [858]'
  - A Basic Assessment posting includes CAGE codes, system security plan description, date, summary level score
    (for example 95 out of 110) and the date a score of 110 is expected [857]
  - Scores are held in SPRS, which vendors reach through PIEE [871]
  - Report cyber incidents within 72 hours of discovery at https://dibnet.dod.mil; a DoD-approved medium assurance
    certificate is needed to report [856]
  - External cloud providers must meet requirements equivalent to the FedRAMP Moderate baseline [856]
  - Preserve images of affected systems for at least 90 days [856]
  - Give access for a Medium or High (government) assessment; 14 business days to rebut findings [858]
  cost_time: None stated in the pages read.
  official_url: https://www.acquisition.gov/dfars/252.204-7012-safeguarding-covered-defense-information-and-cyber-incident-reporting.
