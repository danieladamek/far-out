- id: era-commons-assist
  name: NIH eRA Commons and ASSIST
  what: 'The NIH, CDC and FDA SBIR parent announcement requires eRA Commons registration and tracks applications
    in eRA Commons [322]. Applications are submitted through NIH ASSIST, an institutional system-to-system service,
    or Grants.gov Workspace [322]. The STTR parent also requires ORCID for all PD/PIs [324].

    '
  applies_when: Applying under PA-27-100 (NIH, CDC and FDA SBIR) or PA-27-102 (NIH STTR) [322] [324]. NIH contract
    proposals instead go through eCPS [321].
  steps:
  - Register in SAM, the SBA Company Registry, eRA Commons and Grants.gov; registration can take 6 weeks or more
    [322]
  - Submit through ASSIST, system-to-system, or Grants.gov Workspace [322]
  - Use eRA Commons to follow application status [331]
  - After reauthorization NIH told firms that company registrations take 6+ weeks [327]
  official_url: https://seed.nih.gov/small-business-funding/how-to-apply
