- id: disputes-with-a-prime
  name: Disputes with a prime
  governing_text: 41 U.S.C. 7101 and 7103; FAR 44.203; FAR 52.244-2 (Jun 2020); 4 CFR 21.0 and 21.5; 31 U.S.C. 3905(i)-(j);
    15 U.S.C. 644(k)(6); FAR 32.112-1; FAR 52.219-9 (Jan 2025); FAR 52.219-16 (Sep 2021); 13 CFR 125.3(c)
  what: 'A subcontractor has no contract with the Government. Contract Disputes Act claims are claims by a contractor,
    defined as "a party to a Federal Government contract other than the Federal Government" [1482] [1483]. The Federal
    Circuit put it this way: "Government consents to be sued only by those with whom it has privity of contract,
    which it does not have with subcontractors." [1485]

    '
  applies_when: Any subcontractor in dispute with its prime, or with a claim that must travel through the prime
    because the Government has no privity with subcontractors [1485] [1484].
  how_it_works:
  - '"Each claim by a contractor against the Federal Government relating to a contract shall be submitted to the
    contracting officer for a decision."; in writing, within 6 years after accrual [1483]'
  - 'Pass-through: a prime may sue for its subcontractor''s costs; under the Severin doctrine the burden is on the
    Government to prove the prime is not responsible to the subcontractor [1485]'
  - 'FAR 44.203: the contracting officer will not consent to subcontracts obligating him to deal directly with the
    subcontractor; a subcontract may give an indirect appeal, meaning "assertion by the subcontractor of the prime
    contractor''s right to appeal or the prosecution of an appeal by the prime contractor on the subcontractor''s
    behalf", and may provide that prime and subcontractor are equally bound by the contracting officer''s or board''s
    decision [1484]'
  - The prime gives the contracting officer immediate written notice of any suit and prompt notice of any claim
    by a subcontractor [1451]
  - 'GAO: an interested party is an actual or prospective bidder or offeror (4 CFR 21.0(a)(1)); "GAO will not consider
    a protest of the award or proposed award of a subcontract" except on agency request (21.5(h)); contract administration
    is outside GAO''s protest function (21.5(a)) [1487]'
  - 'Construction payment: interest owed by a prime is not a federal obligation, and contractor–subcontractor disputes
    are not disputes with the United States (31 U.S.C. 3905(i)-(j)) [1430]'
  - 'OSDBU: each agency''s small business office has a statutory duty covering payments, late payment interest penalties,
    and "information regarding payments due to such concerns from an executive agency or a contractor" (15 U.S.C.
    644(k)(6)) [1489]'
  - 'SBA National Ombudsman: takes small-business comments about federal agency enforcement (fines, audits, inspections);
    nothing on its page offers help with a prime contractor [1488]'
  - 'Subcontracting plan: failure to comply in good faith is a material breach (FAR 52.219-9(k)) [1374]; liquidated
    damages are "the actual dollar amount by which the Contractor failed to achieve each subcontract goal" [1492]'
  - 'Plan assurances that protect small subcontractors: a good-faith effort to buy from the small businesses used
    in preparing the bid or proposal, with a written explanation within 30 days of contract completion if not; unsuccessful
    small business subcontract offerors are told the name and location of the apparent successful offeror [1374]'
  - A prime that names a small business as a subcontractor in a proposal must notify it in writing beforehand (13
    CFR 125.3(c)(8)) [1442]
  - SBA Commercial Market Representatives conduct Subcontracting Program Compliance Reviews of large primes, per
    SBA's June 2010 handbook; a non-compliant prime "may be found in material breach of contract and terminated
    for default, or liquidated damages may be imposed" [1375]
  steps:
  - A subcontractor may assert non-payment to the contracting officer, who may look into it and may encourage payment
    or reduce or suspend the prime's progress payments [1439]
  - The prime "will not prohibit a subcontractor from discussing with the Contracting Officer any material matter
    pertaining to payment to or utilization of a subcontractor" [1374]; SBA's rule says the same [1442]
  official_url: https://www.acquisition.gov/far/44.203
