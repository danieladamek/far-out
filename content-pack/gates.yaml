- id: section-889-fascsa
  name: Section 889 telecommunications prohibition and FASCSA orders
  governing_text:
  - FAR 52.204-25 (Nov 2021) [853]
  - FAR 52.204-30 (Dec 2023) [854]
  what: 'FAR 52.204-25, the Section 889 clause, bars delivering covered telecommunications and video surveillance
    equipment to the government and bars the government from contracting with firms that use it; the named companies
    are Huawei Technologies Company, ZTE Corporation, Hytera Communications Corporation, Hangzhou Hikvision Digital
    Technology Company and Dahua Technology Company, and their subsidiaries and affiliates [853]. FAR 52.204-30
    bars contractors from supplying or using articles or sources named in a FASCSA exclusion or removal order; orders
    are issued by the Secretary of Homeland Security, the Secretary of Defense or the Director of National Intelligence
    [854].

    '
  applies_when: Section 889(a)(1)(A) has been effective since August 13, 2019 and (a)(1)(B) since August 13, 2020
    [853]. The FASCSA prohibition applies in contracts carrying 52.204-30 [854].
  steps:
  - 'Represent Section 889 status: 52.212-3 covers Section 889 telecommunications for commercial buys [852]'
  - Search SAM.gov for the phrase "FASCSA order" [854]
  - 'Section 889: report discovery within one business day, with a follow-up within 10 business days [853]'
  - 'FASCSA: report within 3 business days, with a fuller report within 10 business days [854]'
  - 52.204-25 flows down to all subcontracts, except paragraph (b)(2) [853]
  cost_time: None stated in the pages read.
