- id: flow-down-clauses
  name: Flow-down clauses
  governing_text: FAR 52.244-6 (Oct 2025); FAR 52.212-5(e) (Mar 2026); DFARS 252.244-7000 (NOV 2023); FAR 52.244-2
    (Jun 2020); each clause's own subcontracts paragraph
  what: 'A flow-down is a clause in the prime contract that the prime must repeat in its subcontracts. For a commercial
    subcontract the FAR lists the clauses a prime must flow down and says "the Contractor may flow down to subcontracts
    for commercial products or commercial services a minimal number of additional clauses necessary to satisfy its
    contractual obligations" [1448]. Where the prime contract itself is commercial, "the Contractor is not required
    to flow down any FAR clause, other than those in this paragraph (e)(1)" [1449].

    '
  applies_when: Any subcontract under a federal prime contract; the required lists apply to subcontracts for commercial
    products and commercial services [1448] [1449], and each other clause sets its own trigger.
  how_it_works:
  - 'Commercial subcontract under a non-commercial prime contract, FAR 52.244-6(c)(1), 24 entries as returned: 52.203-13
    (Nov 2021); 52.203-15 (Jun 2010); 52.203-17 (Nov 2023); 52.203-19 (Jan 2017); 52.204-21 (Nov 2021); 52.204-23
    (Dec 2023); 52.204-25 (Nov 2021); 52.204-27 (Jun 2023); 52.204-30 (Dec 2023) and Alt I; 52.219-8 (Jan 2025);
    52.222-21 (Apr 2015); 52.222-26 (Sept 2016); 52.222-35 (Jun 2020); 52.222-36 (Jun 2020); 52.222-37 (Jun 2020);
    52.222-40 (Dec 2010); 52.222-50 (Oct 2025) and Alt I (Mar 2015); 52.222-55 (Jan 2022); 52.222-62 (Jan 2022);
    52.224-3 (Jan 2017) and Alt I; 52.225-26 (Oct 2016); 52.232-40 (Mar 2023); 52.240-1 (Nov 2024); 52.247-64 (Nov
    2021) [1448]'
  - 'Commercial prime contract, FAR 52.212-5(e)(1), 27 entries as returned: 52.203-13; 52.203-17; 52.203-19; 52.204-23;
    52.204-25; 52.204-27; 52.204-30; 52.219-8; 52.222-21; 52.222-26; 52.222-35; 52.222-36; 52.222-37; 52.222-40;
    52.222-41; 52.222-50; 52.222-51; 52.222-53; 52.222-54; 52.222-55; 52.222-62; 52.224-3; 52.225-26; 52.226-6;
    52.232-40; 52.240-1; 52.247-64 [1449]'
  - 'DoD: no FAR or DFARS clause flows to a commercial subcontract unless that clause requires it (DFARS 252.244-7000,
    as paraphrased by the fetch) [1450]'
  - 'Basic safeguarding (FAR 52.204-21): fifteen safeguarding requirements, flowed to subcontracts, including commercial
    ones other than COTS, "in which the subcontractor may have Federal contract information residing in or transiting
    through its information system" [1452]'
  - 'DFARS 252.204-7012: included in subcontracts for operationally critical support or involving covered defense
    information, including commercial subcontracts, "without alteration, except to identify the parties"; the sub
    notifies the prime when it asks the contracting officer to vary from a NIST SP 800-171 requirement and gives
    the prime the DoD-assigned incident report number; cyber incidents are reported within 72 hours of discovery
    [1453]'
  - 'CMMC (DFARS 252.204-7021, NOV 2025): flows to subcontracts involving Federal contract information or controlled
    unclassified information, excluding COTS items; before awarding, the prime checks that the sub holds a "current
    CMMC status at the CMMC level that is appropriate for the information that is being flowed down"; affirmation
    of continuous compliance before subcontract award and annually [1454]'
  - 'Trafficking (FAR 52.222-50): "The Contractor shall include the substance of this clause, including this paragraph
    (i), in all subcontracts and in all contracts with agents."; the compliance plan applies to any portion of a
    contract or subcontract over $700,000 for non-COTS supplies acquired, or services performed, outside the United
    States (figure as displayed; recheck) [1455]'
  - 'E-Verify (FAR 52.222-54): subcontracts for services (other than commercial services that are part of a COTS
    purchase) or construction, valued at "more than $3,500", with work performed in the United States [1456]'
  - 'Service Contract Labor Standards (FAR 52.222-41): "The Contractor agrees to insert this clause in all subcontracts
    subject to the Service Contract Labor Standards statute."; withholding, payment suspension and termination are
    available for underpayment of wages or fringe benefits [1457]'
  - 'Construction labor (FAR 52.222-11): eleven named labor clauses go into each construction subcontract; "The
    prime Contractor shall be responsible for compliance by any subcontractor or lower tier subcontractor"; an SF
    1413 within 14 days after contract award for each subcontract [1458]'
  - 'Accelerated payment (FAR 52.232-40): the substance flows to all subcontracts with small business concerns,
    including commercial products and services [1421]'
  - 'Technical data and software (DFARS 252.227-7013 and 252.227-7014): flow without alteration, except to identify
    the parties [1470] [1472]'
  - 'Certified cost or pricing data: the prime inserts FAR 52.215-12 or 52.215-13 in each subcontract that "exceeds
    the threshold for submission of certified cost or pricing data in FAR 15.403-4(a)(1)" [1460] [1461]; the threshold
    is "$2.5 million for prime contracts awarded on or after July 1, 2018" ($950,000 before that date) and reaches
    a subcontract at any tier if the contractor and each higher-tier subcontractor were required to furnish certified
    data [1462]'
  - 'Subcontractor data goes to the Government when the subcontract is $20 million or more, or both above the threshold
    and more than 10 percent of the prime''s proposed price: "the contractor shall submit, or cause to be submitted
    by the subcontractor(s), certified cost or pricing data to the Government" [1463]'
  - 'Consent to subcontract (FAR 52.244-2): consent is not a determination of the acceptability of subcontract terms
    or of cost allowability; "No subcontract or modification thereof placed under this contract shall provide for
    payment on a cost-plus-a-percentage-of-cost basis"; the prime gives immediate written notice of any suit and
    prompt notice of any claim by a subcontractor [1451]'
  - 'Thresholds changed on October 1, 2025 (90 FR 41872, FAR Case 2024-001): simplified acquisition threshold $250,000
    to $350,000; certified cost or pricing data $2,000,000 to $2,500,000; subcontracting plan $750,000 to $900,000
    [1464]'
  - 'A prime''s own terms, one company''s example: Lockheed Martin''s published general provisions for commercial
    subcontracts set payment terms net 45 days, New York governing law with FAR-derived provisions "construed and
    interpreted according to the federal common law of government contracts", stop-work for up to 90 days on written
    notice, and termination for convenience at any time; an illustration from one company, not representative of
    all primes [1467]'
  steps: []
