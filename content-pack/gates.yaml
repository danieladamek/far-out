- id: payment-systems
  name: 'Payment systems: electronic invoicing (WAWF, IPP) and EFT details'
  governing_text:
  - DFARS 252.232-7003 (DEC 2018) [903]
  - FAR 52.232-25 (Jan 2017) [898]
  - FAR 52.204-7 (Nov 2024) [842]
  what: 'DoD contractors must "submit payment requests and receiving reports in electronic form using Wide Area
    WorkFlow (WAWF)" [903]. Treasury''s Invoice Processing Platform is the electronic invoicing system used by civilian
    agencies, provided "at no cost to federal agencies and their vendors" [902]. A proper invoice includes TIN and
    EFT details where required [898], and the EFT indicator is part of the mandatory SAM registration information
    [842].

    '
  applies_when: DoD contracts carrying 252.232-7003, with exceptions for written approval of another method, purchase
    card payments, and certain transportation and TRICARE systems [903]. IPP serves civilian agencies; which agencies
    are enrolled was not checked [902].
  steps:
  - 'DoD: submit through WAWF by EDI, secure file transfer or direct web entry; information at https://wawf.eb.mil/
    [903]'
  - 'Civilian agencies on IPP: vendors can submit invoices, check status and see payment and offset details; enrolment
    details are at ipp.gov [902]'
  - 'Put on each invoice: name and address, invoice date and number, contract number, description and price, payment
    address, and TIN and EFT details where required [898]'
  cost_time: IPP is provided at no cost to vendors [902].
  official_url: https://wawf.eb.mil/
  related_urls:
  - https://www.fiscal.treasury.gov/ipp/
  pending_changes:
