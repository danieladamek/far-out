- id: e-verify
  name: E-Verify
  governing_text:
  - FAR 52.222-54 (Jan 2025) [885]
  - FAR 22.1803 [886]
  what: 'FAR 52.222-54 is the E-Verify clause: it sets enrolment and verification deadlines and the subcontract
    flowdown [885]. E-Verify''s own page says "a presidential Executive order and subsequent Federal Acquisition
    Regulation (FAR) rule required federal contractors to use E-Verify", and that it applies to employees working
    under covered federal contracts [887].

    '
  applies_when: The clause goes in all solicitations and contracts that exceed $150,000, except work only outside
    the United States, a period of performance less than 120 days, or only COTS items (or near-COTS) and related
    commercial services [886]. It flows down to subcontracts over $3,500 for services or construction performed
    in the United States [885].
  steps:
  - Enroll within 30 calendar days of contract award [885]
  - Begin verifying new hires within 90 calendar days of enrollment [885]
  - Verify each new hire within 3 business days after the date of hire [885]
  cost_time: The deadlines in the steps [885]. No cost statement was fetched.
