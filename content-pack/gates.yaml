- id: ostensible-subcontractor-affiliation
  name: Ostensible subcontractor rule and affiliation risk in teaming and joint ventures
  what: An ostensible subcontractor is a subcontractor that is not a similarly situated entity and performs primary
    and vital requirements of a contract or order, or is a subcontractor upon which the prime contractor is unusually
    reliant (13 CFR 121.103(h)(3)(i)) [1024]. Such a relationship makes the offeror ineligible as a small business;
    since final rule 89 FR 102448 (effective January 16, 2025) the offeror is ineligible rather than being treated
    as a joint venture [1095] [1110]. Compliance is judged "as of the date of the final proposal revision for negotiated
    acquisitions and final bid for sealed bidding" (13 CFR 121.404(f)) [1096].
  applies_when: A small prime on a set-aside relies on a subcontractor that is not similarly situated, such as a
    large or incumbent firm [1024]; and, for the wider affiliation rules, whenever firms team, joint venture or
    share owners, managers or revenue [1095].
  steps:
  - 'Safe harbour for services, specialty trade construction and supplies: SBA will find no ostensible subcontractor
    where the prime, together with similarly situated small business subcontractors, meets the limitations on subcontracting
    in 13 CFR 125.6 (13 CFR 121.103(h)(3)(iii)) [1024] [1095]'
  - 'General construction: "the primary and vital requirements of the contract are the management, supervision and
    oversight of the project", not the construction work itself (13 CFR 121.103(h)(3)(iv)) [1024] [1095]'
  - A prime may use a subcontractor's experience and past performance, including an incumbent's, and no single factor
    is determinative [1024] [1109]
  - 'Limitations on subcontracting: not more than 50% of the amount paid by the Government for services or supplies,
    85% for general construction and 75% for special trade construction may go to firms that are not similarly situated;
    work a similarly situated subcontractor performs with its own employees is excluded from the cap and from the
    ostensible subcontractor rule; the penalty is the greater of $500,000 or the excess spent [1023] [1007]'
  - Contracting officers may ask a small prime for information showing compliance with the limitations on subcontracting
    [1029]
  - 'Joint ventures: a joint venture is ineligible where the managing partner will not perform 40% of the joint
    venture''s work (13 CFR 121.103(h)(3)(v)) [1024]; after two years from its first award the partners of a joint
    venture are deemed affiliated for new offers, and each partner counts its proportionate share of the joint venture''s
    receipts and employees [1095]'
  - 'Identity of interest (13 CFR 121.103(f)): family members who do business with each other are presumed affiliated,
    and economic dependence is presumed where a concern derived 70% or more of its receipts from another concern
    over the previous three fiscal years; both presumptions are rebuttable [1095]'
  - 'Newly organized concern (13 CFR 121.103(g)): former officers or key employees who start a firm in the same
    or a related industry with assistance from the old firm; rebuttable by a clear line of fracture [1095]'
  - 'Exceptions: an SBA-approved mentor-protégé agreement is not by itself a basis for affiliation (13 CFR 121.103(b)(6));
    a Small Business Teaming Arrangement on a bundled or multiple-award contract above the substantial bundling
    threshold carries no affiliation if each member is small (13 CFR 121.103(b)(9)) [1095]'
  - 'Who can raise it: on a set-aside, any offeror not eliminated for reasons unrelated to size, the contracting
    officer, or the SBA Government Contracting Area Director may file a size protest [1097]; VOSB/SDVOSB undue-reliance
    protests need credible evidence [1105]'
  - 'Pointer only, not regulation text: a law-firm explainer lists four reliance factors SBA''s Office of Hearings
    and Appeals applies (the subcontractor is the ineligible incumbent; the prime plans to hire most of its workforce
    from it; the prime''s managers previously worked for it on the incumbent contract; the prime lacks relevant
    experience) and says a finding causes affiliation for that contract only [1085] [1024]'
  official_url: https://www.ecfr.gov/current/title-13/chapter-I/part-121/subpart-A/subject-group-ECFRd133f03f6d8398b/section-121.103
