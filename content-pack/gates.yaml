- id: nsf-project-pitch
  name: NSF Project Pitch and invitation
  what: 'A Project Pitch is required for an NSF Phase I proposal, and invitations are valid for the next two submission
    deadlines after the initial official invitation [338]. The pitch has four sections: Technology Innovation (up
    to 3,500 characters); Technical Objectives and Challenges (up to 3,500); Market Opportunity (up to 1,750); Company
    and Team (up to 1,750) [342].

    '
  applies_when: Before any NSF SBIR/STTR Phase I proposal [338]
  steps:
  - Submit the pitch at any time and expect a reply in about 1-2 months [341]
  - Submit only one Project Pitch at a time [342]
  - Stay within two pitches per company per 12 months and three for the same project or technology [338]
  - Invitations issued on or after July 3, 2025 that have not been used run until November 4, 2026 [340]
  official_url: https://seedfund.nsf.gov/project-pitch/
