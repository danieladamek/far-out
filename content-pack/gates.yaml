  - 880
  - 881
  conflicts:
  - Whether the Tier 1 discount pilot, described as one year, continues is not verified [879]
- id: bonding-insurance-construction
  name: Bonds and insurance (construction), with SBA surety guarantees
  governing_text:
  - FAR 28.102-1 [882]
  - FAR 28.307-2 [884]
  what: 'FAR 28.102-1 "requires performance and payment bonds for any construction contract exceeding $150,000"
    [882]. FAR 28.307-2 sets minimum liability insurance for cost-reimbursement contracts [884]. SBA''s Surety Bond
    Guarantee program guarantees bonds issued by surety companies for small firms that cannot get them otherwise
    [883].

    '
  applies_when: 'Construction contracts exceeding $150,000: performance and payment bonds; between $35,000 and $150,000
    the contracting officer selects two or more payment protections (payment bond, irrevocable letter of credit,
    tripartite escrow agreement, certificates of deposit, other approved security) [882]. The 2025 inflation adjustment
    did not change the performance and payment bond thresholds [810].'
  steps:
  - Provide the bonds or payment protection the contract requires [882]
  - A small firm that needs a guarantee applies through an SBA-authorized surety agent; questions go to suretybonds@sba.gov
    [883]
  - SBA guarantees bid, payment, performance and ancillary bonds [883]
  cost_time: 'SBA guarantee fee: 0.6% of the contract price for performance and payment bonds, and no fee for bid
    bond guarantees; SBA guarantees on contracts up to $9 million for non-federal work and up to $14 million for
    federal work [883]. Insurance minimums: employer''s liability at least $100,000; general liability bodily injury
    at least $500,000 per occurrence; automobile $200,000 per person, $500,000 per occurrence bodily injury and
    $20,000 per occurrence property damage [884].'
  official_url: https://www.sba.gov/funding-programs/surety-bonds
  pending_changes:
