- id: miller-act-bond-claim
  name: Miller Act payment bond claim
  governing_text: 40 U.S.C. 3131 and 3133; FAR 28.102-1 and 28.102-2; FAR 28.106-6
  what: 'On federal construction above the threshold the prime furnishes a payment bond, which protects those supplying
    labor and material [1434]. An unpaid subcontractor or supplier claims on the bond by suit in federal district
    court, after a 90-day wait and within one year [1435].

    '
  applies_when: A person who furnished labor or material on a bonded federal construction contract and has not been
    paid in full within 90 days after the last labor or material; a person with a direct contract with a subcontractor
    but none with the prime must also give the prime written notice [1435].
  how_it_works:
  - 'Threshold in the FAR: it "requires performance and payment bonds for any construction contract exceeding $150,000"
    [1436]'
  - 'Threshold in the statute as read: "Before any contract of more than $100,000 is awarded for the construction,
    alteration, or repair of any public building or public work" [1434]'
  - 'Contracts over $35,000 and up to $150,000: the contracting officer selects two or more payment protections
    (payment bond, irrevocable letter of credit, tripartite escrow agreement, certificates of deposit, other security)
    [1436]'
  - 'Amount: above $150,000 the payment bond is 100 percent of the original contract price plus 100 percent of any
    increase, and "the amount of the payment bond must be no less than the amount of the performance bond" [1437];
    the statute sets it at the total amount payable under the contract unless the contracting officer finds that
    impractical in writing [1434]'
  - The inflation adjustment effective October 1, 2025 excluded the performance and payment bond thresholds [1464]
  - A civil action may be brought if the claimant is not paid in full within 90 days after the last labor or material
    (40 U.S.C. 3133(b)(1)) [1435]
  - 'Second tier: written notice to the prime within 90 days from the last labor or material, by any means that
    provides written, third-party verification (40 U.S.C. 3133(b)(2)) [1435]'
  - Suit is in the name of the United States for the use of the claimant, in the U.S. District Court for the district
    where the contract was to be performed, and "must be brought no later than one year after the day on which the
    last of the labor was performed or material was supplied" [1435]
  - A waiver of the right to sue is void unless in writing, signed by the person waiving, and executed after the
    labor or material was furnished [1435]
  - 'Pay-when-paid: the Ninth Circuit held that a "pay when and if paid" clause did not bar the Miller Act payment
    bond claim and that a waiver of Miller Act rights must be clear and explicit; one circuit only [1440]'
  - 'Related: SBA guarantees bid, payment, performance and ancillary bonds for small contractors, on non-federal
    contracts up to $9 million and federal contracts up to $14 million, with a guarantee fee of 0.6% of the contract
    price for performance and payment bonds; the page does not say whether subcontracts qualify [1447]'
  steps:
  - Ask the contracting officer for the surety's name and address, the penal amount, and a copy of the payment bond;
    a reasonable copying fee is allowed [1438]
  - A certified copy of the bond and contract goes to anyone who files an affidavit of non-payment for labor or
    material [1438] [1435]
  - If second tier, give the prime written notice within 90 days from the last labor or material [1435]
  - File suit in U.S. District Court after the 90 days and no later than one year after the last labor or material
    [1435]
