- id: tax-and-exclusion-checks
  name: Responsibility, tax and exclusion checks
  governing_text:
  - FAR 9.104-1 [894]
  - FAR 9.104-5 [895]
  - FAR Subpart 9.4 [893]
  - FAR 52.209-5 (Aug 2020) [896]
  - FAR 52.209-11 (Feb 2016) [897]
  what: 'Before award the contracting officer must find the firm responsible against seven standards: financial
    resources; schedule; performance record; integrity and business ethics; organisation, experience, accounting
    and operational controls; equipment and facilities; otherwise qualified and eligible [894]. Exclusion records
    in SAM are checked after bids open or proposals arrive and again immediately before award [893]. The firm certifies
    whether it is "presently debarred, suspended, proposed for debarment, or declared ineligible" [896], and the
    disclosure threshold for tax is "Federal tax delinquency in an amount that exceeds $15,000." [895]

    '
  applies_when: Before award to any firm [894]. Subcontracts exceeding $45,000 with excluded parties need a compelling
    reason and written notice to the contracting officer [893]. When a corporation discloses tax delinquency or
    a felony conviction, award is blocked until a suspending and debarring official decides [895].
  steps:
  - 'Keep the responsibility certification true: it covers convictions or civil judgments within a three-year period
    for fraud, antitrust, embezzlement, theft, forgery, bribery, false statements, tax evasion [896]'
  - Corporations represent whether they have unpaid assessed federal tax or were "convicted of a felony criminal
    violation under a Federal law within the preceding 24 months" [897]
  - 'Primes: check subcontractors against SAM exclusions before subcontracting above $45,000 [893]'
  - Registrations, exclusions and responsibility/qualification data (formerly FAPIIS.gov) sit together in SAM.gov
    [841]
  cost_time: 'Delinquent tax threshold: exceeds $15,000 [895]. "Generally, debarment should not exceed 3 years"
    [893].'
  official_url: https://sam.gov/content/entity-information
