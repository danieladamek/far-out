- id: market-research-firm-side
  name: Market research from the firm's side
  what:
  - 'Statutory forecast duty (15 U.S.C. 637(a)(12)(C)): each executive agency reporting to FPDS contract actions
    with an aggregate value above $50,000,000 "shall prepare a forecast of expected contract opportunities or classes
    of contract opportunities for the next and succeeding fiscal years"; the quoted sentence goes on to small business
    concerns, where the fetch cut it off [811]'
  - The FAR itself only says that publicising long-range acquisition estimates "may be desirable" (FAR 5.404) [790]
  - GSA's Forecast of Contracting Opportunities tool, at https://acquisitiongateway.gov/forecast, is "a governmentwide
    planning tool that shows upcoming federal contract opportunities"; registration is not required to search, and
    it is for information and planning purposes only [814]
  - A November 29, 2024 OFPP memo set 19 core data elements (including NAICS code, estimated value range, set-aside,
    anticipated solicitation timing, contacts) and reporting "on no less than a quarterly basis"; it was read from
    the archived White House site and its current status is not confirmed [812]
  - acquisition.gov indexes forecast links for 22 agencies; several links redirect or are stale, and it does not
    list EPA or SBA [813]
  - 'Several agencies send firms to the GSA tool rather than hosting their own forecast: USDA, DOL, DOI, DOT (FY26
    onward), NRC and OPM [906] [913] [914] [916] [920] [921]'
  - The buyer's own market research techniques include contacting knowledgeable people in industry, publishing formal
    requests for information, querying the governmentwide database of contracts, and presolicitation conferences;
    the research must address whether small businesses can meet the need [821]
  - 'Award history: "All contract award data that was previously available in FPDS.gov is now available in SAM.gov.";
    a SAM.gov account is needed to see search results, and no role is required [816]'
  - 'USAspending API: V2 endpoints are available and V1 is deprecated; maintained by Treasury [819]'
  - '"Exchanges of information among all interested parties, from the earliest identification of a requirement through
    receipt of proposals, are encouraged."; techniques include industry or small business conferences, one-on-one
    meetings, draft RFPs and RFIs [822]'
  - Once the solicitation is out, "the contracting officer must be the focal point of any exchange with potential
    offerors" [822]
  - 'SBA''s list of where to look: SAM.gov; Small Business Search (SBS), the database agencies use to find small
    contractors; SubNet, which lists subcontracting opportunities posted by large contractors; and agency procurement
    forecasts [823]'
  - GSA points small firms to its forecast tool and to subcontracting leads via SBA SubNet, SAM.gov, USASpending.gov
    and GSA's Subcontracting Directory [722]
  official_url: https://www.acquisition.gov/procurement-forecasts
