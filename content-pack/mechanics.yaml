  active_flag:
  - '`active`: Yes means an active opportunity; No means archived [792]'
  - '`archiveDate` and `archiveType` (manual or automatic) record when and how a notice leaves the active set [792]'
  - On the posting side, archive options include auto30 (automatic archive 30 days after) and autocustom (a date
    the poster sets) [793]
  - Search has a "Show active only" option [794]
  deadline:
  - '`responseDeadLine`: the date by which responses are due [792]'
  - '"notice must be published at least 15 days before issuance of a solicitation", with exceptions for commercial
    products and services [787]'
  - At least 30 days response time for non-commercial actions exceeding the simplified acquisition threshold; at
    least 45 days for research and development actions expected to exceed it [787]
  - For commercial acquisitions and actions over $25,000 but under the SAT, the contracting officer sets a reasonable
    response time [787]
  - 'WTO GPA / FTA acquisitions: at least 40 days between synopsis and offer receipt, reducible to 10 days if covered
    by a published annual forecast [787]'
  synopsis_thresholds:
  - 'Over $25,000: the proposed contract action is synopsized in the GPE [786]'
  - '$20,000 to $25,000: an unclassified notice displayed in a public place or by any appropriate electronic means,
    posted not later than the solicitation issue date and kept up for at least 10 days or until after quotations
    have been opened, whichever is later [786]'
  - Contract awards exceeding $25,000 are synopsized when covered by trade agreements or likely to result in subcontracts
    (5.301) [785]
  - Since October 1, 2025 (FAC 2025-06) the micro-purchase threshold is $15,000 and the simplified acquisition threshold
    $350,000 [810]
  - 'SBA''s plain version: "Government agencies are required to use SAM to advertise all contracts over $25,000."
    [823]'
  data_extract:
  - 'Data access routes named on SAM.gov: DataBank reports, downloadable contract opportunity data files, public
    API [794]'
  - 'Public API: production endpoint https://api.sam.gov/opportunities/v2/search; API key required; posted-date
    range limited to 1 year [792]'
  - The data.gov record for the extract points to https://sam.gov/data-services/Contract%20Opportunities?privacy=Public,
    with contact IAE Outreach (iaeoutreach@gsa.gov); update frequency is not stated on the record [796]
  - 'Award data: the SAM.gov Contract Awards API (production endpoint https://api.sam.gov/contract-awards/v1/search)
    replaced the FPDS ATOM feed; daily limits are 10 requests for a non-federal user without a SAM.gov role and
    1,000 with a role [818] [816]'
