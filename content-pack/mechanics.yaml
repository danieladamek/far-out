- id: responding
  name: 'Responding: sources sought, capability statements, offers and debriefings'
  what:
  - 'Answering a sources-sought notice feeds the "rule of two": over the simplified acquisition threshold a buy
    is set aside when offers are reasonably expected from at least two responsible small businesses at fair market
    prices [828]'
  - 'Agency templates put a capability statement on one page: core competencies, past performance, differentiators
    and company data [825]'
  - A written debriefing request is due within 3 days, of the exclusion notice before award or of the award notification
    after it [832] [833]
  - In DoD, awards of $10 million or more carry a debriefing on request and a round of follow-up questions [834]
  sources_sought:
  - Above the micro-purchase threshold and not over the simplified acquisition threshold, an acquisition "shall
    be set aside for small business unless" two responsible small businesses cannot reasonably be expected [828]
  - Over the simplified acquisition threshold, the acquisition is set aside when offers are reasonably expected
    from at least two responsible small businesses at fair market prices [828]
  - GSA describes a sources sought as posted after requirements are defined and primarily used to identify capable
    small businesses, "if there is a reasonable expectation of obtaining two or more offers from small business
    concerns" [797]
  - Contracting officers must consider potential sources that respond to advance R&D notices for a subsequent solicitation
    [788]
  - 'An RFI is not a solicitation: "RFIs may be used when the Government does not presently intend to award a contract,
    but wants to obtain price, delivery, other market information, or capabilities for planning purposes." [822]'
  - Sole-source notices state that responsible sources may submit a capability statement, proposal or quotation,
    which the agency must consider [789]
  capability_statement:
  - 'HHS elements: branding; company summary; core capabilities; major services; federal small business certifications;
    contract vehicles; state certifications; agencies served; major clients; NAICS codes; partners; staff clearances;
    company data (CAGE code); contact information; length "1 page (front and back)" [824]'
  - 'NIH template: one page, single-sided preferred; PDF under 1MB; tailored per agency or opportunity; past performance
    ordered with the target agency first, then federal, other government, commercial; company data block with CAGE
    code, NAICS codes, socio-economic certifications, GSA Schedule and contract vehicles [825]'
  - 'Treasury: contact details, NAICS codes, past performance examples, certifications, logo, value proposition
    [826]'
  - HHS vendor engagement sessions are pre-arranged 15-minute appointments with Small Business Specialists and require
    an SBCX profile and an uploaded capability statement [827]
  - The HHS page still names the D-U-N-S number and the NIH template still says DUNS [824] [825]; the SAM-generated
    Unique Entity ID took over on April 4, 2022 [844]
  offers:
  - 'Part 15: the RFP must state the requirement, terms and conditions, information required in the proposal, and
    evaluation factors and significant subfactors; Section L holds instructions to offerors and Section M the evaluation
    factors and their relative importance [829]'
  - A proposal received after the deadline is "late" and not considered unless an exception applies [829]
  - Price or cost is evaluated in every source selection; a firm with no record "may not be evaluated favorably
    or unfavorably on past performance"; award without discussions is allowed if the solicitation says so [830]
  - '"Oral presentations by offerors as requested by the Government may substitute for, or augment, written information.";
    representations, certifications and the signed offer must still be in writing [831]'
  - 'Part 12 commercial buys: provisions 52.212-1 (Instructions to Offerors) and 52.212-3 (Offeror Representations
    and Certifications), clause 52.212-4 (Contract Terms and Conditions), on firm-fixed-price contracts or fixed-price
    contracts with economic price adjustment [835]'
  - 'Part 13: "A quotation is not an offer and, consequently, cannot be accepted by the Government to form a binding
    contract."; simplified procedures for commercial products and services run up to $9 million ($15 million for
    acquisitions described in 13.500(c)) [836]'
  - 'GSA''s explainer: an RFQ is for simplified acquisitions or GSA Schedule holders; an RFP is a formal solicitation
    expected to exceed the simplified acquisition threshold [797]'
  debriefings:
  - 'Preaward (FAR 15.505): written request "within 3 days after receipt of the notice of exclusion from the competition";
    the offeror may ask to delay the debriefing until after award [832]'
  - 'Postaward (FAR 15.506): written request within 3 days after the offeror received notification of contract award;
    the debriefing should occur within 5 days after receipt of the written request [833]'
  - 'Minimum content: significant weaknesses or deficiencies; overall evaluated cost or price and technical rating
    of the awardee and the debriefed offeror; overall ranking if any; summary of the rationale for award; no point-by-point
    comparison with other offerors [833]'
  - 'DoD enhanced debriefings (DFARS Case 2018-D009, effective March 18, 2022): for awards of $10 million or more
    a debriefing is required on request; over $10 million and not over $100 million, small businesses and nontraditional
    defense contractors may request the redacted source selection decision document [834]'
  - 'DoD: follow-up questions within 2 business days after the debriefing, answered in writing within 5 business
    days; applies to task and delivery orders of $10 million or more; clauses 252.215-7016 and 252.216-7010 [834]'
  official_url: https://www.gsa.gov/system/files/Pre-Award%20Notices%20-%20508%20-%2008272021.pdf
