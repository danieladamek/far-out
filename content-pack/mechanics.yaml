# mechanics.yaml — FAR Out content pack · assembled 2026-10-03 from the SBIR/STTR, set-asides/vehicles and partnering sweeps. Every reference carries recheck: true until quotes are verified against live pages.
- id: reading-sam-gov
  name: Reading SAM.gov contract opportunities
  what:
  - 'SAM.gov is the Governmentwide point of entry (GPE): "The single point where Government business opportunities
    greater than $25,000, including synopses of proposed contract actions, solicitations, and associated information,
    can be accessed electronically by the public." [791]'
  - '"Contract opportunities are procurement notices from federal contracting offices."; anyone can search without
    an account [794]'
  - An account lets a user "save searches, follow changes to opportunities, and join interested vendor lists" [794];
    SAM.gov help covers how to get email notifications of saved search results [795]
  - The interested vendor list is a per-notice setting the contracting office enables [793]
  - A synopsis carries eighteen data elements, including Product or Service Code, Closing Response Date, Contact
    Point, Description, Place of Contract Performance and Set-aside Status [789]
  - 'What the early notices are for, per GSA: an RFI is used early, before requirements are defined, for planning;
    a sources sought is posted after requirements are defined and is "primarily used to identify small businesses
    capable of performing/providing the requirement" [797]'
  - The FAR term comes from 5.205, where advance R&D notices are titled "Research and Development Sources Sought"
    [788]
  - '"RFI" is not among the notice-type codes [792]; RFIs are a FAR 15.201 technique [822]. That RFIs are posted
    as sources-sought or special notices is the sweep''s inference from the code list; no page fetched says it outright
    [792]'
  - 'Award history: "All public-facing functionality of FPDS has been fully transitioned to Sam.gov."; ezSearch
    was decommissioned February 24, 2026 [816]. Non-federal users cannot see DoD data until 90 days after signing
    [817]'
