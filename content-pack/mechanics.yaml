- id: payment-and-performance
  name: Payment and performance
  what:
  - 'Prompt payment: the due date is the later of the 30th day after the billing office receives a proper invoice
    or the 30th day after Government acceptance; late payment earns interest automatically [898]'
  - Constructive acceptance falls on the 7th day after delivery for computing interest; shorter periods apply to
    perishables (meat and fish 7 days; perishable agricultural commodities and dairy 10 days) [898]
  - The prompt payment interest rate for July 1–December 31, 2026 is 4.75%; the governing rule is 5 CFR Part 1315
    [901]
  - A proper invoice includes name and address, invoice date and number, contract number, description and price,
    payment address, and TIN and EFT details where required [898]
  - 'Accelerated payment to small business primes: agencies "shall provide accelerated payments, to the fullest
    extent permitted by law, with a goal of 15 days after receipt of a proper invoice"; it is a goal, not a right,
    and Prompt Payment Act interest rules are unchanged [900]'
  - 'Small subcontractors: "within 15 days after receipt of accelerated payments from the Government, the Contractor
    shall make accelerated payments to its small business subcontractors"; no fees may be charged, and the clause
    creates no new Prompt Payment Act rights [899]'
  - 'DoD invoicing: payment requests and receiving reports are submitted in electronic form using Wide Area WorkFlow
    (https://wawf.eb.mil/) [903]'
  - 'Civilian invoicing: Treasury''s Invoice Processing Platform, provided at no cost to federal agencies and their
    vendors [902]'
  - 'Performance record: evaluations are prepared at least annually and at completion and entered into CPARS [837];
    the contractor has up to 14 calendar days to comment [838]'
  - 'Modifications: only a contracting officer can change a contract; changes are bilateral (supplemental agreement)
    or unilateral (administrative change, change order); contractors must notify the Government in writing of alleged
    changes (43.104) [904]'
  - 'Requests for equitable adjustment in DoD: certification is required under 10 U.S.C. 3862(a) for requests exceeding
    the simplified acquisition threshold [905]'
  official_url: https://www.fiscal.treasury.gov/prompt-payment/
