- id: affiliation
  name: Affiliation (whose employees and receipts count)
  owner: U.S. Small Business Administration (13 CFR 121.103)
  what: Control, or the power to control, makes firms affiliates of each other, and affiliates' size is added together
    [520]. Affiliation is based on the power to control, whether exercised or not [501]. Affiliates' employees and
    receipts are added to the firm's own when its size is measured [501] [505].
  eligibility:
  - Control may be affirmative or negative (for example, a minority owner able to block a quorum); blocking only
    extraordinary actions (adding equity holders, dissolution, sale of all assets, merger, bankruptcy) is not negative
    control [520]
  - 'Stock: 50% or more of voting stock controls; equal large minority blocks are presumed to control (rebuttable)
    [520]'
  - Common management; identity of interest — family members doing business together are presumed affiliated, rebuttable
    by a clear line of fracture; economic dependence is presumed at 70% or more of receipts from one concern over
    three fiscal years [520]
  - 'Newly organized concern: former officers or key employees start a same-industry firm that gets contracts, financial
    or technical help from the old firm; rebuttable [520]'
  - 'Joint ventures: partners are not affiliated for contracts awarded within two years of the joint venture''s
    first award; the joint venture must be in writing and registered in SAM under its own name [520]'
  - 'Ostensible subcontractor: a subcontractor that is not similarly situated and performs the primary and vital
    requirements of a contract or order, or on which the prime contractor is unusually reliant [520]'
  - 'SBIR/STTR has narrower rules: a firm is not affiliated with a portfolio company of a venture capital operating
    company, hedge fund or private equity firm solely on the basis of shared investors; SBA may find affiliation
    with a holder of 40% or more of voting equity on the totality of circumstances (13 CFR 121.702) [521]'
  benefits:
  - 'Exceptions in 13 CFR 121.103(b)(1)–(b)(10): SBIC and investment-company owners; firms owned by Indian Tribes,
    ANCs, NHOs and CDCs; SBA-approved R&D pools; employee leasing or PEO arrangements; certain investors for financial
    assistance; SBA-approved mentor-protégé relationships; agricultural cooperative members; SBIR/STTR (exceptions
    apply there too); Small Business Teaming Arrangements; faith-based organizations [520]'
  - 'Mentor-protégé (13 CFR 125.9): no affiliation or control may be found between a protégé and its mentor based
    solely on the mentor-protégé agreement, and a joint venture between a protégé and its mentor qualifies as small
    for any procurement for which the protégé individually qualifies as small [522]'
  - 'Mentor-protégé limits: generally no more than three protégés at one time; agreement term may not exceed six
    years; the mentor may take up to a 40% equity interest in the protégé [522]'
  - '8(a) entity-owned firms: size is determined independently, without regard to affiliation with the Tribe or
    ANC [556], the NHO [557] or the CDC [558]'
  - 'Sole-source thresholds and price evaluation preference: not applicable to this record'
  steps: []
  cost_and_time: 'Not applicable: affiliation is a rule applied when size is measured, not an application [520].'
  recertification:
  - A merger, acquisition or sale that changes controlling interest triggers recertification of size within 30 calendar
    days (13 CFR 125.12) [514]
