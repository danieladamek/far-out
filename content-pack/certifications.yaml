- id: nontraditional-defense-contractor
  name: Nontraditional defense contractor status (10 U.S.C. 3014)
  owner: Department of Defense (a statutory status; no certifying body was found)
  what: 'A nontraditional defense contractor is an entity that is not currently performing and has not performed,
    for at least the one-year period preceding DoD''s solicitation of sources, "any contract or subcontract for
    the Department of Defense that is subject to full coverage under the cost accounting standards" [1605] [1628].
    Small businesses qualify in practice because "Contracts and subcontracts with small businesses" are exempt from
    the cost accounting standards [1613]; DoD''s 2018 OT guide says "a large number of entities will fall into the
    NDC category, including nearly all small business concerns" [1628]. This is the effect of the existing definition,
    not a change made by the FY2026 NDAA: section 3014 shows no Pub. L. 119-60 amendment, and section 1826 of that
    Act, set out as a note under section 3014, does not contain the words "small business" [1605] [1610].

    '
  eligibility:
  - No DoD contract or subcontract subject to full coverage under the cost accounting standards (41 U.S.C. 1502),
    now or in the one-year period preceding DoD's solicitation of sources [1605] [1628]
  - The test is full CAS coverage in the prior one-year period, not whether the firm has ever worked for DoD [1605]
  - The definition applies "with respect to a procurement or with respect to a transaction authorized under section
    4021(a) or 4022" [1605]
  - The CAS Board's exemption list has 15 categories, including "Contracts and subcontracts with small businesses"
    (48 CFR 9903.201-1(b)) [1613]
  - 'Amendment history of section 3014 as shown: Pub. L. 116-283 section 1806(b) (Jan. 1, 2021; effective Jan. 1,
    2022) and Pub. L. 117-263 section 1081(a)(4) (Dec. 23, 2022); no Pub. L. 119-60 amendment to the section text
    [1605]. No section heading in Title VIII or Title XVIII of Pub. L. 119-60 names other transaction authority
    or redefines "nontraditional defense contractor" [1610]'
  benefits:
  - 'Prototype OTs: at least one nontraditional defense contractor participating to a significant extent, or all
    significant participants being small businesses or nontraditional defense contractors, satisfies 10 U.S.C. 4022(d)(1)
    without cost share [1601]'
  - 'Commercial treatment: products and services provided by nontraditional defense contractors "may be treated
    by the head of an agency as commercial products and commercial services, respectively, for purposes of this
    chapter" (10 U.S.C. 3457(a)) [1608] [1617]'
  - DFARS 252.215-7013 (JAN 2023) tells offerors that "supplies and services provided by a nontraditional defense
    contractor, as defined in DFARS 202.101, may be treated as commercial products or commercial services"; applying
    commercial procedures does not require a commercial item determination and does not mean the supplies or services
    are commercial [1617]
  - Services provided by a business unit that is a nontraditional defense contractor "shall be treated" as commercial
    services to the extent they use the same pool of employees as for commercial customers and are priced using
    a similar methodology (10 U.S.C. 3457(b)) [1608]
  - 'Exemptions since December 18, 2025 (Pub. L. 119-60, section 1826, 139 Stat. 1249, a statutory note under section
    3014): for DoD contracts, subcontracts, or agreements, "products and services provided by nontraditional defense
    contractors (as defined in section 3014 of title 10, United States Code) shall be exempt" from ten listed requirements:
    DFARS 252.242-7006, 252.234-7002, 252.215-7002, 252.242-7004, 252.245-7003, 252.244-7001, 252.242-7005, DFARS
    215.407, 10 U.S.C. 3702, and FAR Part 31 (each "or successor regulation") [1605] [1610]'
  - 'Waiver: the exemption may be waived or modified for a product or service by written determination approved
    by the head of the relevant contracting activity; delegable only to a senior contracting official or higher;
    partial application needs a written justification that it is in the best interest of the Federal Government;
    the Secretary of Defense notifies the congressional defense committees not later than 60 days after a waiver
    is issued [1605]'
  - The statute behind exemption (9), 10 U.S.C. 3702 (certified cost or pricing data), applies at $10,000,000 for
    prime contracts entered into after June 30, 2026 and $2,000,000 on or before that date [1609]
  steps:
  - No certification, application or SAM representation for nontraditional status was found in this sweep; DFARS
    252.215-7013 advises offerors and does not create a certification [1617]
  - 'DoD''s original Part 215 deviation text requires the provision in every solicitation: "Insert the provision
    at 252.215-7013, Supplies and Services Provided by Nontraditional Defense Contractors, in all solicitations.";
    no nontraditional self-representation was found in the text read [1624]'
  - 'In an OT the Government records which condition it relied on: FPDS element 10T takes "NSP" Nontraditional Significant
    Participation, "CS" Cost Sharing or "DEC" Determination of Exceptional Circumstances [1664]'
  - In Telesto the court found the Army properly relied on certifications and its own evaluation findings for nontraditional
    participation [1661]
  - 'Consortia apply the condition per project: "DOTC, NEST, and AMTC solicitations require NDC participation or
    1/3 cost share on each proposed effort." [1750]'
  cost_and_time: 'None stated: the status follows from the definition, and the sweep found no fee, application or
    processing time [1605] [1617].'
  recertification: None stated. The definition looks back over the one-year period preceding DoD's solicitation
    of sources, so it is read against each solicitation [1605].
  official_url: https://www.law.cornell.edu/uscode/text/10/3014
  pending_changes:
  - status: pending-implementation
    date: '2025-12-18'
    text: Pub. L. 119-60, section 1826 ("Sec. 1826. Exemptions for nontraditional defense contractors.") was enacted
      December 18, 2025 [1610]. The note states no effective date and no dollar threshold, and commentators treat
      it as effective on enactment [1605] [1610] [1687] [1686].
  - status: class-deviation
