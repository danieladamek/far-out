- id: hubzone
  name: HUBZone program
  owner: U.S. Small Business Administration
  what: Certification for small firms based in, and employing residents of, historically underutilized business
    zones [564]. A certified firm keeps its principal office in a HUBZone and at least 35% of its employees live
    in one [564] [566]. Certified firms get sole-source authority and a 10 percent price evaluation preference in
    full and open competition [572]. The statutory government-wide goal for HUBZone firms is not less than 3 percent
    [597].
  eligibility:
  - A small business concern meeting 13 CFR 126.200 [566]
  - At least 51% owned and controlled by U.S. citizens, a CDC, an agricultural cooperative, an ANC, an NHO or an
    Indian tribe [564]
  - 'Principal office in a HUBZone [564]. Principal office: where the greatest number of employees at any one location
    work; lease or deed at least 30 days before review and running at least 60 days after [565]'
  - At least 35% of employees must be HUBZone residents; fractions round to the nearest whole number [566]
  - 'Employee: works a minimum of 10 hours per week in the four-week period before review (SBA may accept at least
    40 hours in that period with a documented business reason) [565]'
  - 'Reside: live at a location full-time for at least 90 calendar days immediately before the date of review [565]'
  - 'Legacy HUBZone employee: lived in a HUBZone for at least 180 calendar days after the firm''s certification
    date and stays continuously employed; up to four at a time, with at least one other HUBZone-resident employee
    [566]'
  - 'Long-term investment: buying a building or leasing for 10+ years keeps principal-office status for up to 10
    years after the area loses designation [566]'
  - For a HUBZone contract, the firm must be listed as certified in DSBS (or successor) and meet 126.200 on the
    date of its initial offer including price; it need not be certified on the award date, except for sole source
    [569]
  benefits:
  - 'Sole source, codified FAR 19.1306: up to $8.5 million for manufacturing NAICS codes and $5.5 million for all
    other NAICS codes, options included, when offers would not be received from two or more HUBZone firms and the
    requirement is not currently in 8(a) [572]'
  - 'Sole source, SBA regulation: 13 CFR 126.612 as displayed prints $7,000,000 (manufacturing) and $4,500,000 (all
    other), where two or more HUBZone firms are not likely to offer [570]. See conflicts'
  - 'Price evaluation preference, codified FAR 19.1307: in full and open competition the contracting officer adds
    a factor of 10 percent to all offers except those of HUBZone firms and other small businesses; not used where
    price is not a selection factor, where all fair and reasonable offers are accepted, or for the reserved portion
    of a multiple-award solicitation; the HUBZone firm may waive it [572] [656]'
  - 'Price evaluation preference, 13 CFR 126.613: the HUBZone price is deemed lower if not more than 10% above the
    large-business low offer; not applied where the low offeror is a small business [570]'
  - 'HUBZone set-asides: SBA''s rules cover offers on a "HUBZone contract" [569]; the codified FAR set-aside section
    for HUBZone was not read in this sweep, so no set-aside test is recorded here'
  - Among the 8(a), HUBZone, SDVOSB and WOSB programs there is no order of precedence; above the simplified acquisition
    threshold they are considered before a general small-business set-aside [652]
  - The limitations on subcontracting apply to HUBZone awards (FAR subpart 19.13) at any value [645]
  steps:
  - Check the address on the HUBZone map (https://maps.certify.sba.gov/hubzone/map) [564] [573]
  - Apply at certifications.sba.gov [564]
  - The applicant must be eligible as of the date SBA issues its decision [567]
  cost_and_time: 'SBA says it does not charge any costs for applying to its programs [585]. 13 CFR 126.306: SBA
    makes its determination within 60 calendar days after receipt of a complete package [567]. One fetch of SBA''s
    page reported "within 90 calendar days" [564]; see conflicts.'
  recertification:
  - Recertify every three years [564], in the 90 calendar days before the triennial anniversary of certification
    [568]
  - Firms with a HUBZone contract in the prior 12 months show they are attempting to maintain 35%; others must meet
    35% outright [568]. Falling below 20% HUBZone residents during a HUBZone contract is failure to attempt to maintain
    [565]
  - A firm that fails to recertify is decertified at the end of its eligibility period; reinstatement is possible
    within 30 days [568]
  - SBA's page describes unannounced program examinations [564]
  - Size and HUBZone status are recertified within 30 calendar days of a merger, acquisition or sale changing controlling
    interest, and on contracts over five years (13 CFR 125.12) [514]
  - 'Status protests: by the fifth business day after bid opening or notice of the apparent successful offeror,
    filed with the contracting officer and forwarded to SBA (hzprotests@sba.gov); SBA decides in 15 business days;
    appeal within 5 business days; on sole-source awards only SBA or the contracting officer may protest (FAR 19.306;
    13 CFR 126.801) [685] [571]'
  official_url: https://www.sba.gov/federal-contracting/contracting-assistance-programs/hubzone-program
  pending_changes:
  - status: final
    date: '2024-12-17'
    text: HUBZone Program Updates and Clarifications, 89 FR 102448 (RIN 3245-AH68), effective January 16, 2025,
      with the unified recertification section 13 CFR 125.12 delayed to January 17, 2026 [515].
  - status: announced
