- id: vosb-sdvosb-vetcert
  name: Veteran-Owned (VOSB) and Service-Disabled Veteran-Owned (SDVOSB) certification — VetCert
  owner: U.S. Small Business Administration (since January 1, 2023; formerly the Department of Veterans Affairs)
  what: SBA certification of veteran-owned and service-disabled veteran-owned small firms [584]. Certification moved
    from VA to SBA on January 1, 2023 [584] [589]. Only certified VOSBs and SDVOSBs are eligible to submit an offer
    on a specific VOSB or SDVOSB requirement [586]. SDVOSBs have government-wide sole-source authority [591], and
    inside VA the Veterans First program gives priority to SDVOSBs and then VOSBs [592].
  eligibility:
  - Identified by VA as a veteran or service-disabled veteran; small; no less than 51% owned and controlled by one
    or more veterans; for SDVOSB, 51% owned and controlled by veterans rated service-disabled by VA [584]
  - '13 CFR 128.200: not less than 51 percent owned and controlled by veterans (service-disabled veterans for SDVOSB)
    [586]'
  - '13 CFR 128.202: ownership direct and unconditional; a surviving spouse may retain SDVOSB status for 3 to 10
    years depending on disability rating [586]'
  - '13 CFR 128.203: the qualifying veteran holds the highest officer position and controls long-term and day-to-day
    decisions [586]'
  - 'Permanently and totally disabled veterans: a spouse or appointed permanent caregiver may assist in management
    [584]'
  benefits:
  - 'SDVOSB set-aside (13 CFR 128.404): a reasonable expectation of two responsible SDVOSB offers at fair market
    price [586]'
  - 'SDVOSB sole source, codified FAR 19.1406: up to $8.5 million for a requirement within the NAICS codes for manufacturing
    and $5 million for any other NAICS code, options included; the firm must be designated in SAM as SBA-certified,
    or have represented SDVOSB status in SAM and applied to SBA on or before December 31, 2023 [591]'
  - 'Sole source, SBA regulation: no SDVOSB sole-source dollar figure was read from 13 CFR part 128 in this sweep,
    so no FAR-versus-13 CFR comparison is recorded'
  - 'VA Veterans First (VAAR subpart 819.70): priority order SDVOSB, then VOSB, then 8(a)/HUBZone, then other small
    business set-asides (819.7005); set aside when two or more certified SDVOSBs (or VOSBs) are expected at a fair
    and reasonable price (819.7006/819.7007); sole source where the price including options will not exceed $5 million
    (819.7008/819.7009); firms must be certified and listed in the SBA certification database (819.7003(b)(3)) [592]'
  - 'Price evaluation preference: none found for VOSB or SDVOSB in the sources read'
  - 'Goal: not less than 5 percent of prime and subcontract awards for service-disabled veterans (15 U.S.C. 644(g))
    [597]; SBA''s page states the government aims to award at least 5% of contracting dollars to SDVOSBs [584]'
  - The limitations on subcontracting apply to SDVOSB awards (FAR subpart 19.14) at any value [645]
  steps:
  - Apply at MySBA Certifications (certifications.sba.gov); the VetCert portal redirects there [584] [585]
  - Capability statements are not required to apply [585]
  - 'Self-certification has ended: SDVOSBs may no longer self-certify for a federal prime contract or subcontract
    that counts toward SDVOSB goals (direct final rule effective August 5, 2024); firms with complete applications
    filed by December 22, 2024 keep self-certified eligibility until SBA decides [590] [584]'
  cost_and_time: SBA does not charge any costs for applying [585]. Average processing time was 12 days at November
    11, 2025 (30 days originally; 81 days at the end of 2024), per an SBA news release [594]. No regulatory processing
    deadline was found.
  recertification:
  - Recertify every 3 years, within 90 calendar days before the eligibility period ends; reinstatement if done within
    30 days after; report eligibility changes within 30 days [587]
  - The eligibility term is three years from the date of SBA's approval letter [589]
  - Random or for-cause program examinations; non-cooperation supports an adverse inference (13 CFR 128.308) [586]
  - Size and SDVOSB status are recertified within 30 calendar days of a merger, acquisition or sale changing controlling
