      map was last updated in 2023 and the next update comes "at some point in 2026" [564].'
  - status: class-deviation
    date: '2025-09-26'
    text: 'FAR-overhaul numbering: the RFO Part 19 model deviation text issued September 26, 2025 carries HUBZone
