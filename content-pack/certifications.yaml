  - status: class-deviation
    date: '2025-09-26'
    text: 'FAR-overhaul numbering: the RFO Part 19 model deviation text issued September 26, 2025 carries the 8(a)
      competition threshold at 19.108-7 ($8.5 million manufacturing NAICS, $5.5 million other) and keeps follow-on
