# certifications.yaml — FAR Out content pack · assembled 2026-10-03 from all four family sweeps (SBIR/STTR; set-asides and vehicles; primes and partnering; OTs, consortia and CSOs). Every reference carries recheck: true until quotes are verified against live pages.
- id: 8a-business-development
  name: 8(a) Business Development program
  owner: U.S. Small Business Administration
  what: 'A nine-year business development program for small firms owned and controlled by socially and economically
    disadvantaged individuals, or by Indian Tribes, Alaska Native Corporations, Native Hawaiian Organizations and
    Community Development Corporations [533] [534] [556] [557] [558]. The term runs nine years from the date of
    SBA''s approval letter: a four-year developmental stage and a five-year transitional stage [534]. Participation
    is one-time-only for firms and individuals, with the exception of entity-owned firms [533]. Since September
    10, 2026 there is no rebuttable presumption of social disadvantage for individually owned applicants [537] [535].'
  eligibility:
  - Small business [533]
  - At least 51 percent unconditionally and directly owned by disadvantaged individuals (13 CFR 124.105), who are
    U.S. citizens [534] [533]
  - 'Control (13 CFR 124.106): a disadvantaged individual holds the highest officer position and manages full-time
    [534]'
  - 'Economic disadvantage, as SBA''s page states it: net worth $850 thousand or less, AGI $400 thousand or less,
    assets $6.5 million or less [533]. As 13 CFR 124.104 states it: net worth less than $850,000; three-year average
    income $400,000; assets over $6.5 million generally not disadvantaged [534]'
  - 'Social disadvantage (13 CFR 124.103, text in force since 2026-09-10): the individual shows that a governmental
    or private entity discriminated or was biased against a clearly definable racial, ethnic, or cultural group
    of which the individual is a member, causing material harm, with evidence that the entity''s action favored
    other groups or disadvantaged the individual''s group, plus self-certification [535] [537]'
  - Material harm means "loss of access to or diminished opportunities related to economic advancement" [535]
  - 'Social disadvantage is a one-time determination: individuals already found disadvantaged need not re-establish
    it [537]'
  - Good character [533]
  - 'Potential for success: two full years in business in the primary industry, waivable (13 CFR 124.107) [534]
    [533]'
  - 'Not previously in the 8(a) program: once a firm or individual has participated, neither is eligible again [534]
    [533]'
  - Entity-owned firms are not affected by the 2026 social-disadvantage rule [537]. A Tribe must show its own economic
    disadvantage; an ANC is deemed economically disadvantaged under 43 U.S.C. 1626(e) [556]. An NHO must establish
    that it is economically disadvantaged [557]. A concern at least 51 percent owned by a CDC is considered controlled
    by the CDC and eligible [558]
  - 'Entity-owned firms: size is determined without regard to affiliation with the Tribe or ANC [556], the NHO (absent
    a substantial unfair competitive advantage) [557] or the CDC [558]. A Tribe may not own 51% or more of another
    firm operating in 8(a) under the same primary NAICS code [556]; the same one-firm-per-primary-NAICS limit applies
    to NHOs and CDCs [557] [558]'
  benefits:
  - 'Sole source, codified FAR (the figures contracting officers apply): an 8(a) acquisition must be competed among
    participants above $8.5 million for acquisitions assigned manufacturing NAICS codes and $5.5 million for all
    other acquisitions, so sole-source awards are available up to those values (FAR 19.805-1) [561]. SBA''s program
    page gives the same figures [533]. A requirement may not be split to stay under the threshold [561]'
  - 'Sole source, SBA regulation: 13 CFR 124.506 as displayed prints $7,000,000 (manufacturing NAICS) and $4,500,000
    (all other) [554]. See conflicts'
  - Above the competitive threshold, a sole-source award is allowed where SBA accepts the requirement for a concern
    owned by an Indian tribe or an Alaska Native Corporation (FAR 19.805-1) [561]; 13 CFR 124.506 as read names
    Tribally-owned, ANC-owned and NHO-owned concerns [554]
  - 'Justification: SBA may not accept for negotiation a sole-source 8(a) contract that exceeds $30 million unless
    the requesting agency has completed a justification (FAR 19.808-1) [562]; the figure rose from $25 million on
    October 1, 2025 [563]. 13 CFR 124.506 as displayed prints $25,000,000, and $100,000,000 for a DoD agency [554].
    DFARS 219.8: SBA may not accept a DoD sole-source 8(a) contract exceeding $100 million without a FAR 6.303 justification
    [671]'
  - 'Lifetime limit (13 CFR 124.519): a firm may not receive sole-source 8(a) awards once it has received a combined
    total of competitive and sole-source 8(a) contracts in excess of $168,500,000; competitive 8(a) awards remain
    available; the cap does not apply to firms owned by an Indian Tribe, ANC, NHO or CDC [555]'
  - 'Set-asides: above the competitive threshold the requirement is competed among eligible 8(a) participants [561]
    [554]. Among the 8(a), HUBZone, SDVOSB and WOSB programs there is no order of precedence, and above the simplified
    acquisition threshold they are considered before a general small-business set-aside (FAR 19.203) [652]'
  - 'Price evaluation preference: none found for 8(a) in the sources read; the 10 percent preference read is HUBZone
    only [656]'
  - In DoD, 8(a) awards go direct to the participant under the DoD–SBA Partnership Agreement (DFARS 219.8) [671]
  - All current 8(a) participants qualify as small disadvantaged businesses [595]
  - The limitations on subcontracting apply to 8(a) awards (FAR subpart 19.8) at any value [645]
  steps:
  - Identify the primary NAICS code [533]
  - Register in SAM [533]
  - Apply at certifications.sba.gov (MySBA Certifications) [533] [549]
  - Applicants whose pending individually owned application was returned on 2026-09-10 have 45 calendar days to
    resubmit through certifications.sba.gov [548]
  - The portal lists three 8(a) FAQ releases (August 28 and September 10, 2026) on the social-disadvantage change
    and potential for success [549]
  cost_and_time: SBA says it does not charge any costs for applying to its programs [585]. Once SBA has determined
    the application is complete, SBA has 90 days to process it and render a decision [533].
  recertification:
  - Annual review through the servicing SBA District Office [533]. Annual submissions under 13 CFR 124.112 include
    an eligibility certification, changes, personal financial information for each disadvantaged owner, transfers
    to family within two years, a record of payments and distributions, mentor-protégé reports, fees paid to agents
    and performance-of-work reports [559]
  - Size and 8(a) status are recertified within 30 calendar days of a merger, acquisition or sale changing controlling
    interest, and on contracts over five years (13 CFR 125.12) [514]
  - A participant's 8(a) eligibility may not be challenged by another participant or any other party; information
    questioning eligibility may be sent to SBA under 124.112(c) [560]. Size can be protested on competitive 8(a)
    awards but not on sole-source ones [560]
  official_url: https://www.sba.gov/federal-contracting/contracting-assistance-programs/8a-business-development-program
