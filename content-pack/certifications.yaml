- id: size-standards
  name: Size standards (being "small")
  owner: U.S. Small Business Administration, Office of Size Standards
  what: A size standard is the ceiling, per NAICS industry, on employees or average annual receipts below which
    a firm, counted together with its affiliates, is small for federal contracting [501] [507]. The official table
    is 13 CFR 121.201, and SBA's posted table is the version effective March 17, 2023 [502]. The contracting officer
    designates the NAICS code for each solicitation, and that code's size standard governs [508]. A firm must not
    exceed the size standard for the NAICS code specified in the solicitation [508].
  eligibility:
  - 'Annual receipts: total income plus cost of goods sold as reported to the IRS, averaged over the latest five
    completed fiscal years; with fewer than five years, total receipts divided by weeks in business times 52 [504]'
  - Receipts exclude net capital gains or losses, taxes collected for taxing authorities, inter-affiliate proceeds
    and amounts collected for another by certain agents; subcontractor costs, reimbursements and payroll-type costs
    may not be excluded [504]
  - 'Employees: the average over each pay period for the preceding completed 24 calendar months, including employees
    of domestic and foreign affiliates; part-time and temporary employees count the same as full-time; volunteers
    are not employees [505]'
  - Affiliates' employees and receipts are included [501] [520]
  - The NAICS code is the one that best describes the principal purpose of the supply or service being acquired
    (FAR 19.102) [648]; its designation can be appealed to SBA's Office of Hearings and Appeals within 10 calendar
    days after the solicitation or an amendment affecting the code or size standard (FAR 19.103; 13 CFR 134.304)
    [649] [683]
  - Size is determined as of the written self-certification with the initial offer including price; a firm small
    at award generally stays small for the life of the contract (13 CFR 121.404) [513]
  - 'Multiple-award solicitations issued after October 1, 2028: one NAICS code, or distinct portions each with its
    own code (FAR 19.102) [648]'
  - 'SBIR and STTR use their own test: an awardee together with its affiliates must not have more than 500 employees
    (13 CFR 121.702) [521]'
  benefits:
  - 'Being small opens the total small-business set-aside: purchases above the micro-purchase threshold and not
    over the simplified acquisition threshold are set aside unless two competitive small-business offers are not
    expected, and above the simplified acquisition threshold an acquisition is set aside when offers are expected
    from at least two responsible small businesses at fair market prices (FAR 19.502-2) [607]'
  - 'Sole-source thresholds and price evaluation preference: none attach to small size alone in the sources read;
    the sole-source authorities read belong to the 8(a), HUBZone, WOSB/EDWOSB and SDVOSB programs [561] [572] [580]
    [591]'
  - The statutory government-wide goal for small business is not less than 23 percent of the total value of all
    prime contract awards each fiscal year [597]
  steps:
  - Find the NAICS code and check the table of size standards or the Size Standards Tool (sba.gov/size-standards)
    [502] [503]
  - Represent size in writing at the time of the initial offer (FAR 19.301-1; FAR 52.219-1) [650] [596]
  cost_and_time: Self-representation; no fee is stated in the sources read [650].
  recertification:
  - '13 CFR 125.12 (in force since January 17, 2026): recertify size within 30 calendar days of a merger, acquisition
    or sale changing controlling interest; on contracts over five years, no more than 120 days before the end of
    year five and before each later option; and when a contracting officer asks in a solicitation [514] [515]'
  - A disqualifying recertification within 180 days after offer and before award makes the firm ineligible for that
    set-aside award; on multiple-award contracts it is ineligible for later set-aside or reserved orders but still
    eligible for unrestricted awards; a merger, acquisition or sale involving another small business is excepted
    [514]
  - 'Size protests: any offeror not eliminated, the contracting officer, SBA and other interested parties may protest
    [516]; private parties have five business days after bid opening or notice of the apparent awardee [517]'
  - Willful misrepresentation of size creates a presumption of loss to the United States based on the total amount
    expended; bidding on a set-aside or registering as small is itself a certification (13 CFR 121.108; 15 U.S.C.
    632(w)) [518] [519]
  official_url: https://www.sba.gov/federal-contracting/contracting-guide/size-standards
