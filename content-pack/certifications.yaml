- id: wosb-edwosb
  name: Women-Owned Small Business (WOSB) and Economically Disadvantaged WOSB (EDWOSB) certification
  owner: U.S. Small Business Administration
  what: Certification under the Women-Owned Small Business Federal Contract program for small firms at least 51%
    owned and controlled by women who are U.S. citizens [574]. SBA designates, by NAICS code, the industries in
    which WOSBs are underrepresented and substantially underrepresented [577]. EDWOSB set-asides are for the underrepresented
    industries and WOSB set-asides for the substantially underrepresented ones [577]. The statutory government-wide
    goal for small businesses owned by women is not less than 5 percent [597].
  eligibility:
  - 'WOSB: small; at least 51% owned and controlled by women who are U.S. citizens; women manage day-to-day operations
    and make long-term decisions [574]'
  - '13 CFR 127.200: not less than 51 percent unconditionally and directly owned by women who are U.S. citizens
    (economically disadvantaged women for EDWOSB) [575]'
  - '13 CFR 127.202: a woman holds the highest officer position and controls management and daily operations [575]'
  - 'EDWOSB adds: personal net worth less than $850,000; $400,000 or less AGI averaged over three years; $6.5 million
    or less in personal assets [574]'
  - 'Eligible industries: 733 NAICS industries, 626 for all WOSB participants and 107 for EDWOSBs only, on the list
    effective October 1, 2022, set by a study Congress requires every five years [581]'
  benefits:
  - 'Set-aside (13 CFR 127.503): a reasonable expectation that two or more EDWOSBs (or WOSBs) will offer and award
    at a fair and reasonable price [578]'
  - 'Sole source, codified FAR 19.1506: up to $8.5 million for manufacturing NAICS codes and $5.5 million for other
    NAICS codes, options included; EDWOSB in NAICS codes where WOSBs are underrepresented, WOSB where substantially
    underrepresented; award at a fair and reasonable price [580]'
  - 'Sole source, SBA regulation: 13 CFR 127.503 as displayed shows $7,000,000 / $4,500,000, where two or more offers
    are not expected [578]. See conflicts'
  - 'Price evaluation preference: none found for WOSB or EDWOSB in the sources read'
  - Among the 8(a), HUBZone, SDVOSB and WOSB programs there is no order of precedence; above the simplified acquisition
    threshold they are considered before a general small-business set-aside [652]
  - The limitations on subcontracting apply to WOSB program awards (FAR subpart 19.15) at any value [645]
  steps:
  - 'Free route: apply through MySBA Certifications (certifications.sba.gov) [574]'
  - 'Or certify through an SBA-approved third-party certifier: El Paso Hispanic Chamber of Commerce; National Women
    Business Owners Corporation; U.S. Women''s Chamber of Commerce; Women''s Business Enterprise National Council
    [574]'
  - 'Other routes in 13 CFR 127.300: 8(a) participation (EDWOSB if woman-owned) and Veteran Small Business Certification
    evidence [575]'
  - Applicants, not third-party certifiers, upload documents to SBA's system [583]
  cost_and_time: There is no cost to apply to SBA for certification [575]. "Whenever practicable, SBA will make
    its determination within 90 calendar days after receipt of a complete package" [574]. No third-party certifier
    fee amounts were read.
  recertification:
  - Program examination every three years by SBA or a third-party certifier; recertify or report the third-party
    examination within 90 days of the end of the eligibility period; failure leads to decertification, with reinstatement
    if done within 30 days [576]
  - 'The annual attestation is in abeyance: firms "do not have to submit an attestation annually" [574]'
  - Notify SBA of material changes within 30 calendar days (13 CFR 127.401) [575]
  - Decertified firms must update SAM within two business days and tell contracting officers [583]
  - Size and WOSB/EDWOSB status are recertified within 30 calendar days of a merger, acquisition or sale changing
    controlling interest, and on contracts over five years (13 CFR 125.12) [514]
  - 'Status protests: written and specific, filed with the contracting officer within five business days [579];
    SBA decides within 15 business days and an appeal goes to OHA within 10 business days (FAR 19.308) [687]; only
    certified WOSBs or pending applicants may protest [583]'
  official_url: https://www.sba.gov/federal-contracting/contracting-assistance-programs/women-owned-small-business-federal-contract-program
  pending_changes:
  - status: final
    date: '2024-12-04'
    text: Women-Owned Small Business Federal Contract Program Updates and Clarifications, 89 FR 96089 (RIN 3245-AI04),
      effective January 3, 2025, aligned WOSB definitions and control rules with the other programs and narrowed
      who may protest [583].
