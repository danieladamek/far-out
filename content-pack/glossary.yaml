  short: A subcontractor that is really doing the small prime's job on a set-aside. The finding makes the offeror
    ineligible as small.
  definition: 'An ostensible subcontractor is a subcontractor that is really doing the prime''s job on a set-aside.
    The rule defines it as a subcontractor that is not a similarly situated entity and performs the primary and
    vital requirements of a contract or order, or on which the prime is unusually reliant (13 CFR 121.103(h)(3))
    [706]. Since January 16, 2025 the consequence is that the offeror is ineligible as a small business for that
    award [292] [770]. Outside general construction, meeting the limitations on subcontracting avoids the finding
    [706].

    '
