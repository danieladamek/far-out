  short: The statute on how a contractor brings a claim against the Government. Only a party to the contract can
    use it.
  definition: 'The Contract Disputes Act is the statute that sets how a contractor brings a claim against the Government,
    starting with a decision by the contracting officer (41 U.S.C. 7103) [977]. Only a contractor can claim under
    it, defined as "a party to a Federal Government contract other than the Federal Government" (41 U.S.C. 7101)
    [976]. A subcontractor has no contract with the Government, so its claim passes through the prime [979]. Other
    transactions are not subject to the Act [1049].

    '
