  definition: 'Every agency has an Office of Small and Disadvantaged Business Utilization (OSDBU), its in-house
    advocate for small business in its own purchases; in DoD it is called the Office of Small Business Programs
    (OSBP), a name NASA also uses (FAR 19.201) [1326] [743]. Its director is appointed by and reports to the agency
    head or deputy, and the agency''s small business specialist is consulted no later than 30 days before a solicitation
    [428]. Vendor outreach sessions are often run by this office, and its compliance counts for 20% of the agency''s
    scorecard grade [912] [383]. DoD''s office now sits under an Office of Industrial Base Growth and administers
    the APEX Accelerators [110] [258].

    '
