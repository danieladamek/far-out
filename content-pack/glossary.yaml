  definition: '8(a) is SBA''s nine-year, one-time business development program for small firms at least 51 percent
    owned and controlled by socially and economically disadvantaged individuals, or by Indian Tribes, Alaska Native
    Corporations, Native Hawaiian Organizations and Community Development Corporations [310] [311]. Participants
    can receive sole-source awards up to a ceiling and compete in 8(a) set-asides (FAR 19.805-1) [338]. Final rule
    91 FR 51568, effective September 10, 2026, removed the rebuttable presumption of social disadvantage for individually
