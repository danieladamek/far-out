  term: Simplified acquisition threshold (SAT)
  kind: methods
  variants:
  - simplified acquisition threshold
  - SAT
  - Simplified acquisition threshold
  short: The dollar line, $350,000 since October 1, 2025, up to which agencies use lighter procedures and reserve
    purchases for small business.
  definition: 'The simplified acquisition threshold is the dollar line, $350,000 since October 1, 2025 and $250,000
    before, up to which agencies use the lighter procedures of FAR Part 13 [417] [438]. Between the micro-purchase
    threshold and this line, a purchase is set aside for small business unless two competitive small-business offers
    cannot be expected [384]. Above it more rules switch on, among them 30-day response times, past performance
    evaluations and, for small-business set-asides, the limitations on subcontracting [563] [603] [422]. A page
    that still says $250,000 is describing the rules before October 1, 2025 [417].

    '
