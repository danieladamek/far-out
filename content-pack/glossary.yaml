  short: A legally binding agreement that is not a procurement contract, grant or cooperative agreement. The FAR
    does not automatically apply.
  definition: 'An other transaction is a legally binding agreement between an agency and a firm that is not a standard
    procurement contract, grant or cooperative agreement [1053]. Because it is none of those, the FAR does not automatically
    apply: DARPA lists the Truth in Negotiations Act, the Cost Accounting Standards and the Contract Disputes Act
    as not applicable, while the Procurement Integrity Act and fiscal law still are [1063] [1053]. The terms, including
    intellectual property, payment and disputes, are what the agreement itself says [1064] [1049]. DoD''s authority
    is 10 U.S.C. 4021 for research and 4022 for prototypes and follow-on production, and several civilian agencies
    have authority of their own [1049] [1388].

    '
