  - micro-purchases
  - Micro-purchase
  - purchase card
  - Governmentwide commercial purchase card
  - GSA SmartPay
  short: The dollar line, $15,000 since October 1, 2025, below which an agency can buy with almost no formality,
    usually by purchase card.
  definition: 'The micro-purchase threshold is the dollar line below which an agency can buy with almost no formality.
    It is $15,000 since October 1, 2025, up from $10,000, with lower figures of $2,000 for construction and $2,500
    for services subject to the wage statutes (FAR 2.101) [418] [417]. Below it the Governmentwide commercial purchase
    card, a government charge card run through GSA SmartPay, is the preferred method and almost no clauses apply
    (FAR 13.201) [440] [447]. Purchases above it, up to the simplified acquisition threshold, are set aside for
    small business [384].

    '
