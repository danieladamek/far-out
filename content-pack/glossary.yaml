  definition: 'Export controls come in two sets. The ITAR, the State Department''s rules on defense articles and
    defense services, require anyone in the United States who manufactures or exports defense articles to register
    with DDTC, even a manufacturer that never exports, at $3,000 a year in Tier 1 (22 CFR Part 122) [640] [641].
    The EAR, administered by the Commerce Department''s Bureau of Industry and Security (BIS), cover purely civilian
    items, dual-use items and military items not controlled under the ITAR [642] [643]. Under them, "A relatively
    small percentage of exports and reexports subject to the EAR require an application to BIS for a license." [642]

    '
