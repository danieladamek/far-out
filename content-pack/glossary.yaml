  - cooperative agreement
  - cooperative agreements
  - procurement contract
  - procurement contracts
  short: The three standard instruments. A contract buys for the Government's own use; a grant or cooperative agreement
    supports a public purpose.
  definition: 'These are the three standard instruments, and the law tells an agency which to use. A procurement
    contract is required when the principal purpose is "to acquire (by purchase, lease, or barter) property or services
    for the direct benefit or use of the United States Government", and the FAR governs it (31 U.S.C. 6303) [1017].
    A grant transfers a thing of value to carry out a public purpose where substantial agency involvement is not
    expected; a cooperative agreement is used where it is (31 U.S.C. 6304, 6305) [1018] [1019]. Grants and cooperative
    agreements follow 2 CFR Part 200, not the FAR [1328]. SBIR and STTR awards come in all three forms: NIH makes
    grants, NSF''s Phase II awards are cooperative agreements, and NASA awards contracts [135] [149] [12].

    '
