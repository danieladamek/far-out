  definition: 'DoD''s Mentor-Protégé Program is separate from SBA''s and rests on 10 U.S.C. 4902, implemented by
    DFARS subpart 219.71 and Appendix I [451] [795]. A mentor qualifies with $25,000,000 in prior-year DoD contracts,
    agreements run not more than three years, and the mentor is reimbursed up to $1,000,000 per protégé per fiscal
    year or takes credit toward its subcontracting goals [451]. The statute is permanent, although DFARS Appendix
    I still reads "Mentors incurring costs through September 30, 2026" [451] [450]. The program calls itself "The
    oldest continuously operating federal mentor-protégé program in existence" [111].

    '
