  short: Work that derives from, extends or completes earlier SBIR or STTR work, paid from other funds. It may be
    awarded sole source, with no dollar limit.
  definition: 'Phase III is work that derives from, extends or completes earlier SBIR or STTR work and is paid for
    from other funds [5]. An agency may award it sole source without a FAR Part 6 justification or synopsis (15
    U.S.C. 638(r)(4)), and the directive sets no limit on number, duration, type or dollar value and lifts the size
    limits [225] [5]. The firm must show that the new work derives from its own SBIR results [224]. GAO''s 2025
    report found Phase III data "not reliable enough" to measure outcomes [242].

    '
