  short: Two classes of non-public information on a contractor's systems. FCI needs 15 basic safeguards; CUI needs
    NIST SP 800-171.
  definition: 'FCI is non-public information provided by or generated for the Government under a contract; CUI is
    unclassified information that must still be protected, and in defense clauses it appears as "covered defense
    information". A contractor system holding FCI must meet the 15 basic safeguarding requirements of FAR 52.204-21,
    which are also CMMC Level 1 [617] [624]. A system holding covered defense information must meet NIST SP 800-171
    (DFARS 252.204-7012) [618]. CMMC applies to awardees that process, store or transmit FCI or CUI [623]. On an
    other transaction, DoD''s guide says CUI is handled under DoDI 5200.48, with NIST SP 800-171 compliance for
    the performer''s unclassified system [1049].

    '
