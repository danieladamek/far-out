  short: A private agreement by which two or more firms pursue a contract together, usually as prime and subcontractor.
  definition: 'A teaming agreement is the private agreement by which two or more firms pursue a contract together,
    usually as prime and subcontractor. The FAR recognises such arrangements provided they are identified and the
    relationships fully disclosed in the offer, and the prime stays fully responsible for performance (FAR subpart
    9.6) [761]. On a set-aside the risk is the ostensible subcontractor rule [706]. Nothing in the subpart authorises
    arrangements that violate antitrust law [761].

