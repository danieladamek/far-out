- id: sbir
  term: SBIR (Small Business Innovation Research)
  kind: science
  variants:
  - SBIR
  - Small Business Innovation Research
  - extramural research budget
  - extramural research budgets
  - extramural budget
  - extramural
  short: The federal program that pays small firms to research and develop their own technology, in phases. Only
    small firms may hold the awards.
  definition: 'SBIR is the federal program that pays small firms to research and develop their own technology, in
    phases. Agencies whose extramural research budgets, the research money they spend outside their own laboratories,
    exceed $100 million must spend not less than 3.2 percent of them on it, and only small firms may hold the awards
    (15 U.S.C. 638; 13 CFR 121.702) [3] [10]. Eleven agencies take part, each with its own topics, deadlines and
    award type [12]. Authority lapsed after September 30, 2025 and was restored on April 13, 2026 by Pub. L. 119-83,
    through September 30, 2031 [1] [59].

    '
