  - CPARS
  - Contractor Performance Assessment Reporting System
  - past performance
  - performance record
  short: Past performance is a firm's record on earlier contracts; CPARS is the governmentwide system where agencies
    record it.
  definition: 'Past performance is a firm''s record on earlier contracts, and CPARS is the governmentwide system
    where agencies record it. Evaluations are prepared at least annually and when the work is completed, on contracts
    and orders above the simplified acquisition threshold, and rate quality, cost control, schedule, management
    and small business subcontracting (FAR 42.1502, 42.1503) [603] [604]. When offers are evaluated, a firm with
    no record "may not be evaluated favorably or unfavorably on past performance" [596]. Subcontractors are not
    rated in CPARS; a small first-tier subcontractor under a subcontracting plan may ask its prime for a written
    rating instead (13 CFR 125.11) [985] [781].

    '
