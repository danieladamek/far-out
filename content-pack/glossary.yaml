  short: An industry classification number. The code assigned to a solicitation decides which size standard applies.
  definition: 'A NAICS code is an industry classification number. In contracting it decides size: the contracting
    officer assigns each solicitation the one code that best describes the principal purpose of what is being bought,
    and that code''s size standard decides who counts as small (FAR 19.102; 13 CFR 121.402) [425] [285]. The designation
