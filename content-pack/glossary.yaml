  short: The shares of federal contract dollars the law says should go to small firms (23 percent overall), and
    SBA's annual grade of each agency against them.
  definition: 'The goals are the shares of federal contract dollars that the law says should go to small firms each
    year: not less than 23 percent of prime contract dollars for small businesses, 5 percent each for small disadvantaged,
    women-owned and service-disabled veteran-owned firms and 3 percent for HUBZone firms (15 U.S.C. 644(g)) [374].
    SBA grades each agency against them in an annual scorecard, which weighs prime contracting at 50%, subcontracting
    at 20%, the year-over-year count of small business primes at 10% and OSDBU compliance at 20% [383] [457]. The
    FY2025 release reports nearly 28 percent of prime contract dollars, $179 billion, to small businesses and a
    government-wide grade of A [382].

    '
