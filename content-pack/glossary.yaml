  short: The FAR's quicker methods for smaller buys (Part 13), used up to $350,000, or up to $9 million for commercial
    products and services.
  definition: 'Simplified acquisition procedures are the FAR''s quicker methods for smaller buys, set out in FAR
    Part 13, such as a request for quotations in place of a full request for proposals [572] [602]. Agencies use
    them to the maximum extent practicable at or below the simplified acquisition threshold of $350,000, and purchases
    between the micro-purchase threshold and that line are set aside for small business (FAR 13.003) [438] [417].
    For commercial products and services they may be used up to $9 million (FAR 13.500) [439].

    '
