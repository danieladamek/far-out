- id: executive-order
  term: Executive order (EO)
  kind: methods
  variants:
  - executive order
  - executive orders
  - EO
  short: A signed direction from the President to federal agencies. It directs; regulations change only when agencies
    then act.
  definition: 'An executive order is a signed direction from the President to federal agencies. Three shape this
    guide: Executive Order 14275 (April 15, 2025) ordered the FAR rewrite [386]; Executive Order 14240 (signed March
    20, 2025) consolidates the purchase of common goods and services in GSA [509]; and Executive Order 14265 directed
    a defense acquisition reform plan with a first preference for commercial solutions [1262]. An order directs
    agencies; the regulations change only when the agencies then act, by deviation or by rule [399].

    '
