  definition: 'A sole-source award is a contract given to one firm without competition. For small firms it is available
    through the certified programs, each with a dollar ceiling: in the codified FAR, $8.5 million for manufacturing
    NAICS codes and $5.5 million otherwise for 8(a), HUBZone and WOSB or EDWOSB firms, and $8.5 million and $5 million
    for SDVOSBs [338] [349] [357] [368]. The official texts disagree: SBA''s 13 CFR 124.506 prints $7,000,000 and
    $4,500,000 for 8(a) [331]. SBIR and STTR Phase III awards may also be made sole source, with no dollar limit
    [5] [225].

    '
