  - GSA Acquisition Regulation
  short: GSA's own supplement to the FAR. Since November 3, 2025 it holds the ordering procedures for GSA Schedule
    contracts.
  definition: 'The GSAR is GSA''s own supplement to the FAR, holding the rules for GSA''s contracts, including the
    Schedule program. Under the FAR overhaul, the ordering procedures for Schedule contracts moved out of FAR subpart
    8.4 into GSAR subpart 538.71 by a class deviation issued August 13, 2025 and effective November 3, 2025 [503].
    Its clauses are numbered from 552, for example 552.238-81 on price reductions, published in GSA''s acquisition
    manual at acquisition.gov [508].

    '
