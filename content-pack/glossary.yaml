  short: A clause in the prime contract that the prime must repeat in its subcontracts.
  definition: 'A flow-down is a clause in the prime contract that the prime must repeat in its subcontracts. For
    a commercial subcontract the FAR lists the clauses that must flow down and adds that "the Contractor may flow
    down to subcontracts for commercial products or commercial services a minimal number of additional clauses necessary
    to satisfy its contractual obligations" (FAR 52.244-6) [695]. Cybersecurity clauses are typical flow-downs:
    the basic safeguarding clause and DFARS 252.204-7012 both reach subcontractors that hold the covered information
    [617] [618].

    '
