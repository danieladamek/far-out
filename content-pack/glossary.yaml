- id: sbir-reauthorization-2026
  term: Small Business Innovation and Economic Security Act (Pub. L. 119-83)
  kind: methods
  variants:
  - Pub. L. 119-83
  - P.L. 119-83
  - Public Law 119-83
  - Small Business Innovation and Economic Security Act
  - SBIR reauthorization
  - April 2026 reauthorization
  - proposal limit
  - proposal limits
  - proposal cap
  - proposal caps
  short: The April 13, 2026 law that restored SBIR and STTR through September 30, 2031 after a six-month lapse,
    with proposal limits and a security-risk review.
  definition: 'Pub. L. 119-83 is the law, approved April 13, 2026, that restored SBIR and STTR after their authority
    lapsed at the end of September 2025, and extended them through September 30, 2031 [1] [59]. It adds a Strategic
    Breakthrough award of up to $30,000,000 and new caps on technical and business assistance, and extends Direct
    to Phase II to the Department of Energy, NASA and STTR [1]. From fiscal year 2027 each agency must limit how
    many proposals one firm may submit; two limits were verified for this guide, nine per fiscal year across HHS
    and one per organisation under NSF 26-510 [1] [29] [35]. Agencies may deny an award on security risk, including
    ties to entities on eight named lists, and a denial does not bar a later cycle [1]. SBA must revise its Policy
    Directive within one year; the directive posted on SBIR.gov is still the May 2023 text [1] [7].

    '
