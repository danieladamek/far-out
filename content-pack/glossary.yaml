  short: The contracting officer's finding, before any award, that a firm is able and fit to perform. Debarred or
    suspended firms are excluded.
  definition: 'Responsibility is the contracting officer''s finding, before any award, that a firm is able and fit
    to perform; the seven standards include adequate financial resources, a satisfactory performance record and
    integrity (FAR 9.104-1) [656]. A firm that is debarred or suspended is excluded from awards: exclusion records
    in SAM are checked after offers arrive and again immediately before award, and the firm certifies whether it
    is "presently debarred, suspended, proposed for debarment, or declared ineligible" (FAR subpart 9.4; 52.209-5)
    [655] [658]. Where a small business would be selected but is found not responsible, the matter goes to SBA under
    its Certificate of Competency procedure [1046] [467]. The rule of two speaks of "responsible" small businesses
    in this sense [384].

    '
