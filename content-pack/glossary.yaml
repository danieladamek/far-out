  short: 'Three tiers of required security: 15 basic requirements, the 110 of NIST SP 800-171, and 24 more. A C3PAO
    is an accredited outside assessor for Level 2.'
  definition: 'The three CMMC levels rise with the sensitivity of the information a contractor holds. Level 1 is
    the 15 basic requirements of FAR 52.204-21, self-assessed annually; Level 2 is the 110 requirements of NIST
    SP 800-171 Revision 2, self-assessed or assessed by a C3PAO; Level 3 adds 24 requirements from NIST SP 800-172
    and is assessed by DIBCAC, a defense assessment body [624] [625] [623]. A C3PAO is an accredited private assessor,
    which must meet ISO/IEC 17020; the Cyber AB, the program''s accreditation body, lists them in its marketplace
    [624] [632]. Results are entered in SPRS [625]. Since July 13, 2026 new procurements are limited to Level 1
    (Self) or Level 2 (Self) [627].

    '
