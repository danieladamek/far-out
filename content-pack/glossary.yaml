  short: 'A new tier for firms that already hold a Phase II: up to $30 million over 48 months, with 100 percent
    matching funds.'
  definition: 'A Strategic Breakthrough award is the large new tier created by Pub. L. 119-83 for firms that already
    hold a Phase II. It is not more than $30,000,000 over not more than 48 months, and requires not less than 100
    percent matching funds from new private capital or non-SBIR government funding [1]. It is open only at agencies
    whose required SBIR spending exceeds $100,000,000, which fund it from up to 0.50 percent of their extramural
    research budgets [1]. The authority ends on September 30, 2031 [1].

    '
