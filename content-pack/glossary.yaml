  short: The statute requiring bonds on federal construction, including a payment bond that protects unpaid subcontractors
    and suppliers.
  definition: 'The Miller Act is the statute requiring a prime contractor on federal construction to furnish bonds,
    including a payment bond that protects those who supply labor and material (40 U.S.C. 3131) [947]. The FAR requires
    performance and payment bonds for any construction contract exceeding $150,000 (FAR 28.102-1), while the statute
    as read says more than $100,000 [644] [947]. An unpaid subcontractor or supplier claims on the bond by suit
    in federal district court, after a 90-day wait and within one year (40 U.S.C. 3133) [948].

    '
