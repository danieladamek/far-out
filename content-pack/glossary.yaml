  short: A purchase reserved so that only small businesses, or only firms in one certified program, may compete
    for it.
  definition: 'A set-aside is a purchase reserved so that only small businesses, or only firms in one certified
    program, may compete for it. The contracting officer decides it under the rule of two: when offers are reasonably
    expected from at least two responsible small firms at fair market prices (FAR 19.502-2) [384]. Above the simplified
    acquisition threshold the 8(a), HUBZone, SDVOSB and WOSB programs are considered first, in no order of precedence
    (FAR 19.203) [429]. A partial set-aside reserves only a portion of a requirement, and orders under a multiple-award
    contract may be set aside at the contracting officer''s discretion (FAR 19.502-4; 19.504) [419] [420]. On SAM.gov
    the set-aside type must be identified in the synopsis and the solicitation [565].

    '
