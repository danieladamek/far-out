- id: far
  term: Federal Acquisition Regulation (FAR)
  kind: methods
  variants:
  - FAR
  - Federal Acquisition Regulation
  short: The main rulebook agencies follow when they buy goods and services by contract. It sits at Title 48 of
    the Code of Federal Regulations.
  definition: 'The FAR is the main rulebook that executive agencies follow when they buy goods and services with
    a contract. It is published at acquisition.gov, where the codified text read for this guide was at FAC 2026-01,
    effective March 13, 2026, and it occupies chapter 1 of Title 48 of the Code of Federal Regulations [418] [402].
    Since 2025 a rewritten FAR has been in use beside the codified one: agencies adopt model text by class deviation
    while the codified text stays on the books [387] [400]. Some instruments, such as other transactions, sit outside
    the FAR altogether [1053].

    '
