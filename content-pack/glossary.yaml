  short: Cost facts a contractor must hand over and certify when a large contract is negotiated. $2.5 million in
    the FAR; $10 million in the defense statute.
  definition: 'Certified cost or pricing data are the cost facts a contractor must hand over, and certify, when
    a large contract is negotiated. The threshold is $2.5 million in FAR 15.403-4 for prime contracts awarded on
    or after July 1, 2018, and it reaches a subcontract at any tier when each tier above also had to certify [962].
    For defense, 10 U.S.C. 3702 now reads $10,000,000 for prime contracts entered into after June 30, 2026 [1036].
    The requirement is known as the Truth in Negotiations Act, which DARPA lists among the rules that do not apply
    to an other transaction [1063].

    '
