  short: A large prime's written goals for subcontracting to small businesses, required on contracts over $900,000
    ($2 million for construction).
  definition: 'A subcontracting plan is a prime contractor''s written goals for subcontracting to small businesses.
    A prime that is not small must have one on contracts expected to exceed $900,000, or $2 million for construction,
    where subcontracting possibilities exist (FAR 19.702) [435] [692]. The plan sets separate goals for small, veteran-owned,
    service-disabled veteran-owned, HUBZone, small disadvantaged and women-owned small businesses (FAR 52.219-9)
    [437]. Missing a goal "does not, in and of itself, constitute a failure to make a good faith effort", but a
    willful or intentional failure brings liquidated damages equal to the shortfall (FAR 52.219-16) [692] [694].
    The thresholds rose from $750,000 and $1.5 million on October 1, 2025; SBA''s 13 CFR 125.3 still prints the
    old figures [340] [704].

    '
