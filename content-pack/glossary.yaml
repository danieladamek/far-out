  definition: 'Section 889 is a ban on certain Chinese telecommunications and video surveillance equipment in federal
    contracting, enacted in the FY2019 NDAA [1049]. Its clause, FAR 52.204-25, bars delivering covered equipment
    to the Government and bars the Government from contracting with firms that use it; the named companies are Huawei,
    ZTE, Hytera, Hikvision and Dahua, with their subsidiaries and affiliates [615]. The two halves took effect on
