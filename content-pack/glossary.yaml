  definition: 'Market research is the agency''s homework before a purchase: finding out who can meet the need, whether
    a commercial item will do, and whether small businesses can compete. FAR Part 7 requires acquisition planning
    and market research for all acquisitions, and Part 10 sets the procedures [1323] [1324]. The techniques include
    contacting people in industry, publishing requests for information, querying contract databases and holding
