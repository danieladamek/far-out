  definition: 'Prompt payment is the Government''s own deadline for paying its prime contractor. Payment is due
    on the later of the 30th day after the billing office receives a proper invoice or the 30th day after acceptance,
    and interest is paid automatically when the Government is late (FAR subpart 32.9) [941]. The interest rate for
    July 1 through December 31, 2026 is 4-3/4 percent [945]. The clock runs to the prime: Treasury''s pages speak
    of agencies paying vendors and do not address subcontractors [663].

