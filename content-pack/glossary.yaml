  - DFARS clause
  short: Numbered blocks of contract text. FAR clauses begin 52, DFARS clauses 252; the digits after the point name
    the part they come from.
  definition: 'A clause is a numbered block of standard text placed in a contract; a provision is the same thing
    in a solicitation. FAR clauses and provisions begin 52 and DFARS clauses 252, and the digits after the point
    name the part they come from: 52.219-14, on limitations on subcontracting, belongs to Part 19 [423], and 252.204-7012
    belongs to DFARS Part 204 [618]. The month and year after a clause''s title is its version date, as in FAR 52.227-20
    (May 2014) [25]. A firm is bound by the clauses in its own contract, which is why this guide cites them by number.

    '
