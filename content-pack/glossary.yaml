  short: The rule that decides whose employees and receipts are counted with a firm's own when its size is measured.
    It turns on control.
  definition: 'Affiliation is the rule that decides whose employees and receipts are counted with a firm''s own
    when its size is measured. SBA''s page states: "Affiliation with another business is based on the power to control,
    whether exercised or not." [278] Control can come through stock, common management, family ties or economic
    dependence, which is presumed when 70% or more of receipts come from one concern over three fiscal years (13
    CFR 121.103) [297]. Exceptions in 121.103(b) include firms owned by Indian Tribes, Alaska Native Corporations,
    Native Hawaiian Organizations and Community Development Corporations, and SBA-approved mentor-protégé relationships
    [297].

    '
