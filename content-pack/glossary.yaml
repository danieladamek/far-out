  short: Two or more firms combining to bid and perform under a name of their own. It is small if each partner is
    small, or under an approved mentor-protégé pair.
  definition: 'A joint venture is two or more firms combining to bid for and perform contracts under a name of their
    own. For set-asides it must be in writing, do business under its own name and be identified as a joint venture
    in SAM; it is small if each partner is small, or if a small protégé joins its SBA-approved mentor (13 CFR 121.103(h))
    [770]. A mentor-protégé venture''s agreement needs twelve provisions, with the protégé as managing venturer
    owning at least 51% and performing at least 40% of the work (13 CFR 125.8) [773]. A small partner may cite the
    venture''s contracts as its own past performance (13 CFR 125.11) [781].

    '
