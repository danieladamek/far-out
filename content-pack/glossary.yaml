  short: The defense pathway for getting a prototype, or a proven system, into the field within about five years.
  definition: 'The Middle Tier of Acquisition is the defense pathway for getting a prototype or a proven system
    into the field quickly. It has two paths: rapid prototyping, with a residual operational capability within 5
    years, and rapid fielding, with production beginning within 6 months and fielding complete within 5 years (10
    U.S.C. 3602; DoDI 5000.80) [1249] [1248]. The pathway''s overview page names other transactions as a way small
    and nontraditional firms compete [1246]. The November 2025 strategy keeps the pathway and delegates its approvals
    to the lowest permissible levels [1264].

    '
