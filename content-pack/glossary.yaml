  definition: 'A populated joint venture has its own employees doing the contract work; an unpopulated one performs
    through the employees of its partner firms. For set-asides, a joint venture formed as a separate legal entity
    may not be populated with individuals intended to perform the contracts unless all parties are similarly situated,
    though it may have its own administrative staff, including Facility Security Officers (13 CFR 121.103(h)(1))
    [770]. An April 2023 SBA rule made unpopulated ventures a requirement only for contracts set aside or reserved
    for small business [783].

    '
