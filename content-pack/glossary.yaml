- id: revolutionary-far-overhaul
  term: Revolutionary FAR Overhaul (RFO)
  kind: methods
  variants:
  - Revolutionary FAR Overhaul
  - RFO
  - FAR overhaul
  - FAR rewrite
  short: The rewrite of the FAR ordered in April 2025. In force by class deviation; proposed rules issued in 2026;
    nothing final as of October 3, 2026.
  definition: 'The Revolutionary FAR Overhaul is the rewrite of the FAR ordered by Executive Order 14275 of April
    15, 2025, which told the FAR Council to cut the regulation back to what statute requires or is otherwise necessary
    [386]. It runs in two phases: model text for each part, adopted by agencies through class deviations, and then
    formal rulemaking through twelve proposed rules [403] [388]. Proposed rules appeared on June 23 and September
    18, 2026, and none was final on October 3, 2026, so the codified FAR and the deviation text coexist [403] [405]
    [407].

    '
