  - FAR 52.219-14
  short: 'The cap on how much of a set-aside contract a small prime may pass to firms that are not similarly situated:
    50 percent for services.'
  definition: 'The limitations on subcontracting cap how much of a set-aside contract a small prime may pass to
    firms that are not like itself. The prime may pay such subcontractors no more than 50 percent of the amount
    paid by the Government for services or supplies, 85 percent for general construction and 75 percent for special
    trade construction, with materials excluded for supplies and construction (FAR 19.505; 52.219-14; 13 CFR 125.6)
    [422] [423] [424]. Work done by a similarly situated entity with its own employees does not count against the
    cap [424]. The rule applies to small-business set-asides above the simplified acquisition threshold and to 8(a),
    HUBZone, SDVOSB and WOSB awards at any value [422].

    '
