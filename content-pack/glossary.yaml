- id: size-standard
  term: Size standard (what makes a firm small)
  kind: methods
  variants:
  - size standard
  - size standards
  - Size Standards Tool
  - small business concern
  - small business concerns
  - being small
  short: The ceiling, per industry, in employees or average annual receipts, under which a firm and its affiliates
    count as a small business concern.
  definition: 'A size standard is the ceiling under which a firm, counted together with its affiliates, is a small
    business concern for a given industry [278] [284]. It is set per NAICS code in employees or in average annual
    receipts (13 CFR 121.201), with receipts averaged over five completed fiscal years and employees over the preceding
    24 calendar months [284] [281] [282]. The code assigned to a solicitation fixes which standard applies, and
    size is determined as of the initial offer that includes price; a firm small at award generally stays small
    for the life of the contract (13 CFR 121.402, 121.404) [285] [290]. SBIR and STTR use their own test of not
    more than 500 employees (13 CFR 121.702) [10]. Pending: a proposed rule of August 20, 2026 would collapse nearly
    1,000 size standards into 338 [288].

    '
