  short: Challenges to another offeror's claim to be small, or to hold a program status. Due by the fifth business
    day after the apparent winner is announced.
  definition: 'A size protest challenges another offeror''s claim to be small; a status protest challenges its claim
    to HUBZone, SDVOSB or WOSB/EDWOSB status. Both are due by the fifth business day after bid opening or notice
    of the apparent successful offeror (FAR 19.302, 19.306 to 19.308; 13 CFR 121.1004) [458] [294] [462] [463] [464].
    SBA decides, and its formal size determination can be appealed to the Office of Hearings and Appeals within
    15 calendar days [460]. 8(a) eligibility cannot be challenged by another participant or any other party [337].
    GAO leaves size matters to SBA [467].

    '
