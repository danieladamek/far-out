  term: Phase I (SBIR/STTR)
  kind: methods
  variants:
  - Phase I
  short: 'The first, small SBIR or STTR award: money to test whether an idea is feasible. Base guideline $150,000.'
  definition: 'Phase I is the first, small award: money to test whether an idea is feasible. The Policy Directive
    describes it as feasibility-related research, normally not more than 6 months for SBIR or 1 year for STTR, with
    a base guideline of $150,000 [5]. As of April 2026 agencies may go to $323,090 without SBA approval, and actual
    amounts vary by agency [11]. In SBIR the awardee performs at least two-thirds of the research effort [5]. The
    CMMC rollout also has numbered phases, which are unrelated.

    '
