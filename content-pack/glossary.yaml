  - GPE
  short: The government's site for registering to do business with it, for posted contract opportunities and for
    award data. Registration is free.
  definition: 'SAM.gov is the government''s single site for registering to do business with it, for posted contract
    opportunities and for award data. FAR 52.204-7 reads: "An Offeror is required to be registered in SAM when submitting
    an offer or quotation and at time of award." [303] Registration is free, can take up to 10 business days to
    become active and is renewed every 365 days [301] [300]. The site is also the governmentwide point of entry
    (GPE), defined in FAR 2.101 as "The single point where Government business opportunities greater than $25,000"
    can be accessed electronically by the public [418]. Since 2025 it has also taken in subcontract reporting and
    the former FPDS award search [724] [720] [584].

    '
