  short: The two tests an individual owner must meet for the 8(a) program. The social test changed on September
    10, 2026.
  definition: 'These are the two tests an individual owner must meet for the 8(a) program. Social disadvantage,
    since September 10, 2026, means showing that a governmental or private entity discriminated or was biased against
    a group of which the individual is a member, causing material harm; there is no longer a rebuttable presumption
    for individually owned applicants (13 CFR 124.103) [312] [314]. Economic disadvantage is a financial ceiling,
    stated on SBA''s page as net worth of $850 thousand or less, income of $400 thousand or less and assets of $6.5
    million or less [310]. The 2026 rule says it does not affect entity-owned firms [314].

    '
