  short: Lets a small distributor or reseller win a supply set-aside if it supplies the product of a U.S. small-business
    manufacturer.
  definition: 'The nonmanufacturer rule lets a small firm that does not make a product, such as a distributor or
    reseller, win a supply set-aside. The condition is that it supplies the end item of a U.S. small-business manufacturer,
    and the firm itself has no more than 500 employees, or 150 for information technology value-added resellers
    (FAR 19.505) [422]. SBA may grant individual or class waivers [422].

    '
