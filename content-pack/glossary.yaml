  short: SBA's program letting a firm of any size mentor a small one. A joint venture of the pair counts as small
    where the protégé is small.
  definition: 'SBA''s Mentor-Protégé Program lets a for-profit firm of any size assist a small firm under a written
    agreement that SBA approves (15 U.S.C. 657r; 13 CFR 125.9) [787] [785]. Its main effect is on size: an approved
    relationship is an exception to affiliation, and a joint venture between a protégé and its mentor qualifies
    as small for any procurement for which the protégé itself is small [297] [785]. An agreement may run up to six
    years, and the mentor may take an equity interest of up to 40% in the protégé [785]. SBA quotes 105 days to
    process an application [788].

    '
