  definition: 'An IDIQ is a contract that sets terms for a period but not how much will be bought; the buying happens
    later, through orders. OASIS+, for example, is a multiple-award, indefinite-delivery, indefinite-quantity contract
    [526]. Where several firms hold it, it is a multiple-award contract: each holder gets "a fair opportunity to
    be considered for each order exceeding the micro-purchase threshold", and orders may be set aside for small
    business (FAR 16.505; 19.504) [421] [420]. An order can be protested only for exceeding the contract''s scope,
    or above $10 million at civilian agencies and $25 million at DoD, NASA and the Coast Guard, and then only at
    GAO [421].

    '
