- id: far-sunset
  term: Sunset of non-statutory FAR text (FAR 1.109)
  kind: methods
  variants:
  - FAR 1.109
  - '1.109'
  - four-year sunset
  - sunset provision
  short: The rule that FAR sections not required by statute expire after four years unless renewed. The official
    texts disagree on how it works.
  definition: 'The sunset is the rule that FAR sections not required by statute expire unless renewed. Executive
    Order 14275 sets the expiry at four years after the final rule''s effective date unless the FAR Council renews
    the provision, and section 1.109 of the model deviation text says the same [386] [392]. The official texts disagree
    on how it will work: the June 23, 2026 proposed rule describes review and rulemaking, and its preamble says
    "Sections, provisions and clauses do not expire until removed from the Code of Federal Regulations through rulemaking"
    [403].

    '
