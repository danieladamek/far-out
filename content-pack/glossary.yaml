  short: The government's system for confirming employment eligibility. Required by clause on contracts over $150,000
    lasting 120 days or more.
  definition: 'E-Verify is the government''s system for confirming that employees may lawfully work in the United
    States. Its own page says "a presidential Executive order and subsequent Federal Acquisition Regulation (FAR)
    rule required federal contractors to use E-Verify" [649]. The clause, FAR 52.222-54, goes in contracts that
    exceed $150,000 and run 120 days or more, with exceptions for work outside the United States and for commercially
    available off-the-shelf items (FAR 22.1803) [648]. It flows down to subcontracts over $3,500 for services or
    construction performed in the United States [647].

    '
