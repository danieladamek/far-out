  short: The prime holds the contract with the Government. A subcontractor works for the prime or for another subcontractor
    and has no contract with the Government.
  definition: 'A prime contractor holds the contract with the Government and answers for the work under it; subcontractors,
    SBA says, "do not work directly with the government, but instead work for other contractors" [730]. A first-tier
    subcontractor contracts with the prime, and lower tiers with other subcontractors. A subcontractor is small
    if it is under the size standard for the NAICS code the prime assigns to the subcontract, and it self-certifies
    when it submits its offer (13 CFR 121.410, 121.411) [989] [990]. Because the Government has a contract only
    with the prime, a subcontractor has no Contract Disputes Act claim of its own, GAO will not hear a protest of
    a subcontract award, and CPARS rates the prime alone [979] [467] [985].

    '
