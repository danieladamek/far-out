  short: An other transaction DoD uses to build and test a prototype. One of four conditions must hold, such as
    a nontraditional contractor taking a significant part.
  definition: 'A prototype OT is an other transaction DoD uses to build and test a prototype, which may be a proof
    of concept, model, pilot or novel use of commercial technology (10 U.S.C. 4022) [1028] [1059]. One of four conditions
    must hold: a nontraditional defense contractor or nonprofit research institution participating to a significant
    extent; all significant participants being small businesses or nontraditional contractors; one third of the
    cost from non-Federal sources; or a written finding of exceptional circumstances [1028]. A competitively awarded
    prototype OT can lead to production without further competition [1029]. Agreements with payments over $5,000,000
    carry a Comptroller General access clause [1049].

    '
