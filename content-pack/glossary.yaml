  short: Re-stating a firm's size and program status after award, within 30 days of a merger or sale and on contracts
    over five years.
  definition: 'Recertification is the duty to re-state a firm''s size and program status after award when certain
    events happen. Under 13 CFR 125.12, in force since January 17, 2026, a firm recertifies within 30 calendar days
    of a merger, acquisition or sale that changes controlling interest, and on contracts longer than five years
    [291] [292]. A disqualifying recertification on a multiple-award contract makes the firm ineligible for later
    set-aside orders but not for unrestricted ones [291]. The word is also used for renewing a certification: HUBZone,
    WOSB and veteran certifications are renewed every three years [345] [353] [364].

    '
