  - nontraditional contractor
  - nontraditional contractors
  short: A firm that has held no DoD contract under full cost accounting standards coverage for at least a year.
    Nearly all small firms qualify.
  definition: 'A nontraditional defense contractor is a firm that has not, for at least the year before DoD''s solicitation,
    performed any DoD contract or subcontract subject to full coverage under the cost accounting standards (10 U.S.C.
    3014) [1032]. Because contracts with small businesses are exempt from those standards, DoD''s guide says the
    category covers a large number of entities, "including nearly all small business concerns" [1039] [1050]. The
    status matters for other transactions: a prototype agreement needs no cost share when at least one such contractor
    participates to a significant extent (10 U.S.C. 4022(d)) [1028]. Section 1826 of the FY2026 NDAA adds exemptions
    from ten listed requirements, set out as a statutory note [1032].

    '
