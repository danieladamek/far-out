- id: dfars
  term: Defense Federal Acquisition Regulation Supplement (DFARS)
  kind: methods
  variants:
  - DFARS
  - Defense Federal Acquisition Regulation Supplement
  - Defense supplement
  short: 'The defense department''s supplement to the FAR: extra rules and clauses that apply only to defense contracts.'
  definition: 'The DFARS is the defense department''s supplement to the FAR: extra rules and clauses that apply
    only to defense contracts. Its parts mirror the FAR''s, so DFARS Part 219 supplements FAR Part 19 on small business
    [448]. It sits at chapter 2 of Title 48 of the Code of Federal Regulations, after the FAR at chapter 1 [402].
    Clause numbers beginning 252 are DFARS clauses, such as 252.204-7012 on safeguarding covered defense information
    [618].

    '
