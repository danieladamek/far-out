    under SBA''s Women-Owned Small Business Federal Contract program; an EDWOSB is one whose owners also meet a
    personal financial ceiling, including net worth of less than $850,000 [351] [352]. Set-asides and sole-source
    awards exist only in industries SBA has designated by NAICS code: 733 on its list effective October 1, 2022,
    of which 107 are open to EDWOSBs only [354] [358]. Certification is free through SBA or comes from one of four
    approved third-party certifiers, with a program examination every three years [351] [353]. The statutory goal
    for women-owned small businesses is not less than 5 percent [374].

    '
