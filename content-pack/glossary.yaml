  definition: 'HUBZone is SBA''s certification for small firms based in, and employing residents of, historically
    underutilized business zones [341]. A certified firm keeps its principal office in a HUBZone and at least 35%
    of its employees live in one (13 CFR 126.200) [341] [343]. Certified firms can receive sole-source awards, and
    in full and open competition they get a price evaluation preference: 10 percent is added to all offers except
    those of HUBZone firms and other small businesses (FAR 19.1306, 19.1307) [349] [433]. Certification is renewed
    every three years, and the statutory goal for HUBZone firms is not less than 3 percent [345] [374].

    '
