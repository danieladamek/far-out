  short: The base agreement is the umbrella OT between the Government and a consortium; a project agreement is what
    a member signs with the manager to do the work.
  definition: 'The base agreement is the umbrella other transaction between the Government and a consortium, signed
    through its manager; a project agreement is what a member then signs with the manager to do one piece of work
    [1415] [1377]. The base agreement sets terms that every project inherits: "Project Agreements shall comply with
    all provisions contained within the OTA and any other supporting documents referenced therein." [1415] One executed
    agreement defines a project award as an agreement between the consortium management firm and the project awardee,
    authorised by the Government [1377]. The member therefore performs under the consortium''s other transaction,
    not under a direct agreement with the Government, and its rights, including intellectual property, are those
    the agreement states [1119] [1064].

    '
