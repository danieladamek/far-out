  definition: 'A synopsis is the public notice of a proposed contract action, posted on SAM.gov before the solicitation.
    Proposed actions over $25,000 must be synopsized there; between $20,000 and $25,000 a notice is displayed in
    a public place or by electronic means (FAR 5.101) [562]. Outside commercial buys the synopsis appears at least
    15 days before the solicitation, and above the simplified acquisition threshold offerors get at least 30 days
    to respond (FAR 5.203) [563]. A synopsis carries eighteen data elements, including the set-aside status and
    the closing response date (FAR 5.207) [565].

    '
