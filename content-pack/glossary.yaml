- id: class-deviation
  term: Class deviation
  kind: methods
  variants:
  - class deviation
  - class deviations
  - model deviation text
  - deviation text
  - by deviation
  short: An agency's written authority for its contracting officers to follow text that departs from the codified
    regulation.
  definition: 'A class deviation is an agency''s written authority for its contracting officers to follow text that
    departs from the codified regulation, across a whole class of purchases. It is how the rewritten FAR is in force
    today: the FAR Council told agencies to adopt each part''s model text by class deviation and keep it until the
    FAR is formally amended [399] [388]. GSA adopted the rewritten Part 19 effective November 3, 2025 and DoD effective
    February 1, 2026 [400] [402]. A deviation stays in effect until rescinded or incorporated into the FAR, so a
    solicitation from an agency under one may use section numbers that differ from the codified text [400].

    '
