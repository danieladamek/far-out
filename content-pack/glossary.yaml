  term: Phase II (SBIR/STTR)
  kind: methods
  variants:
  - Phase II
  short: The main SBIR or STTR research and development award, continuing a Phase I. Base guideline $1,000,000.
  definition: 'Phase II continues a Phase I project into full research and development. It normally runs not more
    than 2 years with a base guideline of $1,000,000; as of April 2026 agencies may go to $2,153,927 without SBA
    approval [5] [11]. One additional, sequential Phase II may follow, and some agencies allow entry without a Phase
    I under Direct to Phase II [5]. In SBIR the awardee performs at least one-half of the research effort [5]. The
    CMMC rollout also has a Phase II, suspended in July 2026, which is unrelated [625].

    '
