  - research institution
  - research institutions
  - Research Institution
  - nonprofit research institution
  short: 'SBIR''s sibling for work done with a research institution: at least 40 percent by the small firm and 30
    percent by the institution.'
  definition: 'STTR is SBIR''s sibling for work done with a research institution. The small business must perform
    not less than 40 percent of the work and a partnering nonprofit research institution not less than 30 percent,
    under an agreement allocating intellectual property [5] [277]. Agencies with extramural research budgets over
    $1 billion must spend 0.45 percent on it, and six agencies take part [3] [12]. The principal investigator may
    be employed by either party [277].

    '
