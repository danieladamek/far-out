  definition: 'Part 15 governs negotiated purchases: the agency asks for proposals, evaluates them against stated
    factors, may hold discussions and take final proposal revisions, and then awards [1325] [596]. It encourages
    exchanges with industry before the solicitation (FAR 15.201) [590], gives offerors a right to a debriefing (FAR
