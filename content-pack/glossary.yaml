  definition: 'SBIR data rights protect the technical data a firm produces under an award: during the protection
    period the Government may use the data but may not disclose it [17]. The directive and the defense clause DFARS
    252.227-7018 set the period at 20 years from award, and the data must carry the required legend [5] [24]. The
