  short: The FAR's rules for buying what the commercial market already sells, with simpler terms and fewer clauses.
  definition: 'Part 12 is the FAR''s set of rules for buying what the commercial market already sells. Agencies
    are to acquire commercial products, commercial services or nondevelopmental items when these are available to
    meet their needs (FAR 12.101) [442]. Such buys are firm-fixed-price or fixed-price with economic price adjustment,
    with time-and-materials only on a documented justification [601]. Market research is what sends a purchase to
    Part 12 [1324]. Pending: a proposed rule of September 18, 2026 would move micro-purchase procedures into Part
    12 [405].

    '
