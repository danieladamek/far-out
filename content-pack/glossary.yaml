    October 1, 2026.
  definition: 'The federal fiscal year runs from October 1 to September 30 and is named for the calendar year in
    which it ends, so FY2027 began on October 1, 2026. Program dates follow it: SBIR and STTR authority now runs
    to September 30, 2031, and the per-firm proposal limits start with fiscal year 2027 [1]. The goals and SBA''s
    scorecard are also kept by fiscal year [374] [382]. A firm''s own fiscal years matter too: annual receipts are
    averaged over its five most recent completed fiscal years when its size is measured [281].

    '
