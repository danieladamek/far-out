  - Rule of Two
  short: 'The test for reserving a purchase for small business: can offers be expected from at least two capable
    small firms at fair prices?'
  definition: 'The rule of two is the test that decides whether a purchase is reserved for small business: can the
    contracting officer reasonably expect offers from at least two capable small firms? Between the micro-purchase
    threshold and the simplified acquisition threshold a purchase is set aside unless two competitive small-business
    offers cannot be expected, a band also reserved by statute (FAR 19.502-2; 15 U.S.C. 644(j)(1)) [384] [374].
    Above that threshold the acquisition is set aside when offers are expected from at least two responsible small
    businesses at fair market prices [384]. VA applies its own two-firm test for veteran-owned firms under Veterans
    First [369].

    '
