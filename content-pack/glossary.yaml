  definition: 'The NDAA is the yearly act of Congress on defense policy, and it is where most changes to defense
    acquisition law are made. The FY2026 NDAA is Pub. L. 119-60, enacted December 18, 2025; its Title XVIII is headed
    Acquisition Reform [806]. Three of its changes were verified in the U.S. Code: section 1802 creates the portfolio
    acquisition executive, section 1823 widens the commercial solutions opening statute, and section 1804 raises
    the certified cost or pricing data threshold [1273] [1033] [1036]. Other sections are known here only from headings
    and digests [806].

    '
