  definition: 'CMMC is the defense department''s program for checking that contractors protect sensitive unclassified
    information on their systems. The rule at 32 CFR Part 170 sets three levels and four rollout phases, and DFARS
    252.204-7021 requires a current CMMC status at the stated level for the life of the contract [624] [623] [621].
    The DFARS rule took effect November 10, 2025 [622]. On July 13, 2026 the Department suspended the Phase II requirements:
    implementation is paused in Phase 1, new procurements may ask only for self-assessments, and "All Phase I self-assessment
    requirements remain firmly in place." [625] [627]

    '
