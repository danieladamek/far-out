  short: The name the defense department gave its reformed acquisition system in November 2025. The founding memorandum
    could not be read; the companion strategy was.
  definition: 'The Warfighting Acquisition System is the name the department gave its reformed acquisition system
    on November 7, 2025, in a memorandum titled "Transforming the Defense Acquisition System into the Warfighting
    Acquisition System to Accelerate Fielding of Urgently Needed Capabilities to Our Warriors" [1263]. The memorandum
    itself could not be read for this guide; a third-party copy reports portfolio acquisition executives with four-year
    terms and a preference for commercial products, so its content is pending confirmation [1263] [1265]. The companion
    Acquisition Transformation Strategy, which was read, establishes portfolio acquisition executives, directs other
    transaction authority "for prototype and follow-on production efforts where in the best interest of the warfighter
    and the taxpayer", and keeps the Middle Tier pathway while delegating its approvals [1264]. Both are policy,
    not law; statute followed in the FY2026 NDAA [1273].

    '
