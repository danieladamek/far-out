  short: The preference for domestic products in federal supply purchases, and the rule on which other countries'
    products may be offered on larger ones.
  definition: 'Buy American is the preference for domestic products in federal supply purchases: under FAR subpart
    25.1 a domestic end product must be manufactured in the United States and meet a domestic-content share of 65%
    for 2024 through 2028 [652]. The Trade Agreements Act works alongside it: above $174,000 for supplies and services,
    eligible products from designated countries are treated like domestic ones (FAR 25.402) [653]. Exceptions to
    Buy American include public interest, nonavailability and unreasonable cost [652]. On the GSA Multiple Award
    Schedule every proposed product and service must comply with the Trade Agreements Act [481].

    '
