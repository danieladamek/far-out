  short: A formal challenge to a solicitation's terms or to an award, filed with the agency, with GAO ($500 fee,
    decision within 100 days) or in court.
  definition: 'A bid protest is a formal challenge to the terms of a solicitation or to an award, by an interested
    party: an actual or prospective offeror whose direct economic interest would be affected [467]. It can be filed
    with the agency itself, starting with the contracting officer, within 10 days of when the basis is known (FAR
    33.103) [465]. At GAO it is filed through the Electronic Protest Docketing System for a $500 fee, generally
    within 10 days, and decided within 100 days; a timely protest stays the award or performance (4 CFR part 21)
    [467] [468] [466]. GAO does not decide size matters or protests of subcontract awards, and it generally does
    not review awards of agreements other than procurement contracts [467] [1038]. For other transactions the Court
    of Federal Claims has taken jurisdiction over several protests, though its decisions are trial-level and not
    uniform [1082] [1080].

    '
