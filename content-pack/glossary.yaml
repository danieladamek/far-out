  definition: 'A CSO is a standing general solicitation: the agency describes problems, firms send short proposals,
    and the agency selects what it wants by peer, technical or operational review [1033] [1058]. For defense the
    authority is 10 U.S.C. 3458, which since section 1823 of Pub. L. 119-60 (December 18, 2025) covers commercial
    products, commercial services and nondevelopmental items, no longer only "innovative" ones [1033] [1034]. DFARS
    subpart 212.70 has not caught up and still says "innovative" [1040]. A CSO may end in a FAR-based contract or
    in a prototype OT under 10 U.S.C. 4022 [1058].

    '
