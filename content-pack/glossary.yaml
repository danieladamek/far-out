  definition: 'A VOSB is a small firm not less than 51 percent owned and controlled by veterans, and an SDVOSB is
    one owned and controlled by veterans whom VA has rated service-disabled; both are certified by SBA (13 CFR Part
    128) [361] [363]. A contracting officer in any agency may award to an SDVOSB sole source, up to $8.5 million
    for manufacturing and $5 million otherwise (FAR 19.1406) [368]. SDVOSBs may no longer self-certify for awards
