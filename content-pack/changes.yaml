- id: chg-pl-119-106-ot-reporting
  date: '2026-09-11'
  status: pending-implementation
  basis: primary
  what: 'Pub. L. 119-106, the Stop Secret Spending Act of 2025 (enactment date as extracted by the fetch), amends
    the Federal Funding Accountability and Transparency Act so that other transaction agreements are reported on
    USAspending.gov: a compilation report within 1 year; "data relating to other transaction agreements is automatically
    transmitted to the website" within 3 years; an implementation plan to Congress within 2 years if not compliant;
    inspector general reports within 1 year and at least every 2 years for 10 years [1421]. GAO had found over $40
    billion in OTAs not reported to USAspending.gov [1129].

    '
  affects:
  - ot-payment-reporting
  - consortium-project-agreement
  sources:
  - 1129
  - 1421
- id: chg-8a-social-disadvantage-rule
  date: '2026-08-11'
  status: final
  basis: primary
  what: 'SBA proposed on June 11, 2026 (91 FR 35433, RIN 3245-AI75; comments due July 13, 2026) [313] and made final
    on August 11, 2026 (91 FR 51568) the removal of the rebuttable presumption of social disadvantage in 13 CFR
    124.103 for individually owned 8(a) applicants: "This rule is effective on September 10, 2026. It applies to
    all pending applications of individually-owned applicants as of that date." [314] "It does not in any way amend
    or affect the eligibility of entity-owned small businesses." [314] Social disadvantage remains a one-time determination,
    so individuals already found disadvantaged need not re-establish it [314]. The eCFR text of 124.103 carries
    the new test [312]. On the effective date SBA returned pending individually owned applications with 45 calendar
    days to resubmit and gave priority to ten NAICS codes [325].

    '
  affects:
  - 8a-business-development
  - 8a-sole-source-and-competition
  - sdb-self-representation
  sources:
  - 312
  - 313
  - 314
  - 325
