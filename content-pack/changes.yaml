- id: chg-ndaa-fy26-1826-note-and-deviations
  date: '2025-12-18'
  status: final
  basis: primary
  what: 'Supplements chg-ndaa-fy26-1826, which marks the section''s content secondary-only. The statutory note at
    10 U.S.C. 3014 sets out Pub. L. 119-60 section 1826 (Dec. 18, 2025, 139 Stat. 1249), read in full on recheck:
    for DoD contracts, subcontracts or agreements, "products and services provided by nontraditional defense contractors
    (as defined in section 3014 of title 10, United States Code) shall be exempt" from ten listed requirements,
    among them 10 U.S.C. 3702 and FAR Part 31; the exemption may be waived by written determination approved by
    the head of the contracting activity, with notice to the congressional defense committees not later than 60
    days after a waiver; the note states no effective date and no dollar threshold, and the definition in section
    3014 itself is not amended [1032]. Implementation by class deviation: the acquisition university''s entry of
    July 24, 2026 says DFARS Part 215 Revision 1 implements section 1826 (nontraditional defense contractors exempt
    from certified cost or pricing data unless waived) [410]; the original Part 215 deviation 2026-O0048, effective
    March 16, 2026, carries no reference to section 1826 in the text read [1047]. SECONDARY ONLY: a law-firm tracker
    dates 2026-O0048 Rev 1 to July 22, 2026 and reports further deviations for Parts 230, 231 and 234 [1048]. The
    deviation memos were not read.

    '
