- id: chg-pl-119-106-ot-reporting
  date: '2026-09-11'
  status: pending-implementation
  basis: primary
  what: 'Pub. L. 119-106, the Stop Secret Spending Act of 2025 (enactment date as extracted by the fetch), amends
    the Federal Funding Accountability and Transparency Act so that other transaction agreements are reported on
    USAspending.gov: a compilation report within 1 year; "data relating to other transaction agreements is automatically
    transmitted to the website" within 3 years; an implementation plan to Congress within 2 years if not compliant;
    inspector general reports within 1 year and at least every 2 years for 10 years [2131]. GAO had found over $40
    billion in OTAs not reported to USAspending.gov [2129].

    '
  affects:
  - ot-payment-reporting
  - consortium-project-agreement
  sources:
  - 2129
  - 2131
