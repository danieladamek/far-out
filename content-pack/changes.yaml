- id: chg-rfo-proposed-rules-2026-09-18
  date: '2026-09-18'
  status: proposed
  basis: primary
  what: 'A second set of four FAR-overhaul proposed rules was issued September 18, 2026, comments due October 19,
    2026: Parts 8, 12, 13, 15, 38, 44 and 51 (FAR Case 2026-003, 91 FR 59406); Parts 16, 17 and 35 (FAR Case 2026-006);
    Parts 9, 27 and 47; and Parts 14, 28 and 36, with Part 52 clauses [409] [405] [406] [521]. SBA Advocacy calls
    them "the second of four planned sets" [409]. FAR Case 2026-003 would move micro-purchase procedures from subpart
    13.2 to subpart 12.4, keep simplified commercial procedures up to $9 million ($15 million for specified emergencies),
    remove provisions 52.212-3 and 52.212-5, require agencies to use existing contracts designated required use
    or best in class before soliciting new ones, and remove Part 38 [405] [521]. FAR Case 2026-006 would give unsuccessful
    offerors on orders above the simplified acquisition threshold up to $7.5 million a brief explanation on written
    request, and Part 15 debriefing procedures above $7.5 million [406]. The Federal Register search of October
    3, 2026 returned no Part 19 proposed rule and no final rule [407].

    '
  affects:
  - simplified-acquisition-and-micro-purchase
  - commercial-product-or-service-buy
  - order-set-aside-multiple-award
  - teaming-contractor-team-arrangements
  - subcontracting-under-prime-plan
  - baa-far-35-016
  - gsa-mas
  - flow-down-clauses
