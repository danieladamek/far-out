- id: chg-eo-14265
  date: '2025-04-09'
  status: final
  basis: primary
  what: 'Executive Order 14265, Modernizing Defense Acquisitions and Spurring Innovation in the Defense Industrial
    Base, was signed April 9, 2025 and published April 15, 2025 (90 FR 15621) [1926]. It set a reform plan due within
    60 days (Sec. 3), an MDAP review within 90 days with programs more than 15% behind schedule or over cost considered
    for cancellation (Sec. 6), and a workforce plan within 120 days, including field training teams (Sec. 5) [1926].

    '
