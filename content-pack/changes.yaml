- id: chg-recertification-125-12
  date: '2026-01-17'
  status: final
  basis: primary
  what: '13 CFR 125.12, created by final rule 89 FR 102448 (RIN 3245-AH68; rule effective January 16, 2025) [292],
    requires recertification of size and program status "within 30 calendar days" of a merger, acquisition or sale
    that changes controlling interest, and on contracts over five years "no more than 120 days prior to the end
    of the fifth year" [291]. Paragraph (g) uses January 17, 2026 as the transition date: disqualifying recertifications
    from events before that date leave the firm eligible for orders under small-business multiple-award contracts,
    though agencies cannot count new orders toward goals [291]. A joint venture may recertify as small where all
    parties are small, or the protégé is small in a mentor-protégé joint venture [291].

    '
