- id: chg-pl-119-83-reauthorization
  date: '2026-04-13'
  status: final
  basis: primary
  what: 'Pub. L. 119-83, the Small Business Innovation and Economic Security Act (S. 3971; 140 Stat. 755), approved
    April 13, 2026, extends SBIR and STTR from September 30, 2025 to September 30, 2031 and lets an agency carry
    unspent fiscal year 2026 set-aside funds into fiscal year 2027 [1]. It adds strategic breakthrough awards of
    "not more than $30,000,000 to a small business concern, including its affiliates", with a period of performance
    of not more than 48 months and not less than 100 percent matching funds [1] [2]; adds the Department of Energy
    and NASA to the Direct to Phase II agencies [2]; sets technical and business assistance at not more than $6,500
    per Phase I project and $50,000 per Phase II project, with the awardee choosing the provider [2]; and adds security-risk
    denial grounds tied to eight named lists [1]. Implementations found: HHS foreign disclosure policy NOT-OD-26-074
    and assistance limits NOT-OD-26-075, both April 20, 2026 [142] [143]; NIH strategic breakthrough announcement
    PA-27-101 [140]; NSF 26-510, strategic breakthrough by invitation to Phase II awardees [35].

    '
