- id: chg-rfo-proposed-rules-2026-06-23
  date: '2026-06-23'
  status: proposed
  basis: primary
  what: 'Phase two of the FAR overhaul, formal rulemaking, began June 23, 2026 with four proposed rules, comments
    due July 23, 2026: Parts 1, 2, 4, 33, 39, 40 and 53 (FAR Case 2026-001, 91 FR 37550); Parts 6, 7, 10, 18, 26,
    37 and 41 (FAR Case 2026-002); Parts 5, 24 and 29; and Parts 3 and 49 [403] [404] [408]. "The FAR Council is
    issuing twelve proposed rules that collectively will streamline the FAR in its entirety." [403] FAR Case 2026-001
    would merge five identification provisions into a revised 52.204-7, remove 52.204-8 in favour of entity-level
    SAM representations, and rewrite Part 33 so that protesters may ask for independent review above the contracting
    officer [403]. FAR Case 2026-002 would relocate Part 10 content to subpart 7.2 [404]. The batch does not include
    Part 19 [408]. None of the proposed rules was final as of October 3, 2026 [407].

    '
