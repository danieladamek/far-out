- id: chg-acquisition-transformation-strategy
  date: '2025-11-07'
  status: announced
  basis: primary
  what: 'On November 7, 2025 the Secretary of War announced three memoranda and the Acquisition Transformation Strategy
    [1927]. The 39-page strategy, posted November 10, 2025 and read in full, has five pillars, gives portfolio acquisition
    executives "expanded authorities for resourcing, requirements, and acquisition decisions within prescribed portfolios"
    (p. 15), directs OT authority "for prototype and follow-on production efforts where in the best interest of
    the warfighter and the taxpayer" (p. 10), keeps MTA while eliminating its Advisory Boards (p. 20), and proposes
    portfolio scorecards (p. 21) [1928].

    '
  affects:
  - aaf-urgent-capability-acquisition
  - aaf-middle-tier-of-acquisition
  - aaf-major-capability-acquisition
  - aaf-software-acquisition
  - aaf-defense-business-systems
  - aaf-acquisition-of-services
  sources:
  - 1927
  - 1928
