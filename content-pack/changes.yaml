  date: '2025-10-01'
  status: final
  basis: primary
  what: 'Final rule 90 FR 41872 (FAR Case 2024-001, FAC 2025-06), published August 27, 2025 and effective October
    1, 2025, raised the micro-purchase threshold from $10,000 to $15,000; the simplified acquisition threshold from
    $250,000 to $350,000; the commercial simplified procedures ceiling (FAR 13.500) from $7,500,000 to $9,000,000;
    the subcontracting plan threshold from $750,000 to $900,000 (construction $1,500,000 to $2,000,000); the 8(a)
    sole-source justification threshold (FAR 6.204) from $25,000,000 to $30,000,000; and certified cost or pricing
    data from $2,000,000 to $2,500,000 [340] [417]. Not adjusted: Construction Wage Rate Requirements, Service Contract
    Labor Standards, performance and payment bonds, and trade agreements thresholds [340]. Official text that lags:
    13 CFR 125.3 still prints $750,000 and $1,500,000 for subcontracting plans [704]. Later statute: 10 U.S.C. 3702
    reads $10,000,000 for prime contracts entered after June 30, 2026 (see chg-ndaa-fy26-1804-tina) [1036].

