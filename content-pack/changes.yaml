  date: '2024-12-11'
  status: final
  basis: primary
  what: 'RETIRED. On December 11, 2024 the FTC and DOJ withdrew the Guidelines for Collaboration Among Competitors
    (vote 3-2), saying they "no longer provide reliable guidance about how enforcers assess the legality of collaborations
    involving competitors." [828] On February 23, 2026 the two agencies sought public comment toward guidance on
    business collaborations (docket ATR-2026-0001; comments were due April 24, 2026); the listed topics do not name
    government-contract teaming and no replacement guidance was found [829]. Offerors still certify independent
    pricing under FAR 52.203-2 [765].

    '
