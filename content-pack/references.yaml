  summary: 'The SBA regulation that sets SBIR/STTR ownership, control and size rules. It distinguishes the SBIR
    options (including the multiple-VC/hedge/PE option) from the single STTR option and sets out affiliation rules.

    '
  key_facts:
  - 'SBIR (a)(1)(i): more than 50% directly owned and controlled by U.S. citizens or permanent resident aliens,
    other small business concerns so owned, an Indian tribe, ANC or NHO, or a combination.'
  - 'SBIR (a)(1)(ii): more than 50% owned by multiple venture capital operating companies, hedge funds or private
    equity firms, for agencies using 15 U.S.C. 638(dd)(1) authority; (a)(2): no single such firm may own more than
    50% unless it itself qualifies under (a)(1)(i).'
  - 'SBIR (a)(1)(iii): joint ventures where each party qualifies.'
  - 'STTR (b): only the citizen/permanent-resident/small-business/tribal ownership option; no multiple-VC option.'
  - '(c): awardee together with affiliates must not have more than 500 employees.'
  - 'Affiliation: control above 50% of voting equity; SBA may find affiliation at 40% or more under the totality
