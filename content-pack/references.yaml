  summary: 'Enrolled text, fetched three times for sections 2, 3, 4, 7, 8, 9 and 10. Ten sections: research security,
    strategic breakthrough funding, proposal limits, Phase III education, Phase III improvements, TABA, data collection,
    extension, extension of pilots. The calendar print (https://www.govinfo.gov/content/pkg/BILLS-119s3971cps/pdf/BILLS-119s3971cps.pdf,
    introduced March 3, 2026) was also read and matches on the points below.

    '
  key_facts:
  - 'Sec. 9: authorization extended from September 30, 2025 to September 30, 2031.'
  - 'Sec. 4: starting fiscal year 2027, each agency''s SBIR/STTR director must set, equally for all small businesses,
    a limit on the maximum number of Phase I and Phase II proposals a firm may submit; basis may be fiscal year,
    solicitation, or topic; limit to be established not later than 90 days before the start of FY2027; waivers topic-by-topic
    for "time-sensitive and urgent" needs, decided within 15 days, capped at 5 percent of topics per year; methodology
    reported to Congress within 30 days.'
  - 'Sec. 2: agencies must evaluate whether a small business "presents a security risk for any reason"; denial grounds
    include a connection to an entity on eight named lists (UFLPA Entity List; Non-SDN Chinese Military-Industrial
    Complex Companies List; Section 889 Prohibition List; Chinese Military Companies list; Military End User List;
    Entity List; FCC List of Equipment and Services; Withhold Release Orders and Findings List) or a risk the agency
    "determines warrants a denial"; denied firms must be notified and remain eligible in later cycles; due-diligence
    scope under 638(vv)(2) widened; GAO study period changed from 3 years to 8 years.'
  - 'Sec. 3: Phase II "strategic breakthrough" awards of not more than $30,000,000 per small business; period of
    performance not more than 48 months; not less than 100 percent matching funds; award not later than 90 days
    after receiving a proposal; funded from not more than 0.50 percent of extramural R&D at agencies required to
    spend more than $100,000,000; ceases to have effect September 30, 2031.'
  - 'Sec. 7: agencies "shall authorize" awardees to select their own TABA provider; TABA now covers cybersecurity
    assistance and screening for foreign involvement; not more than $6,500 per Phase I project and not more than
    $50,000 per Phase II project; funds may be used to hire or train staff and for I-Corps participation.'
  - 'Sec. 8: SBIR.gov database must classify awards as direct-to-Phase II, subsequent Phase II, strategic breakthrough,
    Phase III prime contract, or Phase III subcontract; FPDS must capture Phase III designations and whether non-SBIR
    contracts use SBIR-funded technology.'
  - 'Sec. 10: pilots extended to September 30, 2031 include Commercialization Readiness Program (638(gg)), Phase
    0 pilot (jj), administrative assistance (mm), increased minimum performance standards (qq), commercialization
    assistance pilots (uu), due diligence program (vv).'
  - The Act mentions "data rights" once, as a training topic; it does not amend the data-rights rules.
  quotes:
  - set equally for all small business concerns a limit on the maximum number of proposals
  - has a security risk that the Federal agency determines warrants a denial
  - not more than $30,000,000 to a small business concern
