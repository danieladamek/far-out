  source_kind: primary
  read: full
  summary: The affiliation rule. Control, or the power to control, makes firms affiliates, and affiliates' size
    is added together. Paragraph (b) lists exceptions; (c)–(g) list the bases; (h) covers joint ventures and the
    ostensible subcontractor rule; (i) franchises.
  key_facts:
  - Control may be affirmative or negative (e.g., a minority owner able to block a quorum); blocking only extraordinary
    actions (adding equity holders, dissolution, sale of all assets, merger, bankruptcy) is not negative control.
  - 'Stock: 50% or more of voting stock controls; equal large minority blocks are presumed to control (rebuttable).'
  - Common management (e); identity of interest (f) — family members doing business together presumed affiliated,
    rebuttable by a clear line of fracture; economic dependence presumed at 70% or more of receipts from one concern
    over three fiscal years.
  - 'Newly organized concern (g): former officers/key employees start a same-industry firm that gets contracts,
    financial or technical help from the old firm; rebuttable.'
  - 'Joint ventures (h): partners not affiliated for contracts awarded within two years of the JV''s first award;
    JV must be in writing and registered in SAM under its own name.'
  - 'Ostensible subcontractor: a not-similarly-situated subcontractor that performs the primary and vital requirements,
    or on which the prime is unusually reliant.'
  - 'Exceptions (b)(1)–(b)(10): SBIC/investment-company owners; firms owned by Indian Tribes, ANCs, NHOs, CDCs;
    SBA-approved R&D pools; employee leasing/PEO; certain investors for financial assistance; SBA-approved mentor-protégé;
    agricultural cooperative members; SBIR/STTR (exceptions apply there too); Small Business Teaming Arrangements;
    faith-based organizations.'
  quotes:
  - Concerns and entities are affiliates of each other when one controls or has the power to control the other,
    or a third party or parties controls
  - performs primary and vital requirements of a contract, or of an order, or is a subcontractor upon which the
    prime contractor is unusually reliant.
  role_here: support
  role_note: Sweep A id `ecfr-121-103` (Affiliation).
  cited_in: []
  verified: true
  recheck: true
