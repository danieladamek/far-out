  key: SbaPd2023
  tier: seminal
  citation: U.S. Small Business Administration, Office of Investment and Innovation. SBA SBIR/STTR Policy Directive
    (effective May 3, 2023). 2023-05-03. https://www.sbir.gov/sites/default/files/documents/SBA%20SBIR_STTR_POLICY_DIRECTIVE_May2023.pdf
  url: https://www.sbir.gov/sites/default/files/documents/SBA%20SBIR_STTR_POLICY_DIRECTIVE_May2023.pdf
  year: 2023
  published: '2023-05-03'
  date_note: ''
  accessed: '2026-10-03'
  publisher: U.S. Small Business Administration, Office of Investment and Innovation
  source_kind: primary
  read: partial
  summary: 'The governing program-wide rulebook, linked from https://www.sbir.gov/about/policies as the current
    directive (no 2026 revision posted there on 2026-10-03). Section 4(c) is the fullest official statement of Phase
    III; section 8 covers data rights; it also sets the SBIR/STTR work-share and benchmark rules.

    '
  key_facts:
  - 'Phase III: work that "derives from, extends, or completes" prior SBIR/STTR work and is funded by non-SBIR/STTR
    sources (private capital, or non-SBIR federal funds for products, production, or continued R&D).'
  - Phase I/II competition satisfies statutory competition requirements; the agency need not compete again; a justification
    need only state that the project is a Phase III award deriving from prior SBIR/STTR funding agreements.
  - No limit on number, duration, type, or dollar value of Phase III awards; no time limit between Phase I/II and
    Phase III; size limits for Phase I and II do not apply to Phase III.
  - 'Special acquisition requirement: award to the SBIR/STTR developer "to the greatest extent practicable"; agency
    must negotiate in good faith, do market research on whether the firm is available, capable and willing, and
    issue a non-competitive contract where practicable.'
  - If the agency intends to go elsewhere it must notify SBA in writing before award; SBA may file notice of intent
    to appeal within 5 business days and an appeal within 10 business days; the contracting officer must suspend
    action; the agency decides within 30 business days; SBA reports all such cases to Congress.
  - Protection period begins at award and ends twenty years (or longer at agency discretion) from the date of award;
    data must be marked; unmarked delivery may be corrected within 6 months; DOE takes unlimited rights after expiry,
    other agencies government-purpose use.
  - 'SBIR: awardee performs at least two-thirds of Phase I and one-half of Phase II. STTR: small business at least
    40 percent, research institution at least 30 percent.'
  - 'Set-asides: SBIR 3.2% (agencies with extramural R/R&D over $100M); STTR 0.45% (over $1B).'
  - Failing the Phase II transition-rate or commercialization benchmark bars new Phase I proposals for one year.
  quotes:
  - to the greatest extent practicable, consistent with an Agency's mission and optimal small business participation
  - the number, duration, type, or dollar value of Phase III awards made to a business concern
  - small business size limits for Phase I and Phase II awards do not apply to Phase III awards
  role_here: support
  role_note: 'Sweep D id `sba-pd-2023` (B. Phase III: statute, policy, regulations, protests). Governing program-wide
    directive; fullest official statement of Phase III and data rights until SBA revises it.'
