  - Annual receipts = total income plus cost of goods sold, averaged over the latest five complete fiscal years.
  - Contracting officer designates the NAICS code (13 CFR 121.402); appeal within 10 days of the solicitation.
  - Affiliates' employees/receipts must be included; affiliation is based on the power to control, whether exercised
    or not.
