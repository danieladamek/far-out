  summary: 'The enacted text of S. 3971. Fetched specifically for the public-law number and the exact wording of
    sections 5 and 6 (Phase III). Section 6 adds two duties to 15 U.S.C. 638(r)(4) and tells SBA to revise its policy
    directives within one year.

    '
  key_facts:
  - Public Law 119-83; enacted April 13, 2026; 140 Stat. 755; short title "Small Business Innovation and Economic
    Security Act".
  - Sec. 6(a)(1) amends section 9(j)(4) of the Small Business Act so Procurement Center Representatives must advocate
    for transition of SBIR/STTR technologies to Phase III.
  - 'Sec. 6(a)(2): SBA Administrator must modify the policy directives within one year after enactment (i.e., by
    April 13, 2027).'
  - 'Sec. 6(b) adds 638(r)(4)(C) and (D): simplified and standardized procedures and model contracts; standardized
    solicitation provisions and contract clauses on what a firm must show to establish Phase III eligibility.'
  - 'Sec. 5 adds 638(r)(5) "Workforce training": SBA, with DoD and GSA, must train contracting officers on SBIR/STTR
    authorities, Phase III agreements, Phase III data rights, and execution of Phase III sole-source contracts.'
  quotes:
  - develop simplified and standardized procedures and model contracts for Phase I, Phase II, and Phase III SBIR
    awards
  - advocate for the maximum practicable use and transition of products, services, and technologies developed under
    SBIR or STTR programs to Phase III
