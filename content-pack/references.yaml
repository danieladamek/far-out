  key: PL119-83
  tier: seminal
  citation: U.S. Government Publishing Office (govinfo.gov). Public Law 119-83, Small Business Innovation and Economic
    Security Act (140 Stat. 755). 2026-04-13. https://www.govinfo.gov/content/pkg/PLAW-119publ83/html/PLAW-119publ83.htm
  url: https://www.govinfo.gov/content/pkg/PLAW-119publ83/html/PLAW-119publ83.htm
  year: 2026
  published: '2026-04-13'
  accessed: '2026-10-03'
  publisher: U.S. Government Publishing Office (govinfo.gov)
  source_kind: primary
  read: full
  summary: 'The 2026 SBIR/STTR reauthorization. Ten sections amending section 9 of the Small Business Act (15 U.S.C.
    638): research security, Phase II strategic breakthrough funding, proposal limits, Phase III education and improvements,
    technical and business assistance, data collection, extension to 2031 with FY2026 carryover, and extension of
    pilots including Direct to Phase II.

    '
  key_facts:
  - Public Law 119-83; approved April 13, 2026; 140 Stat. 755; short title "Small Business Innovation and Economic
    Security Act"; enacted as S. 3971.
  - 'Sec. 9(a): section 9(m) date changed from "September 30, 2025" to "September 30, 2031"; section 9(n)(1)(A)
    (STTR) changed from "2025" to "2031".'
  - 'Sec. 9(b): an agency with funds remaining at the end of fiscal year 2026 from amounts required to be expended
    under subsection (f)(1) or (n)(1) may carry them into fiscal year 2027 for SBIR/STTR.'
  - 'Sec. 2: new paragraph in 9(g) (SBIR) and parallel text in 9(o) (STTR) requiring agencies to evaluate whether
    a small business concern "presents a security risk for any reason" using the subsection (vv) due diligence process,
    disclosures, and coordination with the intelligence community, Federal law enforcement and counterintelligence.'
  - 'Sec. 2: adds denial grounds (D), (E), (F) to the pre-existing foreign-risk paragraph: (D) a security risk connecting
    the concern to an entity or individual on eight named lists; (E) a security risk whose primary source is classified;
    (F) a security risk the agency determines warrants a denial.'
  - 'Sec. 2 named lists: UFLPA Entity List (DHS); Non-SDN Chinese Military-Industrial Complex Companies List (Treasury/OFAC);
    Section 889 prohibition list (FY2019 NDAA); list of Chinese military companies (FY2021 NDAA); Military End User
    List (Commerce/BIS); Entity List (Commerce/BIS); FCC list of equipment and services; CBP Withhold Release Orders
    and Findings List.'
  - 'Sec. 2: new paragraph (17) requires a process to notify a denied applicant of the determination and its basis
    "as appropriate pursuant to the discretion of the Federal agency and in a manner that does not compromise national
    security"; a denial does not bar eligibility in a later award cycle.'
  - 'Sec. 2(a)(3): subsection (vv)(2) due diligence expanded to cover cybersecurity practices, patent analysis,
    employee analysis, foreign ownership and financial ties, foreign affiliations of covered individuals/owners/key
    personnel, investment relationships, technology licensing or joint ventures, and business relationships in foreign
    countries of concern.'
  - 'Sec. 2(b): a GAO study requirement changed from "3 years" to "8 years".'
  - 'Sec. 3: "strategic breakthrough allocation" = an amount from the SBIR allocation under (f)(1) of "not more
    than 0.50 percent" of the extramural R/R&D budget, for agencies whose required SBIR expenditure exceeds "$100,000,000".'
  - 'Sec. 3: strategic breakthrough award = "not more than $30,000,000" to a small business concern including affiliates,
    in a single award or series of milestone-based awards; total period of performance "not more than 48 months".'
  - 'Sec. 3 eligibility: not less than 1 prior Phase II award; not less than 100 percent matching funds from new
    private capital and/or new funding from a government agency under a program other than SBIR/STTR Phase I or
    II; demonstrate a technology that is an effective solution, as determined by market research.'
  - 'Sec. 3 Department of Defense-only conditions: a commitment for inclusion in a program objective memorandum
    from an official at program acquisition executive rank or higher; meets high priority requirements or operational
    needs of a military department; not less than 20 percent of the required matching funds from new DoD funding
    outside SBIR/STTR Phase I/II.'
  - 'Sec. 3: agency must complete contract awards using the allocation not later than 90 days after receiving a
    proposal.'
  - 'Sec. 3: new paragraph (6) of subsection (aa) exempts strategic breakthrough awards from the award-size limit
    and the SBA waiver requirement in (aa).'
  - 'Sec. 3(c): each eligible agency must brief Congress within 60 days of enactment on whether it plans to use
    the authority. Sec. 3(d): the section and its amendments cease to have effect on September 30, 2031.'
  - 'Sec. 4: new subsection (aaa): each agency''s SBIR or STTR program director must set, equally for all small
    business concerns, a limit on the maximum number of proposals a concern may submit in response to Phase I and
    Phase II solicitations; the limit may be on a fiscal-year, per-solicitation, or per-topic basis. The statute
    does not fix a number.'
  - 'Sec. 4: waivers on a topic-by-topic basis for topics that are time-sensitive and urgent to the mission; approval/disapproval
    within 15 days; no more than 5 percent of an agency''s SBIR and STTR topics in any fiscal year; report to Congress
    within 30 days of setting or changing limits or granting waivers.'
  - 'Sec. 4 timing: limits to be established "not later than 90 days before the start of fiscal year 2027 and each
    fiscal year thereafter".'
  - 'Sec. 5: SBA to establish Phase III training for contracting officers and the agency acquisition workforce (Phase
    III awards, agreements, data rights, sole-source contracting).'
  - 'Sec. 6(a): Procurement Center Representatives directed to advocate for maximum practicable use and transition
    of SBIR/STTR technology to Phase III; SBA must modify the policy directives within 1 year of enactment.'
  - 'Sec. 6(b): agencies to develop simplified and standardized procedures and model contracts for Phase I, II and
    III and standardized solicitation provisions/clauses on information needed for Phase III eligibility.'
  - 'Sec. 7: technical and business assistance: "not more than $6,500 per project" (Phase I) and "not more than
    $50,000 per project" (Phase II); recipients select the provider or may use funds to hire/augment staff; adds
    cybersecurity assistance and screening for foreign involvement; I-Corps participation option.'
  - 'Sec. 8: SBIR.gov database and FPDS must flag Direct to Phase II, subsequent Phase II, strategic breakthrough,
    and Phase III prime/subcontract awards.'
  - 'Sec. 10(a): section 9(cc) (Phase flexibility / Direct to Phase II) changed from "During fiscal years 2012 through
    2025" to "Until September 30, 2031"; Department of Energy and NASA added alongside NIH, DoD and Department of
    Education; "or STTR program" added.'
  - 'Sec. 10(b)-(k): extends to 2031 the civilian Commercialization Readiness pilot (gg), accelerated awards (hh),
    Phase 0 pilot (jj), administrative funding (mm), increased minimum performance standards (qq), commercialization
    assistance pilots (uu), due diligence program (vv), STTR military research institution pilot (yy), budget calculation
    pilot (zz), and the SOCOM pilot. Sec. 10(l) repeals section 5142 of Pub. L. 112-81 (GAO mandate).'
  quotes:
  - not later than 90 days before the start of fiscal year 2027 and each fiscal year thereafter
  - receipt of an award decision denying an application does not prohibit the small business concern from being
    eligible for an award in a subsequent award cycle
  - not more than 0.50 percent of the extramural budget
