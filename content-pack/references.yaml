    3.2 percent" in fiscal year 2017 and each fiscal year thereafter.'
  - '(n)(1) STTR: agencies with an extramural budget "in excess of $1,000,000,000"; "0.45 percent" for fiscal year
    2016 and each fiscal year thereafter.'
  - '(m) in this edition: SBIR authorization terminates "September 30, 2025" (superseded by Pub. L. 119-83 Sec.
    9).'
  - '(cc) in this edition: NIH, DoD, Department of Education, "fiscal years 2012 through 2025" (superseded by Pub.
    L. 119-83 Sec. 10(a)).'
  - '(aa): no award may exceed the award guidelines "by more than 50 percent".'
  - '(dd): NIH, DOE, NSF "not more than 25 percent"; other agencies "not more than 15 percent" of SBIR funds to
    majority-VC/hedge/PE-owned concerns.'
