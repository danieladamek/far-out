  read: partial
  summary: 'The rewritten Part 19 that agencies follow by class deviation. Three subparts by workflow: 19.1 Presolicitation,
    19.2 Evaluation and Award, 19.3 Postaward. It keeps one Rule of Two for everything above the micro-purchase
    threshold, makes order set-asides discretionary, and restates sole-source caps and subcontracting-plan thresholds.'
  key_facts:
  - '19.104-1 Total small business set-asides: contracting officer must set aside above the micro-purchase threshold
    when two or more responsible small businesses are reasonably expected to offer at fair market prices, quality
    and delivery. Does not apply at or below the micro-purchase threshold.'
  - '19.104-2 Partial set-asides: discretionary ("may, at their discretion").'
  - '19.111-2: contracting officers "may set aside task orders or delivery orders" under multiple-award contracts.
    19.112 covers reserves.'
  - '19.104-1(f): nonmanufacturer rule; offeror may not exceed 500 employees (150 for IT value-added resellers);
    SBA may grant individual or class waivers.'
  - '19.102 Coordination: acquisition package to the SBA procurement center representative at least 30 days before
    solicitation for covered acquisitions; PCR has 15 days to recommend.'
  - 'Sole-source caps: HUBZone (19.105-3) $8.5 million manufacturing / $5.5 million other; SDVOSB (19.106-3) $8.5
    million / $5 million; WOSB/EDWOSB (19.107-3) $8.5 million / $5.5 million.'
  - '8(a) (19.108-7): competition required when two eligible participants are expected and value exceeds $8.5 million
    (manufacturing NAICS) or $5.5 million (other).'
  - '19.109: subcontracting plan required above $900,000 ($2 million for construction of a public facility). Reporting
    is through "Subcontracting Plan Reporting (SPR)" at SAM.gov (19.001).'
  - '19.103(b)(2)(ii): for solicitations issued after October 1, 2028 that result in multiple-award contracts, assign
    one NAICS code, or divide into portions each with its own NAICS code and size standard.'
  - '19.103(d)(1): NAICS appeal within 10 calendar days of the solicitation.'
  - '19.108-11(a): follow-on requirements stay in 8(a) unless SBA releases them or a mandatory source applies.'
  quotes:
  - the contracting officer must set the contract aside for small business if there is a reasonable expectation
    of obtaining offers
  - Contracting officers may set aside task orders or delivery orders
  - expected to exceed $900,000 ($2 million for construction of any public facility)
  role_here: support
  role_note: Sweep B id `rfo-part19-text` (A. The FAR overhaul (RFO)). Model deviation text, not codified FAR; numbering
    recorded in pending_changes (class-deviation).
