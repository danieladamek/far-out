  summary: 'SBA''s plain-language page on how size standards work. Standards vary by NAICS industry and are measured
    in employees or annual receipts; affiliates count. Links to the Size Standards Tool and the table. Slice B adds:
    Plain-language account of how size is measured and where protests and NAICS appeals go.'
  key_facts:
