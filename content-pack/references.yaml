  key: FR2026-8aFinal
  tier: seminal
  citation: Federal Register (SBA). Reforms to 13 CFR 124.103 To Remove SBA's 8(a) Program's Rebuttable Presumption
    of Social Disadvantage for Individually Owned Firms Only. Reforms Do Not Impact Entity-Owned Firms (91 FR 51568).
    2026-08-11. https://www.federalregister.gov/documents/2026/08/11/2026-16370/reforms-to-13-cfr-124103-to-remove-sbas-8a-programs-rebuttable-presumption-of-social-disadvantage
  url: https://www.federalregister.gov/documents/2026/08/11/2026-16370/reforms-to-13-cfr-124103-to-remove-sbas-8a-programs-rebuttable-presumption-of-social-disadvantage
  year: 2026
  published: '2026-08-11'
  accessed: '2026-10-03'
  publisher: Federal Register (SBA)
  source_kind: primary
  read: full
  summary: 'FINAL RULE, effective September 10, 2026. Removes the rebuttable presumption for individually owned
    applicants and adopts the new test. Applies to all applications pending on the effective date; does not touch
    entity-owned firms. Recites the Ultima decision and the DOJ letter. Slice B adds: Final rule ending the rebuttable
    presumption of social disadvantage for individually owned 8(a) firms. Entity-owned firms are not affected. The
    proposed rule was dated June 11, 2026.'
  key_facts:
  - 91 FR 51568; RIN 3245-AI75; docket SBA-2026-0133; effective September 10, 2026.
  - 114 comments received on the proposal.
  - About 4,190 applicants a year affected (FY25 data).
  - 'Ultima Servs. Corp. v. U.S. Dep''t of Agric., 683 F. Supp. 3d 745 (E.D. Tenn. 2023): presumption violated equal
    protection; SBA enjoined from using it.'
  - 'DOJ letter to the Speaker of the House, November 25, 2025: presumption unconstitutional, will not be defended.'
  - 'Social disadvantage is a one-time determination: individuals already found disadvantaged need not re-establish
    it.'
  - 'Changes from proposal: sex discrimination (Equal Credit Opportunity Act of 1974) and disability (ADA 1990)
    examples; other adequate evidence allowed where entity-specific evidence is not readily available; specific
    Congressional findings accepted.'
  - Final rule; RIN 3245-AI75; published August 11, 2026; effective September 10, 2026.
  - Proposed June 11, 2026.
  - Applicants must show group discrimination and personal material harm.
  quotes:
  - This rule is effective on September 10, 2026. It applies to all pending applications of individually-owned applicants
    as of that date.
  - SBA has not recognized the rebuttable presumption in processing 8(a) applications for the past three years due
    to the Court Order in Ultima.
  - It does not in any way amend or affect the eligibility of entity-owned small businesses.
  - The rule applies only to the 8(a) BD eligibility of small businesses owned and controlled by individuals.
  role_here: support
  role_note: 'Sweep A id `fr-2026-8a-final` (8(a) Business Development). Same URL also swept in slice B as `fr-2026-16370`;
    key_facts and quotes merged here (B gave title: Reforms to 13 CFR 124.103 To Remove SBA''s 8(a) Program''s Rebuttable
    Presumption of Social Disadvantage for Individually Owned Firms Only (final rule); published: 2026-08-11 (91
    FR 51568); effective 2026-09-10; read: full; kind: primary). Read depth differs between slices (A: partial;
    B: full); the fuller is recorded.'
  cited_in: []
  verified: true
  recheck: true
