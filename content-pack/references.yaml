  source_kind: primary
  read: full
  summary: 'Sets the minimum time between a synopsis and a solicitation and the minimum response times. Commercial
    buys may use shorter periods or a combined synopsis/solicitation.

    '
  key_facts:
  - Notice must be published at least 15 days before issuance of a solicitation, with exceptions for commercial
    products and services.
  - At least 30 days response time for actions exceeding the simplified acquisition threshold (non-commercial).
  - At least 45 days response time for research and development actions expected to exceed the simplified acquisition
    threshold.
  - For commercial acquisitions and actions over $25,000 but under the SAT, the contracting officer sets a reasonable
    response time.
  - 'WTO GPA / FTA acquisitions: at least 40 days between synopsis and offer receipt, reducible to 10 days if covered
    by a published annual forecast.'
  quotes:
  - notice must be published at least 15 days before issuance of a solicitation
  - allow at least a 30-day response time for receipt of bids or proposals
  - allow at least a 45-day response time for receipt of bids or proposals
