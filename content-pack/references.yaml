  summary: 'The previous reauthorization. It created the due diligence program, the foreign-relationship disclosures,
    the denial rule for certain foreign ties, the repayment (recovery) authority, and the increased minimum performance
    standards for the heaviest multiple-award winners.

    '
  key_facts:
  - Approved September 30, 2022; extended the programs through September 30, 2025.
  - Agencies must establish a due diligence program to assess security risks; up to 2% of SBIR funds may cover its
    cost.
  - Required disclosures cover talent programs, JVs/subsidiaries in countries of concern, obligations to foreign
    state-owned enterprises, foreign ownership, VC investors, technology licensing in the preceding 5 years, related
    foreign entities.
  - 'Recovery authority: awardee must repay all amounts received if a material misstatement or a change in ownership/structure
    poses a national security risk.'
  - 'Increased standards effective April 1, 2023: more than 50 Phase I awards in 5 years; more than 50 Phase II
    awards ($250,000 average) and more than 100 ($450,000 average) over 10 years excluding the last 2; failing firms
    limited to 20 awards per agency for a year; originally sunset September 30, 2025 (extended by pl-119-83 Sec.
    10(f)).'
