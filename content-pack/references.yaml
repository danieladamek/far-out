  summary: The lead proposed rule of phase two. It describes the two phases, says twelve proposed rules will cover
    the whole FAR, and proposes a sunset mechanism for FAR 1.109 that works by review and rulemaking, not automatic
    expiry. It also rewrites Part 33 on protests.
  key_facts:
  - Proposed rule; FAR Case 2026-001; Docket FAR-2026-0001; RIN 9000-AO86; comments due July 23, 2026.
  - 'Phase one: model class deviations for each part. Phase two: formal rulemaking.'
  - Twelve proposed rules in total.
  - 'Sunset (preamble): a process to review non-statutory sections, provisions and clauses; future proposed rules
    at "regular timed increments" will ask the public what should sunset; the FAR Council may state through rulemaking
    an intent not to enforce a clause after a date (cites FAR 1.109(b)).'
  - 'Part 33: contracting officers report agency protests to the head of the contracting activity; protesters may
    ask for independent review above the contracting officer; redacted technical evaluation and source-selection
    documents may be disclosed; GAO procedure text replaced by a pointer to 4 CFR part 21.'
  quotes:
  - The FAR Council is issuing twelve proposed rules that collectively will streamline the FAR in its entirety.
  - Sections, provisions and clauses do not expire until removed from the Code of Federal Regulations through rulemaking
  role_here: support
  role_note: Sweep B id `fr-2026-12559` (A. The FAR overhaul (RFO)).
