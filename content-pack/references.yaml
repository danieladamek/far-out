  key: PD2023
  tier: seminal
  citation: U.S. Small Business Administration, Office of Investment and Innovation (hosted on SBIR.gov). Small
    Business Innovation Research (SBIR) and Small Business Technology Transfer (STTR) Program Policy Directive (effective
    May 3, 2023). 2023-05-03. https://www.sbir.gov/sites/default/files/documents/SBA%20SBIR_STTR_POLICY_DIRECTIVE_May2023.pdf
  url: https://www.sbir.gov/sites/default/files/documents/SBA%20SBIR_STTR_POLICY_DIRECTIVE_May2023.pdf
  year: 2023
  published: '2023-05-03'
  date_note: (effective date)
  accessed: '2026-10-03'
  publisher: U.S. Small Business Administration, Office of Investment and Innovation (hosted on SBIR.gov)
  source_kind: primary
  read: partial
  summary: 'The governing SBA Policy Directive and still the version posted on SBIR.gov. It defines the three phases,
    base award guideline amounts, the 50 percent overage rule and SBA waiver, eligibility and work-share rules,
    data rights, certifications and benchmarks. It pre-dates the 2026 Act and still carries pre-2026 termination
    dates.

    '
  key_facts:
  - Effective May 3, 2023.
  - 'Phase I (§4(a)): feasibility-related experimental or theoretical R/R&D; normally not more than 6 months (SBIR)
    or 1 year (STTR); base guideline $150,000 including modifications.'
  - 'Phase II (§4(b)): continues the Phase I effort; normally not more than 2 years; base guideline $1,000,000 including
    modifications.'
  - 'Phase III (§4(c)): work that derives from, extends, or completes prior SBIR/STTR work, funded by non-SBIR/STTR
    sources; no limit on number, duration, type or dollar value (§4(c)(5)); size limits do not apply (§4(c)(6));
    no further competition required (§4(c)(3)); agencies must make a good-faith effort to award to the original
    awardee and document the file/notify SBA if not (§4(c)(7)).'
  - '§7(i)(1): agencies may exceed the guideline amounts by no more than 50%; §7(i)(2): SBA reviews the amounts
    annually for inflation and posts adjustments on SBIR.gov; §7(i)(4): waiver to exceed by more than 50%, requested
    before solicitation release, decided within 10 business days, effective for one fiscal year.'
  - '§4(b)(5): one additional, sequential Phase II award to continue the work of an initial Phase II.'
  - '§4(b)(1)(ii) Direct to Phase II: NIH, DoD and Department of Education, SBIR only, with a written determination
    of demonstrated feasibility; text says the pilot terminates September 30, 2022 unless extended (out of date;
    see pl-119-83 Sec. 10(a)).'
  - §4(b)(1)(i) cross-program (STTR Phase I to SBIR Phase II and vice versa); §4(b)(7) cross-agency Phase II with
    written determinations.
  - '§6: size/ownership per 13 CFR 121.702; PI primary employment (more than one-half of time) with the SBC, or
    with the research institution for STTR only, at award and during the project.'
  - 'STTR: not less than 40 percent of R/R&D by the SBC and not less than 30 percent by the partnering research
    institution.'
  - 'SBIR: awardee performs a minimum of two-thirds of the research/analytical effort in Phase I and one-half in
    Phase II.'
  - R/R&D must be performed in the United States, with written-approval exceptions.
  - 'Majority-VC/hedge/PE-owned (SBIR only): NIH, DOE, NSF up to 25% of SBIR funds; other agencies up to 15%.'
  - Registration in SBA's Company Registry at SBIR.gov required; information updated no more than 6 months before
    proposal submission.
  - '§8(b)(4): SBIR/STTR Protection Period begins at award and ends twenty years (or longer at agency discretion)
    from award. After expiry: Government purpose rights (DOE: unlimited rights). Data must be marked (§8(b)(5)).'
  - '§6(a)(7): awardees failing the Phase II Transition Rate or Commercialization Rate benchmark are not eligible
    to submit a new Phase I (or Direct to Phase II) proposal for one year; thresholds are posted on SBIR.gov.'
  - The directive text still says the programs are authorized "until September 30, 2022, or as otherwise provided
    in law".
  quotes:
  - Not less than 40 percent of the R/R&D work must be performed by the SBC, and not less than 30 percent of the
    R/R&D work must be performed by a partnering Research Institution.
  - There is no limit on the number, duration, type, or dollar value of Phase III awards made to a business concern
  - A Phase II Awardee may receive one additional, sequential Phase II award to continue the work of an initial
    Phase II award
