  summary: 'Three appendices: solicitation instructions including the certification forms, reporting requirements,
    and the foreign-affiliation disclosure template. This is where the existing "covered foreign" disclosure questions
    and the lifecycle certification timing are written out.

    '
  key_facts:
  - 'Certifications at award, then: Phase I at the time of final payment or disbursement; Phase II prior to receiving
    more than 50% of the total award amount and prior to final payment or disbursement.'
  - 'Stated consequences of misrepresentation: 18 U.S.C. 1001 fines/imprisonment; False Claims Act treble damages
    and civil penalties; Program Fraud Civil Remedies Act double damages; recovery of award funds; suspension/debarment;
    termination.'
  - 'Appendix III definitions: covered individual; foreign affiliation; foreign country of concern = People''s Republic
    of China, North Korea, Russia, Iran, or any other country designated by the Secretary of State; malign foreign
    talent recruitment program as defined in 42 U.S.C. 19237.'
  - Appendix III has eight disclosure questions (talent-program participation; parent/JV/subsidiary in a country
    of concern; obligations to foreign state-owned entities; wholly foreign-owned; VC/institutional investors and
    their affiliations; technology licensing or IP transfer to a country of concern in the previous 5 years; related
    foreign entities; affiliations with research institutions in countries of concern).
  quotes:
