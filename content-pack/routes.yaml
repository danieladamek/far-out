    for manufacturing and $5 million for a requirement within any other NAICS code, options included [591]'
  - The firm must be designated in SAM as SBA-certified, or have represented SDVOSB status in SAM and applied to
    SBA on or before December 31, 2023 [591]
  - 'SDVOSB set-aside (13 CFR 128.404): a reasonable expectation of two responsible SDVOSB offers at fair market
    price [586]'
  - 'VA priority (VAAR 819.7005): SDVOSB, then VOSB, then 8(a)/HUBZone, then other small-business set-asides [592]'
  - 'VA set-aside (VAAR 819.7006/819.7007): when two or more certified SDVOSBs (or VOSBs) are expected at a fair
    and reasonable price [592]'
  - 'VA sole source (VAAR 819.7008/819.7009): where the anticipated award price including options will not exceed
