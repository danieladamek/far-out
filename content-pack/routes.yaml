- id: dod-mentor-protege-program
  name: DoD Mentor-Protégé Program
  family: partnering
  governing_text: 10 U.S.C. 4902; DFARS subpart 219.71; DFARS Appendix I; DFARS 252.219-7003(c); exempt from SBA
    approval under 13 CFR 125.10(c)
  what: The DoD Mentor-Protégé Program is established by 10 U.S.C. 4902 and implemented by DFARS subpart 219.71
    and Appendix I [1122] [1124]. A mentor is reimbursed for developmental assistance to a protégé, capped at $1,000,000
    per protégé per fiscal year unless unusual circumstances are found, or takes credit toward its subcontracting
    goals at four, three or two times the cost [1122]. Section 856 of Pub. L. 117-263 (December 23, 2022) made the
    program permanent and cut the mentor threshold from $100 million to $25 million [1122].
  who_for: 'Protégé: a small firm in one of the statute''s eight categories. Mentor: a DoD contractor with $25,000,000
    in prior-year DoD contracts or otherwise approved, typically a prime with an active subcontracting plan.'
  benefits:
  - 'Protégé: personnel help in management, engineering and technical matters; noncompetitive subcontracts; progress
    and advance payments; loans; assistance obtained from SBDCs, procurement technical assistance entities, HBCUs
    and minority institutions, and women''s business centers (10 U.S.C. 4902(f)) [1122]'
  - 'Mentor: reimbursement through a separately priced contract line item or separate contract, or credit at four
    times (third-party assistance), three times (mentor employees) and two times (other costs) (10 U.S.C. 4902(g);
    Appendix I-103, I-110) [1122] [1123]; mentor firms may count awards to protégés toward small disadvantaged business
    goals (DFARS 252.219-7003(c)) [1036]'
  - DoD says it has supported more than 190 small businesses over the past five years [1128]
  requirements:
  - 'Mentor: $25,000,000 in DoD contracts in the fiscal year before the agreement, or otherwise approved; no agreement
    if SBA finds the firms affiliated (10 U.S.C. 4902(d)) [1122]. Appendix I-102(a): eligible for federal contracts,
    in good financial health and character, not debarred, other than small unless approved, showing capability by
    $25 million in prior-year DoD contracts or subcontracts, an active subcontracting plan as a DoD prime, 8(a)
    graduate status, or Director approval [1123]'
  - DoD's how-to page and the Air Force page say the mentor must be performing under at least one active approved
    subcontracting plan [1127] [1131]
  - 'Protégé categories in the statute: socially and economically disadvantaged; Indian tribe-owned; Native Hawaiian
    Organization-owned; qualified organization employing the severely disabled; women-owned; service-disabled veteran-owned;
    HUBZone; nontraditional defense contractor or supplier of critical goods or services [1122]. Appendix I-102(b):
    small, not above the SBA size standard for its primary NAICS code, and not owned or managed by holders of stock
    options or convertible securities in the mentor [1123]'
  - '"A protege firm may not be a party to more than one DoD mentor-protege agreement at a time." [1123]; protégé
    authority runs for 5 years from its first agreement (10 U.S.C. 4902(c)) [1122]'
  - 'Term: not more than three years, up to five if the Secretary finds unusual circumstances (10 U.S.C. 4902(e))
    [1122]; DFARS Case 2023-D011 set an initial three years extendable by up to two more with OSBP Director approval
    [1125]'
  - The mentor alone selects the protégé (Appendix I-104) and cannot require a protégé agreement as a condition
    of a subcontract (I-106) [1123]
  - 'Reporting (Appendix I-112): mentors semiannually for periods ending March 31 and September 30, due 30 days
    after; protégés annually by October 31 during the agreement and for 2 fiscal years after [1123]'
  how_it_works:
  - 'Who approves: the Mentor-Protégé Program Director in OSD''s Office of Small Business Programs approves mentors;
    component OSBP directors approve agreements; DCMA conducts annual performance reviews (DFARS 219.7103-1, 219.7106)
    [1124]'
  - DoD's program is exempt from the SBA approval that other agencies' mentor-protégé programs need (13 CFR 125.10(c))
    [1113]
  - 'Two tracks: direct-reimbursed agreements go to the defense agency OSBP and start when funds are obligated;
    credit agreements go to DCMA and start on approval [1127]'
  - The mentor submits its prior approval, the signed agreement, the credit-or-reimbursement election, the estimated
    annual cost and a justification for reimbursable costs above $1 million a year; approval is needed before costs
    are incurred (Appendix I-108); incidental expenses may run to 10 percent of total estimated cost (I-109) [1123];
    no reimbursement above $1 million in a fiscal year per protégé without a written determination (DFARS 219.7103-2)
    [1124]
  - 'Component routes: Army uses a white paper with a program manager''s endorsement, then an invitation-only RFP,
    and offers reimbursable, credit and hybrid agreements [1130]; Air Force runs a Broad Agency Announcement in
    which only mentors submit a white paper and then a three-volume proposal [1131]; DTRA takes white papers at
    any time under Notice ID HDTRA124S0001 [1133]; DLA''s OSBP does not pair mentors and protégés [1132]; NGA reports
    14 active agreements and a plan to reach 20 during FY2025-FY2026 [1134]'
  - 'Size of the program: DoD''s paperwork notice counts 96 respondents and 180 annual responses [1126]'
  - 'Nunn-Perry Awards for outstanding mentor-protégé teams were announced April 9, 2026: five teams for FY2024
    and three for FY2025 [1129]'
  steps:
  - 'Find a counterpart: "Mentors and Protégés are solely responsible for finding their counterpart" [1127]'
  - Choose direct-reimbursed or credit [1127]
  - Develop the agreement from a needs assessment [1127]
  - 'Submit: reimbursed agreements to the defense agency OSBP, credit agreements to DCMA [1127]'
  - 'Start: credit agreements on approval, reimbursed agreements when funds are obligated [1127]'
  - Report semiannually, with annual DCMA reviews and protégé reports for two years after [1127]
  - Questions to dodmpp@osd.mil or 571-372-6191 [1127] [1128]
