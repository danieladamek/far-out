- id: nih-other-transaction
  name: NIH other transaction (42 U.S.C. 282(n))
  family: ot-cso
  governing_text: 42 U.S.C. 282(n) (PHS Act section 402(n)); PHS Act section 421(b)(3) (NHLBI) and section 480(e)(3)(C)
    (NCATS); NIH "Other Transactions" (OT) Policy Guide (May 22, 2017)
  what: 'The NIH Director may approve requests by institutes and centers "to engage in transactions other than a
    contract, grant, or cooperative agreement" for projects that carry out the Precision Medicine Initiative; Common
    Fund research, limited to 50 percent of Common Fund amounts available for that purpose in a fiscal year; or
    high impact cutting-edge research or research urgently required to respond to a public health threat [1097].
    NIH describes an OT as "a unique type of legal instrument other than a contract, grant, or cooperative agreement"
    [1098].

    '
  who_for: NIH says OTs are used to reach nontraditional recipients such as patient advocacy organizations, pharmaceutical
    companies and foreign entities [1098]. Its 2017 policy guide names small businesses, patient advocacy organizations,
    educational institutions, pharmaceutical companies, foreign entities, consortia, nonprofits and individuals
    as possible partners [1099].
  how_it_works:
  - 'Authorities NIH names: PHS Act section 402(n) (NIH Director); section 421(b)(3) (NHLBI); section 480(e)(3)(C)
    (NCATS, capped at 20 percent of annual appropriations) [1098]'
  - Applications go through eRA ASSIST under each opportunity announcement [1098]
  - 'IP: "Flexibility in the negotiation of IP rights is one of the rationales for using an OT."; Agreements Officers
    can negotiate IP terms that differ from other funding instruments [1099]'
  - The policy guide's Appendix 1 lists authorities and Appendix 2 lists laws that may not apply, including CICA
    and the Contract Disputes Act [1099]
  - 'Fiscal law applies: GAO found that NHLBI "violated the recording statute when it recorded obligations for three
    Other Transaction Agreements (OTAs) at the time it issued the respective Notices of Award", and did not violate
    the bona fide needs statute (B-333150, April 8, 2024) [1077]'
