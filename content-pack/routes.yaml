- id: finding-subcontract-work
  name: Finding subcontract work (SubNet, prime directories, LYNX, Commercial Market Representatives)
  family: partnering
  governing_text: No regulation governs the directories (SBA, GSA and agency services). 13 CFR 125.3(e) for Commercial
    Market Representatives; FAR subpart 4.14 and clause 52.204-10 for the public first-tier subcontract records.
  what: SubNet is SBA's "database of subcontracting opportunities posted by large contractors looking for small
    businesses to serve as subcontractors" [1055]. SBA also publishes a directory of prime contractors that hold
    contracts with subcontracting plans, and agency small business offices publish their own prime directories [1050]
    [1048]. SBA's Commercial Market Representatives "ensure small businesses get their fair share of opportunities
    as subcontractors" [1051].
  who_for: Small firms building a target list of primes by NAICS code, agency or place, or looking for posted subcontract
    solicitations.
  benefits:
  - SubNet lists description, closing date, performance start date, place of performance, NAICS code and point of
    contact, filtered by state or keyword [1049]
  - SBA's prime directory gives vendor name, location, contracting agency, product/service code, NAICS, contract
    number, performance dates and total contract value [1050]
  - 'Agency directories name each prime''s small business liaison: DOT''s lists company, address, liaison name and
    phone and the work available for subcontracting [1060]; USDA''s gives liaison contact, major products and services,
    subcontracting opportunities, contract number and dollar amount [1062]'
  - Published first-tier subcontract records show the prime contract number, subcontractor name and UEI, amount,
    date, description and place of performance [1045]
  requirements:
  - 'SubNet: questions go to the posted point of contact for the opportunity, not SBA [1049]'
  - 'SAM.gov subcontract reports: non-federal users sign in to search [1044]; the public API needs an API key, and
    non-federal users without an entity role get 10 requests a day [1045]'
  how_it_works:
  - 'SubNet, status on October 3, 2026: live with current listings (10 per page, at least 9 pages; first-page closing
    dates October 12 to November 17, 2026) on legacy.sba.gov, to which https://www.sba.gov/subnet and the old subnet.sba.gov
    address redirect; no retirement or replacement notice was found [1049]. It lets large businesses with federal
    contracts and subcontracting plans "post current subcontracting opportunities for small businesses" [1056];
    large firms that want to post are told to email subcontracting@sba.gov [1048] [1049]'
  - 'SBA Directory of Federal Government Prime Contractors with Subcontracting Plans: a spreadsheet on legacy.sba.gov;
    the newest file is FY 2024 (page updated March 4, 2025), FY 2018 to FY 2023 are also posted, information is
    removed after five years, and no FY 2025 file was posted as of October 3, 2026 [1050]'
  - 'GSA Subcontracting Directory: it "Lists other than small business prime contractors who have been awarded contracts
    with us" [1057]; the file is downloadable from data.gov, declared quarterly, with the newest file named "SubK
    Directory as of 03132025 Filtered.xlsx" [1059]; the small firm then contacts the prime directly [1058]'
  - 'LYNX: SBA''s page links https://www.lynxconnect.io/ and describes it as a "Department of War" market-research
    platform [1048]; the LYNX site itself was not fetched'
  - 'Agency directories: DOT''s FY 2026 directory of primes with approved plans [1060] and its Procurement Assistance
    Division at (202) 366-1930 or (800) 532-1169 [1061]; USDA''s 2026 directory of roughly 22 primes [1062]; NASA''s
    prime-contractor pages (BAE Systems, Blue Origin, JPL, KBR on the fetch date) [1063]; DOE, where approximately
    80% of the annual procurement base goes to management and operating contracts and a Small Business Program Manager
    directory lists DOE and M&O contacts [1064]; VA''s Prime Contractor Directory, of which the one referenced is
    fiscal year 2020 [1065]'
  - Commercial Market Representatives match contractors with small firms, counsel, and run Subcontracting Orientation
    and Assistance Reviews and compliance reviews (13 CFR 125.3(e)) [1021] [1054]. The public contact route is subcontracting@sba.gov;
    the page gives no individual names or phone numbers [1051]. The only by-area CMR list found is a Word file from
    April 2020 [1052]; the current Procurement Center Representative directory shows SBA's six government-contracting
    areas (Area 3 Southeast includes Alabama) [1053]
  - 'Other tools SBA and DoD offices name: SBA''s Small Business Search (formerly Dynamic Small Business Search)
    at https://search.certifications.sba.gov/ and APEX Accelerators (formerly PTACs) [1055] [1051] [1066]'
  - 'Who subcontracts to whom: USAspending shows subawards through the subaward toggle in Advanced Search, award
    profile pages and the Custom Award Data download [1046]; SAM.gov has a public subcontract API [1043] [1045].
    USAspending warns that "Duplication of subaward records is common" and that records are sometimes late, incomplete
    or inconsistent [1046]; data submitted one day is available to USAspending the next day and published the day
    after [1047]'
  - 'Where subcontract dollars go by industry: GSA''s fiscal year 2025 report under Small Business Act section 15(h)(3)(A)(ii)
    lists subcontract dollars by NAICS code for 300+ codes [1078]'
  steps:
  - Open SubNet, filter by state or keyword, and contact the point of contact listed on the opportunity [1049]
  - Download SBA's FY 2024 prime directory and filter by NAICS code and contracting agency [1050]
  - Download the GSA Subcontracting Directory file from data.gov and contact the prime directly [1059] [1058]
  - For one agency's supply chain, open that agency's directory and call the listed small business liaison [1060]
    [1062]
  - Look up a prime's existing first-tier subcontracts in USAspending or through the SAM.gov public subcontract
    API [1046] [1045]
  - Email subcontracting@sba.gov for subcontracting assistance from a Commercial Market Representative [1051]
