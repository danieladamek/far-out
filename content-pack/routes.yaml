- id: commercial-product-or-service-buy
  name: Commercial product or commercial service buy
  family: setaside-vehicle
  governing_text: FAR 12.101; FAR 13.500; FAR 13.003(c)
  what: Agencies are to acquire commercial products, commercial services or nondevelopmental items when they are
    available to meet the agency's needs (FAR 12.101) [665]. For commercial buys, simplified procedures may be used
    above the simplified acquisition threshold up to $9 million (FAR 13.500) [662].
  who_for: Firms selling products or services that are also sold commercially.
  how_it_works:
  - 'FAR 12.101 puts three duties on the agency: market research; acquiring commercial or nondevelopmental items
    when available; and requiring primes and subcontractors to use them [665]'
  - 'Codified FAR 13.500: simplified procedures in amounts greater than the simplified acquisition threshold ($350,000)
    but not exceeding $9 million, or $15 million for acquisitions described in 13.500(c) (contingency, cyber/CBRN
    defense, international disaster assistance, emergency or major disaster), including options [662] [661] [640]'
  - The $9,000,000 ceiling rose from $7,500,000 on October 1, 2025 [640]
