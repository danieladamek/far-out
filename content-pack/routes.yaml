- id: hubzone-sole-source-and-price-preference
  name: HUBZone sole source and price evaluation preference
  family: setaside-vehicle
  governing_text: FAR 19.1306; FAR 19.1307; 13 CFR 126.612 and 126.613
  what: 'A contracting officer can award to an SBA-certified HUBZone firm without competition below a dollar cap
    when offers would not be received from two or more HUBZone firms (FAR 19.1306) [572]. In full and open competition,
    HUBZone offers get a price evaluation preference: a factor of 10 percent is added to other offers (FAR 19.1307)
    [656].'
  who_for: 'SBA-certified HUBZone firms (certifications.yaml: hubzone).'
  how_it_works:
  - 'Sole source, codified FAR 19.1306: up to $8.5 million for manufacturing NAICS codes and $5.5 million for all
    other, options included, only when two HUBZone offers are not expected and the requirement is not currently
    in 8(a) [572]'
  - 13 CFR 126.612 as displayed prints $7,000,000 (manufacturing) / $4,500,000 (all other) [570]
  - 'Price evaluation preference, codified FAR 19.1307: a factor of 10 percent is added to all offers except those
    of HUBZone firms and other small businesses; not used where price is not a selection factor, where all fair
    and reasonable offers are accepted, or for the reserved portion of a multiple-award solicitation; the HUBZone
    firm may waive it [656] [572]'
  - '13 CFR 126.613: the HUBZone price is deemed lower if it is not more than 10% above the large-business low offer;
    not applied where the low offeror is a small business [570]'
  - HUBZone eligibility is tested on the date of the initial offer including price, not on the award date, except
    for sole source [569]
  - On a sole-source award only SBA or the contracting officer may protest HUBZone status [685]
