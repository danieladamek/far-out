- id: federal-technology-licensing
  name: Federal technology licensing (patent license from a federal lab)
  family: partnering
  governing_text: 35 U.S.C. 209; 37 CFR Part 404
  what: '"Federally owned inventions shall be made available for licensing as deemed appropriate in the public interest"
    [1013]. NIST says "Both non-exclusive and exclusive licenses are available" [998].'
  who_for: An applicant must submit a plan for development or marketing [1014]. "First preference for the granting
    of any exclusive or partially exclusive licenses shall be given to small business firms" [1014]; the regulation
    gives first preference to small business firms of equal capability [1013].
  how_it_works:
  - 'Application (37 CFR 404.8): the invention, the applicant, the business, a development plan, investment, and
    geographic scope [1013]; the plan for development or marketing is required and treated as confidential [1014]'
  - 'U.S. manufacture: normally only to a licensee agreeing to manufacture substantially in the United States [1014]
    [1013]'
  - 'Exclusive and partially exclusive licenses: public notice at least 15 days before the license is granted [1014];
    notice of a prospective exclusive license and a public response period (37 CFR 404.7) [1013]'
  - 'After grant: the Government keeps a right to practice; periodic utilization reports; termination for failure
    to achieve practical application [1014]; appeal to the agency head or designee (37 CFR 404.11) [1013]'
  - 'Fees at ARL are negotiable: "an upfront execution fee, an annual minimum royalty, and a running royalty percentage
    of sales and other fees as appropriate"; the licensee reports progress annually [1000]'
  - 'Timeline, one division''s figures: about 3-4 months after receipt of the application, including a 2-month publication
    period for exclusive licenses [1003]'
  - NSWC Carderock, with over 200 active patents, asks for a commercialization plan with technical goals, an investment
