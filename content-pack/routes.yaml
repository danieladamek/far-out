- id: sba-mentor-protege-program
  name: SBA Mentor-Protégé Program
  family: partnering
  governing_text: 15 U.S.C. 657r; 13 CFR 125.9; 13 CFR 124.520 (8(a) Participants); 13 CFR 121.103(b)(6) (affiliation
    exception); 13 CFR 125.10 (other agencies' programs)
  what: Under SBA's Mentor-Protégé Program a for-profit mentor of any size assists a small protégé under a written
    agreement that SBA approves (15 U.S.C. 657r; 13 CFR 125.9) [787] [785]. "A joint venture between a protégé and
    its mentor will qualify as a small business for any procurement for which the protégé individually qualifies
    as small." (13 CFR 125.9(d)(1)) [785]. The 8(a) and All Small mentor-protégé programs were merged into this
    single program on November 16, 2020 [782] [791].
  who_for: 'Protégé: a firm that is small in its primary NAICS code, or in a secondary code where it has experience,
    and has already found a mentor. Mentor: a for-profit firm of any size.'
  benefits:
  - A joint venture with the mentor counts as small wherever the protégé alone is small (13 CFR 125.9(d)(1)) [785]
  - No affiliation or control is found solely on the basis of the agreement or the assistance given under it (13
    CFR 125.9(d)(4); 121.103(b)(6)) [785] [770]
  - The mentor may own up to 40% of the protégé (13 CFR 125.9(d)(2)) [785]
  - The protégé has a right of first refusal on the mentor's interest in the joint venture [785]
  - 'Assistance areas: management and technical; financial; contracting; international trade; business development;
    general and administrative [791]'
  - An 8(a) Participant may take part like any other small business; its joint venture with the mentor on 8(a) contracts
    must meet 13 CFR 124.513(c) and (d) [775]
  requirements:
  - 'Mentor: a for-profit concern of any size with good character and a favourable financial position, not debarred
    or suspended (13 CFR 125.9(b)) [785]; SBA''s page says for-profit or agricultural cooperative [788]'
  - 'Mentor''s limit: generally no more than three protégés at one time, counting parent and subsidiaries in aggregate;
    the first two relationships with Puerto Rico-based small businesses do not count (13 CFR 125.9(b)(3)) [785]'
  - 'Protégé: small for its primary NAICS code, or a secondary code in which it has prior experience (13 CFR 125.9(c)(1))
    [785]; SBA''s page adds for-profit or agricultural cooperative, with a proposed mentor before applying [788]'
  - 'Protégé''s limits: generally one mentor at a time, with a second only where SBA approves it as not competing
    or conflicting (13 CFR 125.9(c)(2)); generally two mentor-protégé agreements with different mentors in total,
    and no more than 12 years in total as a protégé (13 CFR 125.9(c)(4)) [785]'
  - 'Agreement: written, with a needs assessment, the assistance and a timeline, and a single point of contact;
    the mentor commits for at least one year; either party may terminate on 30 days'' notice; "The term of a mentor-protégé
    agreement may not exceed six years."; SBA must approve changes (13 CFR 125.9(e)) [785]'
  how_it_works:
  - 'Application: through certify.sba.gov; MySBA Certifications handles contracting certifications but mentor-protégé
    applications stay on certify.sba.gov [788] [790]'
  - 'Processing: "15 days screening plus 90 days processing (if your application is not withdrawn), totaling 105
    days." [788]'
  - If SBA declines the agreement, the firm may not reapply with the same mentor for 60 calendar days (13 CFR 125.9(f))
    [785]
  - 'Annual reporting: within 30 days of each anniversary the protégé reports assistance received, loans and equity,
    subcontracts, joint venture contracts and a narrative, and certifies any change in terms; SBA may decline continuation
    where assistance was not provided or yielded no material benefit (13 CFR 125.9(g)) [785]'
  - A mentor found not to have provided the assistance has 30 days to respond; SBA then terminates the agreement,
    bars the firm as a mentor for two years, may recommend stop-work orders on joint venture contracts and may treat
    it as grounds for debarment (13 CFR 125.9(h)) [785]
  - SBA publishes the list of active agreements as an Excel file (effective July 7, 2026); the page states no count
    [793]
  - 'Other agencies'' programs need SBA approval; DoD''s program and SBIR/STTR mentoring are exempt (15 U.S.C. 657r(b);
    13 CFR 125.10) [787] [786]. GAO counted 13 agency programs in 2011 [826]. Programs with a live page have their
    own records here: NASA, DOE, DOT, Treasury and FAA'
  - 'GSA: no separate program; GSAR subpart 519.70 and clauses 552.219-75 and 552.219-76 were removed effective
    April 3, 2019 and firms use SBA''s program [815]'
  - 'VA: no separate codified program; VAAR subpart 819.71 displays as "[Reserved]" [823] and VA''s September 2019
    brief refers firms to SBA-approved relationships under 13 CFR 125.9 [824]'
  - 'DHS: status conflicting; the page body says OSDBU will not accept new applications from March 1, 2023 until
    further notice, while the page''s search-result title says the program relaunched and a May 2025 program guide
    exists but could not be read [811]'
  - 'State and HHS: codified only (DOSAR 619.202-70; HHSAR 352.219-70 and 319.270-1); no live program page was read
    for either [818] [821]. EPA: no formal program page; its Office of Small Business Programs suggests partners
    for "mentor/protege relationships" [825]'
  steps:
  - 'Find a mentor first: "Have a proposed mentor prior to applying for the program" [790]'
  - Register both firms in SAM.gov; the protégé's UEI is needed [788]
  - Both firms complete SBA's online tutorial at learn.sba.gov/sba-mpp and keep the training certificates [788]
    [790]
  - Write and sign the Mentor-Protégé Agreement; SBA posts a template (the page is on legacy.sba.gov) [792]
  - Apply at certify.sba.gov, uploading the signed agreement, both training certificates, copies of any active SBA
    or other-agency mentor-protégé agreements, an SBA size redetermination letter if applicable, and proof of experience
    when applying under a secondary NAICS code [790]
  - Allow 105 days [788]
  - Report every year within 30 days of the anniversary [785]; SBA's mailboxes are sbampp@sba.gov, mppjvreporting@sba.gov
    and mppevaluations@sba.gov [788]
