- id: subcontracting-under-prime-plan
  name: Subcontracting under a prime's small business subcontracting plan
  family: setaside-vehicle
  governing_text: FAR 19.702; FAR 19.704; clause FAR 52.219-9 (Jan 2025); DFARS 219.702-70
  what: A prime contractor that is not small must have a small business subcontracting plan on contracts above $900,000
    ($2 million for construction) where subcontracting possibilities exist (FAR 19.702) [435]. The plan sets goals,
    in dollars and percentages, for subcontracting to small, veteran-owned, service-disabled veteran-owned, HUBZone,
    small disadvantaged and women-owned small businesses (FAR 52.219-9) [437].
  who_for: Small firms selling to large primes; the plan's goals are a reason primes look for them.
  how_it_works:
  - Plan required above $900,000 ($2 million for construction); not required from small business concerns, for personal
    services, or for work wholly outside the United States [435]
  - The thresholds rose from $750,000 and $1,500,000 on October 1, 2025 [417]
  - A plan carries separate percentage goals by category and a statement of the total dollars planned to be subcontracted
    [436]
  - 'Flowdown: subcontractors other than small with awards over $900,000 ($2 million for construction) adopt their
    own plan [436]'
  - 'Reporting: ISR semi-annually and SSR annually by October 30, through eSRS [436] [437]'
  - Failure to comply in good faith is a material breach and carries liquidated damages [435]
  - A firm may represent in good faith that it is a small disadvantaged business for federal subcontracting programs
    [372]; SDVOSBs may no longer self-certify for subcontracts that count toward SDVOSB subcontracting goals [367]
  - SubNet lists subcontracting opportunities posted by large primes [443]
  - 'DoD (DFARS 219.702-70): the Test Program for Comprehensive Subcontracting Plans needs three DoD contracts in
    the prior year totalling at least $100 million and expires December 31, 2027 [448]'
  - 'Threshold: $900,000 ($2 million for construction), raised from $750,000 and $1.5 million by FAC 2025-06, effective
    October 1, 2025 [692] [340]'
  - 'Three plan types (FAR 19.701): individual (one contract, whole period including options), commercial (the offeror''s
    fiscal year and whole commercial production; "the preferred" approach for commercial products and services)
    and master (all elements except goals; effective for three years after approval) [692] [436]'
  - 'Clauses (FAR 19.708): 52.219-8 above the simplified acquisition threshold; 52.219-9 above $900,000 ($2 million
    for construction); 52.219-16 wherever 52.219-9 is used; 52.219-10 as an optional incentive clause [692]'
  - 'Flow-down: 52.219-8 goes into all subcontracts that offer further subcontracting opportunities, including commercial
    subcontracts under 52.244-6 [436] [695]'
  - 'Good faith standard: failure means a "willful or intentional failure to perform ... or willful or intentional
    action to frustrate the plan"; missing a goal "does not, in and of itself, constitute a failure to make a good
    faith effort" (FAR 19.705-7) [692]. A failure is a material breach, may be considered in any past performance
    evaluation, and carries liquidated damages equal to the actual dollar amount by which the contractor failed
    to achieve each goal, after written notice and a chance to respond, with appeal under the Disputes clause [437]
    [694]'
  - The examples of good faith and of failure came from SBA's rule 84 FR 65647 (effective December 30, 2019) and
    the FAR's FAC 2021-07 (effective September 10, 2021) [711] [712]
  - Indirect costs must be included in the goals if the contract exceeds $7.5 million (13 CFR 125.3(c)(1)(iv)) [704]
  - 'Lower-tier credit: under 13 CFR 125.3(a)(1)(i)(C) a prime may elect credit for small business subcontracts
    at any tier only where the goals pertain to a single contract with one Federal agency and the lower-tier subcontractors
    have their own individual plans (SBA final rule 88 FR 70339, effective November 13, 2023) [704] [710]; the codified
    clause 52.219-9 limits reported award data to "immediate next-tier subcontractors", with lower-tier credit only
    through an ANC or Indian tribe designation [437]'
  - 'DoD (DFARS 219.7): primes may count subcontracts to qualified nonprofit agencies for the blind and severely
    disabled, and mentor firms may count awards to protégés toward small disadvantaged business goals; the contracting
    officer must challenge any plan without positive goals, and an SDB goal below five percent needs approval one
    level above the contracting officer [716] [718]'
  - 'DoD Test Program for comprehensive plans (DFARS 219.702-70): a contractor with at least three DoD contracts
    in the preceding fiscal year worth at least $100 million in aggregate may hold one corporate, division or plant-wide
    plan; clause 252.219-7004 is used in place of 52.219-9 and 52.219-16; "The Test Program expires on December
    31, 2027." [717] [716] [719]'
  - On a set-aside contract held by a small prime, work passed to a similarly situated first-tier subcontractor
    does not count against the prime's limitation on subcontracting, but anything that subcontractor passes on does
    (FAR 52.219-14; 13 CFR 125.6) [423] [424]
  - 'Goals behind the plans: SBA negotiates each agency''s small business subcontracting goal from recent achievement
    levels [747]; subcontracting achievement is 20% of an agency''s scorecard grade [383]; GSA''s FY 2026 subcontracting
    goal is 24% [748]. CRS, read on a mirror, reports that SBA sets the SDB, HUBZone, WOSB and SDVOSB goals at the
    statutory level and "bases subcontracting goals on recent achievement levels" [378]'
  - 'Credit rests on the subcontractor''s own representation: GAO found NNSA and its management and operating contractors
    counted about $1.1 billion of subcontracts as small business awards in fiscal years 2018-2022 when the recipients
    did not meet SBA size standards [754]'
  - 'Oversight: SBA''s Commercial Market Representatives run compliance reviews and rate primes Exceptional, Very
    Good, Satisfactory, Marginal or Unsatisfactory (13 CFR 125.3(e)-(f)) [704]. GAO found contracting officers did
    not ensure required subcontracting reports were filed on 14 of 26 contracts reviewed [750], that contracting
    officers "rarely identify contractors who have not met their small business goals" and that SBA conducted only
    six compliance reviews in each of fiscal years 2021 and 2022 [751]'
