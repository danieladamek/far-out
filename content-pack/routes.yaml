- id: nasa-space-act-agreement
  name: NASA Space Act Agreement (51 U.S.C. 20113(e))
  family: ot-cso
  governing_text: 51 U.S.C. 20113(e); NASA Partnerships Guide, NAII 1050-3D (original 2016-12-21; last updated 2026-04-07)
  what: 'NASA may enter into and perform contracts, leases, cooperative agreements, or other transactions as necessary,
    on terms it deems appropriate [1088]; NASA''s Partnerships Guide cites 51 U.S.C. 20113(e) as the Other Transactions
    Authority of the Space Act [1089]. The same subsection directs that, to the maximum extent practicable, these
    be allocated "in a manner which will enable small-business concerns to participate equitably and proportionately
    in the conduct of the work of the Administration" [1088].

    '
  who_for: Partners of NASA; a funded agreement goes to a domestic partner [1089].
  how_it_works:
  - 'Three kinds. Reimbursable: the partner reimburses NASA''s costs. Nonreimbursable: each party bears its own
    costs with no exchange of funds. Funded: NASA transfers appropriated funds to a domestic partner and does not
    take ownership of deliverables as it would under a procurement contract [1089]'
  - Funded agreements may be used only "when the Agency cannot accomplish its objectives through the use of a procurement
    contract, grant, or cooperative agreement, and only after full and open competition" [1089]
  - The authority is exercised without regard to 31 U.S.C. 3324(a) and (b) [1088]
  - 'Scale (dated): NASA used about 2,220 other transaction agreements in 2010 and about 3,220 in 2014 [1073]'
  gates: []
  situations:
  - have-technology
  - looking-for-partners
  official_url: https://nodis3.gsfc.nasa.gov/OPD_Docs/NAII_1050_3D_.pdf
