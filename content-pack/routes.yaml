    the change [1056] [1058]. The section heading on the LII page itself still contains "innovative" [1033].'
  - 'Approval above $100 million: the pre-amendment statute required a written determination of efficacy by USD(A&S)
    [1034]; DFARS 212.7003 and the AAF CSO page say senior procurement executive approval [1040] [1056]; the AAF
    BAA-v-CSO page says USD(A&S) or service acquisition executive approval [1057]; the amended statute as read on
