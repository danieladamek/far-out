- id: sdvosb-sole-source-and-va-veterans-first
  name: SDVOSB sole source (government-wide) and VA Veterans First
  family: setaside-vehicle
  governing_text: 'FAR 19.1406; 13 CFR 128.404; in VA: sections 502 and 503 of Public Law 109-461, 38 U.S.C. 8127–8128,
    and VAAR subpart 819.70'
  what: A contracting officer in any agency can award to a certified service-disabled veteran-owned small business
    without competition below a dollar cap (FAR 19.1406) [591]. Inside the Department of Veterans Affairs, the Veterans
    First Contracting Program gives SDVOSBs and then VOSBs priority over the other small-business programs [592]
    [657].
  who_for: 'SBA-certified SDVOSBs; in VA, certified VOSBs as well (certifications.yaml: vosb-sdvosb-vetcert).'
  how_it_works:
  - 'Government-wide sole source, codified FAR 19.1406: up to $8.5 million for a requirement within the NAICS codes
    for manufacturing and $5 million for a requirement within any other NAICS code, options included [591]'
  - The firm must be designated in SAM as SBA-certified, or have represented SDVOSB status in SAM and applied to
    SBA on or before December 31, 2023 [591]
  - 'SDVOSB set-aside (13 CFR 128.404): a reasonable expectation of two responsible SDVOSB offers at fair market
    price [586]'
  - 'VA priority (VAAR 819.7005): SDVOSB, then VOSB, then 8(a)/HUBZone, then other small-business set-asides [592]'
  - 'VA set-aside (VAAR 819.7006/819.7007): when two or more certified SDVOSBs (or VOSBs) are expected at a fair
    and reasonable price [592]'
  - 'VA sole source (VAAR 819.7008/819.7009): where the anticipated award price including options will not exceed
    $5 million [592]'
  - 'VA: the firm must be certified and listed in the SBA certification database (VAAR 819.7003(b)(3)) [592], and
    the offeror must certify compliance with the limitations on subcontracting (819.7004(b)) [657]'
