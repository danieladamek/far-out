- id: size-protest
  name: Size protest
  family: setaside-vehicle
  governing_text: FAR 19.302; 13 CFR 121.1001 and 121.1004; 13 CFR 134.304
  what: An offeror, the contracting officer, SBA or another interested party may protest the small business representation
    of an offeror (FAR 19.302) [681]. Private parties have five business days after bid opening or notice of the
    apparent successful offeror [681] [517].
  who_for: An offeror on a set-aside that believes the apparent winner is not small.
  how_it_works:
  - 'Who may file on a set-aside: any offeror not eliminated, the contracting officer, SBA area directors and other
    interested parties; on competitive 8(a) awards: offerors, the contracting officer and the SBA District Director
    or designee (13 CFR 121.1001) [516]'
  - Filed with the contracting officer within 5 business days (excluding Saturdays, Sundays and legal holidays)
    after bid opening or notice of the apparent successful offeror [681] [517]
  - The contracting officer forwards it to the SBA Government Contracting Area Office for the challenged firm's
    headquarters; SBA decides within 15 business days [681]
  - Appeal to SBA's Office of Hearings and Appeals within 15 calendar days after receipt of the formal size determination;
    an untimely appeal is dismissed (13 CFR 134.304) [683]
  - Contracting officers and SBA are not bound by the time limit; premature and untimely protests are dismissed;
    after agency corrective action in a bid protest a new five-business-day window opens [517] [682]
  - '8(a): size can be protested on competitive awards but not on sole-source ones [560]'
  - GAO does not decide size, NAICS or Certificate of Competency matters; they belong to SBA (4 CFR 21.5(b)) [690]
  - 'Dollar thresholds and fees: none stated in the texts read'
  gates: []
