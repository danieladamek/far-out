- id: order-set-aside-multiple-award
  name: Set-aside of an order under a multiple-award contract
  family: setaside-vehicle
  governing_text: 15 U.S.C. 644(r)(2) (as cited in FAR 19.504; statute text not read); FAR 19.504; FAR 16.505(b)(2)(i)(F);
    13 CFR 125.2(e)
  what: Contracting officers may, at their discretion, set aside orders placed under multiple-award contracts for
    small businesses (FAR 19.504) [643]. SBA's regulation likewise leaves the order set-aside to the contracting
    officer's discretion (13 CFR 125.2(e)) [654].
  who_for: Small firms that already hold the multiple-award contract.
  how_it_works:
  - Order set-asides are at the contracting officer's discretion, citing 15 U.S.C. 644(r)(2) (FAR 19.504(a)) [643]
  - Above the simplified acquisition threshold ($350,000), the contracting officer first considers the socioeconomic
    programs (FAR 19.504(a)(3)) [643] [640]
  - Each contract holder gets a fair opportunity to be considered for each order exceeding the micro-purchase threshold
    ($15,000); orders may be set aside for small business under FAR 16.505(b)(2)(i)(F) [644] [641]
  - A firm small at contract award is small for each order, subject to the rerepresentation rules [650]; after a
    disqualifying recertification it is ineligible for later set-aside or reserved orders [514]
  - 'Protest of an order (FAR 16.505(a)(10)): only for an increase in scope, period or maximum value, or for orders
    over $10 million (civilian agencies) or $25 million (DoD, NASA, Coast Guard), and only to GAO [644]. GAO reports
    that section 885 of the FY2025 NDAA raised the DoD threshold to $35 million [692]'
  - The agency head designates a task-order and delivery-order ombudsman (FAR 16.505(b)(8)) [644]
  - 'DoD: a postaward debriefing is required for task orders and delivery orders valued at $15 million or more (DFARS
    216.505) [672]'
