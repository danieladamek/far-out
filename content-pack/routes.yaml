- id: partnership-intermediary-agreement
  name: Partnership Intermediary Agreement (PIA)
  family: partnering
  governing_text: 15 U.S.C. 3715
  what: A lab director may "enter into a contract or memorandum of understanding with a partnership intermediary"
    to help small businesses and educational institutions work with the lab; costs may be paid from technology transfer
    funds [1512]. The Navy's technology transfer site says intermediaries "work with both the DoD laboratories and
    companies to facilitate communication among potential partners and help the laboratories market their technologies"
    [1525].
  who_for: Small businesses and educational institutions, as the statute's purpose is summarised in the sweep [1512].
  how_it_works:
