    or in part by a State or local government (definition returned with an ellipsis; recheck) [1512]
  - 'TechLink, at Montana State University: "TechLink is the Department of Defense''s only national ''partnership
    intermediary'' for technology transfer." [1526]; a Navy handout describes it as a "partner intermediary that
    is funded by DoD to help private industry access and evaluate technology commercialization opportunities" [1524];
    ARL''s inventions available for licensing are listed by TechLink at techlinkcenter.org [1519]'
  - 'MilTech: a joint venture of TechLink and the Montana Manufacturing Extension Center, offering design, prototyping
    and manufacturing assistance [1525]'
