- id: nasa-mentor-protege-program
  name: NASA Small Business Supplier Development Program (formerly NASA Mentor-Protégé Program)
  family: partnering
  governing_text: 15 U.S.C. 657r and 13 CFR 125.10, as cited by NASA
  what: NASA's Office of Small Business Programs runs the Small Business Supplier Development Program, formerly
    the NASA Mentor-Protégé Program, and cites 15 U.S.C. 657r and 13 CFR 125.10 as its basis [1138]. "A mentor must
    be a current NASA prime contractor with at least one contract that includes an individual small business subcontracting
    plan." [1139]. The program was relaunched in November 2024, and the first agreement under it, L3Harris Technologies
    with Parametric Machining, Inc., was announced April 17, 2025 [1140].
  who_for: 'Mentor: a NASA prime with an individual subcontracting plan. Protégé: a small business concern, HBCU,
    Minority-Serving Institution or AbilityOne Participating Nonprofit Agency.'
  benefits:
  - '"Mentor-Protégé Agreements are designed to build supplier capacity to fulfill NASA requirements and support
    a strong, dynamic, and resilient industrial base" [1138]'
  - 'Stated focus: research and development and aerospace manufacturing NAICS codes [1140]'
  requirements:
  - 'Mentor: a current NASA prime contractor with at least one contract that includes an individual small business
    subcontracting plan [1139]'
  - 'Protégé: small business concern, HBCU, Minority-Serving Institution, or AbilityOne Participating Nonprofit
    Agency [1139]'
