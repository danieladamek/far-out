- id: defense-commercial-solutions-opening
  name: Commercial Solutions Opening, defense (10 U.S.C. 3458; DFARS 212.70)
  family: ot-cso
  governing_text: 10 U.S.C. 3458 as amended by Pub. L. 119-60, section 1823 (Dec. 18, 2025, 139 Stat. 1247); DFARS
    Subpart 212.70 (88 FR 55937, Aug. 17, 2023; not yet conformed to the amendment); for CSOs that award prototype
    OTs, 10 U.S.C. 4022
  what: 'A commercial solutions opening (CSO) is a general solicitation under which the Secretary of Defense and
    each military department Secretary "may acquire commercial products, commercial services, or nondevelopmental
    items through a competitive selection of proposals resulting from a general solicitation" and a peer review,
    technical review, or operational review [1033] [806]. Until Pub. L. 119-60, section 1823 (enacted December 18,
    2025) the authority was to "acquire innovative commercial products and commercial services through a competitive
    selection of proposals" [1034] [806]. The name covers two authorities: CSOs "may be structured as prototype
    OTs pursuant to 10 U.S.C. 4022, or as FAR-based contracts or agreements pursuant to 10 U.S.C. 3458/DFARS 212.70"
    [1058].

    '
  who_for: 'Firms with commercial or near-commercial solutions: WARU''s Acquipedia article describes a CSO loosely
    as "a BAA for higher TRL items" [1058]. In the FY2018–FY2022 pilot, 120 contracts were awarded from CSOs, 82
    (68%) to small entities, 72 unique small entities [1042].'
  how_it_works:
  - 'Lifecycle: a CSO is a long-duration solicitation (typically one or more years) seeking solutions to Government-specified
    problems known as "areas of interest". CSO posted; area of interest posted; industry submits short-form responses;
    Government reviews against stated factors; award decisions; areas of interest updated, added or deleted; CSO
    closed [1058]'
  - 'Codified procedure (DFARS 212.7004): the CSO describes the agency''s interest, evaluation factors, proposal
    period and instructions; technical merit and importance to agency programs are the primary evaluation factors;
    it is publicized through the Governmentwide point of entry; proposals are evaluated by scientific, technological
    or other subject-matter expert peer review; no separate FAR 5.2 synopsis for individual awards [1040]'
  - '"Proposals need not be evaluated against each other since they are not submitted in response to a common performance
    work statement" [1042]'
  - 'The subpart has six sections: 212.7000 Scope; 212.7001 Definition; 212.7002 Policy; 212.7003 Limitations; 212.7004
    Procedures; 212.7005 Congressional notification [1041]'
  - Used when meaningful proposals with varying technical or scientific approaches can be reasonably anticipated
    (DFARS 212.7002) [1040]
  - 'Award under section 3458: "Contracts or agreements entered into using the authority under subsection (a) shall
    be fixed-price, including fixed-price incentive contracts."; products and services acquired are treated as commercial
    products and commercial services [1033] [1040]'
  - Use of general solicitation competitive procedures counts as use of competitive procedures for chapter 221 (3458(b))
    [1033] [1056]
  - 'Follow-on production (new in section 1823): for a product, service, or item acquired under a CSO the Secretary
    may enter into "a follow-on production contract (including a sole source contract), subject to the approval
    requirements of section 3204(e) of this title", or a follow-on production contract or transaction as defined
    in section 4022 [1033] [806]'
  - Congressional notification within 45 days of award for contracts exceeding $100,000,000 (3458(e)) [1033] [1040]
  - 'DIU''s CSO, which awards prototype OTs: step 1, the company sends a short brief about its solution; step 2,
    DIU invites selected companies to pitch; step 3, proposal and award. Awards are prototype agreements under OT
    authority (10 U.S.C. 4022), "in as few as 60-90 days" [97]'
  - 'DIU solution brief: "Solution Briefs not exceed 5 written pages using 12-point font or 15 briefing slides.";
    content is company name and history, employee count, CAGE code or UEI if applicable, financing stage; technology
    in production now; a response to each requirement in the Area of Interest [1065]'
  - 'DIU Phase 2 pitch factors: relevance to the Area of Interest; technical merit and feasibility; company viability;
    innovation or uniqueness; rough-order-of-magnitude pricing; notional schedule; data rights implications [1065]'
  - DIU states that companies retain ownership of IP assets created during the effort [97]
  - 'Compared with a BAA: "CSO procedures are similar to Broad Agency Announcement procedures, but CSOs are broader"
    [1056]; a BAA is for basic and applied research and development not related to a specific system or hardware
    requirement and "Cannot be used for production" [1057]. See route baa-far-35-016'
  - 'Compared with a consortium request: a CSO is publicized through the Governmentwide point of entry [1040]; for
    most consortia, "members pay dues to join the consortium and gain exclusive access to government opportunities"
    [1071]'
  - Awards are fixed-price FAR contracts or, when separately authorized, agreements [1056]
  - 'Small-business responsibility: under DoD''s Part 212 deviation text, if a small business would be selected
    but is found not responsible, the SBA Certificate of Competency procedure is followed (212.7004(e)) [1046]'
  - 'Software: a Secretary of Defense memo of March 6, 2025 directs "Commercial Solutions Openings and Other Transactions
    as the default solicitation and award approaches for acquiring capabilities under the SWP" [1061]'
  - 'Combatant commands: a statutory note (Pub. L. 118-31, section 813) requires the Secretary to use section 3458
    at least four times a year for geographic combatant command needs, through September 30, 2027 [1033]'
  - 'Protest: the Court of Federal Claims took jurisdiction over a CSO that awarded an IDIQ contract (Kinemetrics,
    Inc. v. United States, 155 Fed. Cl. 777 (2021)) [1080]'
  - 'Small-business record: FY2020, FY2021 and FY2022 each saw 19 unique small entities awarded a CSO contract [1042]'
  - 'Civilian agencies: the overhauled FAR Part 12 text read contains no CSO procedure [395]; civilian CSO authority
    was not swept, so there is no civilian CSO route in this slice (todo)'
  - 'Further resources linked from the AAF page: AFWERX CSO resources, DIU CSO process video, GSA Procurement Innovation
    Resource Center [1056]'
  - 'What a small firm must have: the sweep found no certification prescribed; DIU''s brief asks for a CAGE code
    or UEI if applicable [1065]'
