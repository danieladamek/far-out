- id: prototype-ot
  name: Prototype other transaction (10 U.S.C. 4022)
  family: ot-cso
  governing_text: 10 U.S.C. 4022 (as amended through Pub. L. 119-60); 10 U.S.C. 3014 (nontraditional defense contractor);
    32 CFR Part 3 (out of step with the statute); DoD Other Transactions Guide, Version 2.0 (July 2023); USD(A&S)
    memorandum of August 27, 2025 (approval authority)
  what: 'A prototype other transaction (OT) is a legally binding instrument other than a standard procurement contract,
    grant, or cooperative agreement, used by DoD to carry out a prototype project under 10 U.S.C. 4022 [1053] [1028].
    The FAR and many standard procurement contract requirements do not automatically apply; the Procurement Integrity
    Act and fiscal law still do [1053]. A "prototype project" includes a proof of concept, model, or process (including
    a business process); reverse engineering to address obsolescence; a pilot or novel application of commercial
    technologies for defense purposes; agile development activity; the creation, design, development, or demonstration
    of operational utility; or any combination [1029] [1059].

    '
  who_for: 'The DARPA Director, the DIU Director, the Secretary of a military department, or any other official
    designated by the Secretary of Defense may carry out prototype projects [1028]. Any firm can take part, and
    the statutory conditions favour nontraditional defense contractors and small businesses: a project needs no
    cost share when at least one nontraditional defense contractor or nonprofit research institution participates
    to a significant extent, or when all significant participants are small businesses or nontraditional defense
    contractors [1028].'
  how_it_works:
  - 'One of four conditions must be met (10 U.S.C. 4022(d)(1)): (A) at least one nontraditional defense contractor
    or nonprofit research institution participating to a significant extent; (B) all significant participants other
    than the Federal Government are small businesses (including SBIR/STTR participants under 15 U.S.C. 638) or nontraditional
    defense contractors; (C) at least one third of the total cost paid from non-Federal sources; (D) the agency
    senior procurement executive determines in writing that exceptional circumstances justify the transaction [1028]'
  - In the statute "small business" means a small business concern under section 3 of the Small Business Act (15
    U.S.C. 632), and "nontraditional defense contractor" has the meaning given in 10 U.S.C. 3014 [1029] [1054]
  - Costs incurred before the transaction's effective date do not count toward cost share, except costs incurred
    after negotiations began, on a written determination by the responsible official (4022(d)(2)) [1028]
  - '"Significant extent", in DoD''s superseded 2018 guide: the Agreements Officer judges the totality of the circumstances;
    examples are supplying a new key technology, product or process; a novel application; a material increase in
    performance, efficiency, quality or versatility; accomplishing a significant amount of the project; or a material
    reduction in cost or schedule; "AOs should not establish blanket rules or thresholds for determination of significance"
    [1050]. The July 2023 guide gives no definition of "significant extent" in the portion read [1049]'
  - 'Competition: "To the maximum extent practicable, competitive procedures shall be used when entering into agreements
    to carry out the prototype projects under subsection (a)." [1028]; "Although the Competition in Contracting
    Act does not apply to OTs, competition should be pursued to the maximum extent practicable." [1054]'
  - 'The Inspector General restated the point in 2023: "the DoD is required to use competitive procedures to the
    maximum extent practicable to award OT agreements." [1126]'
  - 'Evaluation: the FAR, the DFARS, DoD Source Selection Procedures and the Competition in Contracting Act do not
    apply to OT evaluation [1049]'
  - 'Guidance in force: WARU''s guide page lists July 2023 as the current edition of the OT Guide, issued by OUSD(A&S),
    shows no newer one, and links the companion Guide to Research Other Transactions [1051]'
  - 'Advertising: DoD''s guide says SAM.gov "may not be the most appropriate place" to advertise OT opportunities
    [1049]'
  - 'Ways the opportunity reaches firms: a commercial solutions opening structured to award prototype OTs [1058],
    or a request issued to the members of a consortium through its management organization [1119]; see routes defense-commercial-solutions-opening
    and ot-consortium-membership'
  - Payment may be fixed-price, expenditure-based, payable-milestone, or hybrid [1053]; DARPA's training says advance
    payments are permitted and milestone-based methods are used [1063]
  - 'Approval (statute): over $100,000,000 but not over $500,000,000 (including all options), a written determination
    by the head of the contracting activity (or the director, for DARPA, DIU, MDA); over $500,000,000, a written
    determination by the senior procurement executive (or DARPA/DIU/MDA director) and written notice to the congressional
    defense committees at least 30 days before the authority is exercised; the determination authority may not be
    delegated [1028]. See gate ot-approval-thresholds'
  - 'Audit: a Comptroller General access clause for agreements providing payments over $5,000,000 [1028] [1037];
    other audit and records access is negotiable, and fixed-amount agreements generally need no audit provisions
    [1049]'
  - An agreement under section 4022 is treated as a Federal agency procurement for chapter 21 of title 41 (procurement
    integrity) [1028] [1049]
  - 'Does not apply, as DARPA''s training lists it: Competition in Contracting Act; Truth in Negotiations Act; Cost
    Accounting Standards; Contract Disputes Act; procurement protest process; Pub. L. 85-804 and indemnification;
    cost-plus-percentage-of-cost prohibition; Buy American Act (in part); Bayh-Dole Act (patents); FAR/DFARS/agency
    regulations; termination for convenience or default; changes clause; mandatory flowdowns to subcontractors;
    Uniform Commercial Code [1063]'
  - 'Does not apply, as ARPA-H''s cross-government training lists it: Buy American Act (partially); CICA; Anti-Kickback
    Act; Truthful Cost or Pricing Data Act; Service Contract Act; CAS; Contract Disputes Act; FAR; procurement protest
    processes; Bayh-Dole Act [1066]'
  - 'Still applies: criminal laws (false claims, false statements); laws of general applicability (Civil Rights
    Act); laws applicable to U.S. business (environmental, import/export control); Procurement Integrity Act (41
    U.S.C. 2102–07) [1063]. ARPA-H''s list adds the Antideficiency Act, the Federal Property and Administrative
    Services Act, NEPA, debarment and suspension, and research misconduct and human subjects protections [1066].
    DoD''s guide adds FOIA with the five-year protection of 10 U.S.C. 4021(i), classified-information rules (32
    CFR Part 117), DoDI 5200.48 for CUI, and section 889 of the FY2019 NDAA [1049]'
  - 'Fiscal law governs OTs: GAO applied the recording statute and the bona fide needs statute to NIH other transactions
    (B-333150, April 8, 2024) [1077]'
  - A prototype OT may provide for the award of a follow-on production contract or transaction to the participants
    [1029] [1054]; see route follow-on-production-ot
  - 'What a small firm must have: the sweep found no certification prescribed by section 4022; a firm that is a
    small business or a nontraditional defense contractor meets condition (A) or (B) without cost share [1028].
    See certification nontraditional-defense-contractor'
  - 'Registration: "each member serving as the primary performer on an award must obtain a Unique Entity Identifier
    (UEI) from SAM." [1049]. In Independent Rough Terrain Center the protester''s SAM registration lapsed between
    May 26 and August 9, 2023, after proposal submission and before award, and its protest was dismissed [1083]'
  - 'Scale: DoD obligations through prototype and production OTAs grew from $1.8 billion in fiscal year 2016 to
    over $18 billion in fiscal year 2024; prototype OTAs were $56.3 billion of $62.9 billion obligated in FY2021–FY2024
    (90 percent) [1070]'
  - 'Who takes part: companies that typically did not do business with DoD "participated to a significant extent
    on 88 percent of the transactions awarded during this time" (FY2016–FY2018) [1072]'
  - 'Policy direction: the November 2025 Acquisition Transformation Strategy says the Department "will direct the
    use of the other transaction authority (OTA) for prototype and follow-on production efforts" where in the best
    interest of the warfighter, and commits to "increase engagement with nontraditional defense contractors to educate
    industry on how to compete for OTAs" [1062]'
  - 'Installation and facility prototyping pilot (4022(i)): two projects a year, $300,000,000 aggregate, ends September
    30, 2030 [1028]'
