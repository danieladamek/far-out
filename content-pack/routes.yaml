# routes.yaml — FAR Out content pack · assembled 2026-10-03 from the SBIR/STTR, set-asides/vehicles and partnering sweeps. Every reference carries recheck: true until quotes are verified against live pages.
- id: total-small-business-set-aside
  name: Total small-business set-aside (the Rule of Two)
  family: setaside-vehicle
  governing_text: 15 U.S.C. 644(j)(1) (the band between the micro-purchase threshold and the simplified acquisition
    threshold); FAR 19.502-2(a) and (b); FAR 13.003(b); FAR 19.203; 13 CFR 125.2(f)
  what: The contracting officer restricts a purchase to small businesses when offers are reasonably expected from
    two or more of them, the codified Rule of Two (FAR 19.502-2) [607]. Between the micro-purchase threshold and
    the simplified acquisition threshold the purchase is set aside unless the contracting officer determines there
    is no reasonable expectation of two competitive small-business offers, and that band is also reserved by statute
    [607] [597]. Above the simplified acquisition threshold the acquisition is set aside when offers are expected
    from at least two responsible small businesses and award will be at fair market prices [607].
  who_for: Any firm that is small under the NAICS size standard on the solicitation; no certification is needed
    for the general small-business set-aside.
  how_it_works:
  - 'Micro-purchase threshold (FAR 2.101): $15,000; $2,000 for construction; $2,500 for services; $25,000 (inside
    the United States) / $40,000 (outside) for the emergency categories [641]'
  - 'Simplified acquisition threshold: $350,000, raised from $250,000 on October 1, 2025 by FAR Case 2024-001 [640]
    [563]'
  - 'Above $15,000 and not over $350,000: set aside for small business unless the contracting officer determines
    there is not a reasonable expectation of offers from two or more small businesses (FAR 19.502-2(a); FAR 13.003(b);
    15 U.S.C. 644(j)(1)) [607] [661] [597]'
  - 'Above $350,000: the contracting officer shall set the acquisition aside when there is a reasonable expectation
    of offers from at least two responsible small businesses and award at fair market prices (FAR 19.502-2(b)) [607]'
  - Above the simplified acquisition threshold, the 8(a), HUBZone, SDVOSB and WOSB programs are considered before
    a general small-business set-aside, with no order of precedence among the four (FAR 19.203; 13 CFR 125.2(f))
    [652] [654]. At or below it, the small-business set-aside does not preclude 8(a), HUBZone, SDVOSB or WOSB awards
    (FAR 19.203(b)) [607]
  - The contracting officer coordinates with the small business specialist no later than 30 days before a solicitation
    (FAR 19.201) [651]; SBA's procurement center representative recommends set-asides within 15 days of receiving
    an acquisition package and can appeal a rejected recommendation (FAR 19.402; 13 CFR 125.2(b)) [653] [654]
  - 'DoD, codified DFARS 219.502-2: construction (including maintenance and repairs) under $3.5 million, dredging
    under $2 million, and architect-engineer services for military construction or family housing under $1 million
    are set aside [671]'
  - The limitations on subcontracting apply to small-business set-asides above the simplified acquisition threshold
    [645]
  - Agencies advertise contracts over $25,000 on SAM.gov [666]
  gates:
  - sam-registration
  - size-status-representation
  - limitations-on-subcontracting
  - nonmanufacturer-rule
  situations:
