- id: status-protest
  name: Status protest (HUBZone, SDVOSB, WOSB/EDWOSB)
  family: setaside-vehicle
  governing_text: FAR 19.306 (HUBZone); FAR 19.307 (SDVOSB); FAR 19.308 (EDWOSB/WOSB); 13 CFR 126.801, 127.603,
    128.500; 13 CFR 124.517 (8(a))
  what: An interested party may challenge the HUBZone, SDVOSB or WOSB/EDWOSB status of the apparent successful offeror
    on a program award [462] [463] [464]. The deadline in each case is the fifth business day after bid opening
    or the notice of the apparent successful offeror [462] [463] [464]. 8(a) eligibility cannot be challenged by
    another participant or any other party [337].
  who_for: An offeror on a HUBZone, SDVOSB or WOSB/EDWOSB award that believes the apparent winner does not hold
    the status.
  how_it_works:
  - 'HUBZone (FAR 19.306): by the fifth business day; forwarded to SBA''s HUBZone Program Director (hzprotests@sba.gov);
    decision in 15 business days; appeal to the AA/GC&BD within 5 business days; on a sole source only SBA or the
    contracting officer may protest [462]. SBA and contracting officer protests are always timely, and specific
    facts are required [348]'
  - 'SDVOSB (FAR 19.307): by the fifth business day; VA or SBA may protest at any time; forwarded to SBA''s Office
    of Hearings and Appeals (OHAfilings@sba.gov), whose decision is effective immediately and final [463] [365]'
  - 'WOSB/EDWOSB (FAR 19.308): by the fifth business day; forwarded to SBA (wosbprotest@sba.gov); SBA decides within
    15 business days; appeal to OHA within 10 business days [464]. A protest without specific facts or allegations
    is insufficient [356], and only certified WOSBs or pending applicants may protest [360]'
  - OHA decides size and NAICS appeals, VOSB/SDVOSB status protests and appeals, WOSB/EDWOSB appeals, and 8(a) eligibility,
    suspension and termination appeals [461]
  - 'Dollar thresholds and fees: none stated in the texts read'
