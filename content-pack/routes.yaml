  - 'Authority cited: the AAF BAA-v-CSO page gives section 879 of the FY2017 NDAA and describes the CSO as for innovative
    commercial items [1057]; the final rule implements section 803 of the FY2022 NDAA (Pub. L. 117-81) and section
    814 of the FY2023 NDAA (Pub. L. 117-263) [1042].'
  - 'Federal Register page: the final rule is recorded as 88 FR 55937 [1042]; eCFR gives the subpart''s source as
    88 FR 55939, Aug. 17, 2023 [1041].'
  - 'Secondary only: law-firm commentary describes section 1823 as expanding CSO authority to any commercial product
    or service and creating sole-source follow-on production authority [1108] [1111] [1112]; one explainer puts
    the removed written determination at "$10 million", which appears to be a slip for $100 million [1112] vs [1034].'
- id: baa-far-35-016
  name: Broad Agency Announcement (FAR 35.016)
  family: ot-cso
  governing_text: FAR 35.016 (FAC 2026-01, effective 2026-03-13)
  what: 'Under FAR 35.016, broad agency announcements (BAAs) "may be used by agencies to fulfill their requirements
    for scientific study and experimentation directed toward advancing the state-of-the-art", and only when meaningful
    proposals with varying technical/scientific approaches can be reasonably anticipated [271]. A BAA is for basic
    and applied research and development not related to a specific system or hardware requirement [1057] [271].

    '
  who_for: Firms and institutions offering research and development approaches to an agency's stated research interest
    [271]. The sweep found nothing specific to small firms prescribed in 35.016 [271].
  how_it_works:
  - The BAA describes the agency's research interest, the selection criteria and their relative importance, the
    proposal period, and submission instructions (35.016(b)) [271]
  - Publicized through the Governmentwide point of entry; "The notice must be published no less frequently than
    annually." (35.016(c)) [271]
  - Evaluated by peer or scientific review; written evaluation required; proposals need not be evaluated against
    each other (35.016(d)) [271]
  - Primary bases for selection are technical merit, importance to agency programs, and fund availability (35.016(e))
    [271]
  - No separate subpart 5.2 synopsis for individual awards (35.016(f)) [271]
  - 'As DoD''s comparison page puts it: budget activities 6.1–6.4; "Cannot be used for production"; must be funded
    with RDT&E funds; may result in FAR contracts or non-FAR agreements [1057]'
  - 'Relation to the CSO: "CSO procedures are similar to Broad Agency Announcement procedures, but CSOs are broader"
    [1056]'
  - A DARPA BAA Guide (Nov 2016) is listed in the ARPA-H policy library; it was not read [1068]
  gates: []
