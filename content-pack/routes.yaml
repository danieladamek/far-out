- id: gao-bid-protest
  name: GAO bid protest
  family: setaside-vehicle
  governing_text: 4 CFR part 21; FAR 33.104; FAR 16.505(a)(10)
  what: An actual or prospective bidder or offeror whose direct economic interest would be affected by the award
    of a contract can protest to the Government Accountability Office under 4 CFR part 21 [690]. GAO decides within
    100 days of filing, or 65 days under the express option [689].
  who_for: An offeror or prospective offeror with a direct economic interest in the award.
  how_it_works:
  - Filed through GAO's Electronic Protest Docketing System (4 CFR 21.1) [690]; the filing fee is $500 effective
    October 1, 2024 ($350 before) [691]
  - 'Timing (4 CFR 21.2): solicitation defects before bid opening or the proposal due date; otherwise 10 days after
    the basis is known; 10 days after a required debriefing; 10 days after adverse agency action on an agency protest
    [690]'
  - Stay of award or performance when the agency is notified within 10 days after award or 5 days after a debriefing
    date [689]
  - The agency report is due within 30 days [689]
  - The attorney fee cap of $150 per hour applies to firms other than small businesses [689]
  - 'Outside GAO''s review: size, NAICS and Certificate of Competency matters belong to SBA (4 CFR 21.5(b)); orders
    are outside GAO''s jurisdiction except as statute allows (21.5(l)) [690]'
  - Orders under task- and delivery-order contracts can be protested only for an increase in scope, period or maximum
    value, or above $10 million (civilian agencies) and, in the codified FAR, $25 million (DoD, NASA, Coast Guard)
    (FAR 16.505(a)(10)) [644]; GAO reports that section 885 of the FY2025 NDAA raised the DoD figure to $35 million
    [692]
  - 'FY2025 figures: 1,688 cases filed, a 14% sustain rate and a 52% effectiveness rate [693]'
  gates: []
