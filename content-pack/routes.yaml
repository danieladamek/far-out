- id: crada
  name: Cooperative Research and Development Agreement (CRADA)
  family: partnering
  governing_text: 15 U.S.C. 3710a
  what: An agreement for joint research and development with a federal laboratory. The Government may provide personnel,
    services, facilities, equipment, intellectual property or other resources "with or without reimbursement (but
    not funds to non-Federal parties)" [992]. The lab may accept, retain and use funds, personnel, services and
    property from a collaborating party [992].
  who_for: ARL's CRADAs are open to academia, large and small business and foreign business [999]. The statute gives
    special consideration to small business firms and consortia involving small business firms, and preference to
    U.S.-located businesses agreeing to manufacture substantially in the United States [992].
  how_it_works:
  - 'Money moves one way only: "federal laboratories can receive funds from their collaborator(s), but the laboratory
    cannot provide any funds to its collaboration partner(s)" [999]; "NIST cannot provide funds to the other Collaborator(s)."
    [997]; the Navy can provide labor, materials, facilities and services but not funds [1003]'
  - 'Inventions: the collaborating party is offered the option of an exclusive license for a pre-negotiated field
    of use for inventions made under the agreement; the Government retains a nonexclusive, paid-up license [992].
    At NSWC Indian Head, title follows the inventor''s employer and joint inventions are jointly owned [1003]'
  - 'Confidentiality: a partner''s trade secrets and privileged or confidential commercial information are not disclosed;
    information produced under the agreement may be protected for up to 5 years [992] [997]'
  - 'Approval: the agency has 30 days to disapprove or require modification of an agreement [992]'
  - 'NIST: commercial products from CRADA intellectual property must be substantially manufactured in the United
    States [997]'
  - 'Timeline, one division''s figures: "Usually about 2-4 weeks. However, delays of 3 or 4 months have occurred
    in obtaining a company''s corporate office approval." [1003]; the NIST and ARL pages state no timeline or fee
    [997] [999]'
  - 'Finding a lab: the Federal Laboratory Consortium is "the nationwide network of over 300 federal laboratories
    and research centers" [994]; FLC Business indexes technologies available for licensing, laboratory facilities
    and equipment, funding opportunities and lab programs, and is free: "No log in required to search." [996]'
  - 'Starting points named by the labs: ARL''s ORTA@arl.army.mil [999]; DEVCOM_Partnerships@army.mil [1002]; model
    CRADAs and licenses are available from the Navy ORTA representative [1003]; "The CRADA is a flexible agreement
    that is tailored to each partnership" [1004]'
  - FLC's T2 Mechanisms page lists CRADAs alongside facility usage agreements, technology licenses, material transfer
    agreements, Space Act Agreements, educational partnership agreements, partnership intermediary agreements and
    other transactions [995]
  - SBIR.gov's tutorial names CRADAs, licensing and technical assistance as ways to work with a federally funded
    R&D center, and says some FFRDCs provide limited technical assistance at little or no cost [1026]
