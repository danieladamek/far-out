  governing_text: FAR 33.103
  what: An interested party can protest to the agency itself, filing with the contracting officer and, on request,
    getting an independent review at a level above the contracting officer (FAR 33.103) [465]. Pursuing an agency
    protest does not extend the time for obtaining a stay at GAO [465].
  who_for: An offeror or prospective offeror objecting to a solicitation's terms or to an award.
  how_it_works:
  - 'Timing: protests of solicitation defects before bid opening or the closing date; other grounds within 10 days
    of when the basis is known [465]'
  - The agency aims to resolve the protest within 35 days [465]
  - A protest within 10 days of award suspends performance [465]
  - A later GAO protest must be filed within 10 days after adverse agency action on the agency protest (4 CFR 21.2)
    [467]
  - 'Fees: the sweep describes the agency-level protest as free [465]; no dollar threshold applies in the text read'
