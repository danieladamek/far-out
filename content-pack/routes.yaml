- id: joint-venture-set-aside
  name: Joint venture for a small-business or socioeconomic set-aside
  family: partnering
  governing_text: 13 CFR 121.103(h), 121.404, 125.8, 125.9(d), 125.11(b), 125.12(f); program sections 13 CFR 124.513
    (8(a)), 126.616 (HUBZone), 127.506 (WOSB/EDWOSB), 128.402 (VOSB/SDVOSB); FAR 19.301-1(a)(2); clauses FAR 52.219-14
    and 52.219-28
  what: A joint venture is an association formed to carry out business ventures for joint profit over a two-year
    period; it must be in writing, do business under its own name and be identified as a joint venture in SAM (13
    CFR 121.103(h)) [770]. It may submit an offer as small if each partner is small under the contract's NAICS size
    standard, and a joint venture between a protégé and its SBA-approved mentor is small if the protégé is small
    and the agreement meets the applicable section (13 CFR 121.103(h)(2); FAR 19.301-1(a)(2)) [770] [766]. A joint
    venture agreement between firms that each qualify as small "need not be in any specific form or contain any
    specific conditions" (13 CFR 125.8(b)(1)) [773].
  who_for: Two or more firms that are each small under the contract's NAICS code; a protégé with an SBA-approved
    mentor; a certified 8(a), HUBZone, WOSB/EDWOSB or VOSB/SDVOSB firm leading a joint venture for that program's
    contracts.
  benefits:
  - A joint venture may qualify for award under FAR subparts 19.8, 19.13, 19.14 and 19.15 [766]
  - Agencies must consider the work and qualifications of each partner and of the joint venture itself, and may
    not require the protégé to meet individually the same evaluation or responsibility criteria as other offerors
    (13 CFR 125.8(e)) [773]
  - A small business without its own past performance may use that of a joint venture it belonged to, naming the
    joint venture contracts and the duties it carried out; it cannot claim work performed exclusively by other partners
    (13 CFR 125.11(b)) [781]
  - Within two years of its first award a joint venture may receive any number of contracts (the three-contracts-in-two-years
    limit was removed in 2020), and orders under a previously awarded contract may be issued beyond the two-year
    period [782] [770] [783]
  - A joint venture may be awarded a contract requiring a facility clearance where the joint venture itself or the
    lead small-business partner holds it [782]
  requirements:
  - Written agreement, own name, identified as a joint venture in SAM; it may be a formal or informal partnership
    or a separate legal entity (13 CFR 121.103(h)(1)) [770]. SBA's page adds that the joint venture is registered
    in SAM.gov with its own UEI and CAGE code and the partners listed as immediate owners [789]
  - 'Unpopulated: a separate-legal-entity joint venture cannot be populated with individuals intended to perform
    set-aside contracts unless all parties are similarly situated; it may have its own employees for administrative
    functions, including Facility Security Officers [770]'
  - 'Two-year rule: a specific joint venture generally may not be awarded contracts beyond two years from the award
    of its first contract, after which the partners are deemed affiliated for new offers; an offer submitted before
    the two years end may still be awarded, and the same partners may form a new joint venture with its own two-year
    period [770]'
  - 'Size arithmetic: each partner counts its proportionate share of the joint venture''s receipts and employees
    (13 CFR 121.103(h)(4)) [770]'
  - 'Mentor-protégé joint venture: SBA must approve the mentor-protégé agreement before the joint venture submits
    an offer [785] [789]; the agreement must contain the twelve provisions of 13 CFR 125.8(b)(2) (see the gate jv-agreement-requirements)
    [773]'
  - 'Work share: the joint venture must meet the limitations on subcontracting in 13 CFR 125.6, performed by the
    joint venture participants in aggregate, and the protégé must perform at least 40% of the work the joint venture
    performs, more than administrative or ministerial functions [773] [423]'
  - 'Program joint ventures: the certified firm is managing venturer, owns at least 51% and performs at least 40%
    [774] [776] [778] [779]; "SBA does not certify HUBZone joint ventures" or VOSB/SDVOSB joint ventures [776] [779];
    SBA must approve an 8(a) joint venture before a sole-source 8(a) award and will not approve joint ventures for
    competitive 8(a) awards [774]; an 8(a) protégé''s joint venture with its mentor on 8(a) contracts must meet
    13 CFR 124.513(c) and (d) [775]'
  - A HUBZone, WOSB/EDWOSB or VOSB/SDVOSB firm cannot be a partner in more than one joint venture bidding on the
    same contract [776] [778] [779]; a mentor with more than one protégé cannot submit competing offers on the same
    procurement through separate joint ventures, or hold the same small-business multiple-award contract through
    joint ventures with two protégés (13 CFR 125.9(b)(3)(i), (b)(4)) [785]
  how_it_works:
  - 'Timing of the tests: size is determined as of the initial offer that includes price; compliance with the joint
    venture agreement requirements is judged as of the final proposal revision (negotiated) or final bid (sealed
    bidding) (13 CFR 121.404(a), (f)) [771]'
  - The contract is executed in the joint venture's name (separate legal entity) or the small business's name (informal
    joint venture) and identified as a small-business joint venture award (13 CFR 125.8(f)) [773]
  - Before performance, a written certification signed by an authorised official of each partner goes to the contracting
    officer and SBA (13 CFR 125.8(d)); an annual performance-of-work report and a completion report go to the contracting
    officer and SBA (13 CFR 125.8(h)) [773]
  - 'Recertification: a joint venture may recertify as small where all parties are small at recertification, or
    the protégé is small in a mentor-protégé joint venture (13 CFR 125.12(f)) [291]; once the protégé is no longer
    small for the contract''s NAICS code the joint venture cannot recertify as small, though a change in the protégé''s
    size does not generally affect contracts already awarded (13 CFR 125.9(d)(1)) [785]; clause FAR 52.219-28 carries
    separate joint venture representations for WOSB/EDWOSB, SDVOSB and HUBZone joint ventures [767]'
  - 'Protests: a size protest against a joint venture awardee may come from any offeror not eliminated for reasons
    unrelated to size, the contracting officer or SBA [772] [766]; a HUBZone joint venture protest is due by close
    of business on the fifth business day after notification of the apparent successful offeror [777]; a VOSB/SDVOSB
    joint venture can be protested at OHA for failing 13 CFR 128.402, and losing on that ground alone does not affect
    the partner''s own eligibility [780]'
  - 'Sanctions: failing to have a compliant agreement, to perform to it or to the 40% rule, or to submit certifications
    or allow inspection are grounds for suspension or debarment (13 CFR 125.8(i)) [773]; exceeding the limitations
    on subcontracting carries a penalty of the greater of $500,000 or the excess spent on subcontractors (13 CFR
    125.6(h)) [424]'
  - The FAR took in SBA's joint venture rules by FAC 2022-08 (87 FR 58219), effective October 28, 2022 [768]
  steps:
  - 'Write the agreement: no prescribed form where every partner is small; the twelve listed provisions for a mentor-protégé
    joint venture [773]'
  - Register the joint venture in SAM.gov under its own name with its own UEI and CAGE code, designated as a joint
    venture [789] [770]
  - For a mentor-protégé joint venture, have the mentor-protégé agreement approved by SBA before the joint venture
    submits an offer [785]
  - Represent size at the initial offer that includes price [771]
  - Send the pre-performance certification to the contracting officer and SBA, then the annual and completion performance-of-work
    reports [773]
  - Questions go to the local SBA District Office [789]
  gates:
  - jv-agreement-requirements
