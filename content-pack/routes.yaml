- id: subcontracting-under-prime-plan
  name: Subcontracting under a prime's small business subcontracting plan
  family: partnering
  governing_text: FAR 19.702, 19.704, 19.705-7, 19.708; clauses FAR 52.219-8 (Jan 2025), 52.219-9 (Jan 2025), 52.219-16
    (Sep 2021), 52.242-5 (Jan 2017); 13 CFR 125.3 and 125.11; DFARS subpart 219.7, 219.702-70, 252.219-7003, 252.219-7004
  what: A prime contractor that is not a small business must hold a subcontracting plan when its contract is expected
    to exceed $900,000 ($2 million for construction) and has subcontracting possibilities (FAR 19.702) [1001]. The
    plan carries separate percentage goals for small business, veteran-owned, service-disabled veteran-owned, HUBZone,
    small disadvantaged and women-owned small business (FAR 19.704(a)) [1001]. Clause 52.219-9 carries the plan
    into the contract and makes a failure to comply with it in good faith a material breach [1003].
  who_for: Any small firm that wants work from a large prime; the plan's goals are the prime's reason to look for
    small subcontractors. The small firm itself files no plan.
  benefits:
  - The prime must make a good faith effort to buy from the small businesses it used in preparing the bid or proposal,
    "in the same or greater scope, amount, and quality", and give the contracting officer a written explanation
    within 30 days of contract completion if it does not (FAR 19.704(a)(12)-(13); 52.219-9(d)(12)-(d)(13)) [1002]
    [1003]
  - The prime may not prohibit a subcontractor from discussing payment or utilization matters with the contracting
    officer (FAR 19.704(a)(14); 52.219-9(d)(14)) [1002] [1003]
  - The prime must pay small business subcontractors on time and notify the contracting officer of a reduced or
    untimely payment (FAR 19.704(a)(15)) [1002]; under clause 52.242-5 untimely means more than 90 days past due
    and the written notice is due not later than 14 days after the event [1010]; 13 CFR 125.3(c)(5) carries the
    same 90 days [1021]
  - Above the simplified acquisition threshold the prime must tell unsuccessful small business subcontract offerors
    who the apparent successful offeror is before award (52.219-9(e)(6)) [1003]
  - A small first-tier subcontractor under a prime contract that included a subcontracting plan may ask the prime
    for a past performance rating within 30 calendar days after the prime contract's period of performance ends;
    the prime must provide it within 15 calendar days of the request, on a five-level scale, and the subcontractor
    may notify the contracting officer if the prime does not comply (13 CFR 125.11(c); 87 FR 43731) [1031] [1106]
  - 'DoD contracts: when a prime replaces a small firm identified in its plan with a firm that is not small, it
    must notify the Administrative Contracting Officer in writing (DFARS 219.704; 252.219-7003(e)) [1034] [1036]'
  requirements:
  - The prime may accept a subcontractor's written representation of its size and socioeconomic status unless it
    has reason to question it; HUBZone status is confirmed in SAM or SBA's search database (52.219-8(e)) [1004]
  - Plans are not required from small business concerns, for personal services contracts, or for contracts performed
    entirely outside the United States and its outlying areas (FAR 19.702(b)) [1001]; small primes cannot be required
    to submit a formal plan, but all primes must give small firms the maximum practicable opportunity (13 CFR 125.3(b))
    [1021]
  - A subcontractor that is not small and receives a subcontract in excess of $900,000 ($2 million for construction)
    must adopt its own 52.219-9 plan (FAR 19.704(a)(9)) [1002]; no plan is required from a subcontractor where the
    prime contract contains 52.212-5 or the subcontractor supplies a commercial product or service under 52.244-6
    (52.219-9(j)) [1003]
  how_it_works:
  - 'Threshold: $900,000 ($2 million for construction), raised from $750,000 and $1.5 million by FAC 2025-06, effective
    October 1, 2025 [1001] [1011]'
  - 'Three plan types (FAR 19.701): individual (one contract, whole period including options), commercial (the offeror''s
    fiscal year and whole commercial production; "the preferred" approach for commercial products and services)
    and master (all elements except goals; effective for three years after approval) [1001] [1002]'
  - 'Clauses (FAR 19.708): 52.219-8 above the simplified acquisition threshold; 52.219-9 above $900,000 ($2 million
    for construction); 52.219-16 wherever 52.219-9 is used; 52.219-10 as an optional incentive clause [1001]'
  - 'Flow-down: 52.219-8 goes into all subcontracts that offer further subcontracting opportunities, including commercial
    subcontracts under 52.244-6 [1002] [1006]'
  - 'Good faith standard: failure means a "willful or intentional failure to perform ... or willful or intentional
    action to frustrate the plan"; missing a goal "does not, in and of itself, constitute a failure to make a good
    faith effort" (FAR 19.705-7) [1001]. A failure is a material breach, may be considered in any past performance
    evaluation, and carries liquidated damages equal to the actual dollar amount by which the contractor failed
    to achieve each goal, after written notice and a chance to respond, with appeal under the Disputes clause [1003]
    [1005]'
  - The examples of good faith and of failure came from SBA's rule 84 FR 65647 (effective December 30, 2019) and
    the FAR's FAC 2021-07 (effective September 10, 2021) [1029] [1030]
  - Indirect costs must be included in the goals if the contract exceeds $7.5 million (13 CFR 125.3(c)(1)(iv)) [1021]
  - 'Lower-tier credit: under 13 CFR 125.3(a)(1)(i)(C) a prime may elect credit for small business subcontracts
    at any tier only where the goals pertain to a single contract with one Federal agency and the lower-tier subcontractors
    have their own individual plans (SBA final rule 88 FR 70339, effective November 13, 2023) [1021] [1028]; the
    codified clause 52.219-9 limits reported award data to "immediate next-tier subcontractors", with lower-tier
    credit only through an ANC or Indian tribe designation [1003]'
  - 'DoD (DFARS 219.7): primes may count subcontracts to qualified nonprofit agencies for the blind and severely
    disabled, and mentor firms may count awards to protégés toward small disadvantaged business goals; the contracting
    officer must challenge any plan without positive goals, and an SDB goal below five percent needs approval one
    level above the contracting officer [1034] [1036]'
  - 'DoD Test Program for comprehensive plans (DFARS 219.702-70): a contractor with at least three DoD contracts
    in the preceding fiscal year worth at least $100 million in aggregate may hold one corporate, division or plant-wide
    plan; clause 252.219-7004 is used in place of 52.219-9 and 52.219-16; "The Test Program expires on December
    31, 2027." [1035] [1034] [1037]'
  - On a set-aside contract held by a small prime, work passed to a similarly situated first-tier subcontractor
    does not count against the prime's limitation on subcontracting, but anything that subcontractor passes on does
    (FAR 52.219-14; 13 CFR 125.6) [1007] [1023]
  - 'Goals behind the plans: SBA negotiates each agency''s small business subcontracting goal from recent achievement
    levels [1069]; subcontracting achievement is 20% of an agency''s scorecard grade [1067]; GSA''s FY 2026 subcontracting
    goal is 24% [1070]. CRS, read on a mirror, reports that SBA sets the SDB, HUBZone, WOSB and SDVOSB goals at
    the statutory level and "bases subcontracting goals on recent achievement levels" [1072]'
  - 'Credit rests on the subcontractor''s own representation: GAO found NNSA and its management and operating contractors
    counted about $1.1 billion of subcontracts as small business awards in fiscal years 2018-2022 when the recipients
    did not meet SBA size standards [1077]'
  - 'Oversight: SBA''s Commercial Market Representatives run compliance reviews and rate primes Exceptional, Very
    Good, Satisfactory, Marginal or Unsatisfactory (13 CFR 125.3(e)-(f)) [1021]. GAO found contracting officers
    did not ensure required subcontracting reports were filed on 14 of 26 contracts reviewed [1073], that contracting
    officers "rarely identify contractors who have not met their small business goals" and that SBA conducted only
    six compliance reviews in each of fiscal years 2021 and 2022 [1074]'
  steps:
  - Find primes that hold plans and their small business liaisons (see the route finding-subcontract-work) [1050]
    [1060]
  - 'Get into the prime''s proposal: the good faith duty attaches to the small businesses the prime used in preparing
    the bid or proposal [1002]'
  - Give the prime a written representation of size and socioeconomic status; the prime may rely on it [1004]
  - If the prime drops the firm or pays late, raise it with the contracting officer; the prime may not prohibit
    that [1002]
  - Request a past performance rating from the prime within 30 calendar days after the prime contract's period of
    performance ends [1106]
