- id: partial-set-aside
  name: Partial small-business set-aside
  family: setaside-vehicle
  governing_text: FAR 19.502-3 (contracts other than multiple-award; not read in this sweep); FAR 19.502-4 (multiple-award
    contracts)
  what: A portion of a requirement is set aside for small business when a total set-aside is not appropriate [642].
    In the codified FAR, 19.502-4 is the partial set-aside of a multiple-award contract; it is discretionary [642].
  who_for: Small firms that can perform a severable portion of a larger requirement.
  how_it_works:
  - Discretionary; needs a divisible requirement and two expected small-business offers on the portion [642]
  - 'Under FAR 19.502-4: excludes construction and is not for simplified acquisition procedures; the solicitation
    must identify the set-aside and non-set-aside portions [642]'
  - 'Dollar thresholds: none stated in the text read'
