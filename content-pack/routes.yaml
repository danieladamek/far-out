    for manufacturing and $5 million for a requirement within any other NAICS code, options included [368]'
  - The firm must be designated in SAM as SBA-certified, or have represented SDVOSB status in SAM and applied to
    SBA on or before December 31, 2023 [368]
  - 'SDVOSB set-aside (13 CFR 128.404): a reasonable expectation of two responsible SDVOSB offers at fair market
    price [363]'
  - 'VA priority (VAAR 819.7005): SDVOSB, then VOSB, then 8(a)/HUBZone, then other small-business set-asides [369]'
