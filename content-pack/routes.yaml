    only the DoD clause requires notice when the substitution is made [718]'
  benefits:
  - The prime must make a good faith effort to buy from the small businesses it used in preparing the bid or proposal,
    "in the same or greater scope, amount, and quality", and give the contracting officer a written explanation
    within 30 days of contract completion if it does not (FAR 19.704(a)(12)-(13); 52.219-9(d)(12)-(d)(13)) [436]
    [437]
  - The prime may not prohibit a subcontractor from discussing payment or utilization matters with the contracting
    officer (FAR 19.704(a)(14); 52.219-9(d)(14)) [436] [437]
  - The prime must pay small business subcontractors on time and notify the contracting officer of a reduced or
    untimely payment (FAR 19.704(a)(15)) [436]; under clause 52.242-5 untimely means more than 90 days past due
    and the written notice is due not later than 14 days after the event [698]; 13 CFR 125.3(c)(5) carries the same
    90 days [704]
  - Above the simplified acquisition threshold the prime must tell unsuccessful small business subcontract offerors
    who the apparent successful offeror is before award (52.219-9(e)(6)) [437]
  - A small first-tier subcontractor under a prime contract that included a subcontracting plan may ask the prime
    for a past performance rating within 30 calendar days after the prime contract's period of performance ends;
    the prime must provide it within 15 calendar days of the request, on a five-level scale, and the subcontractor
    may notify the contracting officer if the prime does not comply (13 CFR 125.11(c); 87 FR 43731) [713] [781]
  - 'DoD contracts: when a prime replaces a small firm identified in its plan with a firm that is not small, it
    must notify the Administrative Contracting Officer in writing (DFARS 219.704; 252.219-7003(e)) [716] [718]'
  requirements:
  - The prime may accept a subcontractor's written representation of its size and socioeconomic status unless it
    has reason to question it; HUBZone status is confirmed in SAM or SBA's search database (52.219-8(e)) [693]
  - Plans are not required from small business concerns, for personal services contracts, or for contracts performed
    entirely outside the United States and its outlying areas (FAR 19.702(b)) [692]; small primes cannot be required
    to submit a formal plan, but all primes must give small firms the maximum practicable opportunity (13 CFR 125.3(b))
    [704]
  - A subcontractor that is not small and receives a subcontract in excess of $900,000 ($2 million for construction)
    must adopt its own 52.219-9 plan (FAR 19.704(a)(9)) [436]; no plan is required from a subcontractor where the
    prime contract contains 52.212-5 or the subcontractor supplies a commercial product or service under 52.244-6
    (52.219-9(j)) [437]
  steps:
  - Find primes that hold plans and their small business liaisons (see the route finding-subcontract-work) [732]
    [740]
  - 'Get into the prime''s proposal: the good faith duty attaches to the small businesses the prime used in preparing
    the bid or proposal [436]'
  - Give the prime a written representation of size and socioeconomic status; the prime may rely on it [693]
  - If the prime drops the firm or pays late, raise it with the contracting officer; the prime may not prohibit
    that [436]
  - Request a past performance rating from the prime within 30 calendar days after the prime contract's period of
    performance ends [781]
- id: size-protest
  name: Size protest
  family: setaside-vehicle
  governing_text: FAR 19.302; 13 CFR 121.1001 and 121.1004; 13 CFR 134.304
  what: An offeror, the contracting officer, SBA or another interested party may protest the small business representation
    of an offeror (FAR 19.302) [458]. Private parties have five business days after bid opening or notice of the
    apparent successful offeror [458] [294].
  who_for: An offeror on a set-aside that believes the apparent winner is not small.
  how_it_works:
  - 'Who may file on a set-aside: any offeror not eliminated, the contracting officer, SBA area directors and other
    interested parties; on competitive 8(a) awards: offerors, the contracting officer and the SBA District Director
    or designee (13 CFR 121.1001) [293]'
  - Filed with the contracting officer within 5 business days (excluding Saturdays, Sundays and legal holidays)
    after bid opening or notice of the apparent successful offeror [458] [294]
  - The contracting officer forwards it to the SBA Government Contracting Area Office for the challenged firm's
    headquarters; SBA decides within 15 business days [458]
  - Appeal to SBA's Office of Hearings and Appeals within 15 calendar days after receipt of the formal size determination;
    an untimely appeal is dismissed (13 CFR 134.304) [460]
  - Contracting officers and SBA are not bound by the time limit; premature and untimely protests are dismissed;
    after agency corrective action in a bid protest a new five-business-day window opens [294] [459]
  - '8(a): size can be protested on competitive awards but not on sole-source ones [337]'
  - GAO does not decide size, NAICS or Certificate of Competency matters; they belong to SBA (4 CFR 21.5(b)) [467]
  - 'Dollar thresholds and fees: none stated in the texts read'
