- id: 8a-sole-source-and-competition
  name: 8(a) sole source and 8(a) competition
  family: setaside-vehicle
  governing_text: FAR 19.805-1; FAR 19.808-1; DFARS 219.8; 13 CFR 124.506 and 124.519
  what: An agency can award a contract to a certified 8(a) participant without competition below a dollar line,
    and competes the requirement among 8(a) firms above it (FAR 19.805-1) [561]. A sole-source 8(a) contract above
    $30 million needs a written justification from the requesting agency (FAR 19.808-1) [562].
  who_for: 'Certified 8(a) participants during their nine-year term (certifications.yaml: 8a-business-development).'
  how_it_works:
  - 'Codified FAR 19.805-1: competition among 8(a) firms is required above $8.5 million for acquisitions assigned
    manufacturing NAICS codes and $5.5 million for all other acquisitions; below those values the award can be sole
    source [561]'
  - 13 CFR 124.506 as displayed prints $7,000,000 (manufacturing NAICS) / $4,500,000 (all other) [554]
  - A requirement may not be split to stay under the threshold [561]
  - SBA may accept a sole source above those values for a concern owned by an Indian tribe or Alaska Native Corporation
    [561]
  - 'Justification: SBA may not accept for negotiation a sole-source 8(a) contract that exceeds $30 million unless
    the requesting agency has completed a FAR 6.303 justification (FAR 19.808-1) [562]; the threshold rose from
    $25,000,000 to $30,000,000 on October 1, 2025 [640]. 13 CFR 124.506 as displayed prints $25,000,000, and $100,000,000
    for a DoD agency [554]'
  - 'DoD (DFARS 219.8): awards go direct to the participant under the DoD–SBA Partnership Agreement, and SBA may
    not accept a DoD sole-source 8(a) contract exceeding $100 million without a FAR 6.303 justification [671]'
  - 'Lifetime limit (13 CFR 124.519): no further sole-source 8(a) awards once a firm has received more than $168,500,000
    in combined competitive and sole-source 8(a) contracts; firms owned by an Indian Tribe, ANC, NHO or CDC are
    exempt [555]'
  - A participant's eligibility for a sole-source or competitive 8(a) requirement may not be challenged by another
    participant or any other party [560]
