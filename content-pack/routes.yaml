- id: follow-on-production-ot
  name: Follow-on production after a prototype OT (10 U.S.C. 4022(f))
  family: ot-cso
  governing_text: 10 U.S.C. 4022(f) and 4022(a)(2)(C); DoD Other Transactions Guide, Version 2.0 (July 2023); USD(A&S)
    memorandum of August 27, 2025
  what: 'A follow-on production contract or transaction is one to produce, sustain, or otherwise implement the results
    of a successfully completed prototype project for continued or expanded use by DoD, and it may be awarded to
    the prototype participants without further competition [1029] [1054]. DIU puts it this way: a competitively
    awarded prototype OT "may result in the award of a follow-on production contract or agreement without the use
    of additional competitive procedures" [97]. DoD''s guide names Production OTs under 10 U.S.C. 4022(f) as one
    of three OT types [1049].

    '
  who_for: Participants in a prototype OT that was competitively awarded and successfully completed [1029] [1054].
  how_it_works:
  - 'Two conditions (4022(f)(2)): "competitive procedures were used for the selection of parties for participation
    in the transaction" and "the participants in the transaction successfully completed the prototype project provided
    for in the transaction" [1029] [1054]'
  - 'Notice: the statute as now in force allows the follow-on award "even if explicit notification was not listed
    within the request for proposal for the transaction" [1029]; it was amended after GAO sustained a 2018 protest
    in which the prototype agreement had no follow-on provision [1074]. DoD''s 2018 memo says solicitation documents
    and prototype agreements must include notice of potential follow-on production OTs [1059], and the July 2023
    guide says the solicitation and the Prototype OT agreement should include it [1049]'
  - '"Successfully completed" means the performer met the key technical goals, satisfied the success metrics in
    the Prototype OT, or accomplished a particularly favorable or unexpected result [1049]; successful completion
    requires a written determination [1059]; it can occur before the whole prototype project ends, so that a useful
    part can move to production [1050]'
  - 'Consortia: a follow-on may be awarded when DoD determines that an individual prototype or prototype subproject
    within a consortium is successfully completed; it is not contingent on completion of all consortium activities
    (4022(f)(3)) [1029] [1130]'
  - 'Form: follow-on awards may be made under 4022(a), under chapter 137, or under procedures the Secretary establishes
    by regulation (4022(f)(5)), so the follow-on may be an OT or a FAR contract [1029] [97]'
  - 'Approval: a follow-on production contract or transaction over $100,000,000 (including all options) needs a
    covered official''s written determination that (d) was met for the prior prototype transaction, that (f) will
    be met, and that use is essential to meet critical national security objectives, with the congressional defense
    committees notified at the time the authority is exercised [1028] [1060]'
  - 'Who approves in DoD: service acquisition executive (military departments); Director (DARPA/DIU/MDA); for defense
    agencies and combatant commands, Director or commanding officer up to $100M and USD(R&E) or USD(A&S) above [1060]'
  - A Comptroller General access clause is required for Prototype or follow-on production OTs with payments over
    $5 million [1049]
  - Prototypes or follow-on items may be provided to another contractor as Government-furnished equipment (4022(g))
    [1028]
  - 'GAO sustained one protest on this route: in Oracle America (B-416061, May 31, 2018) "the Army did not properly
    exercise the authority granted to it under the statute", because the prototype OTA had no follow-on provision
    and the prototype project was not complete at award [1074]'
  - The Court of Federal Claims has held that "nothing in the OT statutes expressly removes OT follow-on contracts
    from the purview of this Court's jurisdiction" [1083]
  - 'In practice: production OTA use was $2 billion in fiscal year 2024; ten of 18 weapon-system efforts GAO reviewed
    have awarded or plan FAR contracts for further development and testing before FAR production; DoD''s manual
    reporting named 48 FAR production contracts using follow-on authority and only seven (15 percent) actually were
    [1070]'
  - 'Within consortia: "Nearly all consortia-based OTA obligations were through prototype OTAs rather than production
    OTAs." [1122]; NAMC says its GVS OTA allows follow-on production [1231]; ATI describes MATAC''s OTA as for prototyping
    and production [1210]'
  - Research OTs carry no follow-on production authority [1055]
  - Under the amended CSO statute a product, service or item acquired through a commercial solutions opening may
    also lead to a follow-on production contract or transaction as defined in section 4022 [1033] [806]
  - 'What a small firm must have: a prototype OT that was competitively awarded and successfully completed [1029]
    [1054]; a SAM registration that stays active through award, since a lapse ended one protester''s case [1083]'
