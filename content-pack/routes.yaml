    text: 'FAR-overhaul numbering: the RFO Part 19 model deviation text issued September 26, 2025 states the rule
      once, at 19.104-1, for everything above the micro-purchase threshold: the contracting officer must set aside
      when two or more responsible small businesses are reasonably expected to offer at fair market prices, quality
      and delivery [391]. RFO Part 13 (September 18, 2025) restates the small-business reservation at 13.102 [396],
      and RFO Part 2 (October 28, 2025) carries the $15,000 and $350,000 thresholds [393]. GSA adopted RFO Part
      19 by Class Deviation RFO-2025-19, effective November 3, 2025 [400]; DoD by Class Deviation 2026-O0037, effective
      February 1, 2026, with a deviation DFARS Part 219 [402]. The codified FAR is unchanged at FAC 2026-01 [418].'
