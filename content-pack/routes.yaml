    guide read is NAII 1050-3D, last updated 2026-04-07 [1089].
- id: doe-other-transaction
  name: DOE other transaction (42 U.S.C. 7256)
  family: ot-cso
  governing_text: 42 U.S.C. 7256(a) and (g); Energy Policy Act of 2005, sections 988 and 1007; 2 CFR Part 930 (Technology
    Investment Agreements issued on or after January 3, 2025; formerly 10 CFR 603); DOE Guide to Other Transactions
    (August 2023)
  what: 'The Secretary of Energy "may exercise the same authority to enter into transactions (other than contracts,
    cooperative agreements, and grants), subject to the same terms and conditions" as the Secretary of Defense under
    10 U.S.C. 2371 [now 4021], other than subsections (b) and (f) [1092]. DOE''s guide distinguishes the general
    authority in section 7256(a) from the R&D authority in section 7256(g) [1093]. DOE names the DOE Organization
    Act, 42 U.S.C. 7256, and the Energy Policy Act of 2005 as the authority [1094].

    '
  who_for: Research and development partners of DOE; DOE's guide defines non-traditional contractors as entities
    that have not received a Federal prime award for at least five years [1093]. Unsolicited proposals go to the
    National Energy Technology Laboratory [1094].
  how_it_works:
  - 'Conditions in the statute: competitive, merit-based selection procedures as practicable; a written determination
    that a standard contract, grant or cooperative agreement is not feasible or appropriate; delegable only to a
    presidentially appointed, Senate-confirmed officer [1092]'
  - 'Approval: section 7256(g) agreements need approval by a Senate-confirmed officer with delegated authority;
    all OTs go through Office of Acquisition Management business clearance and Senior Procurement Executive approval
    [1093]'
  - 'Cost share: the EPAct section 1007 standard is that Government funds do not exceed the total from other parties;
    EPAct section 988 allows reduction or elimination for applied R&D [1093]'
  - 'Patents: without Bayh-Dole, title to inventions would vest in DOE under its title-vesting statutes unless the
    agreement provides otherwise; section 7256(g) allows negotiation of patent and data rights [1093]'
  - '"U.S. manufacturing clauses should almost always be included to the extent feasible and practicable" [1093]'
  - 'Consortia: "Consortium arrangements are commercial agreements and DOE is not party to the consortium"; a consortium
    may be run by a lead member or by a consortium manager [1093]'
  - Technology Investment Agreements are governed by 2 CFR Part 930 for agreements issued on or after January 3,
    2025, replacing 10 CFR 603 [1094]
  - 'ARPA-E, inside DOE, has its own award authority: "the Director may provide awards in the form of grants, contracts,
    cooperative agreements, cash prizes, and other transactions" (42 U.S.C. 16538(f)); no public ARPA-E OT guide
    was found [1100]'
  gates:
  - ot-ip-rights
  situations:
  - have-technology
  official_url: https://www.energy.gov/management/other-transaction-authority
  pending_changes: []
  as_of: '2026-10-03'
