    and VAAR subpart 819.70'
  what: A contracting officer in any agency can award to a certified service-disabled veteran-owned small business
    without competition below a dollar cap (FAR 19.1406) [591]. Inside the Department of Veterans Affairs, the Veterans
    First Contracting Program gives SDVOSBs and then VOSBs priority over the other small-business programs [592]
    [657].
  who_for: 'SBA-certified SDVOSBs; in VA, certified VOSBs as well (certifications.yaml: vosb-sdvosb-vetcert).'
  how_it_works:
