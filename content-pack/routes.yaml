  - 1093
  - 1094
  - 1100
  conflicts:
  - '"Non-traditional" differs by agency: DOE''s guide uses no Federal prime award for at least five years [1093];
    DoD''s 10 U.S.C. 3014 uses no DoD contract or subcontract under full cost accounting standards coverage in the
    prior year [1032].'
  - 'Expiry: the fetch tool reported a "September 30, 2030" date in 42 U.S.C. 7256(g) without clear context [1092];
    DOE''s guide states no expiration [1093]. Unresolved.'
- id: faa-other-transaction
