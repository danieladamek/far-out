- id: teaming-contractor-team-arrangements
  name: Teaming and contractor team arrangements (FAR 9.6, Small Business Teaming Arrangements, GSA MAS CTAs)
  family: partnering
  governing_text: FAR 9.601 to 9.604; provision FAR 52.207-6 (Aug 2024) and 13 CFR 121.103(b)(9) for Small Business
    Teaming Arrangements; provision FAR 52.203-2; GSA Multiple Award Schedule program guidance for Schedule CTAs
    (GSA states FAR subpart 9.6 does not apply to them)
  what: 'FAR 9.601 recognises two forms of contractor team arrangement: two or more companies form a partnership
    or joint venture to act as a potential prime contractor, or a potential prime agrees with other companies to
    have them act as its subcontractors under a specified contract [761]. The Government recognises such arrangements
    provided they are identified and the company relationships are fully disclosed in the offer (FAR 9.603) [761].
    A GSA Schedule Contractor Team Arrangement is a different thing: two or more Multiple Award Schedule contractors
    team on a single requirement and each operates as a prime contractor for the portion of work it performs [762].'
  who_for: Any offeror that needs complementary capability (FAR 9.6); small firms bidding together on bundled or
    large multiple-award contracts (Small Business Teaming Arrangement); Multiple Award Schedule contract holders
    (Schedule CTA).
  benefits:
  - '"The Government will not normally require or encourage the dissolution of contractor team arrangements." (FAR
    9.603) [761]'
  - 'Small Business Teaming Arrangement: on bundled or multiple-award contracts above the substantial bundling threshold,
    a small prime may team with small subcontractors without affiliation if each member is small (13 CFR 121.103(b)(9))
    [770]'
  - A prime may use a subcontractor's experience and past performance, including an incumbent's, to strengthen its
    offer (13 CFR 121.103(h)(3)(ii)) [706]
  - 'Schedule CTA: each team member has privity of contract with the government and can interact with it directly
    [763]; each member reports its own sales and pays its own Industrial Funding Fee [762]'
  requirements:
  - 'FAR 9.603: identify the arrangement and fully disclose the company relationships in the offer, or before the
    arrangement becomes effective if it is formed after the offer [761]'
  - 'FAR 9.604: the Government may still require consent to subcontracts, determine the prime''s responsibility,
    pursue competitive contracting, subcontracting and component breakout, and hold the prime fully responsible;
    "Nothing in this subpart authorizes contractor team arrangements in violation of antitrust statutes" [761]'
  - Every offeror certifies under FAR 52.203-2 that its prices were arrived at independently, were not knowingly
    disclosed to another offeror or competitor, and that it made no attempt to induce another concern to submit
    or not submit an offer for the purpose of restricting competition; the provision text does not specifically
    address joint or team proposals (per the extract) [765]
  - 'Small Business Teaming Arrangement (FAR 52.207-6): two or more small businesses in a joint venture, or a small
    prime with small subcontractors under a written agreement designated as a Small Business Teaming Arrangement
    that sets out responsibilities, roles and percentages of work [764]'
  - 'Schedule CTA: every team member is a MAS contractor with its own MAS contract number [762]; for a small-business
    set-aside order the lead and all members must meet the specified socioeconomic status [762], and "All members
    of the CTA must be small for the CTA to be eligible for that order." [763]'
  - 'Schedule CTA agreement elements GSA lists: parties and MAS contract numbers; lead and members; team responsibilities;
    duration and options; ordering procedures; invoicing and payment; independent-contractor relationship; confidential
    information; conflict resolution favouring MAS terms; member replacement; each member reporting its own sales
    and paying its own IFF; pricing at or below MAS rates; signatures [762]'
  - Prime-subcontractor teaming on a set-aside is tested under the ostensible subcontractor rule and the limitations
    on subcontracting (see the gate ostensible-subcontractor-affiliation) [770] [424]
  how_it_works:
  - 'Timing: arrangements are normally formed before the offer but may be entered later, including after award (FAR
    9.602) [761]'
  - 'Schedule CTA: the government is not involved in drafting the CTA document; GSA "strongly encourages" submitting
    it in response to an RFQ [763]; for FPDS reporting the ordering agency determines which party receives the preponderance
    of revenue [762]'
  - 'Antitrust enforcement: DOJ''s Procurement Collusion Strike Force, established November 2019, pursues bid rigging,
    price fixing and market allocation in government procurement and reports 200+ investigations opened and 85+
    guilty pleas and trial convictions as of April 30, 2026; its page does not mention teaming agreements or joint
    ventures [827]'
  - 'Guidance gap: on December 11, 2024 the FTC and DOJ withdrew the April 2000 Antitrust Guidelines for Collaborations
    Among Competitors, saying they "no longer provide reliable guidance about how enforcers assess the legality
    of collaborations involving competitors." [828]'
  - 'Where a teaming-style deal becomes bid rigging, in DOJ''s words: a July 9, 2025 Sherman Act indictment alleged
    a would-be competitor agreed to "stand down and neither submit nor join an independent competing bid" in exchange
    for subcontracts; it concerned a state-university procurement, not a federal one, and the page notes a later
    presidential pardon [830] (press release located through a law-firm note [831])'
  steps:
  - 'Prime-subcontractor team or joint venture under FAR 9.6: agree the roles, then identify the arrangement and
    disclose the relationships in the offer [761]'
  - 'Small Business Teaming Arrangement: put it in a written agreement so designated, with responsibilities, roles
    and percentages of work [764]'
  - 'Schedule CTA: draft the CTA document covering the elements GSA lists and submit it with the quote [762] [763]'
