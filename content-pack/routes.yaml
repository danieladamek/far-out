    Guide, Version 2.0, Appendix F (not read)
  what: 'For most OT consortia, "members pay dues to join the consortium and gain exclusive access to government
    opportunities" [1071]. DoD awards a base OTA to a consortium management organization; "DOD selects the consortium
    member awardee and typically awards the project to the CMO.", which issues a sub-award to the member [1120]
    [1119]. Consortia-based OTAs account for half of DoD''s prototype OTA obligations, FY2021–FY2024 [1070] [1121].

    '
  who_for: 'Traditional and nontraditional firms alike: consortium pages say "Companies that are part of the US
    Defense Industrial base as well as new and emerging non-traditional defense contractors are encouraged to join"
    [1170] [1192]. Membership is mostly nontraditional: 80% to 85% at the four consortia GAO examined [1121]; NSTXL
    states 83% non-traditional members [1138]; NAMC 70% [1228]; SOSSEC "Nearly 80% of the membership are non-traditional
    companies." [1233]; ATI says "80% of our members are small or emerging innovators" [1157].'
  how_it_works:
  - 'Find the consortium: MITRE''s AiDA page lists 36 OT consortia grouped by sponsor (9 OSD-sponsored, 6 Air Force/Space
    Force, 10 Army, 8 Navy, 3 non-DoD), each with focus, sponsoring office, manager and URL; last updated 2025-09-22
    [1115]. A DoD notice of 2024-04-24 (HQ0102240001), read only through a commercial mirror, points to that page
    as the fiscal year 2024 DoD consortia list maintained under Section 833 of Public Law 116-283 [1116] [1117]'
  - 'Join: one NSTXL membership covers every OTA NSTXL manages [1138] [1141]; ATI consortia are joined one by one
    in three steps: find a consortium, apply, then access solicitations once accepted [1156]; CMG''s C5 and CEED
    each take their own application [1220] [1222]'
  - 'Documents commonly asked for: a signed Consortium Membership Agreement; a UEI; an active SAM.gov account; an
    active DD2345; a CAGE code; for firms under foreign ownership, a FOCI mitigation plan or Export Compliance Acknowledgment
    Form [1160] [1168] [1185] [1187] [1201]'
  - Dues as posted run from nothing (NSTIC, RRPV, Cornerstone; DIBC in the first year) [1193] [1215] [1235] [1191],
    through $250 a year (MCDC, CWMD) [1185] [1187] and $500 a year (TReX II, VLC, C5, CEED, NAMC) [1160] [1178]
    [1220] [1222] [1229], to $1,000 or $5,000 a year at MTEC [1180] and up to $10,000 at NSTXL for corporate members
    with annual revenue of $100M+ [1138]; NAC charges a one-time $500 [1168]. Exact tables are in programs.yaml
  - 'Fees on awards: NSTIC assesses 0.05% of all awarded funding; AMTC 0.15%; DOTC and NEST 0.5% [1194] [1169] [1172].
    C5 and CEED each assess "a small management and administrative fee, expressed as a fixed percentage" with no
    rate on the page [1220] [1222]. NSTXL says "NSTXL is paid a management fee by the Government." and takes no
    percentage of the performer''s invoice [1142]'
  - 'Requests: the sponsor issues a request to members through the manager (a Request for White Papers at C5 and
    DOTC, a Request for Solutions or Request for Prototype Proposal at NSTXL, a Request for Project Proposals at
    MTEC); members answer; the Government evaluates and selects; a full proposal follows for selected concepts [1224]
    [1166] [1143] [1182] [1227]'
  - 'Who may respond: "You must be a member of NSTXL to submit a response to any request." [1142]; NAMC says "These
    projects are all exclusive to NAMC—perks of the consortia" [1229]'
  - 'Who may look: S²MARTS requests are posted publicly while SpEC requests need membership and a DD2345 [1142];
    DOTC''s schedule is public but "To view complete solicitation information please visit the NAC Members Only
    site." [1166]; MTEC, NASC and NSTXL list solicitation titles or statuses without login [1182] [1226] [1143]'
  - 'The statutory condition is applied project by project: "DOTC, NEST, and AMTC solicitations require NDC participation
    or 1/3 cost share on each proposed effort." [1169]; the 2017 C5 base agreement requires one-third cost share
    unless an NDC participates to a significant extent or all significant participants are small businesses or NDCs
    [1224]; NSWC Crane briefed the same condition for S²MARTS [1152]'
  - '"A transaction includes all individual prototype subprojects awarded under the transaction to a consortium
    of United States industry and academic institutions." [1029]'
  - 'Award: under the 2017 C5 base agreement a bilateral modification obligates project funding, a Technical Direction
    Letter authorizes work, and the manager issues a Project Agreement to the selected member [1224]; at NSTXL agreement
    finalization takes about 3–5 business days after selection notice [1142]'
  - 'Registration: "each member serving as the primary performer on an award must obtain a Unique Entity Identifier
    (UEI) from SAM." [1049]; the Inspector General found in 2021 that there was no DoD requirement for consortium
    members to register in SAM [1124]'
  - 'Time to award as managers state it: NSTXL "just over 100 days" on average [1144]; SpEC reports one request-to-award
    in under 8 months [1147]; UTIC issues requests for prototype proposals twice a year [1198]; DOTC releases a
    Request for White Papers each month [1166]'
  - 'Why agencies use consortia, per officials GAO interviewed: a ready pool of vendors including nontraditional
    ones; government–industry collaboration before solicitation; administrative support through a single point of
    contact; faster execution using standard templates [1119]. NSWC Crane''s reasons for one broad consortium: avoid
    a proliferation of OTAs and "Limit burden to small vendors, no need to join several consortia" [1152]'
  - 'Criticisms on record, dues and overlap: "Officials from one company told us their firm has joined 20 different
    consortia and pays about $30,000 a year in membership dues."; several consortia cover the same technology areas;
    a DARPA official said dues may exclude innovative companies [1119]'
  - 'Criticisms on record, manager pay: consortium management organization compensation ranged from 0.7% to 21.3%
    of obligated dollars on 12 OTAs GAO reviewed, at least $332 million in FY2019–2021, paid by seven methods [1119];
    the Inspector General found fees of 1.55% to 6% of project value and no guidance for negotiating them [1124]
    [1123]'
  - 'Criticisms on record, competition: "DoD contracting personnel did not always compete base OTs to the maximum
    extent practicable" [1124]; CRS records the argument that consortia "reduce competition, since only members
    of the consortium under contract can participate." alongside GAO''s finding that members gain exclusive access
    [1079] [1071]'
  - 'What a small firm must have: membership in the consortium that carries the sponsor''s work; for most defense
    consortia read, a DD2345; a UEI from SAM to be primary performer [1160] [1168] [1196] [1049]'
  gates:
