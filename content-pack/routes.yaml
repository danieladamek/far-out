- id: simplified-acquisition-and-micro-purchase
  name: Simplified acquisition and micro-purchase
  family: setaside-vehicle
  governing_text: FAR 13.003; FAR 13.201; FAR 13.301; FAR 2.101 (thresholds); 15 U.S.C. 644(j)(1)
  what: Agencies use simplified acquisition procedures to the maximum extent practicable for purchases at or below
    the simplified acquisition threshold (FAR 13.003(a)) [438]. Purchases between the micro-purchase threshold and
    the simplified acquisition threshold are set aside for small business (FAR 13.003(b)) [438]. For micro-purchases
    the Governmentwide commercial purchase card is the preferred method, and almost no clauses apply (FAR 13.201)
    [440].
  who_for: Any firm for micro-purchases; small businesses for purchases between the micro-purchase threshold and
    the simplified acquisition threshold.
  how_it_works:
  - 'Micro-purchase threshold (FAR 2.101): $15,000; $2,000 for construction; $2,500 for services; $25,000 (inside
    the United States) / $40,000 (outside) for the emergency categories [418]; raised from $10,000 on October 1,
    2025 [417]'
  - 'Simplified acquisition threshold: $350,000, raised from $250,000 on October 1, 2025 [417]'
  - 'Above $15,000 and not over $350,000: reserved for small business unless two competitive small-business offers
    cannot be obtained (FAR 13.003(b); 15 U.S.C. 644(j)(1)) [438] [374]'
  - 'Micro-purchases: the purchase card is the preferred method to purchase and to pay (FAR 13.201(b)); no provisions
    or clauses are required except as at 13.202 and 32.1110 (FAR 13.201(d)) [440]'
  - The card may be used by contracting officers and other designated individuals, for micro-purchases, for orders
    under existing contracts, and for payment (FAR 13.301) [441]
  - Purchase-card micro-purchases are among the listed exceptions to the SAM registration requirement (FAR 4.1102)
    [302]
  - 'GSA tells cardholders to check sources in order: personal property, UNICOR (mandatory over $3,500 unless waived),
    AbilityOne, then the commercial platforms, then open market [445]; eight commercial platforms support purchases
    at or below the micro-purchase threshold [444]'
  - 'Getting found: the SAM registration populates SBA''s Small Business Search; agencies advertise contracts over
    $25,000 on SAM.gov; SubNet lists subcontracting opportunities posted by large primes [443]'
  - Schedule contractors' catalogues are ordered through GSA Advantage, where federal buyers pay by purchase card
    or activity address code [446]
