- id: crada
  name: Cooperative Research and Development Agreement (CRADA)
  family: partnering
  governing_text: 15 U.S.C. 3710a
  what: An agreement for joint research and development with a federal laboratory. The Government may provide personnel,
    services, facilities, equipment, intellectual property or other resources "with or without reimbursement (but
    not funds to non-Federal parties)" [1511]. The lab may accept, retain and use funds, personnel, services and
    property from a collaborating party [1511].
  who_for: ARL's CRADAs are open to academia, large and small business and foreign business [1518]. The statute
    gives special consideration to small business firms and consortia involving small business firms, and preference
    to U.S.-located businesses agreeing to manufacture substantially in the United States [1511].
  how_it_works:
  - 'Money moves one way only: "federal laboratories can receive funds from their collaborator(s), but the laboratory
    cannot provide any funds to its collaboration partner(s)" [1518]; "NIST cannot provide funds to the other Collaborator(s)."
    [1516]; the Navy can provide labor, materials, facilities and services but not funds [1522]'
  - 'Inventions: the collaborating party is offered the option of an exclusive license for a pre-negotiated field
    of use for inventions made under the agreement; the Government retains a nonexclusive, paid-up license [1511].
    At NSWC Indian Head, title follows the inventor''s employer and joint inventions are jointly owned [1522]'
  - 'Confidentiality: a partner''s trade secrets and privileged or confidential commercial information are not disclosed;
    information produced under the agreement may be protected for up to 5 years [1511] [1516]'
  - 'Approval: the agency has 30 days to disapprove or require modification of an agreement [1511]'
  - 'NIST: commercial products from CRADA intellectual property must be substantially manufactured in the United
    States [1516]'
  - 'Timeline, one division''s figures: "Usually about 2-4 weeks. However, delays of 3 or 4 months have occurred
    in obtaining a company''s corporate office approval." [1522]; the NIST and ARL pages state no timeline or fee
    [1516] [1518]'
  - 'Finding a lab: the Federal Laboratory Consortium is "the nationwide network of over 300 federal laboratories
    and research centers" [1513]; FLC Business indexes technologies available for licensing, laboratory facilities
    and equipment, funding opportunities and lab programs, and is free: "No log in required to search." [1515]'
  - 'Starting points named by the labs: ARL''s ORTA@arl.army.mil [1518]; DEVCOM_Partnerships@army.mil [1521]; model
    CRADAs and licenses are available from the Navy ORTA representative [1522]; "The CRADA is a flexible agreement
    that is tailored to each partnership" [1523]'
  - FLC's T2 Mechanisms page lists CRADAs alongside facility usage agreements, technology licenses, material transfer
    agreements, Space Act Agreements, educational partnership agreements, partnership intermediary agreements and
    other transactions [1514]
  - SBIR.gov's tutorial names CRADAs, licensing and technical assistance as ways to work with a federally funded
    R&D center, and says some FFRDCs provide limited technical assistance at little or no cost [1545]
  gates: []
