- id: research-ot
  name: Research other transaction (10 U.S.C. 4021)
  family: ot-cso
  governing_text: 10 U.S.C. 4021; Guide to Research Other Transactions Under 10 U.S.C. 4021 (OUSD(R&E), revised
    July 2025); 32 CFR Part 37 (Technology Investment Agreements)
  what: 'The Secretary of Defense and each military department Secretary "may enter into transactions (other than
    contracts, cooperative agreements, and grants) under the authority of this subsection" in carrying out basic,
    applied, and advanced research projects [1031] [1030]. Research OTs are focused on validating research results
    rather than delivering the resulting technology [1052]. They "do not include authority for follow-on production
    contracts or transactions" [1055].

    '
  who_for: Performers of basic, applied and advanced research who can share the cost [1052]. Statutory award authority
    sits with the Secretary of Defense, the military department Secretaries and DARPA; others need delegation [1052].
    The Secretary of Defense acts through DARPA, DIU, or any other DoD element the Secretary designates; the Defense
    Innovation Unit was added by Pub. L. 118-31, section 913(a)(2) (Dec. 22, 2023) [1031] [1030].
  how_it_works:
  - 'Conditions (4021(e)): the Secretary must ensure, to the maximum extent practicable, no duplication of research
    under existing DoD programs, and, to the extent the Secretary determines practicable, that Government funds
    do not exceed the total provided by other parties [1031] [1055]'
  - Resource share is required and, to the maximum extent practicable, Government funds do not exceed the total
    provided by the other parties [1052]; DARPA's training says cost share 50/50 is preferred for research [1063]
  - 'Advance payments: "The authority provided under subsection (a) may be exercised without regard to section 3324
    of title 31." [1030]'
  - Proposals, business plans and technical information submitted are protected from disclosure for five years after
    receipt (4021(i)) [1030]
  - A research OT structured as an assistance transaction may be a Technology Investment Agreement under 32 CFR
    Part 37 [1055]
  - A Comptroller General access clause is not required for Research OTs [1049]
  - 'Still applicable: fiscal laws, regulations and policies; suspension and debarment; lobbying restrictions; criminal
    statutes; export laws; industrial security. Not applicable: the Competition in Contracting Act and the DoD Grants
    and Agreements Regulations [1052]'
  - '"Laws and regulations of general applicability or unrelated to the award process will generally still apply
    to Research OTs" [1052]'
  - 'IP: "OTs are not subject to the statutory regimes of the Bayh-Dole Act (35 U.S.C. 201-212) for patentable inventions
    or 10 U.S.C. 3771 for technical data"; IP rights are fully negotiable [1052]'
  - 'Disputes: agreements should set out how either party raises a dispute and favor alternative dispute resolution
    [1052]'
  - 'Within consortia the research form is rare: of $24,337.9 million obligated on consortia-based OTAs in FY2019–2021,
    research was $34.6 million [1119]'
  - 'What a small firm must have: resource share, with Government funds not exceeding the other parties'' total
    to the extent practicable [1052]; the sweep found no certification prescribed [1055]'
