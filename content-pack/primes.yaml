- id: lockheed-martin
  name: Lockheed Martin
  supplier_portal_url: https://podio.com/webforms/8182136/612474
  portal_note: Registration is by submitting marketing information in the Supplier Marketing Portal [833].
  registration_asks:
  - 'Portal profile: "Include all NAICS codes" [834]'
  - '"Include self-certified size according to the Small Business Administration''s size standard" [834]'
  - '"Be sure to include your quality certifications and clearances" [834]'
  - The FAQ does not itemise the portal's fields; it says "Clearly state your size and status in your online submission"
    [833]
  liaison_named:
    status: office-or-mailbox
    text: 'The FAQ says SBLOs are often more accessible for conversation and offers a link to request one; no SBLO
      is named on the pages read [833]. Mailboxes given: Supplier.Communications@lmco.com (step 4 of the marketing
      guide) [834] and supplier.communications@lmco.com for the mentor-protégé programme [836].'
  programs:
  - name: Mentor-Protégé Program
    authority: Government agency programmes; the company names no single one as its own. The Programs page links
      the mentor-protégé pages of the Department of Defense, Department of Energy, Department of Homeland Security,
      EPA, FAA and NASA [836]; the Resources page links "DOD Mentor/Protégé Program" and "SBA Mentor Protege Program"
      [837].
    text: '"The Mentor Protégé Program is a government outreach program designed to encourage large defense contractors
      to develop technical and business capabilities of small businesses" [836]. "Formal mentoring is done under
      a Mentor Protégé contract tied to a government contract" [833].'
  - name: SBIR directory
    authority: Small Business Innovation Research Program, as the page names it [834].
    text: 'Step 5 of the marketing guide, for R&D firms: "Subscribe to the Lockheed Martin Small Business Innovation
      Research Program (SBIR) directory"; contact page https://www.lockheedmartin.com/en-us/suppliers/sbir/sbir-contact.html
      [834].'
  selection_statement: '"Most opportunities will be by invitation to participate in a competitive bid" [833]. "Lockheed
    Martin anticipates subcontracting requirements as part of the contract bid process." [833]'
  forecast_statement: No forecast is published on the pages read. "Opportunities do not exist in all areas at all
    times"; windows of opportunity "might be on an annual basis or as far out as ten years" [833]. The marketing
    guide names an annual report, Business Areas pages, a "What We Buy" Directory and a Corporate Agreements Listing
    as research sources and points to an events calendar [834]; the small-business landing page lists an "Upcoming
    Events Calendar" [835].
  also_states:
  - '"it is the corporation''s policy to facilitate its negotiated contracting goals to small and small disadvantaged
    businesses, HUBZone, women- and veteran-owned small businesses" [835]'
  - The Programs page also mentions the Veteran Institute for Procurement and an AbilityOne contact [836]
  - The Resources page links SAM, SBA size standards, SubNet, eSRS, NIST and CISA small-business cybersecurity material
    and APTAC; several links are legacy addresses (fbo.gov, fpds.gov, dss.mil), as printed on the page [837]
  unreadable:
  - The Supplier Marketing Portal form (podio.com) was disallowed by robots.txt; its fields were not read.
  - Capability statement, CMMC attestation and insurance requirements are not stated on the pages fetched.
