# help.yaml — FAR Out content pack · assembled 2026-10-03 from the SBIR/STTR sweeps (slices A–D). Every entry carries recheck: true until quotes are verified against live pages.
- id: apex-accelerators
  name: APEX Accelerators (formerly Procurement Technical Assistance Centers)
  what: 'APEX Accelerators (formerly known as Procurement Technical Assistance Centers) provide technical assistance
    to businesses interested in selling products or services to federal, state, and local governments [471]. The
    program is administered by the DoD Office of Small Business Programs through cooperative agreements with state
    and local governments and non-profits [469]. As of October 2023 the network had 90-plus APEX Accelerators with
    over 300 local offices and more than 600 procurement advisers [469]. Ohio''s host page lists bid preparation
    help, bid-matching, military specifications, one-on-one training and procurement histories, at no charge to
    Ohio businesses [470].

    '
  who_for: Businesses interested in selling products or services to federal, state and local governments [471]
  how_to_find: SBA points to the national locator at https://www.apexaccelerators.us/#/ [471]. State hosts may run
    their own finders; Ohio's county finder is at https://find.govcontracts.ohio.gov/contact/ [470].
  official_url: https://www.apexaccelerators.us/
  pending_changes: []
  as_of: '2026-10-03'
  sources:
  - 469
  - 470
  - 471
  - 472
  conflicts: []
- id: sbdc
  name: Small Business Development Centers (SBDC)
  what: 'Small Business Development Centers give individual advising and technical assistance on capital, planning,
    technology, marketing and export [473]. SBA lists SBDCs among its contracting-specific helpers [472]. SBA''s
    page gives no count of centers [473].

    '
  who_for: Small businesses seeking general business advising and technical assistance [473]
  how_to_find: SBA's finder at https://www.sba.gov/local-assistance [473]
  official_url: https://www.sba.gov/local-assistance/resource-partners/small-business-development-centers-sbdc
