    rise (October 1, 2025) [417], the fiscal year 2026 defense authorization act (December 18, 2025) [1273] [1033],
    the SBIR and STTR reauthorization (April 13, 2026) [1], the CMMC Phase II suspension (announced July 13, 2026)
    [625] and the 8(a) rule (final August 11, 2026, effective September 10, 2026) [314]. Eight items are known here
    only from secondary sources or from texts that could not be read, and they are marked as such. Left off the
    chart: one record dated only to the year 2025, NSF Translation to Practice [1401], and three records dated outside
    the window.
  how_to_read: >-
    Time runs left to right and each row is a status, so you can see at a glance what is law (final), what is in
    use by deviation, what is enacted but not yet implemented, and what is only proposed or announced. Each point
    is one change record; points stacked at one date happened on the same day. Check the series before you rely
    on a point: anything not marked as read from a primary text is reported, not confirmed. A point shows when a
    change was made or announced, which is not always when it takes effect.
  explain:
  - 'on': 'y: status'
    text: >-
      The status word on the change record. Final means a law, final rule or completed action; class-deviation means
      agencies follow new text while the codified text stays in force; pending-implementation means enacted with
      no implementing document found; proposed and announced carry no legal effect yet.
  - 'on': 'series: basis'
    text: >-
      How the record is sourced: primary (the governing text or official page was read), primary-partial (read in
      part), secondary-only (reported by commentary only), unread (the text is listed but could not be read) or
      unconfirmed (not confirmed as live).
  - 'on': points at 2025-12-18
    text: >-
      Ten records share December 18, 2025: nine on the fiscal year 2026 defense authorization act and one on DoD
      class deviations dated the same day. Sections 1802, 1823 and 1804 were verified in the U.S. Code [1273] [1033]
      [1036]; sections 1822, 1824 and 824 were read as headings only and their content comes from digests [806]
      [1108].
  - 'on': plot_date
    text: >-
      The date field of the record. Three records give only a month and are placed on its first day; the date_precision
      column marks them.
  - 'on': class-deviation row
    text: >-
      The FAR overhaul reaches contracts this way for now: model text is issued part by part and adopted agency
      by agency. Part 19 was taken up by GSA from November 3, 2025 and by DoD from February 1, 2026 [400] [402].
  concepts: [where-the-numbers-live, how-a-buy-happens]
  discussed_in: [8-what-changed, 1-why-this-matters, 9-how-to-read]
  source: >-
    One row per record in changes.yaml dated from December 2024 to October 2026; date, status, basis and sources
    are copied from the record and the short title is the builder's. Month-only dates are plotted on the first of
    the month (plot_date) with the original kept in date. Nothing else was converted.
- id: sbir-phases
  label: Figure 8
  title: SBIR/STTR from Phase I to Phase III, with the branches around it
  kind: pathway
  synthesis: conceptual
  refs: [1, 5, 10, 11, 20, 29, 31, 35, 55, 64, 108, 109, 149, 225, 235, 236, 239]
  data: figures/data/sbir-phases.json
  script: figures/scripts/sbir-phases.py
  caption: >-
    SBIR and STTR run in three phases. Phase I tests feasibility, with a base guideline of $150,000; Phase II continues
    the work, with a base guideline of $1,000,000; Phase III is work that derives from, extends or completes the
    earlier work and is paid from other funds, with no limit on number, duration, type or dollar value [5]. As of
    April 2026 agencies may go to $323,090 and $2,153,927 without seeking SBA approval [11]. Around that line sit
    the branches. Direct to Phase II skips Phase I on a written determination of demonstrated feasibility and now
    runs until September 30, 2031 at NIH, DoD, Education, DOE and NASA [5] [1]. Fast-Track, at NSF, joins a $400,000
    Phase I component to a Phase II of up to $1,155,000 in one award [35]. One sequential Phase II may follow the
    first [5]. The Strategic Breakthrough award is not more than $30,000,000 over not more than 48 months and needs
    at least one prior Phase II award and not less than 100 percent matching funds [1]. After Phase II, agency transition
    programs add money or help: TACFI and STRATFI [236], Army CATALYST [239], the Navy's STP [235], ART [55], APFIT
    [108] [109], NIH's Commercialization Readiness Pilot [31] and NSF's Phase IIB supplement [35]. An agency may
    award Phase III sole source under 15 U.S.C. 638(r)(4) [225].
  how_to_read: >-
    Follow the heavy line left to right for the standard path: Phase I, Phase II, Phase III. The boxes above and
    below Phase I are other ways in, and both arrive at Phase II. The boxes after Phase II are what can follow it
    before or alongside Phase III; the list under the transition box names the agency programs. Open a box in the
    app to see its amounts, time limits and the text behind them. The figure shows what the rules allow, not what
    any agency will fund in a given year.
  explain:
  - 'on': 'node: Phase III'
    text: >-
      Not a third award from the SBIR budget. It is any work that derives from, extends or completes Phase I or
      II work, funded from other sources, and the size limits for Phases I and II do not apply to it [5].
  - 'on': 'node: Direct to Phase II'
    text: >-
      The posted directive still lists only NIH, DoD and Education and an expired date; Pub. L. 119-83 extended
      the authority to September 30, 2031 and added DOE, NASA and STTR [5] [1].
  - 'on': 'node: Strategic Breakthrough award'
    text: >-
      A new tier in the 2026 act for agencies whose required SBIR spending exceeds $100,000,000. Defense awards
      carry extra conditions, including a commitment from a senior acquisition official [1].
  - 'on': 'node: Fast-Track'
    text: >-
      NIH also offers Fast-Track and counts those applications in its per-firm limit of nine a fiscal year [31]
      [29].
  - 'on': 'nodes: transition programs'
    text: >-
      Each has its own eligibility and matching rule. APFIT is procurement funding that only a government organisation
      can request on a firm's behalf; the firm must be a small business, a nontraditional defense contractor, or
      one with no more than $400,000,000 in contracts in the prior year [109].
  concepts: [sbir-phases-101]
  discussed_in: [5-getting-funded-for-rd]
  source: >-
    Conceptual figure drawn by the builder. Nodes and edges are in figures/data/sbir-phases.json. Amounts and durations
    in the node details are as the cited statute, directive and agency pages give them; nothing was converted. The
    transition programs shown are those with a program record in this pack and are not a complete list.
