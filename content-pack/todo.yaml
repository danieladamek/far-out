- id: t-PD014
  kind: unverified
  about: gates
  text: 'Sweep D''s draft "steps" include practical suggestions with no source; they are left out of the records
    and listed here for the author. Accelerated payment: check the subcontract carries the substance of 52.232-40.
    Flow-down: ask the prime which clauses are in its prime contract; separate mandatory flow-downs from the prime''s
    own terms; negotiate the latter. Data rights: keep records showing private-expense development; license the
    prime only what it needs to perform. SBIR: tell the prime and the contracting officer in writing that the work
    is Phase III; ask that 252.227-7018 be in the subcontract. Disputes: read the disputes, governing-law and forum
    clauses; ask for a sponsorship clause obliging the prime to pass claims up; avoid broad releases that end the
    prime''s liability. Past performance: put the rating right in the subcontract; diarise the 30-day window; keep
    the prime contract number. Size: recompute size before each certification; update SAM; track the joint venture''s
    first award date. Teaming: define work share and price or attach the subcontract; avoid exclusivity that blocks
    direct sales.'
