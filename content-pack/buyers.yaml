- id: aaf-software-acquisition
  name: Software Acquisition (AAF pathway)
  kind: buyer-pathway
  governing_text: DoD Instruction 5000.87, Operation of the Software Acquisition Pathway [1254]; FY2020 NDAA §800
    and the Secretary's memo "Directing Modern Software Acquisition to Maximize Lethality", March 6, 2025, as cited
    on the pathway page [1252].
  date: '2020-10-02'
  date_note: DoDI 5000.87 is dated October 2, 2020 [1254]; listed as Oct 2020 on the official policy list [1238].
    The March 6, 2025 memo PDF returned 403 and was not read.
  what: '"This pathway is for the timely acquisition of custom software capabilities developed for the DoD" [1252].
    It has two paths, applications and embedded software, is not subject to JCIDS and is not treated as an MDAP
    [1252].

    '
  timelines:
  - Demonstrate viability within 1 year of first obligation; deliver at least annually [1252]
  - MVP and MVCR deployed within 1 year of first obligation (applications path); deliveries at least annually after
    [1254]
  decision_authority:
  - The program manager recommends the pathway and the milestone decision authority or decision authority approves
    it; pathways may be combined or used in sequence [1239]
  - CAEs are decision authorities unless USD(A&S) designates special interest [1254]
  - The PM approves any commercial or proprietary software before insertion (§3.2.e.5) [1254]
  - Since December 18, 2025 the statute has program managers report to a portfolio acquisition executive, who reports
    to the component or service acquisition executive and may "modify, discontinue, or terminate" underperforming
    efforts [1273]
  industry_entry:
  - Services may come "from the DoD, the DoD components, other government agencies, or commercial providers" (§1.2.h)
    [1254]
  - '"Leveraging existing enterprise services, if available, is preferred over creating unique software services
    for individual programs." [1254]'
  - The instruction requires a flexible, modular contract strategy and an IP strategy and is silent on small business
    and OTs, per the sweep's summary of the instruction [1254]
  - CSOs and OTs "as the default solicitation and award approaches for acquiring capabilities under the SWP" (strategy
    p. 2, restating the March 6, 2025 memo) [1264]
  - 'DIU''s account of the memo: "After a successful prototype, any interested DoD entity has the authority to enter
    into non-competitive follow-on production contracts" [1255]'
  - The develop-strategies page lists five strategy documents (acquisition, contracting, IP, test, product support)
    and, as returned, does not mention CSOs, OTs, small business or the March 2025 memo [1253]
  official_url: https://aaf.waru.edu/aaf/software/
