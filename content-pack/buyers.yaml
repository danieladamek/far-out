- id: grants-cooperative-agreements-model
  name: Grants and cooperative agreements model (31 U.S.C. 6303–6305; 2 CFR Part 200)
  kind: buyer-pathway
  governing_text: 31 U.S.C. 6303, 6304 and 6305 [1017]; 2 CFR Part 200, Uniform Administrative Requirements, Cost
    Principles, and Audit Requirements for Federal Awards [1328].
  date: '2026-10-01'
  date_note: eCFR section pages up to date as of 2026-10-01 [1328]; the statutory test dates from Pub. L. 97-258,
    1982 (from Pub. L. 95-224, 1978) [1017].
  what: 'A procurement contract is the instrument when the principal purpose is "to acquire (by purchase, lease,
    or barter) property or services for the direct benefit or use of the United States Government" [1017]. A grant
    or cooperative agreement instead transfers a thing of value "to carry out a public purpose of support or stimulation
    authorized by a law of the United States"; a grant is used when "substantial involvement is not expected" and
    a cooperative agreement when "substantial involvement is expected" [1017]. "A grant is a way the government
    funds your ideas and projects to provide public services and stimulate the economy." [1329]

    '
  timelines:
  - NOFOs are posted on Grants.gov; generally open at least 60 calendar days, no fewer than 30 with justification
    (200.204) [1328]
  - Merit review (200.205) and risk review (200.206) before award [1328]
  - 'Lifecycle: pre-award (announcement, application review); award; post-award (implementation, reporting, closeout)
    [1329]'
  - 'De minimis indirect rate: "up to 15 percent of modified total direct costs" (200.414(f)) [1328]'
  - Single audit at $1,000,000 or more in federal awards expended in a fiscal year (200.501(a)) [1328]
  decision_authority:
  - The awarding agency picks the instrument by the statutory test in 31 U.S.C. 6303–6305 [1017]
  - The agency conducts merit review and risk review before award [1328]
  industry_entry:
  - Register in SAM.gov first (free; "Allow up to 10 business days"; renew yearly); the UEI flows into applications;
    the EBiz POC creates the Grants.gov profile and assigns roles such as Authorized Organization Representative
    [1329]
  - 'Front doors in this pack that list assistance instruments beside contracts and OTs: NGA''s BIG-ST BAA (procurement
    contracts, grants, cooperative agreements, other transactions) [1314]; DARPA''s DSO office-wide BAA (cooperative
    agreement, procurement contract, other) [1320]'
  - The DIU OnRamp Hub network is itself run under a cooperative agreement [1287]
  official_url: https://www.grants.gov/learn-grants/grants-101
