  name: Major Capability Acquisition (AAF pathway)
  kind: buyer-pathway
  governing_text: DoD Instruction 5000.85, Major Capability Acquisition [1251].
  date: '2020-08-06'
  date_note: August 6, 2020, with Change 1 of November 4, 2021 [1251]; listed as Nov 2021 on the official policy
    list [1238].
  what: 'The pathway for military-unique, enduring programs, run through phases and milestones under a milestone
    decision authority, as the sweep summarises the pathway page [1250].

    '
  timelines:
  - 'Phases: MSA, TMRR, EMD, P&D, O&S; decisions: MDD, Milestones A, B, C [1250]'
  - 'ACAT I: above $525M RDT&E or $3.065B procurement (FY2020 dollars); ACAT II: $200M RDT&E / $920M procurement
