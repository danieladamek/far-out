- id: civilian-procurement-model
  name: Civilian procurement model (FAR Parts 7, 10, 12, 13, 15 and 19)
  kind: buyer-pathway
  governing_text: Codified FAR Part 7 [1323], Part 10 [1324], Part 12 [601], Part 13 [602], Part 15 [1325], Subpart
    19.2 [1326] and Subpart 19.4 [1327], with acquisition.gov showing FAC 2026-01, effective 03/13/2026 [1323];
    15 U.S.C. 637(a)(12)(C) [579]; 15 U.S.C. 644(g) and (k) [374]. The codified sections are the primary citations;
    overhaul deviation numbering is recorded under pending_changes.
  date: '2026-03-13'
  date_note: FAC 2026-01, effective 03/13/2026, as shown on FAR pages [1323].
  what: '"Agencies shall perform acquisition planning and conduct market research for all acquisitions." [1323]
    If commercial items can meet the need, Part 12 procedures shall be used (10.002(d)(1)), on a firm-fixed-price
    or fixed-price with economic price adjustment basis (12.207(a)) [1324] [601]. Small purchases run under Part
    13 and negotiated buys under Part 15, by tradeoff or lowest price technically acceptable, per the sweep''s summaries
    of those Parts [602] [1325]. The sweep found no pathway framework on the civilian side comparable to the AAF;
    that framing is the sweep''s and is not a quoted statement.

    '
  timelines:
  - Market research is required before new requirements documents, before soliciting above the SAT, and before bundling
    or consolidation [1324]
  - 'Written plan required for cost-reimbursement and other high-risk contracts (7.103(e)); consolidation determination
    above $2 million (7.107-2); substantial bundling: $8 million DoD; $6 million NASA, GSA, DOE; $2.5 million other
    agencies (7.107-4) [1323]'
  - Acquisition package to the SBA PCR at least 30 days before solicitation for specified large or consolidated
    buys (19.202-1(e)(1)) [1326]
  - PCR recommendation due within 15 days of receiving the package (19.402(c)(2)) [1327]
  - Micro-purchase threshold $15,000 (FAR 2.101, fetched separately); Subpart 13.5 commercial simplified procedures
    up to $9 million ($15 million in specified cases) [602]
  - Part 12 takes precedence over inconsistent FAR policy (12.102(c)) [601]
  - Past performance is evaluated in competitive buys above the simplified acquisition threshold (15.304(c)(3));
    the FAR text gives the term, not a dollar figure [1325]
  decision_authority:
  - Each agency has an OSDBU (Office of Small Business Programs in DoD); the Director reports to the agency head
    or deputy (19.201(c)) [1326]; the statute has the Director "report directly and exclusively to, the head of
    such agency or to the deputy of such head" [374]
  - The small business specialist is part of the planning team, per the sweep's summary of Part 7 [1323]
  - Contracting officers must make every reasonable effort to find additional small business sources (19.202-2(a))
    [1326]
  - The SBA procurement center representative's role includes "Reviewing proposed acquisitions to recommend–the
    set-aside or sole-source award to a small business"; the PCR may recommend new small business sources and component
    breakout and may appeal a rejected recommendation [1327]
  - The OSDBU Director identifies bundled solicitations, assigns a small business technical adviser to each office
    and makes recommendations to contracting officers [374]
  industry_entry:
  - 'Agency forecasts: the duty applies to executive agencies reporting more than $50 million in annual contract
    actions; the forecast includes number of opportunities, dollar-value ranges, anticipated quarter of solicitation
    and responsible activity, and "such forecasts shall be available to small business concerns" [579]'
  - acquisition.gov keeps a directory of agency forecast pages, 22 listed in the fetch, at https://www.acquisition.gov/procurement-forecasts
    [581]; DOI's page covers anticipated contracts above the simplified acquisition threshold, is updated annually
    in October, and gives projections, not commitments [676]
  - 'Exchanges with industry before the RFP (15.201): industry conferences, one-on-one meetings, presolicitation
    notices, draft RFPs, RFIs, site visits [1325]'
  - 'Market research techniques: contacting industry, RFIs, database queries, catalogs, presolicitation conferences
    (10.002(b)) [1324]'
  - Acquisitions above the micro-purchase threshold, but at or below the simplified acquisition threshold, "shall
    be set aside for small business concerns" [602]
  - '"It is the policy of the Government to provide maximum practicable opportunities in its acquisitions to small
    business" [1326]'
  - 'Governmentwide goals: small business not less than 23 percent; SDVOSB 5 percent; HUBZone 3 percent; SDB 5 percent;
    WOSB 5 percent [374]'
