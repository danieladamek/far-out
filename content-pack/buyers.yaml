  - status: announced
    date: 2025-11
    text: 'Acquisition Transformation Strategy, primary and read: MTA approvals are delegated "to the lowest permissible
      levels"; MTA Advisory Boards are eliminated and replaced with a digitized system (p. 20). MTA is not eliminated
      [1264].'
  - status: announced
    date: '2025-11-07'
    text: 'November 2025 reforms, primary and read: the Acquisition Transformation Strategy was announced on November
      7, 2025 together with three Secretary of War memoranda [1263]. The strategy gives portfolio acquisition executives
      "expanded authorities for resourcing, requirements, and acquisition decisions within prescribed portfolios"
      (p. 15), directs OT authority "for prototype and follow-on production efforts where in the best interest of
      the warfighter and the taxpayer" (p. 10), and proposes portfolio scorecards to track delivery, production
      scale and use of commercial solutions (p. 21) [1264].'
  - status: announced
    date: '2025-11-07'
    text: 'November 2025 reforms, SECONDARY ONLY: the memorandum on transforming the Defense Acquisition System
      into the Warfighting Acquisition System is named in the official release [1263], but its PDF returned 403
      and its content is known only from a third-party-hosted copy or digest and from law-firm digests. Reported:
      PAEs with single accountability over portfolios and four-year terms with a possible two-year extension; commercial
      products and offerings as the preferred approach; USW(A&S) implementing guidance in 30 days, Military Department
      PAE implementation plans in 60 days, commercial-first guidance in 90 days, modularity and other reforms in
      180 days [1265]; 150–180 days for regulatory updates [1266]; full PAE transition within 2 years [1267]. None
      of this is confirmed against the memo.'
