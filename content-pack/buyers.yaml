- id: aaf-defense-business-systems
  name: Defense Business Systems (AAF pathway)
  kind: buyer-pathway
  governing_text: DoD Instruction 5000.75, Business Systems Requirements and Acquisition [1258]; 10 U.S.C. 2222,
    as named on the pathway page [1256].
  date: '2017-02-02'
  date_note: February 2, 2017, with Change 2 of January 24, 2020 [1258]; listed as Jan 2020 on the official policy
    list [1238]. The bare URL returned 403; the dated URL from the policy list worked [1258].
  what: 'The pathway runs business systems through the Business Capability Acquisition Cycle with a commercial-first
    stance, as the sweep summarises the pathway page [1256]. "DoD reduces risk and maximizes benefits by using commercial-off-the-shelf
    software successfully demonstrated in commercial marketplace." [1256]

    '
  timelines:
  - 'Five BCAC phases: Capability Need Identification; Solution Analysis; Functional Requirements and Acquisition
    Planning; Acquisition, Testing and Deployment; Capability Support [1256]'
  - Authority-to-proceed points between each BCAC phase [1258]
  decision_authority:
  - The program manager recommends the pathway and the milestone decision authority or decision authority approves
    it; pathways may be combined or used in sequence [1239]
  - 'Category I: FYDP above $250M (MDA is the DAE); Category II: above $50M (CAE); Category III: below $50M [1258]'
  - Since December 18, 2025 the statute has program managers report to a portfolio acquisition executive, who reports
    to the component or service acquisition executive and may "modify, discontinue, or terminate" underperforming
    efforts [1273]
  industry_entry:
  - PMs must "engage further with industry (e.g., market research, benchmarking, requests for information, industry
    days)" (§4.2.c.1.b) [1258]
  - The acquisition strategy must describe "use of COTS or reasons not to use COTS" (App. 4B.2.i.1) [1258]
  - The instruction "will minimize the need for customization of commercial products to the maximum extent practicable"
    [1258]
  - The pathway's contracting page names FAR Part 12, Part 15, IDIQ/GWAC orders and prototype OTs with possible
    follow-on production; a commercial item determination is required for FAR Part 12 use; contracting officers
    may set aside orders under IDIQ contracts (FAR Part 19) [1257]
  official_url: https://aaf.waru.edu/aaf/dbs/
  pending_changes:
