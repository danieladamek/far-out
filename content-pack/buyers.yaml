- id: aaf-middle-tier-of-acquisition
  name: Middle Tier of Acquisition (AAF pathway)
  kind: buyer-pathway
  governing_text: 10 U.S.C. 3602, enacted by Pub. L. 118-159, December 23, 2024 [1249]; DoD Instruction 5000.80,
    Operation of the Middle Tier of Acquisition (MTA), which implements section 804 of Pub. L. 114-92 [1248].
  date: '2019-12-30'
  date_note: DoDI 5000.80 as returned is dated December 30, 2019 [1248]; the official policy list dates it Nov 2024
    [1238]. The statute was enacted December 23, 2024, and LII shows no Pub. L. 119-60 amendment to it [1249].
  what: '"Rapidly develop fieldable prototypes within an acquisition program to demonstrate new capabilities and/or
    rapidly field production quantities of systems with proven technologies that require minimal development." [1245]
    It has two paths, rapid prototyping and rapid fielding, each with Planning, Execution and Completion phases
    [1245].

    '
  timelines:
  - 'Rapid prototyping: residual operational capability "within 5 years of the MTA program start date" (§1.2.c)
    [1248]'
  - 'Rapid fielding: "begin production within 6 months and complete fielding within 5 years" (§1.2.d) [1248]'
  - 'Statute: rapid prototyping within five years; rapid fielding with production within six months and completion
    within five years; the requirements process is to complete "in a period of not more than six months" [1249]'
  - '"MTA programs may not be planned to exceed 5 years to completion" [1247]; the 5-year limit runs from program
    start, with a DAE waiver to exceed [1246]'
  - 'Residual operational capability: "any military utility for an operational user that can be fielded" [1247]'
  decision_authority:
  - The program manager recommends the pathway and the milestone decision authority or decision authority approves
    it; pathways may be combined or used in sequence [1239]
  - Component Acquisition Executives are decision authorities unless delegated (§2.6.a) [1248]
  - Programs expected to exceed the MDAP threshold need a written USD(A&S) decision before obligating funds (§4.1.c)
    [1248]
  - '"MTA program production start date will not exceed 6 months after MTA program start date without DAE waiver."
    [1248]'
  - Since December 18, 2025 the statute has program managers report to a portfolio acquisition executive, who reports
    to the component or service acquisition executive and may "modify, discontinue, or terminate" underperforming
    efforts [1273]
  industry_entry:
  - As returned, DoDI 5000.80 contains no OT, industry, commercial or small-business language [1248]
  - The WarU overview page names Other Transactions and "Procurement for Experimental Purposes (10 USC 2373)" as
    ways small and nontraditional firms compete; 10 USC 2373 is the old section number, now 10 U.S.C. 4023 [1246]
  - The overview page says MTA encourages small business and nontraditional contractors and that prototyping can
    lead to follow-on production, per the sweep's summary of the page [1246]
  - The rapid prototyping path page names no contracting vehicle [1247]
  - The selecting-a-pathway page mentions OT agreements as a contracting vehicle for MTA [1239]
  - Technologies demonstrated via rapid prototyping "may be transitioned to major capability acquisition programs"
    (DoDI 5000.85 §3.2.c) [1251]
  official_url: https://aaf.waru.edu/aaf/mta/
