- id: aaf-acquisition-of-services
  name: Acquisition of Services (AAF pathway)
  kind: buyer-pathway
  governing_text: DoD Instruction 5000.74, Defense Acquisition of Services [1261].
  date: '2020-01-10'
  date_note: January 10, 2020, with Change 1 of June 24, 2021 [1261]; listed as June 2021 on the official policy
    list [1238].
  what: 'The pathway applies to "Contracted services with a total estimated value at or above the simplified acquisition
    threshold (SAT)." [1259] It uses seven steps: form the team; review current strategy; market research; define
    requirements; develop acquisition strategy; execute strategy; manage performance [1259].

    '
  timelines:
  - Seven steps, with no fixed duration recorded in the sweep [1259]
  - 'S-CAT I: $1B+ or $300M+/year; II: $250M–$1B; III: $100M–$250M; IV: $10M–$100M; V: SAT–$10M [1261]'
  decision_authority:
  - The program manager recommends the pathway and the milestone decision authority or decision authority approves
    it; pathways may be combined or used in sequence [1239]
  - S-CAT I–II decided by SAE/CAE or designee; III–V by the component Senior Services Manager or designee [1261]
  - Since December 18, 2025 the statute has program managers report to a portfolio acquisition executive, who reports
    to the component or service acquisition executive and may "modify, discontinue, or terminate" underperforming
    efforts [1273]
  industry_entry:
  - '"increase small business participation as prime and subcontractors" (§3.2.b.3) [1261]'
  - OSBP reviews decisions to convert work performed by a small business (§1.2.c.4) [1261]
  - '"Existing government-wide contracts should be used to maximum extent practicable" (§1.2.d.3) [1261]'
  - '"Market research to collect information to maximize reliance on the commercial marketplace" [1261]'
  - Step 3 describes sources-sought notices, RFIs and one-on-one meetings as normal practice and links market research
    to small-business set-aside decisions, per the sweep's summary of the page [1260]
  - '"One-on-one meetings with industry leaders are not only permissible (ref FAR15.201 (c)(4)) they are highly
    encouraged." [1260]'
