- id: aaf-urgent-capability-acquisition
  name: Urgent Capability Acquisition (AAF pathway)
  kind: buyer-pathway
  governing_text: DoDI 5000.81, Urgent Capability Acquisition, and DoDD 5000.71, as named on the pathway page [1243];
    framework instruction 5000.02, Operation of the Adaptive Acquisition Framework [1238]. The DoDI 5000.81 PDF
    returned 403 and was not read; this record rests on the WarU pathway pages.
  date: '2019-12-31'
  date_note: DoDI 5000.81 effective December 31, 2019 per the pathway page [1243]; listed as Dec 2019 on the official
    policy list [1238].
  what: '"Field capabilities to fulfill urgent existing and/or emerging operational needs or quick reactions in
    less than 2 years." [1243] It is one of the six pathways of the Adaptive Acquisition Framework [1237].

    '
  timelines:
  - '"in less than 2 years" [1243]'
  - 'Ceiling: below $525M RDT&E and $3.065B procurement (FY2020 constant dollars) [1243]'
  - Letter contracts are definitized "by 180 days or before completion of 40% of work" [1244]
  decision_authority:
  - The program manager recommends the pathway and the milestone decision authority or decision authority approves
    it; pathways may be combined or used in sequence [1239]
  - The MDA decides which deficiencies must be resolved and acceptable risk [1243]
  - Since December 18, 2025 the statute has program managers report to a portfolio acquisition executive, who reports
    to the component or service acquisition executive and may "modify, discontinue, or terminate" underperforming
    efforts [1273]
  industry_entry:
  - The pathway's contracting page names Federal Supply Schedules (FAR 8.4), letter contracts (FAR 16.603) and orders
    under existing IDIQ, multiple-award and GWAC contracts (FAR 16.5) [1244]
  - It also names research OTs (10 U.S.C. 4021), prototype OTs (10 U.S.C. 4022) and procurement for experimental
    purposes (10 U.S.C. 4023) [1244]
  - 'Prototype OT conditions as restated on the page: nontraditional participation, all small or nontraditional
    participants, one-third cost share, or a senior procurement executive determination [1244]'
  - '"competition should be pursued to the maximum extent practicable to incentivize high quality and competitive
    pricing" [1244]'
  - The sweep's draft record adds that small-business set-aside is named as a fair-opportunity exception for IDIQ
    and GWAC orders and that the pathway page itself states no small-business provision; neither point is among
    the extracted key facts [1244] [1243]
  official_url: https://aaf.waru.edu/aaf/uca/
  pending_changes:
  - status: announced
    date: 2025-11
    text: The Acquisition Transformation Strategy sets a goal of delivering kill chains "within 24 months of an
      operational demand signal using commercial-off-the-shelf products" (p. 32) [1264]. The sweep's draft record
      describes this as a proposal to explore a new or amended pathway; that wording is not among the extracted
      key facts.
  - status: announced
    date: '2025-11-07'
    text: 'November 2025 reforms, primary and read: the Acquisition Transformation Strategy was announced on November
      7, 2025 together with three Secretary of War memoranda [1263]. The strategy gives portfolio acquisition executives
      "expanded authorities for resourcing, requirements, and acquisition decisions within prescribed portfolios"
      (p. 15), directs OT authority "for prototype and follow-on production efforts where in the best interest of
      the warfighter and the taxpayer" (p. 10), and proposes portfolio scorecards to track delivery, production
      scale and use of commercial solutions (p. 21) [1264].'
  - status: announced
    date: '2025-11-07'
    text: 'November 2025 reforms, SECONDARY ONLY: the memorandum on transforming the Defense Acquisition System
      into the Warfighting Acquisition System is named in the official release [1263], but its PDF returned 403
      and its content is known only from a third-party-hosted copy or digest and from law-firm digests. Reported:
      PAEs with single accountability over portfolios and four-year terms with a possible two-year extension; commercial
      products and offerings as the preferred approach; USW(A&S) implementing guidance in 30 days, Military Department
      PAE implementation plans in 60 days, commercial-first guidance in 90 days, modularity and other reforms in
      180 days [1265]; 150–180 days for regulatory updates [1266]; full PAE transition within 2 years [1267]. None
      of this is confirmed against the memo.'
  - status: final
    date: 2026-04
    text: 'April 2026 change to 5000.02, TEXT UNREAD: the official policy list shows "DoWI 5000.02, Operation of
      the Adaptive Acquisition Framework — April 2026" [1238]. A secondary tracking site, the only source for the
      day and for calling it a change and not a reissue, records "DoWI 5000.02 ''Operation of the Adaptive Acquisition
      Framework'' (23 January 2020 with 8 April 2026 Change)" [1242]. The fetch of the instruction returned the
      January 23, 2020 text with Change 1 of June 8, 2022, so what the April 2026 change says is not known [1241].
      The six pathway instructions are still listed under their DoDI numbers [1238].'
  - status: final
    date: '2025-12-18'
    text: 'FY2026 NDAA, Pub. L. 119-60 §1802, verified in the U.S. Code: adds 10 U.S.C. 1732, the portfolio acquisition
      executive, the "senior acquisition official designated by the component acquisition executive or the service
      acquisition executive"; program managers report to the PAE, and the PAE is to "prioritize the use of transactions
      for prototype projects" [1273]. The section heading is in the Act''s table of contents [806].'
  - status: final
    date: '2025-12-18'
    text: 'FY2026 NDAA, Pub. L. 119-60 §1823, verified in the U.S. Code: amends 10 U.S.C. 3458, the defense CSO
      statute. The definition of "innovative" and the prior $100M approval requirement are removed and a follow-on
      production authority is added; contracts or agreements "shall be fixed-price, including fixed-price incentive
      contracts"; awards above $100,000,000 require notice to the congressional defense committees within 45 days
      [1033].'
  - status: final
    date: '2025-12-18'
    text: 'FY2026 NDAA, Pub. L. 119-60 §1804(c), verified in the U.S. Code: 10 U.S.C. 3702 sets the certified cost
      or pricing data threshold at $10,000,000 for prime contracts entered after June 30, 2026, replacing $2,000,000;
      the nontraditional defense contractor subcontract alternative figure shown is $5,000,000 [1036].'
  - status: final
    date: '2025-12-18'
    text: 'FY2026 NDAA §1822, SECONDARY ONLY: the heading "commercial products and services" is in the Act''s table
      of contents [806]. Its content is reported by digests only: a written memorandum is required before noncommercial
      procurement methods are used [1108], from the contracting officer and the PAE in one digest [1274]. Statute
      text not read.'
  - status: final
    date: '2025-12-18'
    text: 'FY2026 NDAA §1824, SECONDARY ONLY: the heading "flowdown limits" is in the Act''s table of contents [806].
      The sweep''s findings describe it as flowdown limits for commercial subcontracts on the strength of the secondary
      digests taken together, with no source-level detail recorded [1108] [1110] [1274]. Statute text not read.'
  - status: final
