# scope.yaml — FAR Out · the record the guide is accountable to; renders on /methods; queries are every search run, with links returned as hits
topic: Rather than just an informational application I want one that I can access from anywhere, so in github pages,
  that serves as a navigation and education site for all things for a small business whose primary business is supporting
  federal government programs ... a source for walking me through any path available for doing business with the
  federal government and of course large primes and other partnering arrangements. Also built into this I'd like
  a search capability that finds opportunities from these various sites.
question: For a small business that wants federal work, what routes exist (direct contracts and set-asides, contract
  vehicles, SBIR/STTR and other R&D funding, Other Transactions and Commercial Solutions Openings, and work through
  primes and partners), what does each require, how does the government on the other side of the table actually
  buy, and what has changed in 2025-26 that the official pages have not caught up with?
purpose: orientation
boundary:
  in:
  - 'the four route families: SBIR/STTR and innovation front doors; set-asides, certifications and contract vehicles;
    primes and partnering; Other Transactions, consortia and CSOs'
  - 'the government buyer''s side: the six AAF pathways, the civilian procurement model, the grants model, each
    agency''s small-business office and forecast'
  - 'the gates: registrations, representations, cybersecurity, accounting, clearance, export, bonding, labor, payment'
  - 'what changed in 2025-26: the FAR overhaul, the Warfighting Acquisition System, the SBIR/STTR reauthorization,
    8(a) reform, CMMC, the FY2026 NDAA'
  - 'free help: APEX Accelerators, SBA partners, agency outreach'
  - what large primes say on their own supplier pages, recorded as stated
  out:
  - state and local contracting
  - foreign military sales and export licensing beyond the registration gate
  - grants other than SBIR/STTR (they appear in search results only)
  - proposal-writing and pricing coaching
  - anything tailored to a specific firm
  - recommendations of paid consultants, tools or memberships
  rationale: 'Daniel: any small contractor should be able to use this; no connection whatsoever to any one firm.
    Out-list proposed by the builder on 2026-10-03 and not objected to.'
level: 'the firm: what it must be, hold and do to enter each route; the agency: how it decides to buy'
time_window:
  current_from: 2024
  seminal: statute, regulation and policy directives of any age that govern a route
stance: navigation-with-provenance
depth: deep
anchors:
- citation: Adaptive Acquisition Framework, aaf.waru.edu
  why: Daniel named it
- citation: SBA contracting guide and contracting assistance programs
  why: Daniel named the SBA sites
- citation: SBIR.gov
  why: Daniel named it
- citation: DoD SBIR/STTR Innovation Portal, dodsbirsttr.mil
  why: Daniel named it; robots.txt disallows automated reading, so it is cited by URL only
excluded:
- what: law-firm and consultant commentary as a source of fact
  why: carried only as pointers to a primary source or as flags of pending change; labelled secondary
- what: pages that could not be fetched (congress.gov, uscode.house.gov during maintenance, acq.osd.mil, dodsbirsttr.mil,
    fsd.gov, parts of business.defense.gov)
  why: read on official mirrors where one exists (govinfo, arpa-h.gov OT Community, Cornell LII) and marked for
    re-reading
assumed: false
interview:
- q: Is this meant to be tailored to one firm, or a generic guide any small federal contractor could use?
  answer: NO it should not have any connection whatsoever to CohesionForce. ANY small contractor should be able
    to use this.
  asked: '2026-10-03'
- q: Name?
  answer: I'll want to name this thing "FAR Out"
  asked: '2026-10-03'
- q: How should the spine be organised?
  answer: 'Situation-first: a pathfinder asks where the firm is and leads into a catalogue of the four route families.'
  asked: '2026-10-03'
- q: Which route families in depth for the first release?
  answer: 'All four: SBIR/STTR and front doors; OTs, consortia, CSOs; set-asides and vehicles; primes and partnering.'
  asked: '2026-10-03'
- q: Who is the default reader?
  answer: 'Layered: plain language first, expanding to rule citations and detail.'
  asked: '2026-10-03'
- q: How far on the gates?
  answer: Checklists with links.
  asked: '2026-10-03'
- q: Build path?
  answer: Topic-mode prototype now, with extension files.
  asked: '2026-10-03'
- q: Zotero sync?
  answer: No zotero sync with this
  asked: '2026-10-03'
- q: Recheck per family or once over all four?
  answer: Lets do that then (one recheck over all four families).
  asked: '2026-10-03'
