  defense: false
  what: 'STTR requires a nonprofit research institution partner and an agreement allocating intellectual property,
    and lets the principal investigator be employed by either party [488]. In STTR the small business performs at
    least 40 percent and the research institution at least 30 percent; in SBIR the awardee performs at least two-thirds
    of Phase I and one-half of Phase II [422]. The set-asides are 3.2% of extramural R&D for SBIR and 0.45% for
    STTR [422] [456].

    '
  funds_or_buys: ''
  eligibility:
  - 'SBIR: up to 33% subcontracted in Phase I and 50% in Phase II; PI primarily employed by the small business [488]'
  - 'STTR: small business at least 40%, research institution at least 30%; PI at either [488]'
  - 'Set-aside thresholds: SBIR applies to agencies with extramural R/R&D over $100M and STTR to those over $1B
    [422]'
  - 'DoD contracts: provision 252.227-7040 and clause 252.227-7041 cover STTR intellectual-property allocation [435]'
  - 'NIH: firms majority-owned by venture capital, hedge fund or private-equity firms are ineligible for STTR [332]'
