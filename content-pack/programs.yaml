- id: phase-iii-award
  name: SBIR/STTR Phase III award
  family: sbir-sttr
  kind: transition
  owner: Any federal agency or federal prime contractor; program-wide rules set by SBA under 15 U.S.C. 638
  agency: government-wide
  defense: false
  what: 'Phase III is work that derives from, extends, or completes prior SBIR/STTR work and is funded by sources
    other than the SBIR/STTR programs [422] [429]. Federal agencies and federal prime contractors are to issue Phase
    III awards, including sole source awards, to the firm that developed the technology "to the greatest extent
    practicable" [423] [422]. The Phase I/II competition satisfies statutory competition requirements, so the agency
    need not compete again [422]. There is no limit on the number, duration, type or dollar value of Phase III awards
    [422] [425].

    '
  funds_or_buys: ''
  eligibility:
  - Small business size limits for Phase I and Phase II awards do not apply to Phase III awards [422]
  - There is no time limit between Phase I/II and Phase III [422] [425]
  - The firm must show the new work derives from its own SBIR results; matching government-furnished specifications
    are not enough (Toyon Research Corporation, B-409765, protest denied August 5, 2014) [423]
  - Phase III may be a subcontract under a prime, and multiple Phase III awards from the same or multiple agencies
    are allowed [430]
  - Phase III may be for NASA programs, other agencies, or the private sector [431]
  cycle:
    pattern: 'No solicitation cycle: Phase III contracts are funded from non-SBIR/STTR sources and may be awarded
      without further competition [431].'
    current_solicitations: []
  awards:
  - phase: III
    amount: no limit on number, duration, type, or dollar value
    duration: no limit; no time limit after Phase I/II
    cite:
    - 422
    - 425
  steps:
  - Identify the prior Phase I or II agreement and its topic number [430]
  - Show that the new work derives from, extends or completes that agreement [430]
  - Assert SBIR/STTR data rights in the proposal [430]
  - The contracting officer awards without further competition; the contract file cites 15 U.S.C. 638(r)(4), the
    topic number and the related Phase I or II contract number, and no J&A is required [430]
  - No FAR Part 6 sole source justification and no FAR Part 5 notice is required when 15 U.S.C. 638(r)(4) is used
    [425]
  - The award must be reported in FPDS with a Phase III designation and topic numbers [430]
  - If the agency intends to award elsewhere it must notify SBA in writing before award; SBA may file notice of
    intent to appeal within 5 business days and an appeal within 10 business days, the contracting officer must
    suspend action, and the agency decides within 30 business days [422]
  portal: ''
  registrations: []
  gates:
  - data-rights-marking
  situations:
  - have-technology
  - first-awards
  modifiers:
    rd: true
    product: true
    service: true
  pending_changes:
  - status: pending-implementation
    date: '2027-04-13'
    text: SBA must modify its policy directives within one year after enactment, that is by April 13, 2027 (sec.
      6(a)(2)) [416]; the directive linked on sbir.gov on 2026-10-03 is still the May 2023 one [310]
  - status: pending-implementation
    date: '2026-04-13'
    text: Agencies must develop simplified and standardized procedures and model contracts for Phase I, II and III
      awards, and standardized solicitation provisions and contract clauses on what a firm must show to establish
      Phase III eligibility (sec. 6(b), new 638(r)(4)(C) and (D)); no implementing document was found in sweep D
      [416]
  - status: pending-implementation
    date: '2026-04-13'
    text: SBA, with DoD and GSA, must train contracting officers on SBIR/STTR authorities, Phase III agreements,
      Phase III data rights and execution of Phase III sole-source contracts (sec. 5, new 638(r)(5)); implementation
      not verified in sweep D [416]
  - status: pending-implementation
    date: '2026-04-13'
    text: The SBIR.gov database must classify awards as Phase III prime contract or Phase III subcontract and FPDS
      must capture Phase III designations (sec. 8); implementation not verified in sweep D [417]
  - status: proposed
    date: '2023-04-07'
    text: FAR Case 2020-010 would add an explicit Phase III statement to FAR 6.302-5; proposed rule published April
      7, 2023 with comments due June 6, 2023, and no final rule was found as of 2026-10-03 [428]
  - status: class-deviation
    date: '2026-02-01'
    text: Class Deviation 2026-O0017 tells DoW contracting officers to use the overhauled FAR Part 6 text, effective
      February 1, 2026; the statutory exception appears under a new number (DFARS supplement 206.103-5) and SBIR
      Phase III is not mentioned [427]
  distinctive: 'SBA''s tutorial: "The right to receive sole-source funding agreements is a key Phase III right."
    [432]'
  official_url: https://www.sbir.gov/about/policies
  as_of: '2026-10-03'
  sources:
  - 310
