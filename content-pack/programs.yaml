      of every month, with a pre-release of about three weeks and an open period of four weeks closing at 12:00
      PM ET [41][61][86][72]. DoW and SBA pages still describe three pre-scheduled BAAs/CSOs a year, numbered .1/.2/.3
      (SBIR) and .A/.B/.C (STTR), plus out-of-cycle and annual BAAs [52][56].
