- id: direct-to-phase-ii
  name: Direct to Phase II (phase flexibility, 15 U.S.C. 638(cc))
  family: sbir-sttr
  kind: program
  owner: Agencies named in 15 U.S.C. 638(cc)
  agency: multiple
  defense: false
  what: 'Direct to Phase II allows the award of a Phase II without a prior associated Phase I award, on a written
    agency determination of demonstrated feasibility [40][5]. Public Law 119-83 Sec. 10(a) changed the authority
    from "During fiscal years 2012 through 2025" to "Until September 30, 2031", added the Department of Energy and
    NASA alongside NIH, DoD and the Department of Education, and added "or STTR program" [1][2].

    '
  funds_or_buys: null
  eligibility:
  - 'Agencies named after the 2026 Act: NIH, DoD, Department of Education, Department of Energy and NASA [1][2]'
  - Requires a written determination of demonstrated feasibility [5]
  - A firm failing a standard performance benchmark is ineligible for Direct to Phase II awards for 1 year [13]
  - 'Army: Direct to Phase II allowed where Phase I-type research was done with other funding [82]'
  cycle:
    pattern: Offered as designated topics within agency solicitations; Navy FY-26 Release 5 carried 7 Direct to
      Phase II topics and Release 6 carries 1 Direct to Phase II SBIR topic [72].
    current_solicitations: []
