  - HHS accepts a maximum of nine new and resubmission Phase I, Fast-track and Direct to Phase II applications per
    small business per fiscal year, for due dates on or after April 13, 2026 [330]
  cycle:
    pattern: 'Three standard due dates a year: September 5, January 5 and April 5, moved to the next business day
      when they fall on a weekend or federal holiday [319]. The SBIR parent accepts Phase I, Phase II, Direct to
      Phase II (NIH only) and Fast-Track (NIH only) applications [322]. The parent is listed on Grants.gov [323].
      No targeted announcements were listed on 2026-10-03, only the four parents [319]. NIH expired all active SBIR/STTR
      announcements on November 17, 2025 after authority lapsed on October 1, 2025 [326]. PA-27-100 is a reissue
      of PA-24-245 and PA-24-246 [322].'
