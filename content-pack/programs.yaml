- id: diu-cso
  name: DIU Commercial Solutions Opening
  family: ot-cso
  kind: front-door
  status: live
  status_note: DIU's 2026 CSO guidebook and its open-solicitations page, with closing dates in October 2026, were
    read on 2026-10-03 [1953] [1955].
  owner: Defense Innovation Unit
  agency: DoW
  defense: true
  what: 'DIU, founded August 2015 as DIUx, works in three portfolios in 2026: Autonomous Warfare, Kill Web and the
    10x Portfolio [1959]. It posts an Area of Interest and runs a three-phase Commercial Solutions Opening; awards
    are prototype OT agreements under 10 U.S.C. 4022 with fixed-price milestone payments [1953]. "Any competitively
    awarded OT for Prototype agreement can result in one or more follow-on production awards without further competition"
    [1953].

    '
  funds_or_buys: other-transaction
  eligibility:
  - '"Any individual or commercial entity is eligible to respond to a DIU solicitation." [1952]'
  - Open to traditional and nontraditional contractors, nonprofits, small businesses and foreign-owned firms; SAM
    registration required before award [1954]
  - One-third cost share applies where no nontraditional participates significantly [1954]; the statutory conditions
    are in 10 U.S.C. 4022 subsection (d) [1942]
  - DIU checks ownership, runway and security before the pitch; the agreements officer verifies nontraditional status
    in FPDS-NG [1953]
  - 'An opportunity can add its own terms: CLASS ACT — Investors (PROJ00719) requires nontraditional status, no
    current or prior facility clearance, and at least $100 million of available capital [1956]'
  cycle:
    pattern: An Area of Interest is generally one page and is live on diu.mil "for about 14 days" [1953]; open solicitations
      are listed on DIU's site [1955].
    current_solicitations:
    - id: Low Cost ISR (LC-ISR), Autonomous Warfare portfolio, CSO
      opens: ''
      closes: '2026-10-14'
      note: Closes October 14, 2026 [1955]
    - id: CLASS ACT — Investors (PROJ00719; solicitation HQ084526SC002)
      opens: ''
      closes: '2026-10-13'
      note: Responses due 2026-10-13; single PDF, 10MB maximum; targets investors, not product firms [1956] [1955]
    - id: CLASS ACT — Sensors and Effectors (counter-unmanned, maritime)
      opens: ''
      closes: '2026-10-13'
      note: Closes October 13, 2026 [1955]
  awards:
  - phase: Prototype OT
    amount: No per-award ceiling or typical size; the guide gives no award ceilings or typical award sizes
    duration: Period of performance generally not to exceed 24 months
    cite:
    - 1953
    - 1954
  - phase: Aggregate, FY2023 (DIU's own figures)
    amount: 90 prototype contracts, $298M; 1,768 proposals; 33 new solicitations
    duration: ''
    cite:
    - 1958
  - phase: Aggregate, FY2016–2023
    amount: 450 prototype agreements, $1.7 billion obligated; 62 transitioned (51% of completed), $5.5 billion combined
      ceiling (GAO); 451 awards, $1.7B (DIU)
    duration: Prototype execution typically 12–24 months (GAO)
    cite:
    - 1957
    - 1958
  - phase: Aggregate as stated in March 2025
    amount: Over 500 awards in eight years
    duration: ''
    cite:
    - 1919
  steps:
  - 'Phase 1: brief "Limited to 5 pages or 15 slides", evaluated in about 10 days on relevance, innovation, technical
    merit [1953]'
  - '"Solution Briefs will be evaluated on the basis of merit of proposed concept, not against other submissions."
    [1954]'
  - '"Each brief must stand entirely on its own merits—no cross‑references, no assumed context" [1953]'
  - DIU responds within 30 days if interested [1952]
  - 'Phase 2: live pitch within about 30 days: "20-minute pitch and 40-minute rapid-fire questioning"; outcomes:
    advance, portal hold (180 days), or nonselection [1953]; the pitch includes rough-order-of-magnitude price,
    notional schedule and data-rights assertions [1954]'
  - 'Phase 3: Request for Prototype Proposal and negotiation, 30–60 days; fixed-price milestone payments [1953]'
  - Payment by milestone through WAWF; companies generally retain IP and the Department licenses rights [1952]
  - Follow-on under §4022(f) may be a production OT, a FAR contract, IDIQ, BPA or Schedule listing [1953]
