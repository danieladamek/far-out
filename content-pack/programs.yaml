- id: nsf-sbir-sttr
  name: America's Seed Fund powered by NSF (SBIR/STTR)
  family: sbir-sttr
  kind: program
  owner: National Science Foundation
  agency: NSF
  defense: false
  what: 'NSF funds SBIR and STTR projects across nearly all technology areas and market sectors and does not solicit
    specific technologies [337]. Phase I is a standard grant; Phase II and Fast-Track are fixed amount cooperative
    agreements [337]. A Project Pitch is required for Phase I [338]. A parallel pilot solicitation, NSF 26-511,
    covers scientific instrumentation with the same deadlines and award terms [339].

    '
  funds_or_buys: grants
  eligibility:
  - Fewer than 500 employees; at least 50% of equity owned by U.S. citizens or permanent residents; all funded work
    in the United States [341]
  - PI legally employed at least 20 hours a week; at least one month (173 hours) per six months [341]
  - Project Pitch required for Phase I; at most two pitches per company per 12 months and no more than 3 for the
    same project or technology [338]
  - Each small business can only submit one Project Pitch at a time [342]
  - 'Limit on proposals per organization: 1; one PI per proposal at a time [338]'
  - STTR requires a subaward to a not-for-profit research institution, with 1 PI and 1 co-PI [338]
  - Only NSF Phase I SBIR/STTR awardees are permitted to submit a Phase II proposal [343]
  cycle:
    pattern: Deadlines are July 27, 2026, November 4, 2026, March 4, 2027 and July 7, 2027, then the first Wednesday
      in November, first Thursday in March and first Wednesday in July annually, at 5pm submitter's local time [338]
      [337]. A Project Pitch can be submitted at any time, with a reply in about 1-2 months [341]. Invitations are
      valid for the next two submission deadlines [338]. NSF says firms are notified about funding about 6 months
      after they submit [341]. Solicitations NSF 24-579, 24-580 and 24-582 are archived [340].
    current_solicitations:
    - id: NSF 26-510
      opens: '2026-05-21'
      closes: '2026-11-04'
      note: Posted May 21, 2026; closes is the next deadline, recurring thereafter; anticipated funding $210,000,000
        [338]
    - id: NSF 26-511
      opens: '2026-05-22'
      closes: '2026-11-04'
      note: Pilot emphasis on scientific instrumentation. Posted May 22, 2026; same deadlines; up to $40,000,000
        total anticipated budget [339]
