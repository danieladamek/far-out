  - The TDR expansion began with Refresh 27 (June 2025), which made TDR mandatory for all existing Product SINs
    and the Cloud SIN (518210C) [709]
  - Under TDR, sales are reported monthly, within 30 days after month-end, and the IFF is paid quarterly within
    30 days (it may be paid monthly) [713]
  - TDR grace and trial periods run July 1, 2026 through December 31, 2026, with no enforcement for good-faith data-entry
    errors in that window [714]
  - 'Sales criteria (clause I-FSS-639): the contracting officer may decline the first option if reported sales are
    not expected to exceed $100,000 within the first 60 months after award, and later options if reported sales
    did not exceed $125,000 in each 60-month period thereafter [707]'
  - GSA reports that it eliminated approximately 1,600 MAS contracts in Fiscal Year 2025 and that contracts failing
    sales thresholds were allowed to expire [744]
  - Catalogue data goes to GSA Advantage within 30 calendar days of award and of any modification; price reductions
    are reported to the contracting officer within 15 days of the effective date; the option notification letter
    is answered 165 days before contract end [717]
  - Either party may cancel the contract in whole or in part on written notice, effective 30 calendar days after
    receipt (GSAM 552.238-79) [732]
