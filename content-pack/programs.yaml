  - 422
  - 423
  - 424
  - 425
  - 426
  - 427
  - 428
  - 429
  - 430
  - 431
  - 432
  - 450
  - 455
  conflicts:
  - 'Where the authority sits: the codified FAR 6.302-5 (FAC 2026-01) contains no reference to SBIR/STTR Phase III
    [426] vs acquisition-workforce and Navy guidance that no Part 6 justification is needed under 15 U.S.C. 638(r)(4)
    [425] [430]'
  - 'Statute text: the 638(r)(4) sentence was read only as quoted in a 2014 GAO decision [423]; the fetch of 15
    U.S.C. 638 on a non-government site truncated before subsection (r) [424]'
  - 'Phase III reporting: Navy guidance says Phase III must be reported in FPDS [430] vs GAO''s finding that the
