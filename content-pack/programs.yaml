- id: strategic-breakthrough-awards
  name: Strategic Breakthrough awards (Pub. L. 119-83 Sec. 3)
  family: sbir-sttr
  kind: program
  owner: Agencies whose required SBIR expenditure exceeds $100,000,000
  agency: multiple
  defense: false
  what: 'Public Law 119-83 Sec. 3 creates a strategic breakthrough allocation of not more than 0.50 percent of the
    extramural R/R&D budget, taken from the SBIR allocation, for agencies whose required SBIR expenditure exceeds
    $100,000,000 [1]. An award is not more than $30,000,000 to a small business concern including its affiliates,
    in a single award or a series of milestone-based awards, with a total period of performance of not more than
    48 months [1][2]. These awards are exempt from the award-size limit and the SBA waiver requirement in 15 U.S.C.
    638(aa) [1].

    '
  funds_or_buys: null
  eligibility:
  - Not less than 1 prior Phase II award [1]
  - Not less than 100 percent matching funds from new private capital, new government funding under a program other
    than SBIR/STTR Phase I or II, or a combination [1][2]
  - Must demonstrate a technology that is an effective solution, as determined by market research [1]
  - 'Department of Defense only: a commitment for inclusion in a program objective memorandum from an official at
    program acquisition executive rank or higher; meets high priority requirements or operational needs of a military
    department; not less than 20 percent of the required matching funds from new DoD funding outside SBIR/STTR Phase
    I/II [1]'
  - 'AFWERX: on an active Phase II or one completed within two years, with no second (sequential) Phase II already,
    at least 90 days since Phase II start, and work performed in the United States [66]'
  - 'NSF: by invitation to Phase II awardees [35]'
  cycle:
    pattern: The agency must complete contract awards using the allocation not later than 90 days after receiving
      a proposal [1].
    current_solicitations: []
