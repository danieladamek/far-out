  what: 'The Department of War SBIR/STTR program is managed by the Office for Small Business Innovation under the
    Office of the Under Secretary of War for Research and Engineering and runs as "a competitive, three-phased process"
    [54][53][40]. Topics for the Services and Components are issued through joint BAAs and CSOs, and all proposals
    must be submitted electronically through the Defense SBIR/STTR Innovation Portal (DSIP) [52][56]. After reauthorization
    the Department announced a redesigned initiative, solicitations with over 90 topics and the new Accelerated
    Research for Transition (ART) Program [39][60].

    '
  funds_or_buys: contracts
  eligibility:
  - For-profit entity located in the U.S., fewer than 500 employees, owned and controlled by U.S. citizens or permanent
    residents [14]
  - 'STTR: at least 40% of the work by the small business and 30% by the research institution [65][86]'
  - The small business concern must register with DSIP to submit a proposal in response to any DoW Component topic
    [56]
  - Until 10 Nov 26, where applicable, solicitations will require CMMC Level 1 or 2 self-assessment [61]
  cycle:
