    sources [5]. There is no limit on the number, duration, type, or dollar value of Phase III awards, size limits
    do not apply, and no further competition is required [5]. Agencies must make a good-faith effort to award to
    the original awardee, and may award Phase III as a sole-source contract [5][17].

