# programs.yaml — FAR Out content pack · assembled 2026-10-03 from the SBIR/STTR, set-asides/vehicles and partnering sweeps. Every reference carries recheck: true until quotes are verified against live pages.
- id: sbir-sttr-governmentwide
  name: SBIR/STTR (government-wide framework)
  family: sbir-sttr
  kind: program
  owner: U.S. Small Business Administration (Policy Directive); participating agencies run their own programs
  agency: SBA
  defense: false
  what: 'SBIR and STTR are authorized by section 9 of the Small Business Act, codified at 15 U.S.C. 638, and governed
    by the SBA SBIR/STTR Policy Directive effective May 3, 2023 [3][5]. Agencies with an extramural R/R&D budget
    in excess of $100,000,000 must spend not less than 3.2 percent on SBIR, and agencies with an extramural budget
    in excess of $1,000,000,000 must spend 0.45 percent on STTR [3]. SBIR.gov lists 11 participating agencies, six
    labelled SBIR/STTR and five labelled SBIR only [12]. Public Law 119-83, approved April 13, 2026, moved the termination
    date of both programs from September 30, 2025 to September 30, 2031 [1].

    '
  funds_or_buys: null
  eligibility:
  - Awardee together with its affiliates must not have more than 500 employees [10][15]
  - More than 50% directly owned and controlled by U.S. citizens or permanent resident aliens, other small business
    concerns so owned, an Indian tribe, ANC or NHO, or a combination [10]
  - 'SBIR only: more than 50% owned by multiple venture capital operating companies, hedge funds or private equity
    firms, no single one owning more than 50%, at agencies using 15 U.S.C. 638(dd)(1) authority; STTR has no multiple-VC
    option [10][30]'
  - 'Majority-VC/hedge/PE-owned awardees: NIH, DOE, NSF up to 25% of SBIR funds; other agencies up to 15% [3][5]'
  - VCOCs, hedge funds and private equity firms must have a place of business located in the United States and be
    created or organized in the United States [15]
  - For-profit, with a U.S. place of business [30][14]
  - R/R&D must be performed in the United States, with written-approval exceptions [5][30]
  - 'SBIR principal investigator: primary employment (more than one-half of time) with the small business concern
    at award and during the project [5]'
  - 'STTR principal investigator: primary employment with the small business concern or with the research institution
    [5]'
  - 'STTR work share: not less than 40 percent of the R/R&D by the small business concern and not less than 30 percent
    by the partnering research institution [5]'
  - 'SBIR work share: awardee performs a minimum of two-thirds of the research/analytical effort in Phase I and
    one-half in Phase II [5]'
  - Size and eligibility are determined at the time of award; some agencies also require certification at application
    [15]
  - 'Phase I to Phase II Transition Rate benchmark: firms with 21 or more Phase I awards over the past 5 fiscal
    years (excluding the most recently completed year) need a ratio of at least 0.25 [13]'
  - 'Commercialization Rate benchmark: firms with 16 or more Phase II awards over the past 10 fiscal years (excluding
    the 2 most recently completed) need at least $100,000 of sales and/or investment per Phase II on average, or
    patents equal to 15% of Phase II awards [13]'
  - 'Failing a standard benchmark: ineligible for Phase I and Direct to Phase II awards for 1 year; assessment on
    June 1 each year [13][5]'
  - 'Increased standards effective April 1, 2023: 51+ Phase I awards (5 fiscal years) need a ratio of at least 0.50;
    51+ Phase II awards (10 fiscal years) need $250,000 average; 101+ need $450,000 average; failing firms are limited
    to 20 total Phase I and Direct to Phase II awards from each federal agency for the year [13]'
  - An agency is to "not make an award under the SBIR program of the Federal agency to a small business concern
    if the head of the Federal agency determines that" one of grounds (A) to (F) applies, including a connection
    to an entity or individual on eight named lists [1][4]
  - A denial does not bar eligibility in a later award cycle [1]
  cycle:
    pattern: Firms apply through each agency's SBIR or STTR program before that agency's submission closing date
      [14]. Statutory authority lapsed after September 30, 2025 and resumed on enactment on April 13, 2026; during
      the lapse active awards continued but agencies were not issuing solicitations [3][43][27][1][32].
    current_solicitations: []
  awards:
  - phase: I
    amount: $150,000 base guideline, including modifications
    duration: normally not more than 6 months (SBIR) or 1 year (STTR)
    cite:
    - 5
  - phase: I
    amount: up to $323,090 including modifications without seeking SBA approval, as of April 2026
    duration: ''
    cite:
    - 11
    - 31
  - phase: I
    amount: $50,000–$275,000 (typical range on the SBIR.gov Apply page)
    duration: 6-12 months
    cite:
    - 14
  - phase: II
    amount: $1,000,000 base guideline, including modifications
    duration: normally not more than 2 years
    cite:
    - 5
  - phase: II
    amount: up to $2,153,927 including modifications without seeking SBA approval, as of April 2026
    duration: ''
    cite:
    - 11
    - 31
  - phase: II
    amount: $400,000–$1.8 million (typical range on the SBIR.gov Apply page)
    duration: 24 months
    cite:
    - 14
  - phase: III
    amount: no SBIR/STTR funding; no limit on number, duration, type or dollar value
    duration: ''
    cite:
    - 5
    - 14
  steps:
  - Hold an active SAM registration, renewed at least annually; registration may take 6–8 weeks [37]
  - The UEI is assigned through SAM.gov; DUNS is no longer used as of April 4, 2022 [37]
  - Register at the SBA Company Registry on SBIR.gov before proposal submission and include the SBC Control ID with
    the proposal; the registration is free and the ID is usable at any SBIR/STTR agency [37][36]
  - Registry information must be updated no more than 6 months before proposal submission [5]
  - Apply through the agency's SBIR or STTR program before the submission closing date [14]
  - Certify size, ownership and program requirements at award; again for Phase I at the time of final payment or
    disbursement; and for Phase II prior to receiving more than 50% of the total award amount and prior to final
    payment or disbursement [6]
  - Answer the eight foreign-affiliation disclosure questions in Appendix III of the Policy Directive [6][8]
  - Agencies may exceed the guideline amounts by no more than 50%; a larger award needs an SBA waiver requested
    before solicitation release [5][3]
