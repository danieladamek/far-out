    amount: up to $1,250,000
    duration: typically 24 months
    cite:
    - 338
  - phase: Fast-Track
    amount: up to $1,555,000 (Phase I component $400,000 plus up to $1,155,000 Phase II)
    duration: Phase I component 6 to 12 months plus a further 18 to 24 months
    cite:
    - 337
    - 338
  - phase: Phase IIB supplement
    amount: $50,000 to $500,000
    duration: ''
    cite:
    - 338
  - phase: TECP supplement
    amount: up to 20% of the Phase II award
    duration: ''
    cite:
    - 338
  steps:
  - 'Submit a Project Pitch with four sections: Technology Innovation, Technical Objectives and Challenges, Market
    Opportunity, Company and Team [342]'
  - Wait for an official invitation from an NSF SBIR/STTR program officer [338] [344]
  - Register for a Unique Entity ID (SAM.gov), in Research.gov and in the SBA Company Registry [343]
  - In Research.gov choose NSF 26-510 or NSF 26-511, then the program and phase [345]
  - Submit the full proposal through Research.gov with a copy of the email invitation from an NSF SBIR/STTR program
