    amount: Maximum total $30,000,000.00; component limits vary (NCI $15,000,000.00; most others $3,000,000.00)
    duration: must not exceed 4 years
    cite:
    - 325
  - phase: Commercialization Readiness Pilot
    amount: $4,191,495
    duration: up to 3 years
    cite:
