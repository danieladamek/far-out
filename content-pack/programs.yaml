  what: 'MAS, also called schedules or Federal Supply Schedule, is where federal, state, local and tribal governments
    and other eligible buyers get commercial products, services and other solutions [701]. It runs under one solicitation,
    47QSMD20R0001, now at Refresh 32 (June 2026), formed when GSA consolidated its 24 schedules into a single solicitation
    [707] [724]. GSA says a Schedule contract does not guarantee sales: the holder must market, respond to requests
    for quotations, and maintain pricing and compliance [722].

    '
  status: 'Open to new offers: GSA publishes a seven-step roadmap that ends with submitting an offer in eOffer,
    and Refresh 32 (June 2026) is the latest solicitation refresh listed, with no later refresh posted on 2026-10-03
    [702] [708]'
  funds_or_buys: procurement
  eligibility:
  - A minimum of two years of corporate experience is required unless the offer is submitted under Startup Springboard
    [705]
  - Financial statements for the previous two-year period, audited if available, with at least a balance sheet and
    income statement [704]
  - 'Past performance: three or more CPARS reports may be verified in eOffer; otherwise three customer references
    and three completed Past Performance Questionnaires [705]'
  - Startup Springboard is available exclusively to offers in the Information Technology category that are in a
    FASt Lane initiative and are agency-sponsored [720]
  - All proposed products and services must comply with the Trade Agreements Act [705]
  - A subcontracting plan is required for large businesses unless exceptions apply [704]
  - 'No small-business restriction on entry is stated; orders and BPAs may be set aside for small business at the
    ordering contracting officer''s discretion under codified FAR 8.405-5 (authority: section 1331 of Public Law
    111-240, 15 U.S.C. 644(r)), and the Part 19 preference programs are not mandatory under FAR subpart 8.4 [726]'
  - An agency gets small business credit for an order only if the awardee meets the size standard for the order's
    NAICS code [726]
  - 'GSA''s advice to small firms before applying: minimum 2 years in business (Springboard exception), financial
    stability, past performance, and a grasp of compliance requirements [722]'
  cycle:
    pattern: 'One standing solicitation, refreshed several times a year: Refresh 26 April 2025; Refresh 27/28 June/July
      2025; Refresh 29 August 2025; Refresh 30 November 2025; Refresh 31 April 2026; Refresh 32 June 2026 [708]'
    current_solicitations:
