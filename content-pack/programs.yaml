  what: 'NIH funds small-business R&D through SBIR (R43/R44) and STTR (R41/R42) grants [322] [324]. The parent announcements
    are investigator-initiated and take projects that fit a participating institute or center [322]. NIH describes
    the program as over $1.4 billion a year, funded by 24 NIH Institutes and Centers along with CDC, FDA, ACL and
    ARPA-H [318].

