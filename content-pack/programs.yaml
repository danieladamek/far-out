  funds_or_buys: grants
  eligibility:
  - More than 50% owned and controlled by U.S. citizens or permanent residents; not more than 500 employees including
    affiliates [332]
  - The research or R&D project must be performed in its entirety in the United States [332]
  - Firms with 20 or more Phase I awards in the past 5 years must meet a transition-rate benchmark of 0.25 [332]
  - Firms majority-owned by venture capital, hedge fund or private-equity firms are ineligible for STTR [332]
  - VC-majority-owned firms may compete for up to 25% of NIH set-asides [333]
  - 'SBIR: the small business may outsource up to 33% (Phase I) and 50% (Phase II). STTR: minimum 40% small business
    and 30% research partner [320]'
